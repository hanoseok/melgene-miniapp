  <section id="screen-start" class="lt-screen lt-start">

    <p class="lt-hook">选好玩法，固定几个想要的号码，再排除不想要的，看着彩球一颗颗滚出来。一次最多5注。</p>

    <div class="mg-ad mg-ad-start"></div>

  <!-- 도구 화면 (진행 중 화면의 광고 1자리: 뽑기 버튼 아래) -->

    <h2 class="lt-h2">设置摇号</h2>

      <p class="lt-label" id="preset-label">选哪种玩法？</p>
      <div class="lt-presets" role="radiogroup" aria-labelledby="preset-label">
        <button type="button" class="lt-chip" role="radio" data-preset="kr" aria-checked="true">韩国乐透 6/45</button>
          <button type="button" class="lt-chip" role="radio" data-preset="euro" aria-checked="false">欧洲式 5/50 + 2</button>
          <button type="button" class="lt-chip" role="radio" data-preset="us" aria-checked="false">美国强力球</button>
          <button type="button" class="lt-chip" role="radio" data-preset="custom" aria-checked="false">自定义</button>
      </div>
      <p id="preset-info" class="lt-hint">从1到45选6个</p>
      <div id="custom-box" class="lt-custom" hidden>
        <label class="lt-field"><span class="lt-field-name">选几个号码</span><input id="custom-pick" class="lt-input" type="number" inputmode="numeric" min="1" max="10" value="6"></label>
        <label class="lt-field"><span class="lt-field-name">最大号码</span><input id="custom-max" class="lt-input" type="number" inputmode="numeric" min="2" max="100" value="45"></label>
      </div>
    </div>
    <div class="lt-card">
      <p class="lt-label" id="games-label">几注？</p>
      <div class="lt-seg" role="radiogroup" aria-labelledby="games-label">
        <button type="button" class="lt-seg-btn" role="radio" data-games="1" aria-checked="true">1</button>
          <button type="button" class="lt-seg-btn" role="radio" data-games="2" aria-checked="false">2</button>
          <button type="button" class="lt-seg-btn" role="radio" data-games="3" aria-checked="false">3</button>
          <button type="button" class="lt-seg-btn" role="radio" data-games="4" aria-checked="false">4</button>
          <button type="button" class="lt-seg-btn" role="radio" data-games="5" aria-checked="false">5</button>
      </div>
    </div>
    <div class="lt-card">
      <label class="lt-field lt-field-wide"><span class="lt-field-name">固定号码（可选）</span><span class="lt-hint">例如 7, 21，每一注都会包含</span><input id="fixed-in" class="lt-input lt-input-left" type="text" inputmode="text" autocomplete="off" placeholder="7, 21" maxlength="60"></label>
      <label class="lt-field lt-field-wide"><span class="lt-field-name">排除号码（可选）</span><span class="lt-hint">例如 4, 13，绝不会摇出</span><input id="exclude-in" class="lt-input lt-input-left" type="text" inputmode="text" autocomplete="off" placeholder="4, 13" maxlength="120"></label>
      <p id="tool-error" class="lt-error" role="alert" hidden></p>

    <div id="machine" class="lt-machine" role="img" aria-label="彩球在摇奖机里翻滚"><span class="lt-ball lt-m-ball" data-c="0" style="--i:0"></span><span class="lt-ball lt-m-ball" data-c="1" style="--i:1"></span><span class="lt-ball lt-m-ball" data-c="2" style="--i:2"></span><span class="lt-ball lt-m-ball" data-c="3" style="--i:3"></span><span class="lt-ball lt-m-ball" data-c="4" style="--i:4"></span><span class="lt-ball lt-m-ball" data-c="0" style="--i:5"></span><span class="lt-ball lt-m-ball" data-c="2" style="--i:6"></span><span class="lt-ball lt-m-ball" data-c="1" style="--i:7"></span><span class="lt-ball lt-m-ball" data-c="3" style="--i:8"></span></div>
    <button type="button" id="draw-btn" class="lt-btn lt-btn-primary">开始摇球 🎱</button>

    <div class="mg-ad"></div>

  </footer>
