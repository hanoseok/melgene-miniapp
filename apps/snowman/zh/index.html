        <button type="button" class="sm-opt" role="radio" data-f="p" data-v="2" aria-checked="false" tabindex="-1"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">圆点</span></button>
      </div>
    </div>
    <div class="sm-panel" role="tabpanel" id="panel-arms" aria-labelledby="tab-arms" data-step="5" hidden>
      <p class="sm-label" id="grp-a-label">手臂</p>
      <div class="sm-opts" role="radiogroup" aria-labelledby="grp-a-label" data-group="a">
        <button type="button" class="sm-opt" role="radio" data-f="a" data-v="0" aria-checked="true"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">树枝</span></button>
        <button type="button" class="sm-opt" role="radio" data-f="a" data-v="1" aria-checked="false" tabindex="-1"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">手套</span></button>
        <button type="button" class="sm-opt" role="radio" data-f="a" data-v="2" aria-checked="false" tabindex="-1"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">挥手</span></button>
        <button type="button" class="sm-opt" role="radio" data-f="a" data-v="3" aria-checked="false" tabindex="-1"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">无手臂</span></button>
      </div>
    </div>
    <div class="sm-panel" role="tabpanel" id="panel-extras" aria-labelledby="tab-extras" data-step="6" hidden>

      <div class="sm-opts" role="group" aria-labelledby="grp-x-label" data-group="x">
        <button type="button" class="sm-opt sm-extra" data-bit="1" aria-pressed="false"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">扫帚</span></button>
        <button type="button" class="sm-opt sm-extra" data-bit="2" aria-pressed="true"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">纽扣</span></button>
        <button type="button" class="sm-opt sm-extra" data-bit="4" aria-pressed="false"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">小鸟</span></button>
        <button type="button" class="sm-opt sm-extra" data-bit="8" aria-pressed="false"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">闪光</span></button>
      </div>
    </div>
    <div class="sm-panel" role="tabpanel" id="panel-scene" aria-labelledby="tab-scene" data-step="7" hidden>
      <p class="sm-label" id="grp-g-label">背景</p>
      <div class="sm-opts" role="radiogroup" aria-labelledby="grp-g-label" data-group="g">
        <button type="button" class="sm-opt" role="radio" data-f="g" data-v="0" aria-checked="true"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">雪夜</span></button>
        <button type="button" class="sm-opt" role="radio" data-f="g" data-v="1" aria-checked="false" tabindex="-1"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">晴天雪地</span></button>
        <button type="button" class="sm-opt" role="radio" data-f="g" data-v="2" aria-checked="false" tabindex="-1"><canvas class="sm-ic" width="96" height="96" aria-hidden="true"></canvas><span class="sm-opt-name">村庄灯火</span></button>
      </div>
    </div>
    <div class="sm-panel" role="tabpanel" id="panel-name" aria-labelledby="tab-name" data-step="8" hidden>
      <div class="sm-name-head"><label class="sm-label" for="f-name">名字（选填）</label><button id="idea-btn" class="sm-idea" type="button">💡 灵感</button></div>

      <p id="name-count" class="sm-count" aria-live="polite">0/20</p>
    </div>
    <div class="sm-nav">
      <button id="back-btn" class="sm-tool" type="button">← 上一步</button>
      <button id="random-btn" class="sm-tool" type="button"><span aria-hidden="true">🎲</span> 随机来一个</button>
      <button id="next-btn" class="sm-tool sm-tool-next" type="button">下一步 →</button>
    </div>
    <button id="done-btn" class="sm-btn sm-btn-primary" type="button">雪人完成啦</button>
    <div class="mg-ad"></div>
