<main class="bc-shell">
  <!-- 시작 화면: h1·훅 → 방식 → 범위 → 시작 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="bc-screen bc-setup">
    <h1 class="bc-h1"><span class="bc-kicker">宾果抽号器</span><span class="bc-h1-main">年会宾果抽号，<br><em>一块屏幕全搞定</em></span></h1>
    <p class="bc-hook">公平随机抽号，电视上也看得清的大数字，已开号码一目了然。主持人也能一起玩。</p>

    <form id="bc-form" class="bc-card bc-form" novalidate autocomplete="off">
      <p class="bc-label" id="mode-label">玩哪种宾果？</p>
      <div class="bc-modes" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="bc-mode" id="mode-75" role="radio" aria-checked="true" data-mode="75"><span class="bc-mode-icon" aria-hidden="true">B·I·N·G·O</span><span class="bc-mode-name">75球宾果</span><span class="bc-mode-desc">B·I·N·G·O 五列，最常见的玩法</span></button>
        <button type="button" class="bc-mode" id="mode-90" role="radio" aria-checked="false" data-mode="90"><span class="bc-mode-icon" aria-hidden="true">1–90</span><span class="bc-mode-name">90球宾果</span><span class="bc-mode-desc">1到90，英式宾果</span></button>
        <button type="button" class="bc-mode" id="mode-custom" role="radio" aria-checked="false" data-mode="custom"><span class="bc-mode-icon" aria-hidden="true">1–30</span><span class="bc-mode-name">自定号码范围</span><span class="bc-mode-desc">比如给小朋友玩1到30</span></button>
      </div>
      <div id="custom-box" class="bc-custom" hidden>
        <div class="bc-range">
          <label class="bc-field" for="from"><span class="bc-label bc-label-sm">起始号码</span>
            <input id="from" class="bc-input" type="number" inputmode="numeric" step="1" min="1" max="999" value="1" enterkeyhint="go"></label>
          <span class="bc-range-arrow" aria-hidden="true">→</span>
          <label class="bc-field" for="to"><span class="bc-label bc-label-sm">结束号码</span>
            <input id="to" class="bc-input" type="number" inputmode="numeric" step="1" min="1" max="999" value="30" enterkeyhint="go"></label>
        </div>
        <p class="bc-hint" id="custom-hint">号码数量可设5到150个，范围在1到999之间。</p>
      </div>
    </form>

    <p id="error" class="bc-error" role="alert" hidden></p>
    <button type="button" id="start-btn" class="bc-btn bc-btn-primary">开始抽号 🎱</button>
    <p class="bc-fair">使用加密随机数抽号，号码绝不重复 · 游戏保存在本设备</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 진행 화면(TV·프로젝터에 띄우는 화면): 광고 자리 없음 -->
  <section id="screen-play" class="bc-screen bc-play" hidden>
    <div class="bc-bar">
      <span id="mode-chip" class="bc-chip"></span>
      <p id="count" class="bc-count"></p>
      <button type="button" id="fs-btn" class="bc-mini bc-mini-ghost bc-fs" aria-pressed="false" aria-label="全屏" title="全屏" hidden><span aria-hidden="true">⛶</span></button>
      <button type="button" id="finish-btn" class="bc-mini">结束</button>
    </div>

    <div class="bc-stage">
      <div id="ball" class="bc-ball is-empty" aria-hidden="true">
        <span class="bc-ball-face"><span id="ball-letter" class="bc-ball-letter"></span><span id="ball-num" class="bc-ball-num">?</span></span>
      </div>
      <p id="ready" class="bc-ready">点「抽号」开出第一个号码</p>
    </div>

    <div class="bc-prev">
      <p class="bc-prev-label" id="prev-label">上几个</p>
      <ol id="prev" class="bc-prev-list" aria-labelledby="prev-label"></ol>
    </div>

    <button type="button" id="draw-btn" class="bc-btn bc-btn-primary bc-draw">抽下一个号码</button>
    <div id="auto-bar" class="bc-auto-bar" hidden><span id="auto-fill" class="bc-auto-fill"></span></div>

    <div class="bc-controls">
      <button type="button" id="undo-btn" class="bc-btn bc-btn-ghost" disabled>↶ 撤销</button>
      <label class="bc-switch"><input type="checkbox" id="auto" role="switch"><span class="bc-switch-ui" aria-hidden="true"></span><span>自动抽号</span></label>
    </div>
    <div class="bc-interval">
      <p class="bc-small" id="interval-label">间隔</p>
      <div id="interval" class="bc-seg" role="radiogroup" aria-labelledby="interval-label">
        <button type="button" class="bc-seg-btn" role="radio" aria-checked="false" data-sec="3">3秒</button>
        <button type="button" class="bc-seg-btn" role="radio" aria-checked="true" data-sec="5">5秒</button>
        <button type="button" class="bc-seg-btn" role="radio" aria-checked="false" data-sec="8">8秒</button>
      </div>
    </div>
    <div class="bc-toggles">
      <label class="bc-switch" id="voice-wrap" hidden><input type="checkbox" id="voice" role="switch"><span class="bc-switch-ui" aria-hidden="true"></span><span>语音播报</span></label>
      <label class="bc-switch"><input type="checkbox" id="sound" role="switch"><span class="bc-switch-ui" aria-hidden="true"></span><span>音效</span></label>
    </div>

    <h2 class="bc-h2 bc-board-title" id="board-title">已开号码</h2>
    <div id="board" class="bc-board" role="group" aria-labelledby="board-title"></div>

    <button type="button" id="new-btn" class="bc-btn bc-btn-ghost bc-new">新游戏</button>
    <p id="live" class="visually-hidden" aria-live="polite"></p>
  </section>

  <!-- 끝 화면: 요약 숫자만 → 공통 끝 화면 -->
  <section id="screen-end" class="bc-screen bc-end" hidden>
    <article class="bc-card bc-sum" aria-labelledby="end-title">
      <p class="bc-sum-kicker">游戏结束</p>
      <h2 class="bc-h2" id="end-title">辛苦啦！</h2>
      <dl class="bc-stats">
        <div class="bc-stat bc-stat-big"><dt>已抽号码</dt><dd id="stat-drawn">0</dd><p id="stat-of" class="bc-stat-of"></p></div>
        <div class="bc-stat"><dt>游戏时长</dt><dd id="stat-time">0</dd></div>
      </dl>
      <p id="end-none" class="bc-sum-sub" hidden>这次还没抽号。来一局正式的吧？</p>
      <button type="button" id="edit-btn" class="bc-btn bc-btn-ghost">换一种宾果</button>
    </article>
    <div data-mg-end="bingocall"></div>
  </section>

    © <span id="year"></span> 宾果抽号器 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
