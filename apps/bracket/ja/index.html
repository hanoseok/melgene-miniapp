<header class="mg-top"><a class="mg-home" href="https://example.com/ja/" aria-label="メルジン ミニアプリのホームへ"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">ミニアプリ</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="言語を選択"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja" selected>日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="言語を選択"><a href="../" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="../ko/" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="bk-shell">
  <!-- 시작 화면: h1·훅 → 이어 하기(있을 때) → 제목 → 항목 → 시드 → 방식 → 만들기 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="bk-screen bk-setup">
    <h1 class="bk-h1"><span class="bk-kicker">トーナメント表作成</span><span class="bk-h1-main">あなたのリストで、<br><em>優勝はただひとつ</em></span></h1>
    <p class="bk-hook">選手、チーム、お菓子、映画、なんでもOK。公平に組み合わせを決めて、最後に残る1位を決めよう。</p>

    <div id="resume" class="bk-resume" hidden>
      <p id="resume-text" class="bk-resume-text"></p>
      <button type="button" id="resume-btn" class="bk-mini bk-mini-strong">続きから</button>
    </div>

    <form id="bk-form" class="bk-card bk-form" novalidate autocomplete="off">
      <label class="bk-label" for="title">トーナメント名 <span class="bk-opt">（任意）</span></label>
      <input id="title" class="bk-input" type="text" maxlength="40" placeholder="金曜日の卓球大会" spellcheck="false">
      <label class="bk-label" for="items">参加者・項目</label>
      <textarea id="items" class="bk-textarea" rows="8" maxlength="4000" placeholder="1行に1つずつ
ラーメン
カレー
寿司
焼肉" spellcheck="false"></textarea>
      <p class="bk-hint"><span>2〜64個、1行に1つ。同じ名前は1つにまとめます。</span> <output id="items-count" class="bk-count"></output></p>
      <p id="items-dupes" class="bk-hint bk-dupes" hidden></p>
      <fieldset class="bk-choice">
        <legend class="bk-label">組み合わせ</legend>
        <label class="bk-radio"><input type="radio" name="seed" id="seed-r" value="r" checked><span>🎲 ランダム抽選</span></label>
        <label class="bk-radio"><input type="radio" name="seed" id="seed-o" value="o"><span>📋 入力した順番</span></label>
      </fieldset>
      <fieldset class="bk-choice">
        <legend class="bk-label">遊び方</legend>
        <label class="bk-radio bk-radio-tall"><input type="radio" name="mode" id="mode-p" value="p" checked><span><b>1試合ずつ選ぶ</b><small>2つずつ表示。好きな方をタップ。</small></span></label>
        <label class="bk-radio bk-radio-tall"><input type="radio" name="mode" id="mode-d" value="d"><span><b>組み合わせだけ作る</b><small>実際の試合用。勝者はあとで表をタップ。</small></span></label>
      </fieldset>
    </form>

    <p id="error" class="bk-error" role="alert" hidden></p>
    <button type="button" id="create-btn" class="bk-btn bk-btn-primary">トーナメント表を作る 🏆</button>
    <p class="bk-fair">この端末で暗号用乱数で抽選・入力内容はブラウザの外に出ません</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 대진 화면: 제목 → 맞대결 → 대진표 → 도구 → 우승(+ 공통 끝 화면). 광고 자리 없음 -->
  <section id="screen-play" class="bk-screen bk-play" hidden>
    <div class="bk-event">
      <h2 class="bk-h2 bk-ev-title" id="ev-title"></h2>
      <p id="ev-meta" class="bk-ev-meta"></p>
    </div>

    <div id="duel" class="bk-duel" hidden>
      <p id="duel-round" class="bk-duel-round"></p>
      <p id="duel-progress" class="bk-duel-progress" aria-live="polite"></p>
      <div class="bk-duel-cards">
        <button type="button" id="side-a" class="bk-side bk-side-a"><span class="bk-side-name" id="side-a-name"></span></button>
        <span class="bk-vs" aria-hidden="true">VS</span>
        <button type="button" id="side-b" class="bk-side bk-side-b"><span class="bk-side-name" id="side-b-name"></span></button>
      </div>
      <p class="bk-duel-hint">勝つ方をタップ</p>
    </div>

    <div id="board-wrap" class="bk-card bk-board-wrap">
      <h3 class="bk-h3">トーナメント表</h3>
      <p id="board-hint" class="bk-hint">名前をタップすると次のラウンドへ進みます。</p>
      <div id="board" class="bk-board"></div>
    </div>

    <div id="tools" class="bk-tools">
      <button type="button" id="undo-btn" class="bk-btn bk-btn-ghost">↩️ 戻す</button>
      <button type="button" id="png-btn" class="bk-btn bk-btn-ghost">🖼️ 画像を保存</button>
      <button type="button" id="text-btn" class="bk-btn bk-btn-ghost">📋 テキストコピー</button>
      <button type="button" id="link-btn" class="bk-btn bk-btn-ghost">🔗 リンクをコピー</button>
      <button type="button" id="new-btn" class="bk-btn bk-btn-ghost">✏️ 新しく作る</button>
    </div>
    <p id="live" class="visually-hidden" aria-live="assertive"></p>

    <div id="done" class="bk-done" hidden>
      <article class="bk-card bk-done-card" aria-labelledby="champ-name">
        <svg class="bk-trophy" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path d="M30 18h40v20c0 13-9 22-20 22s-20-9-20-22z" fill="#fcbf49"/>
          <path d="M30 25H17c0 12 6 19 15 20M70 25h13c0 12-6 19-15 20" fill="none" stroke="#fcbf49" stroke-width="6" stroke-linecap="round"/>
          <rect x="45" y="58" width="10" height="14" fill="#f7a823"/>
          <rect x="31" y="72" width="38" height="11" rx="3" fill="#fcbf49"/>
          <path d="M40 26l3 6 6 1-5 4 1 6-5-3-5 3 1-6-5-4 6-1z" fill="#fff6d8" opacity=".85"/>
        </svg>
        <p class="bk-done-kicker">🏆 優勝</p>
        <h2 class="bk-h2 bk-champ" id="champ-name"></h2>
        <p id="champ-summary" class="bk-done-meta"></p>
      </article>
      <div data-mg-end="bracket"></div>
    </div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> トーナメント表作成 · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>

<script>window.PAGE_I18N = {"lang":"ja","ui":{"optional":"（任意）","resumeText":"途中のトーナメント：{title}","resumeBtn":"続きから","titleLabel":"トーナメント名","titlePh":"金曜日の卓球大会","itemsLabel":"参加者・項目","itemsPh":"1行に1つずつ\nラーメン\nカレー\n寿司\n焼肉","itemsHint":"2〜64個、1行に1つ。同じ名前は1つにまとめます。","count":"{n}個","dupes":"重複を{d}個削除しました","seedLabel":"組み合わせ","seedRandom":"🎲 ランダム抽選","seedOrder":"📋 入力した順番","modeLabel":"遊び方","modePick":"1試合ずつ選ぶ","modePickHint":"2つずつ表示。好きな方をタップ。","modeDraw":"組み合わせだけ作る","modeDrawHint":"実際の試合用。勝者はあとで表をタップ。","create":"トーナメント表を作る 🏆","fair":"この端末で暗号用乱数で抽選・入力内容はブラウザの外に出ません","titleDefault":"マイトーナメント","meta":"{n}個 · {m}試合","matchOf":"全{n}試合中 第{k}試合","tapWinner":"勝つ方をタップ","vs":"VS","pickAria":"{name}を勝者にする","rFinal":"決勝","rSemi":"準決勝","rQuarter":"準々決勝","rOf":"ベスト{n}","bye":"シード","tbd":"未定","advance":"シード →","bracketTitle":"トーナメント表","drawHint":"名前をタップすると次のラウンドへ進みます。","undo":"↩️ 戻す","png":"🖼️ 画像を保存","copyText":"📋 テキストコピー","shareLink":"🔗 リンクをコピー","newBracket":"✏️ 新しく作る","champion":"優勝","toastText":"トーナメント表をテキストでコピーしました","toastLink":"リンクをコピーしました。この表がそのまま開きます。","linkTooLong":"表が長すぎてリンクにできません。画像で保存してください。","pngDone":"トーナメント表の画像を保存しました","pngFail":"このブラウザでは画像を作れませんでした。","pngBrand":"メルジン ミニアプリ · トーナメント表作成","liveCreated":"{n}個でトーナメント表を作りました。","liveChampion":"{name}が優勝！","liveUndo":"最後の選択を戻しました。"},"errors":{"tooFew":"2つ以上入れてください。","tooMany":"最大64個までです（今は{n}個）。","badLink":"リンクが壊れていて開けません。下から新しく作ってください。"},"result":{"kicker":"🏆 優勝","summary":"{title} · {n}個 · {m}試合","again":"シャッフルしてもう一度 🎲","shareTitle":"トーナメント表作成","shareText":"「{title}」の優勝は{name} 🏆","shareTextPlain":"自分のリストで公平なトーナメント表を作ろう 🏆"}};</script>
<script>window.MG_FAQ = [{"q":"ランダム抽選の仕組みは？公平ですか？","a":"ブラウザの暗号用乱数（crypto.getRandomValues）を使い、棄却サンプリング付きのフィッシャー–イェーツ法でシャッフルします。どの並び順もまったく同じ確率で出るので、誰と誰が当たるかは誰にも（自分にも）決められません。"},{"q":"シード（不戦勝）はどう決まりますか？","a":"トーナメント表には2・4・8・16・32・64の枠が必要です。たとえば6個なら2枠が空き、空き枠と当たる側はそのまま次のラウンドへ進みます。シードは表全体に均等に散らばり、空き枠同士が当たることはありません。"},{"q":"ランダムではなく自分で決めた順番にできますか？","a":"はい。「入力した順番」を選ぶと、リストの順番がシード順になります。1番目が第1シード、2番目が第2シード…と続き、上位シードから先に不戦勝を受け取ります。"},{"q":"選び直しはできますか？","a":"「戻す」で最後の選択を取り消すか、表の前の試合でもう一方の名前をタップしてください。その試合に関わる後の結果は消えるので、表はいつも正しい状態に保たれます。"},{"q":"入力した内容はどこかに送られますか？","a":"いいえ。リストと選択はあとで続けられるよう、このブラウザにだけ保存されます。コピーしたリンクは表をURLの中に入れているだけで、送った相手にしか見えません。"}];</script>
