<header class="mg-top"><a class="mg-home" href="https://example.com/" aria-label="멜진 미니앱 홈으로"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">미니앱</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="언어 선택"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko" selected>한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="언어 선택"><a href="./" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="./" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="./" hreflang="fr" lang="fr">Français</a> <a href="./" hreflang="de" lang="de">Deutsch</a> <a href="./" hreflang="th" lang="th">ไทย</a> <a href="./" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="./" hreflang="es" lang="es">Español</a> <a href="./" hreflang="it" lang="it">Italiano</a> <a href="./" hreflang="pt" lang="pt">Português</a> <a href="./" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="bk-shell">
  <!-- 시작 화면: h1·훅 → 이어 하기(있을 때) → 제목 → 항목 → 시드 → 방식 → 만들기 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="bk-screen bk-setup">
    <h1 class="bk-h1"><span class="bk-kicker">토너먼트 대진표</span><span class="bk-h1-main">내 목록으로,<br><em>단 하나의 우승</em></span></h1>
    <p class="bk-hook">선수, 팀, 메뉴, 영화 뭐든 넣어 보세요. 공정하게 대진을 짜고 끝까지 남는 1등을 가려요.</p>

    <div id="resume" class="bk-resume" hidden>
      <p id="resume-text" class="bk-resume-text"></p>
      <button type="button" id="resume-btn" class="bk-mini bk-mini-strong">이어 하기</button>
    </div>

    <form id="bk-form" class="bk-card bk-form" novalidate autocomplete="off">
      <label class="bk-label" for="title">대진표 제목 <span class="bk-opt">(선택)</span></label>
      <input id="title" class="bk-input" type="text" maxlength="40" placeholder="금요일 탁구 대회" spellcheck="false">
      <label class="bk-label" for="items">참가 이름·항목</label>
      <textarea id="items" class="bk-textarea" rows="8" maxlength="4000" placeholder="한 줄에 하나씩
떡볶이
치킨
피자
짜장면" spellcheck="false"></textarea>
      <p class="bk-hint"><span>2~64개, 한 줄에 하나씩. 같은 이름은 하나만 남아요.</span> <output id="items-count" class="bk-count"></output></p>
      <p id="items-dupes" class="bk-hint bk-dupes" hidden></p>
      <fieldset class="bk-choice">
        <legend class="bk-label">대진 배치</legend>
        <label class="bk-radio"><input type="radio" name="seed" id="seed-r" value="r" checked><span>🎲 랜덤 추첨</span></label>
        <label class="bk-radio"><input type="radio" name="seed" id="seed-o" value="o"><span>📋 입력한 순서대로</span></label>
      </fieldset>
      <fieldset class="bk-choice">
        <legend class="bk-label">어떻게 할까요?</legend>
        <label class="bk-radio bk-radio-tall"><input type="radio" name="mode" id="mode-p" value="p" checked><span><b>한 판씩 고르기</b><small>두 개씩 나와요. 더 좋은 쪽을 누르세요(이상형 월드컵).</small></span></label>
        <label class="bk-radio bk-radio-tall"><input type="radio" name="mode" id="mode-d" value="d"><span><b>대진표만 뽑기</b><small>실제 경기용. 결과는 나중에 대진표에서 눌러요.</small></span></label>
      </fieldset>
    </form>

    <p id="error" class="bk-error" role="alert" hidden></p>
    <button type="button" id="create-btn" class="bk-btn bk-btn-primary">대진표 만들기 🏆</button>
    <p class="bk-fair">이 기기에서 crypto 난수로 추첨 · 입력한 항목은 브라우저 밖으로 나가지 않아요</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 대진 화면: 제목 → 맞대결 → 대진표 → 도구 → 우승(+ 공통 끝 화면). 광고 자리 없음 -->
  <section id="screen-play" class="bk-screen bk-play" hidden>
    <div class="bk-event">
      <h2 class="bk-h2 bk-ev-title" id="ev-title"></h2>
      <p id="ev-meta" class="bk-ev-meta"></p>
    </div>

    <div id="duel" class="bk-duel" hidden>
      <p id="duel-round" class="bk-duel-round"></p>
      <p id="duel-progress" class="bk-duel-progress" aria-live="polite"></p>
      <div class="bk-duel-cards">
        <button type="button" id="side-a" class="bk-side bk-side-a"><span class="bk-side-name" id="side-a-name"></span></button>
        <span class="bk-vs" aria-hidden="true">VS</span>
        <button type="button" id="side-b" class="bk-side bk-side-b"><span class="bk-side-name" id="side-b-name"></span></button>
      </div>
      <p class="bk-duel-hint">이기는 쪽을 누르세요</p>
    </div>

    <div id="board-wrap" class="bk-card bk-board-wrap">
      <h3 class="bk-h3">대진표</h3>
      <p id="board-hint" class="bk-hint">이름을 누르면 다음 라운드로 올라가요.</p>
      <div id="board" class="bk-board"></div>
    </div>

    <div id="tools" class="bk-tools">
      <button type="button" id="undo-btn" class="bk-btn bk-btn-ghost">↩️ 되돌리기</button>
      <button type="button" id="png-btn" class="bk-btn bk-btn-ghost">🖼️ 이미지 저장</button>
      <button type="button" id="text-btn" class="bk-btn bk-btn-ghost">📋 글로 복사</button>
      <button type="button" id="link-btn" class="bk-btn bk-btn-ghost">🔗 링크 복사</button>
      <button type="button" id="new-btn" class="bk-btn bk-btn-ghost">✏️ 새 대진표</button>
    </div>
    <p id="live" class="visually-hidden" aria-live="assertive"></p>

    <div id="done" class="bk-done" hidden>
      <article class="bk-card bk-done-card" aria-labelledby="champ-name">
        <svg class="bk-trophy" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path d="M30 18h40v20c0 13-9 22-20 22s-20-9-20-22z" fill="#fcbf49"/>
          <path d="M30 25H17c0 12 6 19 15 20M70 25h13c0 12-6 19-15 20" fill="none" stroke="#fcbf49" stroke-width="6" stroke-linecap="round"/>
          <rect x="45" y="58" width="10" height="14" fill="#f7a823"/>
          <rect x="31" y="72" width="38" height="11" rx="3" fill="#fcbf49"/>
          <path d="M40 26l3 6 6 1-5 4 1 6-5-3-5 3 1-6-5-4 6-1z" fill="#fff6d8" opacity=".85"/>
        </svg>
        <p class="bk-done-kicker">🏆 최종 우승</p>
        <h2 class="bk-h2 bk-champ" id="champ-name"></h2>
        <p id="champ-summary" class="bk-done-meta"></p>
      </article>
      <div data-mg-end="bracket"></div>
    </div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 토너먼트 대진표 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
