<main class="bk-shell">
  <!-- 시작 화면: h1·훅 → 이어 하기(있을 때) → 제목 → 항목 → 시드 → 방식 → 만들기 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="bk-screen bk-setup">
    <h1 class="bk-h1"><span class="bk-kicker">淘汰赛对阵表</span><span class="bk-h1-main">你的名单，<br><em>只有一个冠军</em></span></h1>
    <p class="bk-hook">选手、队伍、零食、电影都可以。公平抽签排好对阵，看看谁能一路赢到最后。</p>

    <div id="resume" class="bk-resume" hidden>
      <p id="resume-text" class="bk-resume-text"></p>
      <button type="button" id="resume-btn" class="bk-mini bk-mini-strong">继续</button>
    </div>

    <form id="bk-form" class="bk-card bk-form" novalidate autocomplete="off">
      <label class="bk-label" for="title">比赛名称 <span class="bk-opt">（可选）</span></label>
      <input id="title" class="bk-input" type="text" maxlength="40" placeholder="周五乒乓球赛" spellcheck="false">
      <label class="bk-label" for="items">参赛名单</label>
      <textarea id="items" class="bk-textarea" rows="8" maxlength="4000" placeholder="每行一个
火锅
烤鸭
小笼包
麻辣烫" spellcheck="false"></textarea>
      <p class="bk-hint"><span>2到64个，每行一个。重复的名字只保留一个。</span> <output id="items-count" class="bk-count"></output></p>
      <p id="items-dupes" class="bk-hint bk-dupes" hidden></p>
      <fieldset class="bk-choice">
        <legend class="bk-label">对阵排法</legend>
        <label class="bk-radio"><input type="radio" name="seed" id="seed-r" value="r" checked><span>🎲 随机抽签</span></label>
        <label class="bk-radio"><input type="radio" name="seed" id="seed-o" value="o"><span>📋 按输入顺序</span></label>
      </fieldset>
      <fieldset class="bk-choice">
        <legend class="bk-label">怎么玩？</legend>
        <label class="bk-radio bk-radio-tall"><input type="radio" name="mode" id="mode-p" value="p" checked><span><b>一场场选胜者</b><small>每次两张卡片，点你更喜欢的。</small></span></label>
        <label class="bk-radio bk-radio-tall"><input type="radio" name="mode" id="mode-d" value="d"><span><b>只生成对阵表</b><small>用于真实比赛，之后在表上点胜者。</small></span></label>
      </fieldset>
    </form>

    <p id="error" class="bk-error" role="alert" hidden></p>
    <button type="button" id="create-btn" class="bk-btn bk-btn-primary">生成对阵表 🏆</button>
    <p class="bk-fair">在本设备用加密随机数抽签 · 名单不会离开你的浏览器</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 대진 화면: 제목 → 맞대결 → 대진표 → 도구 → 우승(+ 공통 끝 화면). 광고 자리 없음 -->
  <section id="screen-play" class="bk-screen bk-play" hidden>
    <div class="bk-event">
      <h2 class="bk-h2 bk-ev-title" id="ev-title"></h2>
      <p id="ev-meta" class="bk-ev-meta"></p>
    </div>

    <div id="duel" class="bk-duel" hidden>
      <p id="duel-round" class="bk-duel-round"></p>
      <p id="duel-progress" class="bk-duel-progress" aria-live="polite"></p>
      <div class="bk-duel-cards">
        <button type="button" id="side-a" class="bk-side bk-side-a"><span class="bk-side-name" id="side-a-name"></span></button>
        <span class="bk-vs" aria-hidden="true">VS</span>
        <button type="button" id="side-b" class="bk-side bk-side-b"><span class="bk-side-name" id="side-b-name"></span></button>
      </div>
      <p class="bk-duel-hint">点击胜者</p>
    </div>

    <div id="board-wrap" class="bk-card bk-board-wrap">
      <h3 class="bk-h3">对阵表</h3>
      <p id="board-hint" class="bk-hint">点名字即可晋级下一轮。</p>
      <div id="board" class="bk-board"></div>
    </div>

    <div id="tools" class="bk-tools">
      <button type="button" id="undo-btn" class="bk-btn bk-btn-ghost">↩️ 撤销</button>
      <button type="button" id="png-btn" class="bk-btn bk-btn-ghost">🖼️ 保存图片</button>
      <button type="button" id="text-btn" class="bk-btn bk-btn-ghost">📋 复制文字</button>
      <button type="button" id="link-btn" class="bk-btn bk-btn-ghost">🔗 复制链接</button>
      <button type="button" id="new-btn" class="bk-btn bk-btn-ghost">✏️ 新建对阵</button>
    </div>
    <p id="live" class="visually-hidden" aria-live="assertive"></p>

    <div id="done" class="bk-done" hidden>
      <article class="bk-card bk-done-card" aria-labelledby="champ-name">
        <svg class="bk-trophy" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path d="M30 18h40v20c0 13-9 22-20 22s-20-9-20-22z" fill="#fcbf49"/>
          <path d="M30 25H17c0 12 6 19 15 20M70 25h13c0 12-6 19-15 20" fill="none" stroke="#fcbf49" stroke-width="6" stroke-linecap="round"/>
          <rect x="45" y="58" width="10" height="14" fill="#f7a823"/>
          <rect x="31" y="72" width="38" height="11" rx="3" fill="#fcbf49"/>
          <path d="M40 26l3 6 6 1-5 4 1 6-5-3-5 3 1-6-5-4 6-1z" fill="#fff6d8" opacity=".85"/>
        </svg>
        <p class="bk-done-kicker">🏆 冠军</p>
        <h2 class="bk-h2 bk-champ" id="champ-name"></h2>
        <p id="champ-summary" class="bk-done-meta"></p>
      </article>
      <div data-mg-end="bracket"></div>
    </div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 淘汰赛对阵表 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"随机抽签是怎么做的？公平吗？","a":"使用浏览器的加密随机数（crypto.getRandomValues），以带拒绝采样的 Fisher–Yates 洗牌打乱名单，每一种顺序出现的概率完全相同。谁和谁相遇，没有人（包括你自己）能决定。"},{"q":"轮空是怎么安排的？","a":"对阵表需要2、4、8、16、32或64个位置。比如有6个参赛者，就会空出2个位置，遇到空位的一方直接晋级下一轮。轮空会均匀分布在整张表上，两个轮空不会相遇。"},{"q":"可以不随机，按我自己的顺序吗？","a":"可以。选择“按输入顺序”，名单顺序就是种子顺序：第一个是1号种子，第二个是2号种子……高种子先遇到低种子，也优先获得轮空。"},{"q":"选错了可以撤销吗？","a":"点“撤销”取消上一次选择，或在表上点前面比赛的另一个名字。依赖那场比赛的后续结果会被清除，对阵表始终保持一致。"},{"q":"我输入的内容会被上传吗？","a":"不会。名单和选择只保存在本浏览器里，方便你之后继续。复制的链接把对阵表放在网址本身里，只有收到链接的人能看到。"}];</script>
