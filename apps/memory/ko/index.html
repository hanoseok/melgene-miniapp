<main class="mm-shell">
  <!-- 시작 화면: 티징 + 난이도 + 한 줄 방법 + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="mm-screen mm-start">
    <p class="mm-badge">🎃 할로윈 카드 뒤집기</p>
    <div class="mm-hero" aria-hidden="true"><i class="mm-hc mm-hc-0"></i><i class="mm-hc mm-hc-1"></i><i class="mm-hc mm-hc-up"><b>🎃</b></i><i class="mm-hc mm-hc-3"></i><i class="mm-hc mm-hc-4"></i></div>
    <h1 class="mm-h1"><span class="mm-kicker">카드 짝 맞추기</span><span class="mm-h1-main">카드를 뒤집어<br>같은 <em>짝</em>을 찾아요</span></h1>
    <p class="mm-hook">호박, 유령, 박쥐가 카드 뒤에 숨어 있어요. 두 장씩 뒤집고, 어디에 뭐가 있었는지 잘 기억해 두세요.</p>
    <div id="levels" class="mm-levels" role="radiogroup" aria-label="난이도 고르기">
      <button type="button" class="mm-level" role="radio" aria-checked="true" data-level="easy"><span class="mm-level-name">쉬움</span><span class="mm-level-grid">4 × 3</span></button>
      <button type="button" class="mm-level" role="radio" aria-checked="false" data-level="normal"><span class="mm-level-name">보통</span><span class="mm-level-grid">4 × 4</span></button>
      <button type="button" class="mm-level" role="radio" aria-checked="false" data-level="hard"><span class="mm-level-name">어려움</span><span class="mm-level-grid">4 × 6</span></button>
    </div>
    <button id="start-btn" class="mm-btn mm-btn-primary" type="button">시작하기 →</button>
    <p class="mm-how">두 장씩 뒤집기 · 같은 그림이면 짝!</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 카드 판 (광고 없음) -->
  <section id="screen-play" class="mm-screen mm-play" hidden>
    <div class="mm-hud">
      <div class="mm-hud-box mm-hud-time"><span class="mm-hud-label">시간</span><span id="hud-time" class="mm-hud-val" aria-live="off">0.0</span></div>
      <div class="mm-hud-box mm-hud-moves"><span class="mm-hud-label">횟수</span><span id="hud-moves" class="mm-hud-val" aria-live="off">0</span></div>
      <div class="mm-hud-box mm-hud-pairs"><span class="mm-hud-label">찾은 짝</span><span id="hud-pairs" class="mm-hud-val" aria-live="polite">0/0</span></div>
    </div>
    <div class="mm-bar" aria-hidden="true"><i id="bar-fill" class="mm-bar-fill"></i></div>
    <div id="field" class="mm-field">
      <div id="board" class="mm-board" role="group" aria-label="카드 판. 카드 두 장을 뒤집어 같은 그림 짝을 찾으세요."></div>
      <button id="pause-btn" class="mm-pause" type="button" hidden>일시정지 · 누르면 이어서 해요</button>
    </div>
  </section>

  <!-- 끝 화면: 결과 카드 → 공통 끝 화면 -->
  <section id="screen-end" class="mm-screen mm-end" hidden>
    <article class="mm-result" aria-labelledby="res-big">
      <p id="res-level" class="mm-eyebrow"></p>
      <p class="mm-head-line"><span class="mm-head-emoji" aria-hidden="true">🎃</span><span id="res-head" class="mm-head">짝을 모두 찾았어요!</span></p>
      <p class="mm-score-line"><span id="res-big" class="mm-score-big">0</span> <span class="mm-points">초</span></p>
      <p id="res-newbest" class="mm-newbest" hidden>최고 기록 경신!</p>
      <p id="res-best" class="mm-best"></p>
      <dl class="mm-stats">
        <div class="mm-stat"><dt>뒤집은 횟수</dt><dd id="res-moves" class="mm-stat-num"></dd></div>
        <div class="mm-stat"><dt>정확도</dt><dd id="res-acc" class="mm-stat-num"></dd></div>
      </dl>
      <div id="res-rank" class="mm-rank" hidden>
        <p id="res-comparing" class="mm-comparing">다른 플레이어 기록과 비교하는 중…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="mm-top"></p>
          <p id="res-beat" class="mm-beat"></p>
          <p id="res-others" class="mm-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="memory"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 할로윈 카드 짝 맞추기 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"카드 짝 맞추기는 어떻게 하나요?","a":"처음엔 모든 카드가 뒤집혀 있어요. 카드 한 장을 누르고, 또 한 장을 누르세요. 두 장의 그림이 같으면 짝이 되어 그대로 열려 있고, 다르면 잠깐 보인 뒤 다시 뒤집혀요. 모든 짝을 찾으면 끝! 시간은 첫 카드를 뒤집을 때부터 재요."},{"q":"횟수와 정확도는 어떻게 세나요?","a":"카드 두 장을 뒤집을 때마다 1번으로 세요. 정확도는 찾은 짝 수를 횟수로 나눈 값이라, 한 번도 틀리지 않고 다 찾으면 100%예요. 틀려도 시간이 더해지지는 않지만 횟수는 늘어나요."},{"q":"난이도마다 뭐가 달라요?","a":"쉬움은 카드 12장(6쌍), 보통은 16장(8쌍), 어려움은 24장(12쌍)이에요. 판마다 카드 위치와 그림이 새로 섞이고, 최고 기록은 난이도별로 따로 저장돼요."},{"q":"다른 앱으로 넘어가면 어떻게 되나요?","a":"시간이 멈추고 카드가 가려져서 몰래 볼 수 없어요. 돌아와서 판을 누르면 하던 곳부터 이어서 할 수 있어요."},{"q":"“상위 %”는 어떻게 계산하나요?","a":"끝까지 마치면 난이도와 반올림한 시간이 같은 난이도를 한 다른 플레이어들의 실제 기록과 비교돼요. 아직 비교할 기록이 없으면 이 칸은 보이지 않아요."}];</script>
