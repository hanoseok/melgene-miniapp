<main class="mm-shell">
  <!-- 시작 화면: 티징 + 난이도 + 한 줄 방법 + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="mm-screen mm-start">
    <p class="mm-badge">🎃 ハロウィンのカードめくり</p>
    <div class="mm-hero" aria-hidden="true"><i class="mm-hc mm-hc-0"></i><i class="mm-hc mm-hc-1"></i><i class="mm-hc mm-hc-up"><b>🎃</b></i><i class="mm-hc mm-hc-3"></i><i class="mm-hc mm-hc-4"></i></div>
    <h1 class="mm-h1"><span class="mm-kicker">神経衰弱</span><span class="mm-h1-main">カードをめくって<br>同じ<em>ペア</em>を探そう</span></h1>
    <p class="mm-hook">かぼちゃ、おばけ、コウモリがカードの裏にかくれています。2枚ずつめくって、どこに何があったか覚えておこう。</p>
    <div id="levels" class="mm-levels" role="radiogroup" aria-label="難易度を選ぶ">
      <button type="button" class="mm-level" role="radio" aria-checked="true" data-level="easy"><span class="mm-level-name">かんたん</span><span class="mm-level-grid">4 × 3</span></button>
      <button type="button" class="mm-level" role="radio" aria-checked="false" data-level="normal"><span class="mm-level-name">ふつう</span><span class="mm-level-grid">4 × 4</span></button>
      <button type="button" class="mm-level" role="radio" aria-checked="false" data-level="hard"><span class="mm-level-name">むずかしい</span><span class="mm-level-grid">4 × 6</span></button>
    </div>
    <button id="start-btn" class="mm-btn mm-btn-primary" type="button">スタート →</button>
    <p class="mm-how">2枚ずつめくる・同じ絵ならペア！</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 카드 판 (광고 없음) -->
  <section id="screen-play" class="mm-screen mm-play" hidden>
    <div class="mm-hud">
      <div class="mm-hud-box mm-hud-time"><span class="mm-hud-label">タイム</span><span id="hud-time" class="mm-hud-val" aria-live="off">0.0</span></div>
      <div class="mm-hud-box mm-hud-moves"><span class="mm-hud-label">手数</span><span id="hud-moves" class="mm-hud-val" aria-live="off">0</span></div>
      <div class="mm-hud-box mm-hud-pairs"><span class="mm-hud-label">ペア</span><span id="hud-pairs" class="mm-hud-val" aria-live="polite">0/0</span></div>
    </div>
    <div class="mm-bar" aria-hidden="true"><i id="bar-fill" class="mm-bar-fill"></i></div>
    <div id="field" class="mm-field">
      <div id="board" class="mm-board" role="group" aria-label="神経衰弱の盤。2枚めくって同じ絵のペアを探してください。"></div>
      <button id="pause-btn" class="mm-pause" type="button" hidden>一時停止中・タップで再開</button>
    </div>
  </section>

  <!-- 끝 화면: 결과 카드 → 공통 끝 화면 -->
  <section id="screen-end" class="mm-screen mm-end" hidden>
    <article class="mm-result" aria-labelledby="res-big">
      <p id="res-level" class="mm-eyebrow"></p>
      <p class="mm-head-line"><span class="mm-head-emoji" aria-hidden="true">🎃</span><span id="res-head" class="mm-head">全部そろった！</span></p>
      <p class="mm-score-line"><span id="res-big" class="mm-score-big">0</span> <span class="mm-points">秒</span></p>
      <p id="res-newbest" class="mm-newbest" hidden>ベスト更新！</p>
      <p id="res-best" class="mm-best"></p>
      <dl class="mm-stats">
        <div class="mm-stat"><dt>手数</dt><dd id="res-moves" class="mm-stat-num"></dd></div>
        <div class="mm-stat"><dt>正確さ</dt><dd id="res-acc" class="mm-stat-num"></dd></div>
      </dl>
      <div id="res-rank" class="mm-rank" hidden>
        <p id="res-comparing" class="mm-comparing">ほかのプレイヤーと比べています…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="mm-top"></p>
          <p id="res-beat" class="mm-beat"></p>
          <p id="res-others" class="mm-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="memory"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> ハロウィン神経衰弱 · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>

<script>window.MG_FAQ = [{"q":"神経衰弱の遊び方は？","a":"はじめはすべてのカードが裏向きです。1枚めくって、もう1枚めくります。同じ絵ならペアとして表のまま残り、ちがう絵なら少しだけ見えたあと裏に戻ります。全部のペアをそろえたらクリア。タイムは最初のカードをめくった瞬間から計ります。"},{"q":"手数と正確さはどう数えますか？","a":"2枚めくるたびに1手です。正確さは見つけたペアの数を手数で割った値なので、一度もまちがえずにそろえると100%になります。まちがえてもタイムは増えませんが、手数は増えます。"},{"q":"難易度で何が変わりますか？","a":"かんたんは12枚（6ペア）、ふつうは16枚（8ペア）、むずかしいは24枚（12ペア）です。カードの並びと絵は毎回シャッフルされ、ベスト記録は難易度ごとに別々に保存されます。"},{"q":"ほかのアプリに切り替えたらどうなりますか？","a":"タイムが止まり、カードが隠れるのでこっそり見ることはできません。戻ってきて盤をタップすれば、続きから遊べます。"},{"q":"「上位 %」はどうやって決まりますか？","a":"クリアすると、難易度と丸めたタイムが同じ難易度のほかのプレイヤーの実際の記録と比べられます。比べる記録がまだないときは表示されません。"}];</script>
