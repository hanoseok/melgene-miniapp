<script>window.MG_FAQ = [{"q":"记忆翻牌怎么玩？","a":"开始时所有卡牌都背面朝上。先点一张，再点第二张。两张图案相同就配对成功并保持翻开；不同的话会短暂显示后再翻回去。找齐所有配对即可过关。计时从翻开第一张牌时开始。"},{"q":"步数和准确率怎么计算？","a":"每翻开两张牌算一步。准确率 = 配对数 ÷ 步数，所以一次都没翻错就是 100%。翻错不会加时间，但会增加步数。"},{"q":"不同难度有什么区别？","a":"简单有 12 张牌（6 对），普通有 16 张（8 对），困难有 24 张（12 对）。每一局卡牌位置和图案都会重新洗牌，最佳纪录按难度分别保存。"},{"q":"切换到其他应用会怎样？","a":"计时会停止，卡牌也会被遮住，无法偷看。回来后点一下盘面，就能从刚才的位置继续。"},{"q":"“前 %”是怎么来的？","a":"完成后，你的难度和四舍五入后的用时会与同难度其他玩家的真实记录比较。如果还没有可比较的记录，就不会显示。"}];</script>
