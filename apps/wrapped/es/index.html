<body class="wr-body">
<header class="mg-top"><a class="mg-home" href="https://example.com/es/" aria-label="Inicio de Melgene Apps"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">Apps</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="Idioma"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es" selected>Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="Idioma"><a href="../" hreflang="en" lang="en">English</a> <a href="../ja/" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="../ko/" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="./" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 Especial fin de año</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">Resumen del año</span><span class="wr-h1-main">Tu año<br><em>en una tarjeta</em></span></h1>
    <p class="wr-hook">Una palabra, una canción, un momento que no vas a olvidar. Escribe unas líneas y obtén una tarjeta que resume tu año.</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">Crear mi tarjeta →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">Tu año en pocas líneas</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="Temas de la tarjeta">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">Aurora</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">Atardecer</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">Menta</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">Medianoche</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">Papel</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">Neón</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="Vista previa de tu tarjeta"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">Tu nombre (opcional)</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="p. ej. Lucía">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">Tu palabra del año <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="Una palabra para tu año">
        <div id="ideas" class="wr-ideas" role="group" aria-label="Ideas de palabras">
        <button type="button" class="wr-idea" data-w="Crecer">Crecer</button>
        <button type="button" class="wr-idea" data-w="Valentía">Valentía</button>
        <button type="button" class="wr-idea" data-w="Calma">Calma</button>
        <button type="button" class="wr-idea" data-w="Cambio">Cambio</button>
        <button type="button" class="wr-idea" data-w="Alegría">Alegría</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">Mejor momento</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="p. ej. Ver el mar con mi hermana">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">Canción del año</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="La que escuchaste en bucle">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">Comida del año</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="p. ej. Los tacos de los viernes">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">Lugar del año</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="p. ej. El cafecito junto al trabajo">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">Gracias a</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="p. ej. Mamá, mi equipo, Diego">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">Meta para el próximo año</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="p. ej. Correr 10 km">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">Terminar mi tarjeta</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> Guardar imagen</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> Copiar texto</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> Editar</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Resumen del año · <a href="privacy.html">Política de privacidad</a> · <a href="guide.html">Guía</a>
  </footer>
</main>
