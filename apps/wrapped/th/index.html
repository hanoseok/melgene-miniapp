<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 พิเศษส่งท้ายปี</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">ทำการ์ดสรุปปี</span><span class="wr-h1-main">สรุปปีของฉัน<br><em>ในการ์ดใบเดียว</em></span></h1>
    <p class="wr-hook">หนึ่งคำ หนึ่งเพลง หนึ่งช่วงเวลาที่ไม่มีวันลืม เขียนไม่กี่บรรทัดก็ได้การ์ดสรุปปีของคุณแล้ว</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">ทำการ์ดของฉัน →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">ปีของฉันในไม่กี่บรรทัด</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="ธีมการ์ด">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">ออโรรา</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">ฟ้ายามเย็น</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">มินต์</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">เที่ยงคืน</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">กระดาษ</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">นีออน</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="ตัวอย่างการ์ด"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">ชื่อ (ไม่บังคับ)</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น มายด์">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">คำประจำปีของฉัน <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="ปีนี้ในหนึ่งคำ">
        <div id="ideas" class="wr-ideas" role="group" aria-label="ไอเดียคำประจำปี">
        <button type="button" class="wr-idea" data-w="เติบโต">เติบโต</button>
        <button type="button" class="wr-idea" data-w="สู้ต่อไป">สู้ต่อไป</button>
        <button type="button" class="wr-idea" data-w="พักใจ">พักใจ</button>
        <button type="button" class="wr-idea" data-w="เปลี่ยนแปลง">เปลี่ยนแปลง</button>
        <button type="button" class="wr-idea" data-w="มีความสุข">มีความสุข</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">ช่วงเวลาที่ดีที่สุด</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น ไปทะเลกับน้องสาว">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">เพลงแห่งปี</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เพลงที่เปิดวนทั้งปี">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">อาหารแห่งปี</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น หมูกระทะกับเพื่อน">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">สถานที่แห่งปี</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น คาเฟ่เล็ก ๆ ใกล้ที่ทำงาน">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">คนที่อยากขอบคุณ</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น แม่ ทีมของฉัน">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">เป้าหมายปีหน้า</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น วิ่งให้ได้ 10 กม.">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">ทำการ์ดให้เสร็จ</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> บันทึกรูป</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> คัดลอกข้อความ</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> แก้ไข</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  </footer>
