<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 年终特辑</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">年度总结卡片制作</span><span class="wr-h1-main">把这一年<br><em>装进一张卡片</em></span></h1>
    <p class="wr-hook">一个词、一首歌、一个忘不掉的瞬间。写上几行，就能得到一张属于你的年度总结卡片。</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">开始制作 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">用几行字回顾这一年</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="卡片主题">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">极光</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">晚霞</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">薄荷</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">午夜</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">纸张</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">霓虹</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="卡片预览"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">名字（可选）</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：小雨">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">年度关键词 <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="用一个词形容今年">
        <div id="ideas" class="wr-ideas" role="group" aria-label="关键词推荐">
        <button type="button" class="wr-idea" data-w="成长">成长</button>
        <button type="button" class="wr-idea" data-w="坚持">坚持</button>
        <button type="button" class="wr-idea" data-w="突破">突破</button>
        <button type="button" class="wr-idea" data-w="治愈">治愈</button>
        <button type="button" class="wr-idea" data-w="松弛感">松弛感</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">最难忘的瞬间</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：和妹妹看冬天的海">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">年度歌曲</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="今年单曲循环最多的歌">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">年度美食</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：深夜的一碗面">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">年度地点</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：公司楼下的小咖啡馆">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">想感谢的人</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：妈妈、我的团队">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">明年的目标</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：跑完10公里">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">生成卡片</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> 保存图片</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> 复制文字</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> 修改</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 年度总结卡片 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
