<header class="mg-top"><a class="mg-home" href="https://example.com/ja/" aria-label="メルジン ミニアプリのホームへ"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">ミニアプリ</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="言語を選択"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja" selected>日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="言語を選択"><a href="../" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="../ko/" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 年末スペシャル</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">今年の振り返りカード作成</span><span class="wr-h1-main">あなたの1年を<br><em>カード1枚に</em></span></h1>
    <p class="wr-hook">ひとこと、1曲、忘れられない瞬間。数行書くだけで、今年をぎゅっとまとめたカードができあがります。</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">カードを作る →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">数行でふり返る、わたしの1年</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="カードのテーマ">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">オーロラ</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">夕焼け</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">ミント</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">真夜中</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">紙</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">ネオン</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="カードのプレビュー"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">名前（任意）</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：ゆい">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">今年の一言 <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="今年をひとことで">
        <div id="ideas" class="wr-ideas" role="group" aria-label="一言のアイデア">
        <button type="button" class="wr-idea" data-w="挑戦">挑戦</button>
        <button type="button" class="wr-idea" data-w="笑顔">笑顔</button>
        <button type="button" class="wr-idea" data-w="変化">変化</button>
        <button type="button" class="wr-idea" data-w="成長">成長</button>
        <button type="button" class="wr-idea" data-w="癒し">癒し</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">最高の瞬間</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：妹と見た冬の海">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">今年の曲</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="いちばん聴いた1曲">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">今年のごはん</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：深夜のラーメン">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">今年の場所</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：会社近くの小さなカフェ">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">ありがとうを伝えたい人</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：母、チームのみんな">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">来年の目標</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：10kmを走りきる">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">カードを完成させる</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> 画像を保存</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> テキストをコピー</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> 編集する</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 今年の振り返りカード · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>
