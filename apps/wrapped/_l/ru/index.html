<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 К концу года</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">Итоги года</span><span class="wr-h1-main">Твой год<br><em>в одной карточке</em></span></h1>
    <p class="wr-hook">Одно слово, одна песня, один момент, который не забыть. Заполни пару строк — и получишь карточку с итогами года.</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">Создать карточку →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">Твой год в нескольких строках</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="Оформление карточки">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">Сияние</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">Закат</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">Мята</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">Полночь</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">Бумага</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">Неон</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="Предпросмотр карточки"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">Имя (необязательно)</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Например, Маша">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">Твоё слово года <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="Год одним словом">
        <div id="ideas" class="wr-ideas" role="group" aria-label="Идеи для слова">
        <button type="button" class="wr-idea" data-w="Рост">Рост</button>
        <button type="button" class="wr-idea" data-w="Смелость">Смелость</button>
        <button type="button" class="wr-idea" data-w="Перезагрузка">Перезагрузка</button>
        <button type="button" class="wr-idea" data-w="Спокойствие">Спокойствие</button>
        <button type="button" class="wr-idea" data-w="Благодарность">Благодарность</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">Лучший момент</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Например, море зимой с сестрой">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">Песня года</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Та, что стояла на повторе">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">Еда года</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Например, шаурма после работы">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">Место года</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Например, кофейня у работы">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">Спасибо</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Например, маме, команде, Диме">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">Цель на следующий год</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Например, пробежать 10 км">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">Собрать карточку</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> Сохранить картинку</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> Скопировать текст</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> Изменить</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Итоги года · <a href="privacy.html">Политика конфиденциальности</a> · <a href="guide.html">Гайд</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"Что нужно заполнить?","a":"Только слово года. Имя, лучший момент, песня, еда, место, кого хочешь поблагодарить и цель — по желанию: пустые строки просто не появятся на карточке."},{"q":"Какой год будет на карточке?","a":"Тот, итоги которого ты подводишь, — по дате на твоём устройстве. В январе на карточке всё ещё будет только что закончившийся год, так что можно сделать её чуть позже."},{"q":"Можно сохранить карточку как картинку?","a":"Да. «Сохранить картинку» создаёт PNG 1080×1350, который отлично подходит для сторис и чатов. На телефоне откроется меню «Поделиться», на компьютере картинка скачается."},{"q":"Где хранится то, что я пишу?","a":"Только в твоём браузере, пока ты редактируешь, и внутри ссылки, если ты ею делишься. Ничего из написанного не отправляется на наш сервер, поэтому карточку увидит любой, у кого есть ссылка, — отправляй её только тем, кому доверяешь."}];</script>
