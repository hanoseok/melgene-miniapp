<body class="wr-body">
<header class="mg-top"><a class="mg-home" href="https://example.com/" aria-label="Melgene Apps home"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">Apps</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="Language"><option value="en" data-hreflang="en" lang="en" selected>English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="Language"><a href="./" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="./" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="./" hreflang="fr" lang="fr">Français</a> <a href="./" hreflang="de" lang="de">Deutsch</a> <a href="./" hreflang="th" lang="th">ไทย</a> <a href="./" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="./" hreflang="es" lang="es">Español</a> <a href="./" hreflang="it" lang="it">Italiano</a> <a href="./" hreflang="pt" lang="pt">Português</a> <a href="./" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 Year-end special</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">Year in review card maker</span><span class="wr-h1-main">Wrap up<br><em>your year</em></span></h1>
    <p class="wr-hook">One word, one song, one moment you’ll never forget. Fill in a few lines and get a card that sums up your year.</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">Make my card →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">Your year, in a few lines</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="Card themes">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">Aurora</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">Sunset</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">Mint</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">Midnight</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">Paper</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">Neon</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="Preview of your card"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">Your name (optional)</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Sam">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">Your word of the year <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="One word for your year">
        <div id="ideas" class="wr-ideas" role="group" aria-label="Word ideas">
        <button type="button" class="wr-idea" data-w="Growth">Growth</button>
        <button type="button" class="wr-idea" data-w="Brave">Brave</button>
        <button type="button" class="wr-idea" data-w="Rest">Rest</button>
        <button type="button" class="wr-idea" data-w="Change">Change</button>
        <button type="button" class="wr-idea" data-w="Joy">Joy</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">Best moment</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Seeing the sea with my sister">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">Song of the year</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="The song you played on repeat">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">Food of the year</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Midnight ramen">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">Place of the year</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. The little café by work">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">Someone to thank</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Mom, my team, Alex">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">Goal for next year</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Run a 10K">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">Finish my card</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> Save image</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> Copy text</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> Edit</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Year in Review Card · <a href="privacy.html">Privacy Policy</a> · <a href="guide.html">Guide</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"What do I need to fill in?","a":"Only your word of the year. Your name, best moment, song, food, place, the person you want to thank and your goal are all optional — empty lines simply don’t appear on the card."},{"q":"Which year does the card show?","a":"The year you are wrapping up, taken from your device’s date. In January the card still shows the year that just ended, so you can make it a little late."},{"q":"Can I save the card as a picture?","a":"Yes. “Save image” makes a 1080×1350 PNG that fits stories and chats. On a phone it opens the share sheet; on a computer it downloads."},{"q":"Where is what I write kept?","a":"Only in your own browser while you edit, and inside the link if you share it. Nothing you type is sent to our server, so anyone with the link can read the card — share it with people you trust."}];</script>
