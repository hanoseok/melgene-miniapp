<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 Spécial fin d’année</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">Bilan de l’année</span><span class="wr-h1-main">Ton année<br><em>en une carte</em></span></h1>
    <p class="wr-hook">Un mot, une chanson, un moment inoubliable. Remplis quelques lignes et obtiens une carte qui résume ton année.</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">Créer ma carte →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">Ton année en quelques lignes</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="Thèmes de la carte">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">Aurore</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">Crépuscule</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">Menthe</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">Minuit</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">Papier</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">Néon</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="Aperçu de ta carte"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">Ton prénom (facultatif)</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex. Léa">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">Ton mot de l’année <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="Un mot pour ton année">
        <div id="ideas" class="wr-ideas" role="group" aria-label="Idées de mots">
        <button type="button" class="wr-idea" data-w="Audace">Audace</button>
        <button type="button" class="wr-idea" data-w="Équilibre">Équilibre</button>
        <button type="button" class="wr-idea" data-w="Renouveau">Renouveau</button>
        <button type="button" class="wr-idea" data-w="Gratitude">Gratitude</button>
        <button type="button" class="wr-idea" data-w="Liberté">Liberté</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">Meilleur moment</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex. La mer en hiver avec ma sœur">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">Chanson de l’année</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Celle que tu as écoutée en boucle">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">Plat de l’année</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex. Les crêpes du dimanche">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">Lieu de l’année</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex. Le petit café près du bureau">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">Merci à…</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex. Maman, mon équipe, Hugo">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">Objectif pour l’an prochain</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex. Courir un 10 km">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">Terminer ma carte</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> Enregistrer l’image</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> Copier le texte</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> Modifier</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Mon bilan de l’année · <a href="privacy.html">Politique de confidentialité</a> · <a href="guide.html">Guide</a>
  </footer>
</main>
