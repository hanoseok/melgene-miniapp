<main class="wr-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 연말 특집</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">올해 결산 카드 만들기</span><span class="wr-h1-main">나의 한 해를<br><em>카드 한 장에</em></span></h1>
    <p class="wr-hook">한 단어, 한 곡, 잊지 못할 한 순간. 몇 줄만 적으면 나의 한 해를 담은 결산 카드가 완성돼요.</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">결산 카드 만들기 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">몇 줄로 돌아보는 나의 한 해</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="카드 테마">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">오로라</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">노을</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">민트</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">한밤</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">종이</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">네온</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="카드 미리보기"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">이름 (선택)</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 지민">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">올해의 한 단어 <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="올해를 한 단어로">
        <div id="ideas" class="wr-ideas" role="group" aria-label="한 단어 추천">
        <button type="button" class="wr-idea" data-w="성장">성장</button>
        <button type="button" class="wr-idea" data-w="버티기">버티기</button>
        <button type="button" class="wr-idea" data-w="도전">도전</button>
        <button type="button" class="wr-idea" data-w="쉼표">쉼표</button>
        <button type="button" class="wr-idea" data-w="행복">행복</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">최고의 순간</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 동생이랑 처음 본 겨울 바다">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">올해의 노래</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="올해 제일 많이 들은 노래">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">올해의 음식</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 퇴근길 떡볶이">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">올해의 장소</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 회사 앞 작은 카페">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">고마운 사람</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 엄마, 우리 팀, 민수">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">내년 목표</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 10km 마라톤 완주">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">카드 완성하기</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> 이미지 저장</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> 텍스트 복사</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> 고치기</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 올해 결산 카드 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
