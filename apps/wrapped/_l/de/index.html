  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="wr-screen wr-start">
    <p class="wr-badge">🎁 Zum Jahresende</p>
    <div class="wr-hero" aria-hidden="true"><span class="wr-hero-main">🎁</span><span class="wr-hero-a">📅</span><span class="wr-hero-b">🎧</span><span class="wr-hero-c">✨</span><span class="wr-hero-d">🏆</span></div>
    <h1 class="wr-h1"><span class="wr-kicker">Jahresrückblick-Karte</span><span class="wr-h1-main">Dein Jahr<br><em>auf einer Karte</em></span></h1>
    <p class="wr-hook">Ein Wort, ein Song, ein Moment, den du nie vergisst. Ein paar Zeilen eintragen – fertig ist die Karte, die dein Jahr zusammenfasst.</p>
    <button id="start-btn" class="wr-btn wr-btn-primary" type="button">Karte erstellen →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="wr-screen wr-edit" hidden>
    <h2 class="wr-edit-title">Dein Jahr in ein paar Zeilen</h2>
    <div id="themes" class="wr-chips" role="radiogroup" aria-label="Kartendesigns">
      <button type="button" class="wr-chip wr-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="wr-chip-emoji" aria-hidden="true">🌌</span><span class="wr-chip-name">Polarlicht</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="1" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌅</span><span class="wr-chip-name">Abendrot</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="2" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🍃</span><span class="wr-chip-name">Minze</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="3" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">🌙</span><span class="wr-chip-name">Mitternacht</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="4" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">📝</span><span class="wr-chip-name">Papier</span></button>
      <button type="button" class="wr-chip wr-theme" role="radio" data-t="5" aria-checked="false"><span class="wr-chip-emoji" aria-hidden="true">⚡</span><span class="wr-chip-name">Neon</span></button>
    </div>
    <div class="wr-preview"><canvas id="preview-canvas" class="wr-canvas" width="1080" height="1350" role="img" aria-label="Vorschau deiner Karte"></canvas></div>
    <div class="wr-fields">
      <label class="wr-field" for="f-nm"><span class="wr-label">Dein Name (optional)</span>
        <input id="f-nm" class="wr-input" type="text" data-k="nm" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="z. B. Lena">
      </label>
      <div class="wr-field wr-field-word">
        <label class="wr-label" for="f-w">Dein Wort des Jahres <span class="wr-req" aria-hidden="true">*</span></label>
        <input id="f-w" class="wr-input wr-input-word" type="text" data-k="w" maxlength="48" autocomplete="off" enterkeyhint="next" spellcheck="false" required aria-describedby="word-hint" placeholder="Ein Wort für dein Jahr">
        <div id="ideas" class="wr-ideas" role="group" aria-label="Wort-Ideen">
        <button type="button" class="wr-idea" data-w="Mut">Mut</button>
        <button type="button" class="wr-idea" data-w="Wachstum">Wachstum</button>
        <button type="button" class="wr-idea" data-w="Neustart">Neustart</button>
        <button type="button" class="wr-idea" data-w="Gelassenheit">Gelassenheit</button>
        <button type="button" class="wr-idea" data-w="Dankbarkeit">Dankbarkeit</button>
        </div>
      </div>
      <label class="wr-field" for="f-mo"><span class="wr-label">Schönster Moment</span>
        <input id="f-mo" class="wr-input" type="text" data-k="mo" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="z. B. Wintermeer mit meiner Schwester">
      </label>
      <label class="wr-field" for="f-so"><span class="wr-label">Song des Jahres</span>
        <input id="f-so" class="wr-input" type="text" data-k="so" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="Der Song in Dauerschleife">
      </label>
      <label class="wr-field" for="f-fo"><span class="wr-label">Essen des Jahres</span>
        <input id="f-fo" class="wr-input" type="text" data-k="fo" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="z. B. Döner nach Mitternacht">
      </label>
      <label class="wr-field" for="f-pl"><span class="wr-label">Ort des Jahres</span>
        <input id="f-pl" class="wr-input" type="text" data-k="pl" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="z. B. das kleine Café am Büro">
      </label>
      <label class="wr-field" for="f-th"><span class="wr-label">Danke an</span>
        <input id="f-th" class="wr-input" type="text" data-k="th" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="z. B. Mama, mein Team, Jonas">
      </label>
      <label class="wr-field" for="f-go"><span class="wr-label">Ziel fürs nächste Jahr</span>
        <input id="f-go" class="wr-input" type="text" data-k="go" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="z. B. 10 km laufen">
      </label>
    </div>
    <p id="word-hint" class="wr-hint" aria-live="polite"></p>
    <button id="done-btn" class="wr-btn wr-btn-primary" type="button">Karte fertigstellen</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="wr-screen wr-end" hidden>
    <article class="wr-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="wr-eyebrow"></p>
      <h2 id="end-title" class="wr-sr"></h2>
      <canvas id="end-canvas" class="wr-canvas wr-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="wr-end-actions">
        <button id="save-btn" class="wr-btn wr-btn-primary wr-btn-sm" type="button"><span aria-hidden="true">📥</span> Bild speichern</button>
        <button id="copy-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">📋</span> Text kopieren</button>
        <button id="edit-btn" class="wr-btn wr-btn-soft wr-btn-sm" type="button"><span aria-hidden="true">✏️</span> Bearbeiten</button>
      </div>
      <p id="save-status" class="wr-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="wrapped"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Jahresrückblick-Karte · <a href="privacy.html">Datenschutz</a> · <a href="guide.html">Anleitung</a>
  </footer>
