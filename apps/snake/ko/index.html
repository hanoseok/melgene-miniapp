<main class="sn-shell">
  <!-- 시작 화면: 티징 + 아주 짧은 방법(액션 게임) + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="sn-screen sn-start">
    <p class="sn-badge">🐍 추억의 아케이드</p>
    <div class="sn-hero" aria-hidden="true">
      <svg class="sn-hero-snake" viewBox="0 0 220 120" aria-hidden="true" focusable="false">
        <path d="M18 92 C40 92 40 56 66 56 C92 56 92 92 118 92 C144 92 144 56 170 56" fill="none" stroke="#04140d" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 92 C40 92 40 56 66 56 C92 56 92 92 118 92 C144 92 144 56 170 56" fill="none" stroke="#9cff4f" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 92 C40 92 40 56 66 56 C92 56 92 92 118 92 C144 92 144 56 170 56" fill="none" stroke="#5fd32a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 22" stroke-dashoffset="-2"/>
        <circle cx="172" cy="49" r="5.5" fill="#fff" stroke="#04140d" stroke-width="2"/><circle cx="173.5" cy="49" r="2.6" fill="#04140d"/>
        <circle cx="172" cy="64" r="5.5" fill="#fff" stroke="#04140d" stroke-width="2"/><circle cx="173.5" cy="64" r="2.6" fill="#04140d"/>
        <path d="M184 56 L202 56 M196 56 L203 51 M196 56 L203 61" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <h1 class="sn-h1"><span class="sn-kicker">뱀 게임 · 지렁이 게임</span><span class="sn-h1-main">먹고 길어지고<br><em>부딪히지 마요</em></span></h1>
    <p class="sn-hook">뱀을 움직여 사과를 먹어요. 한 입마다 길어지고 조금씩 빨라져요. 한 번만 잘못 꺾어도 끝이에요.</p>
    <ul class="sn-how">
      <li><span class="sn-how-ico" aria-hidden="true">👆</span><span class="sn-how-txt">스와이프 또는 방향키</span></li>
      <li><span class="sn-how-ico" aria-hidden="true">🍎</span><span class="sn-how-txt">사과 먹기</span></li>
      <li><span class="sn-how-ico" aria-hidden="true">🧱</span><span class="sn-how-txt">벽과 꼬리 피하기</span></li>
    </ul>
    <button id="start-btn" class="sn-btn sn-btn-primary" type="button">꿈틀꿈틀 시작 →</button>
    <p class="sn-facts">점점 빨라져요 · 벽은 위험 · 최고 기록 도전</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 캔버스 (광고 없음) -->
  <section id="screen-play" class="sn-screen sn-play" hidden>
    <div class="sn-hud">
      <div class="sn-hud-box sn-hud-score"><span class="sn-hud-label">점수</span><span id="hud-score" class="sn-hud-val">0</span></div>
      <div class="sn-hud-box sn-hud-best"><span class="sn-hud-label">최고</span><span id="hud-best" class="sn-hud-val">0</span></div>
      <button id="pause-btn" class="sn-pause" type="button" aria-label="일시정지" title="일시정지"><span aria-hidden="true"></span></button>
    </div>
    <div id="field" class="sn-field" tabindex="0" role="application" aria-label="게임 판. 스와이프하거나 방향키, W A S D 로 뱀을 움직여요.">
      <canvas id="sn-canvas" class="sn-canvas"></canvas>
      <div id="countdown" class="sn-overlay sn-count" hidden><span id="countdown-num" class="sn-count-num"></span></div>
      <div id="pause-overlay" class="sn-overlay sn-paused" hidden>
        <p class="sn-paused-title">잠깐 멈춤</p>
        <button id="resume-btn" class="sn-btn sn-btn-primary sn-btn-sm" type="button">계속하기</button>
      </div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="sn-screen sn-end" hidden>
    <article class="sn-result" aria-labelledby="res-score">
      <p id="res-reason" class="sn-eyebrow"></p>
      <p class="sn-score-line"><span id="res-score" class="sn-score-big">0</span> <span class="sn-points">점</span></p>
      <p id="res-newbest" class="sn-newbest" hidden>최고 기록 경신!</p>
      <p id="res-best" class="sn-best"></p>
      <dl class="sn-stats">
        <div class="sn-stat"><dt>먹은 사과</dt><dd id="res-ate">0</dd></div>
        <div class="sn-stat"><dt>도달한 속도 단계</dt><dd id="res-level">1</dd></div>
      </dl>
      <div id="res-rank" class="sn-rank" hidden>
        <p id="res-comparing" class="sn-comparing">다른 사람들과 비교하는 중…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="sn-top"></p>
          <p id="res-beat" class="sn-beat"></p>
          <p id="res-others" class="sn-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="snake"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 뱀 게임 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"어떻게 하나요?","a":"판 위에서 원하는 방향으로 스와이프하거나 방향키, W A S D 를 눌러요. 뱀은 멈추지 않고 계속 움직이니까 사과 쪽으로 방향을 꺾어 주세요. 사과를 먹을 때마다 길어지고, 벽이나 내 꼬리에 부딪히면 한 판이 끝나요."},{"q":"왜 점점 빨라지나요?","a":"사과를 몇 개 먹을 때마다 속도 단계가 올라가요. 뱀이 더 빨리 움직이고 사과 하나의 점수도 조금씩 커져요. 일정 속도가 되면 더는 빨라지지 않아서 끝까지 즐길 수 있어요."},{"q":"상위 %는 진짜인가요?","a":"네. 한 판이 끝나면 점수만 이름 없이 서버로 보내 다른 사람들의 점수와 비교해요. 비교할 실제 기록이 있을 때만 상위 %가 보이고, 없으면 아무것도 보여주지 않아요."},{"q":"게임이 저절로 멈췄어요.","a":"다른 탭이나 앱으로 가면 게임이 자동으로 멈춰서, 자리를 비운 사이에 부딪히지 않아요. 계속하기를 누르면 이어서 할 수 있어요. 최고 기록은 이 브라우저에 저장돼요."}];</script>
