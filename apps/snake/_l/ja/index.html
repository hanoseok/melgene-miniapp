  <!-- 시작 화면: 티징 + 아주 짧은 방법(액션 게임) + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="sn-screen sn-start">
    <p class="sn-badge">🐍 定番アーケード</p>
    <div class="sn-hero" aria-hidden="true">
      <svg class="sn-hero-snake" viewBox="0 0 220 120" aria-hidden="true" focusable="false">
        <path d="M18 92 C40 92 40 56 66 56 C92 56 92 92 118 92 C144 92 144 56 170 56" fill="none" stroke="#04140d" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 92 C40 92 40 56 66 56 C92 56 92 92 118 92 C144 92 144 56 170 56" fill="none" stroke="#9cff4f" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 92 C40 92 40 56 66 56 C92 56 92 92 118 92 C144 92 144 56 170 56" fill="none" stroke="#5fd32a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 22" stroke-dashoffset="-2"/>
        <circle cx="172" cy="49" r="5.5" fill="#fff" stroke="#04140d" stroke-width="2"/><circle cx="173.5" cy="49" r="2.6" fill="#04140d"/>
        <circle cx="172" cy="64" r="5.5" fill="#fff" stroke="#04140d" stroke-width="2"/><circle cx="173.5" cy="64" r="2.6" fill="#04140d"/>
        <path d="M184 56 L202 56 M196 56 L203 51 M196 56 L203 61" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <h1 class="sn-h1"><span class="sn-kicker">スネークゲーム</span><span class="sn-h1-main">食べて伸びて<br><em>ぶつかるな！</em></span></h1>
    <p class="sn-hook">ヘビを動かしてリンゴを食べよう。1口ごとに長く、少しずつ速くなる。曲がり損ねたら終わりです。</p>
    <ul class="sn-how">
      <li><span class="sn-how-ico" aria-hidden="true">👆</span><span class="sn-how-txt">スワイプか矢印キー</span></li>
      <li><span class="sn-how-ico" aria-hidden="true">🍎</span><span class="sn-how-txt">リンゴを食べる</span></li>
      <li><span class="sn-how-ico" aria-hidden="true">🧱</span><span class="sn-how-txt">壁としっぽに注意</span></li>
    </ul>
    <button id="start-btn" class="sn-btn sn-btn-primary" type="button">スタート →</button>
    <p class="sn-facts">だんだん速く · 壁は即アウト · ベスト更新へ</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 캔버스 (광고 없음) -->
  <section id="screen-play" class="sn-screen sn-play" hidden>
    <div class="sn-hud">
      <div class="sn-hud-box sn-hud-score"><span class="sn-hud-label">スコア</span><span id="hud-score" class="sn-hud-val">0</span></div>
      <div class="sn-hud-box sn-hud-best"><span class="sn-hud-label">ベスト</span><span id="hud-best" class="sn-hud-val">0</span></div>
      <button id="pause-btn" class="sn-pause" type="button" aria-label="一時停止" title="一時停止"><span aria-hidden="true"></span></button>
    </div>
    <div id="field" class="sn-field" tabindex="0" role="application" aria-label="ゲーム画面。スワイプ、矢印キー、W A S D でヘビを操作します。">
      <canvas id="sn-canvas" class="sn-canvas"></canvas>
      <div id="countdown" class="sn-overlay sn-count" hidden><span id="countdown-num" class="sn-count-num"></span></div>
      <div id="pause-overlay" class="sn-overlay sn-paused" hidden>
        <p class="sn-paused-title">一時停止</p>
        <button id="resume-btn" class="sn-btn sn-btn-primary sn-btn-sm" type="button">再開</button>
      </div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="sn-screen sn-end" hidden>
    <article class="sn-result" aria-labelledby="res-score">
      <p id="res-reason" class="sn-eyebrow"></p>
      <p class="sn-score-line"><span id="res-score" class="sn-score-big">0</span> <span class="sn-points">点</span></p>
      <p id="res-newbest" class="sn-newbest" hidden>ベスト更新！</p>
      <p id="res-best" class="sn-best"></p>
      <dl class="sn-stats">
        <div class="sn-stat"><dt>食べたリンゴ</dt><dd id="res-ate">0</dd></div>
        <div class="sn-stat"><dt>到達したスピード段階</dt><dd id="res-level">1</dd></div>
      </dl>
      <div id="res-rank" class="sn-rank" hidden>
        <p id="res-comparing" class="sn-comparing">みんなの記録と比べています…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="sn-top"></p>
          <p id="res-beat" class="sn-beat"></p>
          <p id="res-others" class="sn-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="snake"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> スネークゲーム · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"遊び方は？","a":"盤面を好きな方向にスワイプするか、矢印キーやW A S Dで操作します。ヘビは止まらず進み続けるので、リンゴに向かって曲がりましょう。リンゴを食べるたびに長くなり、壁や自分のしっぽにぶつかると終了です。"},{"q":"なぜだんだん速くなるの？","a":"リンゴを数個食べるごとにスピード段階が上がり、ヘビが速くなってリンゴ1個の点数も少し増えます。一定の速さになるとそれ以上は上がらないので、最後まで遊べます。"},{"q":"上位％は本物？","a":"はい。1回終わるとスコアだけが匿名でサーバーに送られ、ほかの人のスコアと比べます。比べられる実際の記録があるときだけ上位％が表示され、ないときは何も出ません。"},{"q":"ゲームが勝手に止まりました。","a":"別のタブやアプリに移ると自動で一時停止するので、席を外している間にぶつかる心配はありません。「再開」で続きから遊べます。ベスト記録はこのブラウザに保存されます。"}];</script>
