<main class="fg-shell">
  <!-- 시작 화면: h1·훅 → 무엇을 뽑나 → 몇 명 / 몇 팀 → 손가락 판 열기 → 공정성 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="fg-screen fg-setup">
    <h1 class="fg-h1"><span class="fg-kicker">손가락 룰렛</span><span class="fg-h1-main">다 같이 올리면<br><em>딱 한 명 당첨</em></span></h1>
    <p class="fg-hook">테이블 가운데 휴대폰 하나, 손가락 하나씩. 잠깐만 가만히 있으면 누가 커피를 쏠지, 누가 먼저 할지, 누가 설거지할지 화면이 정해 줘요.</p>

    <form id="fg-form" class="fg-card fg-form" novalidate autocomplete="off">
      <p class="fg-label" id="mode-label">무엇을 뽑을까요?</p>
      <div class="fg-seg fg-seg-3" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-one" role="radio" aria-checked="true" data-mode="one">👆 1명 뽑기</button>
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-n" role="radio" aria-checked="false" data-mode="n">✌️ 여러 명</button>
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-teams" role="radio" aria-checked="false" data-mode="teams">🎨 팀 나누기</button>
      </div>
      <div id="n-box" class="fg-sub" hidden>
        <p class="fg-label" id="n-label">몇 명 뽑을까요?</p>
        <div class="fg-stepper" role="group" aria-labelledby="n-label">
          <button type="button" id="n-less" class="fg-step-btn" aria-label="줄이기">−</button>
          <output id="n-value" class="fg-step-value" aria-live="polite"></output>
          <button type="button" id="n-more" class="fg-step-btn" aria-label="늘리기">+</button>
        </div>
      </div>
      <div id="teams-box" class="fg-sub" hidden>
        <p class="fg-label" id="teams-label">몇 팀으로 나눌까요?</p>
        <div class="fg-seg fg-seg-3" role="radiogroup" aria-labelledby="teams-label">
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-2" role="radio" aria-checked="true" data-teams="2">2팀</button>
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-3" role="radio" aria-checked="false" data-teams="3">3팀</button>
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-4" role="radio" aria-checked="false" data-teams="4">4팀</button>
        </div>
      </div>
    </form>

    <button type="button" id="start-btn" class="fg-btn fg-btn-primary">손가락 판 열기 👆</button>
    <p class="fg-fair">정하는 순간 crypto 난수로 뽑아요 · 손가락 최대 10개 · 어디로도 보내지 않아요</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 손가락 판 화면: 안내·설정 → 판 → 클릭 모드 버튼 → (끝나면) 결과 카드 → 최근 기록 → 공통 끝 화면. 광고 자리 없음 -->
  <section id="screen-play" class="fg-screen fg-play" hidden>
    <div class="fg-bar">
      <p id="play-banner" class="fg-banner"></p>
      <button type="button" id="settings-btn" class="fg-mini">설정</button>
    </div>
    <div id="pad" class="fg-pad" role="application" aria-label="손가락 판: 여기에 다 같이 손가락을 올리세요" aria-describedby="pad-status">
      <div id="dots" class="fg-dots" aria-hidden="true"></div>
      <div class="fg-status-wrap"><p id="pad-status" class="fg-status"></p><p id="pad-count" class="fg-count"></p></div>
    </div>
    <div id="click-bar" class="fg-click-bar" hidden>
      <p class="fg-click-hint">점을 다시 누르면 지워져요. 다 찍었으면 시작!</p>
      <div class="fg-click-btns">
        <button type="button" id="clear-btn" class="fg-btn fg-btn-ghost">지우기</button>
        <button type="button" id="go-btn" class="fg-btn fg-btn-go" disabled>시작!</button>
      </div>
    </div>
    <p id="live" class="visually-hidden" aria-live="assertive"></p>

    <div id="result" class="fg-result" hidden>
      <article class="fg-card fg-res-card" id="result-card" aria-labelledby="res-title">
        <p class="fg-res-kicker">👆 손가락 룰렛 결과</p>
        <h2 class="fg-h2 fg-res-title" id="res-title"></h2>
        <p id="res-sub" class="fg-res-sub"></p>
        <ul id="res-teams" class="fg-res-teams" hidden></ul>
        <div class="fg-actions">
          <button type="button" id="edit-btn" class="fg-btn fg-btn-ghost">설정 바꾸기</button>
        </div>
      </article>
      <div id="history-card" class="fg-card fg-history" hidden>
        <div class="fg-history-head">
          <h3 class="fg-h3" id="history-title">최근 결과</h3>
          <button type="button" id="history-clear" class="fg-mini">지우기</button>
        </div>
        <ol id="history" class="fg-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="finger"></div>
    </div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 손가락 룰렛 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
