<main class="fg-shell">
  <!-- 시작 화면: h1·훅 → 무엇을 뽑나 → 몇 명 / 몇 팀 → 손가락 판 열기 → 공정성 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="fg-screen fg-setup">
    <h1 class="fg-h1"><span class="fg-kicker">手指轮盘</span><span class="fg-h1-main">大家一起按住<br><em>只选中一个人</em></span></h1>
    <p class="fg-hook">手机放在桌子中间，每人一根手指。稍等一下别动，屏幕就会决定谁请奶茶、谁先出牌、谁去洗碗。</p>

    <form id="fg-form" class="fg-card fg-form" novalidate autocomplete="off">
      <p class="fg-label" id="mode-label">要选什么？</p>
      <div class="fg-seg fg-seg-3" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-one" role="radio" aria-checked="true" data-mode="one">👆 选1人</button>
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-n" role="radio" aria-checked="false" data-mode="n">✌️ 选多人</button>
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-teams" role="radio" aria-checked="false" data-mode="teams">🎨 分组</button>
      </div>
      <div id="n-box" class="fg-sub" hidden>
        <p class="fg-label" id="n-label">选几个人？</p>
        <div class="fg-stepper" role="group" aria-labelledby="n-label">
          <button type="button" id="n-less" class="fg-step-btn" aria-label="减少">−</button>
          <output id="n-value" class="fg-step-value" aria-live="polite"></output>
          <button type="button" id="n-more" class="fg-step-btn" aria-label="增加">+</button>
        </div>
      </div>
      <div id="teams-box" class="fg-sub" hidden>
        <p class="fg-label" id="teams-label">分成几组？</p>
        <div class="fg-seg fg-seg-3" role="radiogroup" aria-labelledby="teams-label">
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-2" role="radio" aria-checked="true" data-teams="2">2组</button>
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-3" role="radio" aria-checked="false" data-teams="3">3组</button>
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-4" role="radio" aria-checked="false" data-teams="4">4组</button>
        </div>
      </div>
    </form>

    <button type="button" id="start-btn" class="fg-btn fg-btn-primary">打开手指面板 👆</button>
    <p class="fg-fair">决定的瞬间用 crypto 随机数抽取 · 最多10根手指 · 不上传任何数据</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 손가락 판 화면: 안내·설정 → 판 → 클릭 모드 버튼 → (끝나면) 결과 카드 → 최근 기록 → 공통 끝 화면. 광고 자리 없음 -->
  <section id="screen-play" class="fg-screen fg-play" hidden>
    <div class="fg-bar">
      <p id="play-banner" class="fg-banner"></p>
      <button type="button" id="settings-btn" class="fg-mini">设置</button>
    </div>
    <div id="pad" class="fg-pad" role="application" aria-label="手指面板：大家一起把手指放在这里" aria-describedby="pad-status">
      <div id="dots" class="fg-dots" aria-hidden="true"></div>
      <div class="fg-status-wrap"><p id="pad-status" class="fg-status"></p><p id="pad-count" class="fg-count"></p></div>
    </div>
    <div id="click-bar" class="fg-click-bar" hidden>
      <p class="fg-click-hint">再点一次可删除点，齐了就按开始！</p>
      <div class="fg-click-btns">
        <button type="button" id="clear-btn" class="fg-btn fg-btn-ghost">清空</button>
        <button type="button" id="go-btn" class="fg-btn fg-btn-go" disabled>开始！</button>
      </div>
    </div>
    <p id="live" class="visually-hidden" aria-live="assertive"></p>

    <div id="result" class="fg-result" hidden>
      <article class="fg-card fg-res-card" id="result-card" aria-labelledby="res-title">
        <p class="fg-res-kicker">👆 手指轮盘结果</p>
        <h2 class="fg-h2 fg-res-title" id="res-title"></h2>
        <p id="res-sub" class="fg-res-sub"></p>
        <ul id="res-teams" class="fg-res-teams" hidden></ul>
        <div class="fg-actions">
          <button type="button" id="edit-btn" class="fg-btn fg-btn-ghost">修改设置</button>
        </div>
      </article>
      <div id="history-card" class="fg-card fg-history" hidden>
        <div class="fg-history-head">
          <h3 class="fg-h3" id="history-title">最近结果</h3>
          <button type="button" id="history-clear" class="fg-mini">清空</button>
        </div>
        <ol id="history" class="fg-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="finger"></div>
    </div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 手指轮盘 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"怎么选的？公平吗？","a":"在决定的那一刻，从屏幕上的手指中用浏览器的密码学随机数（crypto.getRandomValues）加拒绝采样来抽取，每根手指的概率完全相同。颜色只按手指放上的先后顺序分配，与结果无关。"},{"q":"为什么不马上选？","a":"要等约2.5秒内没有人新放或抬起手指才会选。有人晚到或松手，倒计时就会重新开始，所以没人能在最后一刻偷偷进出。"},{"q":"最多几个人？","a":"最多10根手指。很多手机同时只能识别5个左右的触点，人多时可以用平板或电脑的点击模式，或者分两轮进行。"},{"q":"分组是怎么分的？","a":"先用 crypto 随机数把所有手指打乱，再轮流分到各组。各组人数最多差1人，每个人进入任何一组的概率都相同。手指会变成所在组的颜色。"},{"q":"能用鼠标吗？","a":"可以。在电脑上每位玩家点一下放一个点，点错了再点一次删除，然后按开始。抽取方式完全一样。"}];</script>
