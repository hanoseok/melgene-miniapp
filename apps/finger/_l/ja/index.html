<main class="fg-shell">
  <!-- 시작 화면: h1·훅 → 무엇을 뽑나 → 몇 명 / 몇 팀 → 손가락 판 열기 → 공정성 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="fg-screen fg-setup">
    <h1 class="fg-h1"><span class="fg-kicker">指ルーレット</span><span class="fg-h1-main">みんなで指を置いたら<br><em>選ばれるのは1人</em></span></h1>
    <p class="fg-hook">テーブルの真ん中にスマホ1台、指は1人1本。少しじっとしていれば、おごる人も最初の人も皿洗い当番も画面が決めてくれます。</p>

    <form id="fg-form" class="fg-card fg-form" novalidate autocomplete="off">
      <p class="fg-label" id="mode-label">何を決める？</p>
      <div class="fg-seg fg-seg-3" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-one" role="radio" aria-checked="true" data-mode="one">👆 1人</button>
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-n" role="radio" aria-checked="false" data-mode="n">✌️ 複数人</button>
        <button type="button" class="fg-seg-btn fg-mode-btn" id="mode-teams" role="radio" aria-checked="false" data-mode="teams">🎨 チーム</button>
      </div>
      <div id="n-box" class="fg-sub" hidden>
        <p class="fg-label" id="n-label">何人選ぶ？</p>
        <div class="fg-stepper" role="group" aria-labelledby="n-label">
          <button type="button" id="n-less" class="fg-step-btn" aria-label="減らす">−</button>
          <output id="n-value" class="fg-step-value" aria-live="polite"></output>
          <button type="button" id="n-more" class="fg-step-btn" aria-label="増やす">+</button>
        </div>
      </div>
      <div id="teams-box" class="fg-sub" hidden>
        <p class="fg-label" id="teams-label">何チームに分ける？</p>
        <div class="fg-seg fg-seg-3" role="radiogroup" aria-labelledby="teams-label">
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-2" role="radio" aria-checked="true" data-teams="2">2チーム</button>
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-3" role="radio" aria-checked="false" data-teams="3">3チーム</button>
          <button type="button" class="fg-seg-btn fg-team-btn" id="teams-4" role="radio" aria-checked="false" data-teams="4">4チーム</button>
        </div>
      </div>
    </form>

    <button type="button" id="start-btn" class="fg-btn fg-btn-primary">指を置く画面へ 👆</button>
    <p class="fg-fair">決める瞬間に crypto 乱数で選びます・指は最大10本・どこにも送信しません</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 손가락 판 화면: 안내·설정 → 판 → 클릭 모드 버튼 → (끝나면) 결과 카드 → 최근 기록 → 공통 끝 화면. 광고 자리 없음 -->
  <section id="screen-play" class="fg-screen fg-play" hidden>
    <div class="fg-bar">
      <p id="play-banner" class="fg-banner"></p>
      <button type="button" id="settings-btn" class="fg-mini">設定</button>
    </div>
    <div id="pad" class="fg-pad" role="application" aria-label="指を置くエリア：みんなでここに指を置いてください" aria-describedby="pad-status">
      <div id="dots" class="fg-dots" aria-hidden="true"></div>
      <div class="fg-status-wrap"><p id="pad-status" class="fg-status"></p><p id="pad-count" class="fg-count"></p></div>
    </div>
    <div id="click-bar" class="fg-click-bar" hidden>
      <p class="fg-click-hint">点をもう一度押すと消えます。そろったらスタート！</p>
      <div class="fg-click-btns">
        <button type="button" id="clear-btn" class="fg-btn fg-btn-ghost">消す</button>
        <button type="button" id="go-btn" class="fg-btn fg-btn-go" disabled>スタート！</button>
      </div>
    </div>
    <p id="live" class="visually-hidden" aria-live="assertive"></p>

    <div id="result" class="fg-result" hidden>
      <article class="fg-card fg-res-card" id="result-card" aria-labelledby="res-title">
        <p class="fg-res-kicker">👆 指ルーレットの結果</p>
        <h2 class="fg-h2 fg-res-title" id="res-title"></h2>
        <p id="res-sub" class="fg-res-sub"></p>
        <ul id="res-teams" class="fg-res-teams" hidden></ul>
        <div class="fg-actions">
          <button type="button" id="edit-btn" class="fg-btn fg-btn-ghost">設定を変える</button>
        </div>
      </article>
      <div id="history-card" class="fg-card fg-history" hidden>
        <div class="fg-history-head">
          <h3 class="fg-h3" id="history-title">最近の結果</h3>
          <button type="button" id="history-clear" class="fg-mini">消す</button>
        </div>
        <ol id="history" class="fg-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="finger"></div>
    </div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 指ルーレット · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>

<script>window.MG_FAQ = [{"q":"どうやって選ぶの？公平？","a":"決める瞬間に画面にある指の中から、ブラウザの暗号用乱数（crypto.getRandomValues）と棄却サンプリングで選ぶので、どの指も確率はまったく同じです。色は指を置いた順に付くだけで、結果には関係ありません。"},{"q":"どうしてすぐに選ばないの？","a":"約2.5秒間、指が増えたり離れたりしなかったときに選びます。誰かが遅れて置いたり指を離したりすると待ち時間は最初からやり直しなので、最後の瞬間にこっそり抜けたり入ったりはできません。"},{"q":"何人まで遊べる？","a":"指は10本までです。多くのスマホは同時に5本ほどしか認識しないので、人数が多いときはタブレットやパソコンのクリックモードを使うか、2回に分けて遊んでください。"},{"q":"チームはどう分けるの？","a":"すべての指を crypto 乱数でシャッフルしてから順番に各チームへ配ります。チームの人数差は最大1人で、誰がどのチームになる確率も同じです。指はチームの色に変わります。"},{"q":"マウスでも使える？","a":"はい。パソコンでは参加者ごとに1回クリックして点を置き、間違えた点はもう一度押して消してからスタートを押します。選び方は同じです。"}];</script>
