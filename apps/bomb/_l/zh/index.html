<main class="bm-shell">
  <!-- 시작 화면: h1·훅 → 누가 하나 → 이름 → 심지 길이 → 힌트·벌칙 → 불붙이기 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="bm-screen bm-setup">
    <h1 class="bm-h1"><span class="bm-kicker">传炸弹游戏</span><span class="bm-h1-main">点一下，传出去，<br><em>别在你手里炸</em></span></h1>
    <p class="bm-hook">一部手机，一根秘密引线。点炸弹，传给下一个人，希望它别在你手里爆炸！</p>

    <form id="bm-form" class="bm-card bm-form" novalidate autocomplete="off">
      <p class="bm-label" id="mode-label">谁来玩？</p>
      <div class="bm-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="bm-seg-btn" id="mode-free" role="radio" aria-checked="true">🎲 直接开玩</button>
        <button type="button" class="bm-seg-btn" id="mode-names" role="radio" aria-checked="false">👥 输入名字</button>
      </div>
      <div id="names-box" class="bm-names" hidden>
        <label class="bm-label" for="names">按传递顺序输入名字</label>
        <textarea id="names" class="bm-textarea" rows="5" maxlength="400" placeholder="每行一个名字，按传递顺序
小明
小红
浩宇
欣怡" spellcheck="false"></textarea>
        <p class="bm-hint"><span>2到12人，炸弹按这个顺序传。</span> <output id="names-count" class="bm-count"></output></p>
      </div>
      <p class="bm-label" id="fuse-label">引线长度</p>
      <div class="bm-seg bm-seg-3" role="radiogroup" aria-labelledby="fuse-label">
        <button type="button" class="bm-seg-btn bm-fuse-btn" id="fuse-short" role="radio" aria-checked="false" data-fuse="short"><span class="bm-fuse-name">短</span><span class="bm-fuse-range">10–25秒</span></button>
        <button type="button" class="bm-seg-btn bm-fuse-btn" id="fuse-normal" role="radio" aria-checked="true" data-fuse="normal"><span class="bm-fuse-name">中</span><span class="bm-fuse-range">20–45秒</span></button>
        <button type="button" class="bm-seg-btn bm-fuse-btn" id="fuse-long" role="radio" aria-checked="false" data-fuse="long"><span class="bm-fuse-name">长</span><span class="bm-fuse-range">40–80秒</span></button>
      </div>
      <label class="bm-switch">
        <input type="checkbox" id="hints" role="switch">
        <span class="bm-switch-ui" aria-hidden="true"></span>
        <span class="bm-switch-text"><span class="bm-switch-label">显示提示</span><span class="bm-hint">引线越烧越短，火花就越快。</span></span>
      </label>
      <label class="bm-switch">
        <input type="checkbox" id="missions" role="switch">
        <span class="bm-switch-ui" aria-hidden="true"></span>
        <span class="bm-switch-text"><span class="bm-switch-label">惩罚任务卡</span><span class="bm-hint">给被炸到的人一个轻松的小惩罚。</span></span>
      </label>
    </form>

    <p id="error" class="bm-error" role="alert" hidden></p>
    <p id="shared-note" class="bm-note" hidden>已从分享链接读取玩家，准备好就点燃引线吧！</p>
    <button type="button" id="start-btn" class="bm-btn bm-btn-primary">点燃引线 💣</button>
    <p class="bm-fair">爆炸时间在开始时用 crypto 随机数决定，全程保密 · 名字只存在这台设备上</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: 안내·소리·그만 → 들고 있는 사람 → 폭탄 → 넘기기 안내 → 멈춤·펑 → (끝나면) 결과 카드 → 최근 기록 → 공통 끝 화면. 광고 자리 없음 -->
  <section id="screen-play" class="bm-screen bm-play" hidden>
    <div class="bm-bar">
      <p id="play-banner" class="bm-banner"></p>
      <button type="button" id="mute-btn" class="bm-icon-btn" aria-pressed="false" aria-label="关闭声音">🔊</button>
      <button type="button" id="stop-btn" class="bm-mini">停止</button>
    </div>
    <div id="stage" class="bm-stage">
      <p id="holder" class="bm-holder"></p>
      <button type="button" id="bomb-btn" class="bm-bomb" aria-label="传炸弹" aria-describedby="pass-msg">
        <svg class="bm-bomb-svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="bm-body" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#5a5670"/><stop offset=".55" stop-color="#26232f"/><stop offset="1" stop-color="#0f0d14"/></radialGradient>
          </defs>
          <path class="bm-fuse" d="M128 46 C140 26 158 22 170 30" fill="none" stroke="#c9a46a" stroke-width="7" stroke-linecap="round"/>
          <rect x="106" y="40" width="34" height="24" rx="6" transform="rotate(32 123 52)" fill="#3b3848"/>
          <circle cx="94" cy="118" r="66" fill="url(#bm-body)"/>
          <ellipse cx="70" cy="90" rx="18" ry="11" transform="rotate(-35 70 90)" fill="#fff" opacity=".28"/>
        </svg>
        <span class="bm-spark" aria-hidden="true"></span>
      </button>
      <p id="pass-msg" class="bm-pass" aria-live="polite"></p>
      <p id="pass-count" class="bm-pass-count"></p>
      <p class="bm-tip">点完马上把手机递给下一个人。快！</p>
      <div id="paused" class="bm-paused" hidden>
        <p class="bm-paused-title">⏸ 已暂停</p>
        <p class="bm-paused-text">游戏在后台时，引线也会停下。</p>
        <button type="button" id="resume-btn" class="bm-btn bm-btn-primary">继续游戏</button>
      </div>
    </div>
    <div id="boom" class="bm-boom" aria-hidden="true" hidden><span class="bm-boom-burst"></span><span class="bm-boom-text">💥 轰！</span></div>
    <p id="live" class="visually-hidden" aria-live="assertive"></p>

    <div id="result" class="bm-result" hidden>
      <article class="bm-card bm-res-card" id="result-card" aria-labelledby="res-title">
        <p class="bm-res-kicker" id="res-kicker">💥 轰！</p>
        <h2 class="bm-h2 bm-res-title" id="res-title"></h2>
        <p id="res-sub" class="bm-res-sub"></p>
        <p id="res-stats" class="bm-res-stats"></p>
        <div id="mission-card" class="bm-mission" hidden>
          <h3 class="bm-h3">惩罚任务</h3>
          <p id="mission-text" class="bm-mission-text"></p>
        </div>
        <div class="bm-actions">
          <button type="button" id="edit-btn" class="bm-btn bm-btn-ghost">修改玩家</button>
          <button type="button" id="link-btn" class="bm-btn bm-btn-ghost" hidden>复制带名字的链接</button>
        </div>
      </article>
      <div id="history-card" class="bm-card bm-history" hidden>
        <div class="bm-history-head">
          <h3 class="bm-h3" id="history-title">最近几局</h3>
          <button type="button" id="history-clear" class="bm-mini">清除</button>
        </div>
        <ol id="history" class="bm-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="bomb"></div>
    </div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 传炸弹游戏 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
