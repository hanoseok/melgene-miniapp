<main class="dc-shell">
  <!-- 첫 화면(시작 화면이 따로 없는 도구 앱): h1·훅 → 개수/종류 → 주사위 판 → 굴리기 → (첫 굴림 뒤) 기록 + 공통 끝 화면 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-dice" class="dc-screen">
    <h1 class="dc-h1"><span class="dc-kicker">サイコロを振る</span><span class="dc-h1-main">振って、転がして<br><em>サイコロ</em>に決めてもらおう</span></h1>
    <p class="dc-hook">個数と種類を選んで振るだけ。ボードゲームにTRPG、皿洗い当番を決めるときにも。</p>

    <div class="dc-card dc-settings">
      <p class="dc-label" id="count-label">サイコロの数</p>
      <div class="dc-seg" role="radiogroup" aria-labelledby="count-label">
        <button type="button" class="dc-seg-btn" role="radio" data-count="1" aria-checked="false">1</button>
        <button type="button" class="dc-seg-btn" role="radio" data-count="2" aria-checked="true">2</button>
        <button type="button" class="dc-seg-btn" role="radio" data-count="3" aria-checked="false">3</button>
        <button type="button" class="dc-seg-btn" role="radio" data-count="4" aria-checked="false">4</button>
        <button type="button" class="dc-seg-btn" role="radio" data-count="5" aria-checked="false">5</button>
        <button type="button" class="dc-seg-btn" role="radio" data-count="6" aria-checked="false">6</button>
      </div>
      <p class="dc-label" id="type-label">サイコロの種類</p>
      <div class="dc-seg" role="radiogroup" aria-labelledby="type-label">
        <button type="button" class="dc-seg-btn dc-type-btn" role="radio" data-sides="4" aria-checked="false">d4</button>
        <button type="button" class="dc-seg-btn dc-type-btn" role="radio" data-sides="6" aria-checked="true">d6</button>
        <button type="button" class="dc-seg-btn dc-type-btn" role="radio" data-sides="8" aria-checked="false">d8</button>
        <button type="button" class="dc-seg-btn dc-type-btn" role="radio" data-sides="10" aria-checked="false">d10</button>
        <button type="button" class="dc-seg-btn dc-type-btn" role="radio" data-sides="12" aria-checked="false">d12</button>
        <button type="button" class="dc-seg-btn dc-type-btn" role="radio" data-sides="20" aria-checked="false">d20</button>
      </div>
      <p class="dc-hint">d6はおなじみの立方体。d4〜d20はTRPGなどのテーブルゲーム用です。</p>
    </div>

    <div id="tray" class="dc-tray" aria-label="サイコロトレイ">
      <div id="dice" class="dc-dice" aria-hidden="true"></div>
      <p id="total" class="dc-total is-idle">準備ができたらどうぞ</p>
    </div>
    <p id="live" class="visually-hidden" aria-live="polite"></p>
    <button type="button" id="roll-btn" class="dc-btn dc-btn-primary">サイコロを振る 🎲</button>
    <p class="dc-keyhint">ヒント:スペースキーでも振れます</p>
    <p class="dc-fair">どの面が出る確率もまったく同じ(暗号論的乱数)</p>

    <div id="history" class="dc-history" hidden>
      <div class="dc-card dc-history-card">
        <h2 class="dc-h2" id="history-title">直近10回の結果</h2>
        <p class="dc-history-note">このページを開いている間だけ残ります。</p>
        <ol id="history-list" class="dc-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="dice"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> サイコロ · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>

<script>window.MG_FAQ = [{"q":"サイコロの結果は本当にランダムで公平ですか？","a":"はい。すべての結果はブラウザの暗号論的乱数生成器（crypto.getRandomValues）と棄却サンプリングで決まるので、どの面もほかの面よりわずかでも出やすくなることはありません。結果はアニメーションが始まる前に決まっていて、転がる動きは演出です。"},{"q":"一度に何個まで振れますか？","a":"1回につき1〜6個、すべて同じ種類のサイコロを振れます。トレイにそれぞれの出目と合計が表示され、直近10回の結果はページを開いている間、短いリストに残ります。"},{"q":"d4、d8、d10、d12、d20とは何ですか？","a":"それぞれ4面、8面、10面、12面、20面のサイコロで、ダンジョンズ&ドラゴンズなどのTRPGで使われます。dの後ろの数字が面の数なので、d20は1〜20が出て、2d6は6面サイコロ2個という意味です。"},{"q":"ボードゲームに使えますか？","a":"もちろんです。サイコロをなくしたとき、箱に入っているより多くのサイコロが必要なとき、ビデオ通話で遊ぶときに使ってみてください。キーボードならスペースキーですばやく振れます。"}];</script>
