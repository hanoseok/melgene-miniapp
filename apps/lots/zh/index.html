<main class="lt-shell">
  <!-- 시작 화면: h1·훅 → 쪽지 수 → 이름(선택, 접힘) → 쪽지 내용(간단/직접) → 옵션 → 시작 → 최근 설정 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-setup" class="lt-screen lt-setup">
    <h1 class="lt-h1"><span class="lt-kicker">在线抽签</span><span class="lt-h1-main">手机传一圈<br><em>一人抽一张</em></span></h1>
    <p class="lt-hook">把签折好，手机传一圈就搞定。今天谁请奶茶？谁来接受惩罚？</p>

    <form id="lt-form" class="lt-form" novalidate autocomplete="off">
      <div class="lt-card lt-ticket">
        <div class="lt-row">
          <label class="lt-label" for="count">做几张签？</label>
          <div class="lt-stepper">
            <button type="button" id="count-dec" class="lt-step" aria-label="少一张">−</button>
            <input id="count" class="lt-input lt-input-num" type="number" step="1" inputmode="numeric" value="6" min="2" max="50" enterkeyhint="done">
            <button type="button" id="count-inc" class="lt-step" aria-label="多一张">+</button>
          </div>
        </div>
        <p id="count-note" class="lt-hint lt-count-note" hidden></p>
        <button type="button" id="names-btn" class="lt-more-btn" aria-expanded="false" aria-controls="names-box">+ 填写参与者（可选）</button>
        <div id="names-box" class="lt-names" hidden>
          <label class="lt-label" for="names">谁来抽？</label>
          <textarea id="names" class="lt-textarea" rows="4" spellcheck="false" placeholder="每行一个名字
小明
小红
阿杰" aria-describedby="names-hint"></textarea>
          <p class="lt-hint" id="names-hint">填了名字就按人数做签，每轮会提示轮到谁。</p>
        </div>
      </div>

      <div class="lt-card lt-ticket">
        <p class="lt-label" id="mode-label">签上写什么？</p>
        <div class="lt-seg" role="radiogroup" aria-labelledby="mode-label">
          <button type="button" class="lt-seg-btn" id="mode-simple" role="radio" aria-checked="true">中签 / 空签</button>
          <button type="button" class="lt-seg-btn" id="mode-custom" role="radio" aria-checked="false">自定义签文</button>
        </div>
        <div id="simple-box" class="lt-simple">
          <div class="lt-row">
          <label class="lt-label" for="winners">中签张数</label>
          <div class="lt-stepper">
            <button type="button" id="winners-dec" class="lt-step" aria-label="少一张">−</button>
            <input id="winners" class="lt-input lt-input-num" type="number" step="1" inputmode="numeric" value="1" min="1" max="50" enterkeyhint="done">
            <button type="button" id="winners-inc" class="lt-step" aria-label="多一张">+</button>
          </div>
        </div>
          <p id="simple-preview" class="lt-preview" aria-live="polite"></p>
        </div>
        <div id="custom-box" class="lt-custom" hidden>
          <p class="lt-hint">写下签文和张数，合计要等于签的总数。</p>
          <ul id="kinds" class="lt-kinds"></ul>
          <div class="lt-kind-btns">
            <button type="button" id="kind-add" class="lt-mini">+ 添加签文</button>
            <button type="button" id="fill-blank" class="lt-mini">其余补成空签</button>
          </div>
          <p id="total" class="lt-total" aria-live="polite"></p>
        </div>
      </div>

      <div class="lt-card lt-ticket lt-opts">
        <label class="lt-switch"><input type="checkbox" id="hide" role="switch" checked><span class="lt-switch-ui" aria-hidden="true"></span><span class="lt-switch-text">看完立刻盖住结果<small>手机传下去时，下一个人看不到前面的结果。</small></span></label>
        <label class="lt-switch"><input type="checkbox" id="fx" role="switch" checked><span class="lt-switch-ui" aria-hidden="true"></span><span class="lt-switch-text">中签撒彩纸</span></label>
      </div>
    </form>

    <p id="error" class="lt-error" role="alert" hidden></p>
    <button type="button" id="start-btn" class="lt-btn lt-btn-primary">折好纸签 🎟️</button>
    <p class="lt-fair">用 crypto 随机数洗牌一次 · 内容不会上传服务器</p>

    <div id="recent" class="lt-card lt-recent" hidden>
      <div class="lt-recent-head">
        <h2 class="lt-h2" id="recent-title">最近的设置</h2>
        <button type="button" id="recent-clear" class="lt-mini">清除</button>
      </div>
      <ul id="recent-list" class="lt-recent-list" aria-labelledby="recent-title"></ul>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 뽑기 화면: 진행 → 차례 → 접힌 쪽지 격자 → 그만 뽑기 (광고 없음). 펼친 쪽지·폰 넘기기는 앱 폭 안의 덮개 -->
  <section id="screen-draw" class="lt-screen lt-draw" hidden>
    <div class="lt-progress">
      <p id="progress" class="lt-progress-text"></p>
      <div class="lt-bar" aria-hidden="true"><i id="bar-fill" class="lt-bar-fill"></i></div>
    </div>
    <p id="turn" class="lt-turn"></p>
    <p class="lt-pick-hint">随便点一张折好的签</p>
    <div id="grid" class="lt-grid" role="group" aria-label="折好的纸签"></div>
    <button type="button" id="finish-btn" class="lt-mini lt-finish">到此结束</button>
    <p id="live" class="visually-hidden" aria-live="polite"></p>

    <div id="reveal" class="lt-cover lt-reveal" hidden role="dialog" aria-modal="true" aria-labelledby="reveal-who">
      <div class="lt-cover-inner">
        <p id="reveal-who" class="lt-reveal-who"></p>
        <div id="paper" class="lt-paper">
          <div class="lt-paper-in">
            <span id="paper-no" class="lt-paper-no"></span>
            <span id="paper-label" class="lt-paper-label"></span>
            <span id="paper-tag" class="lt-paper-tag"></span>
          </div>
          <div class="lt-flap" aria-hidden="true"><span id="flap-no" class="lt-flap-no"></span></div>
        </div>
        <button type="button" id="next-btn" class="lt-btn lt-btn-primary">下一位</button>
      </div>
      <div id="confetti" class="lt-confetti" aria-hidden="true"></div>
    </div>

    <div id="pass" class="lt-cover lt-pass" hidden role="dialog" aria-modal="true" aria-labelledby="pass-title">
      <div class="lt-cover-inner">
        <p class="lt-pass-emoji" aria-hidden="true">📱👉</p>
        <p id="pass-title" class="lt-pass-title"></p>
        <p class="lt-hint lt-pass-hint">前面的结果已经盖住了。</p>
        <button type="button" id="ready-btn" class="lt-btn lt-btn-primary">准备好了</button>
      </div>
    </div>
  </section>

  <!-- 끝 화면: 결과 카드(누가 뭘 뽑았나) → 공통 끝 화면 -->
  <section id="screen-end" class="lt-screen lt-end" hidden>
    <article class="lt-card lt-result" id="result-card" aria-labelledby="res-title">
      <p id="shared-badge" class="lt-badge" hidden>🎟️ 分享的抽签结果</p>
      <h2 class="lt-h2 lt-res-title" id="res-title">谁抽到了什么</h2>
      <p id="shared-note" class="lt-shared-note" hidden></p>
      <ul id="res-tags" class="lt-tags"></ul>
      <ol id="summary" class="lt-summary"></ol>
      <p id="leftover" class="lt-leftover" hidden></p>
      <h3 class="lt-h3">按签文查看</h3>
      <ul id="tally" class="lt-tally"></ul>
      <div class="lt-actions">
        <button type="button" id="copy-btn" class="lt-btn lt-btn-ghost">复制为文字</button>
        <button type="button" id="link-btn" class="lt-btn lt-btn-ghost">复制结果链接</button>
        <button type="button" id="edit-btn" class="lt-btn lt-btn-ghost">修改设置</button>
      </div>
    </article>
    <div data-mg-end="lots"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 抽签 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
