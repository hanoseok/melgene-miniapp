<main class="rn-shell">
  <!-- 첫 화면(시작 화면이 따로 없는 도구 앱): h1·훅 → 범위·개수·옵션 → 뽑기 → (뽑은 뒤) 결과 + 최근 기록 + 공통 끝 화면 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-rn" class="rn-screen">
    <h1 class="rn-h1"><span class="rn-kicker">随机数生成器</span><span class="rn-h1-main">抽一个还是一百个<br>都<em>公平</em>随机</span></h1>
    <p class="rn-hook">定好范围和数量就能抽。抽奖、幸运观众、课堂点名、排顺序都好用。</p>

    <form id="rn-form" class="rn-card rn-settings" novalidate autocomplete="off">
      <p class="rn-label" id="preset-label">常用范围</p>
      <div class="rn-presets" role="group" aria-labelledby="preset-label">
        <button type="button" class="rn-chip" data-preset="1-6" aria-pressed="false">1–6</button>
        <button type="button" class="rn-chip" data-preset="1-10" aria-pressed="false">1–10</button>
        <button type="button" class="rn-chip" data-preset="1-45" aria-pressed="false">1–45</button>
        <button type="button" class="rn-chip" data-preset="1-100" aria-pressed="true">1–100</button>
      </div>

      <div class="rn-range">
        <label class="rn-field" for="min"><span class="rn-label">最小值</span>
          <input id="min" class="rn-input" type="number" step="1" value="1" min="-1000000000" max="1000000000" enterkeyhint="go"></label>
        <span class="rn-range-arrow" aria-hidden="true">→</span>
        <label class="rn-field" for="max"><span class="rn-label">最大值</span>
          <input id="max" class="rn-input" type="number" step="1" value="100" min="-1000000000" max="1000000000" enterkeyhint="go"></label>
      </div>

      <div class="rn-count">
        <label class="rn-label" for="count">抽几个数字？</label>
        <div class="rn-stepper">
          <button type="button" id="count-dec" class="rn-step" aria-label="减少一个">−</button>
          <input id="count" class="rn-input rn-input-count" type="number" step="1" inputmode="numeric" value="1" min="1" max="1000" enterkeyhint="go">
          <button type="button" id="count-inc" class="rn-step" aria-label="增加一个">+</button>
        </div>
      </div>

      <div class="rn-toggles">
        <label class="rn-switch"><input type="checkbox" id="dup" role="switch"><span class="rn-switch-ui" aria-hidden="true"></span><span>允许重复</span></label>
        <label class="rn-switch"><input type="checkbox" id="sort" role="switch"><span class="rn-switch-ui" aria-hidden="true"></span><span>从小到大</span></label>
      </div>

      <button type="button" id="more-btn" class="rn-more-btn" aria-expanded="false" aria-controls="more">更多选项</button>
      <div id="more" class="rn-more" hidden>
        <label class="rn-field" for="exclude"><span class="rn-label">排除号码</span>
          <input id="exclude" class="rn-input rn-input-text" type="text" inputmode="text" placeholder="例如 4, 13, 20-25" maxlength="2000" aria-describedby="exclude-hint"></label>
        <p class="rn-hint" id="exclude-hint">用逗号或空格分隔。写 20-25 就会排除这一段的所有数字。</p>
        <label class="rn-field" for="label"><span class="rn-label">抽奖名称(可选)</span>
          <input id="label" class="rn-input rn-input-text" type="text" placeholder="例如 粉丝福利抽奖" maxlength="60"></label>
      </div>
    </form>

    <p id="error" class="rn-error" role="alert" hidden></p>
    <button type="button" id="draw-btn" class="rn-btn rn-btn-primary">开始抽号 🔢</button>
    <p class="rn-fair">无偏差的加密随机数 · 输入内容不会离开你的浏览器</p>

    <div id="result" class="rn-result" hidden>
      <div class="rn-card rn-result-card" id="result-card">
        <p id="shared-badge" class="rn-badge" hidden>🎁 分享的抽奖结果</p>
        <h2 class="rn-h2" id="res-title">抽中的数字</h2>
        <p id="res-label" class="rn-res-label" hidden></p>
        <ul id="res-tags" class="rn-tags"></ul>
        <div id="reels" class="rn-reels" aria-hidden="true"></div>
        <p id="live" class="visually-hidden" aria-live="polite"></p>
        <p id="shared-note" class="rn-shared-note" hidden></p>
        <div class="rn-actions">
          <button type="button" id="copy-btn" class="rn-btn rn-btn-ghost">复制数字</button>
          <button type="button" id="link-btn" class="rn-btn rn-btn-ghost">复制结果链接</button>
        </div>
      </div>
      <div class="rn-card rn-history-card" id="history-card" hidden>
        <div class="rn-history-head">
          <h2 class="rn-h2" id="history-title">最近的抽号</h2>
          <button type="button" id="history-clear" class="rn-mini">清除</button>
        </div>
        <p class="rn-history-note">最多保存最近10次，只存在这台设备上。</p>
        <ol id="history-list" class="rn-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="randnum"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 随机数生成器 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
