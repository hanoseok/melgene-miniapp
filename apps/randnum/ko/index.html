<header class="mg-top"><a class="mg-home" href="https://example.com/ko/" aria-label="멜진 미니앱 홈으로"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">미니앱</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="언어 선택"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko" selected>한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="언어 선택"><a href="../" hreflang="en" lang="en">English</a> <a href="../ja/" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="rn-shell">
  <!-- 첫 화면(시작 화면이 따로 없는 도구 앱): h1·훅 → 범위·개수·옵션 → 뽑기 → (뽑은 뒤) 결과 + 최근 기록 + 공통 끝 화면 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-rn" class="rn-screen">
    <h1 class="rn-h1"><span class="rn-kicker">랜덤 숫자 뽑기</span><span class="rn-h1-main">숫자 하나도, 백 개도<br><em>공정하게</em> 뽑아요</span></h1>
    <p class="rn-hook">범위와 개수만 정하고 뽑기. 경품 추첨, 이벤트 당첨자, 발표 순서, 자리 번호 정하기에 딱이에요.</p>

    <form id="rn-form" class="rn-card rn-settings" novalidate autocomplete="off">
      <p class="rn-label" id="preset-label">자주 쓰는 범위</p>
      <div class="rn-presets" role="group" aria-labelledby="preset-label">
        <button type="button" class="rn-chip" data-preset="1-6" aria-pressed="false">1–6</button>
        <button type="button" class="rn-chip" data-preset="1-10" aria-pressed="false">1–10</button>
        <button type="button" class="rn-chip" data-preset="1-45" aria-pressed="false">1–45</button>
        <button type="button" class="rn-chip" data-preset="1-100" aria-pressed="true">1–100</button>
      </div>

      <div class="rn-range">
        <label class="rn-field" for="min"><span class="rn-label">최소</span>
          <input id="min" class="rn-input" type="number" step="1" value="1" min="-1000000000" max="1000000000" enterkeyhint="go"></label>
        <span class="rn-range-arrow" aria-hidden="true">→</span>
        <label class="rn-field" for="max"><span class="rn-label">최대</span>
          <input id="max" class="rn-input" type="number" step="1" value="100" min="-1000000000" max="1000000000" enterkeyhint="go"></label>
      </div>

      <div class="rn-count">
        <label class="rn-label" for="count">몇 개 뽑을까요?</label>
        <div class="rn-stepper">
          <button type="button" id="count-dec" class="rn-step" aria-label="하나 줄이기">−</button>
          <input id="count" class="rn-input rn-input-count" type="number" step="1" inputmode="numeric" value="1" min="1" max="1000" enterkeyhint="go">
          <button type="button" id="count-inc" class="rn-step" aria-label="하나 늘리기">+</button>
        </div>
      </div>

      <div class="rn-toggles">
        <label class="rn-switch"><input type="checkbox" id="dup" role="switch"><span class="rn-switch-ui" aria-hidden="true"></span><span>중복 허용</span></label>
        <label class="rn-switch"><input type="checkbox" id="sort" role="switch"><span class="rn-switch-ui" aria-hidden="true"></span><span>작은 순 정렬</span></label>
      </div>

      <button type="button" id="more-btn" class="rn-more-btn" aria-expanded="false" aria-controls="more">옵션 더 보기</button>
      <div id="more" class="rn-more" hidden>
        <label class="rn-field" for="exclude"><span class="rn-label">뺄 숫자</span>
          <input id="exclude" class="rn-input rn-input-text" type="text" inputmode="text" placeholder="예: 4, 13, 20-25" maxlength="2000" aria-describedby="exclude-hint"></label>
        <p class="rn-hint" id="exclude-hint">쉼표나 띄어쓰기로 구분해요. 20-25처럼 쓰면 그 사이 숫자를 모두 빼요.</p>
        <label class="rn-field" for="label"><span class="rn-label">추첨 이름 (선택)</span>
          <input id="label" class="rn-input rn-input-text" type="text" placeholder="예: 10월 댓글 이벤트" maxlength="60"></label>
      </div>
    </form>

    <p id="error" class="rn-error" role="alert" hidden></p>
    <button type="button" id="draw-btn" class="rn-btn rn-btn-primary">숫자 뽑기 🔢</button>
    <p class="rn-fair">치우침 없는 암호학적 난수 · 입력한 내용은 밖으로 나가지 않아요</p>

    <div id="result" class="rn-result" hidden>
      <div class="rn-card rn-result-card" id="result-card">
        <p id="shared-badge" class="rn-badge" hidden>🎁 공유된 추첨 결과</p>
        <h2 class="rn-h2" id="res-title">뽑힌 숫자</h2>
        <p id="res-label" class="rn-res-label" hidden></p>
        <ul id="res-tags" class="rn-tags"></ul>
        <div id="reels" class="rn-reels" aria-hidden="true"></div>
        <p id="live" class="visually-hidden" aria-live="polite"></p>
        <p id="shared-note" class="rn-shared-note" hidden></p>
        <div class="rn-actions">
          <button type="button" id="copy-btn" class="rn-btn rn-btn-ghost">숫자 복사</button>
          <button type="button" id="link-btn" class="rn-btn rn-btn-ghost">결과 링크 복사</button>
        </div>
      </div>
      <div class="rn-card rn-history-card" id="history-card" hidden>
        <div class="rn-history-head">
          <h2 class="rn-h2" id="history-title">최근 추첨 기록</h2>
          <button type="button" id="history-clear" class="rn-mini">지우기</button>
        </div>
        <p class="rn-history-note">최근 10번까지, 이 기기에만 저장돼요.</p>
        <ol id="history-list" class="rn-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="randnum"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 랜덤 숫자 뽑기 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
