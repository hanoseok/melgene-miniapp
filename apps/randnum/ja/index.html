<main class="rn-shell">
  <!-- 첫 화면(시작 화면이 따로 없는 도구 앱): h1·훅 → 범위·개수·옵션 → 뽑기 → (뽑은 뒤) 결과 + 최근 기록 + 공통 끝 화면 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-rn" class="rn-screen">
    <h1 class="rn-h1"><span class="rn-kicker">乱数生成</span><span class="rn-h1-main">数字ひとつも百個も<br><em>公平に</em>抽選</span></h1>
    <p class="rn-hook">範囲と個数を決めて抽選するだけ。プレゼント企画、ビンゴ、発表順、席決めにどうぞ。</p>

    <form id="rn-form" class="rn-card rn-settings" novalidate autocomplete="off">
      <p class="rn-label" id="preset-label">よく使う範囲</p>
      <div class="rn-presets" role="group" aria-labelledby="preset-label">
        <button type="button" class="rn-chip" data-preset="1-6" aria-pressed="false">1–6</button>
        <button type="button" class="rn-chip" data-preset="1-10" aria-pressed="false">1–10</button>
        <button type="button" class="rn-chip" data-preset="1-45" aria-pressed="false">1–45</button>
        <button type="button" class="rn-chip" data-preset="1-100" aria-pressed="true">1–100</button>
      </div>

      <div class="rn-range">
        <label class="rn-field" for="min"><span class="rn-label">最小</span>
          <input id="min" class="rn-input" type="number" step="1" value="1" min="-1000000000" max="1000000000" enterkeyhint="go"></label>
        <span class="rn-range-arrow" aria-hidden="true">→</span>
        <label class="rn-field" for="max"><span class="rn-label">最大</span>
          <input id="max" class="rn-input" type="number" step="1" value="100" min="-1000000000" max="1000000000" enterkeyhint="go"></label>
      </div>

      <div class="rn-count">
        <label class="rn-label" for="count">いくつ選ぶ？</label>
        <div class="rn-stepper">
          <button type="button" id="count-dec" class="rn-step" aria-label="1つ減らす">−</button>
          <input id="count" class="rn-input rn-input-count" type="number" step="1" inputmode="numeric" value="1" min="1" max="1000" enterkeyhint="go">
          <button type="button" id="count-inc" class="rn-step" aria-label="1つ増やす">+</button>
        </div>
      </div>

      <div class="rn-toggles">
        <label class="rn-switch"><input type="checkbox" id="dup" role="switch"><span class="rn-switch-ui" aria-hidden="true"></span><span>重複あり</span></label>
        <label class="rn-switch"><input type="checkbox" id="sort" role="switch"><span class="rn-switch-ui" aria-hidden="true"></span><span>小さい順</span></label>
      </div>

      <button type="button" id="more-btn" class="rn-more-btn" aria-expanded="false" aria-controls="more">その他のオプション</button>
      <div id="more" class="rn-more" hidden>
        <label class="rn-field" for="exclude"><span class="rn-label">除外する数字</span>
          <input id="exclude" class="rn-input rn-input-text" type="text" inputmode="text" placeholder="例: 4, 13, 20-25" maxlength="2000" aria-describedby="exclude-hint"></label>
        <p class="rn-hint" id="exclude-hint">カンマかスペースで区切ります。20-25 と書くとその間をすべて除外。</p>
        <label class="rn-field" for="label"><span class="rn-label">抽選名(任意)</span>
          <input id="label" class="rn-input rn-input-text" type="text" placeholder="例: フォロワー感謝企画" maxlength="60"></label>
      </div>
    </form>

    <p id="error" class="rn-error" role="alert" hidden></p>
    <button type="button" id="draw-btn" class="rn-btn rn-btn-primary">数字を抽選 🔢</button>
    <p class="rn-fair">偏りのない暗号論的乱数・入力内容は外に送られません</p>

    <div id="result" class="rn-result" hidden>
      <div class="rn-card rn-result-card" id="result-card">
        <p id="shared-badge" class="rn-badge" hidden>🎁 共有された抽選結果</p>
        <h2 class="rn-h2" id="res-title">抽選結果</h2>
        <p id="res-label" class="rn-res-label" hidden></p>
        <ul id="res-tags" class="rn-tags"></ul>
        <div id="reels" class="rn-reels" aria-hidden="true"></div>
        <p id="live" class="visually-hidden" aria-live="polite"></p>
        <p id="shared-note" class="rn-shared-note" hidden></p>
        <div class="rn-actions">
          <button type="button" id="copy-btn" class="rn-btn rn-btn-ghost">数字をコピー</button>
          <button type="button" id="link-btn" class="rn-btn rn-btn-ghost">結果リンクをコピー</button>
        </div>
      </div>
      <div class="rn-card rn-history-card" id="history-card" hidden>
        <div class="rn-history-head">
          <h2 class="rn-h2" id="history-title">最近の抽選</h2>
          <button type="button" id="history-clear" class="rn-mini">消去</button>
        </div>
        <p class="rn-history-note">直近10回まで、この端末にだけ保存されます。</p>
        <ol id="history-list" class="rn-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="randnum"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 乱数生成 · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"本当に公平に選ばれますか？","a":"はい。すべての数字はブラウザの暗号論的乱数生成器(crypto.getRandomValues)と棄却サンプリングで決まるので、範囲内のどの数字も他より出やすいことはありません。結果は数字が回る演出が始まる前に決まっています。"},{"q":"重複なしで選ぶには？","a":"「重複あり」をオフのまま抽選してください。くじ引きと同じで、一度出た数字は二度と出ません。範囲内の数字より多く選ぼうとすると、範囲を広げるか個数を減らすよう案内します。"},{"q":"プレゼント企画の当選発表に結果リンクはどう使いますか？","a":"抽選後に「結果リンクをコピー」を押してください。数字・範囲・オプション・抽選日時がリンクの中に入っているので、開いた人は抽選し直さず「共有された抽選結果」として同じ数字を見られます。発表の投稿に添えると便利です。"},{"q":"マイナスや大きな範囲も使えますか？","a":"使えます。最小・最大はそれぞれ −10億〜10億まで入れられ、一度に1,000個まで選べます。特定の数字や 20-25 のような区間を除外することもできます。"}];</script>
