<main class="bt-shell">
  <!-- 한 화면(시작 화면이 따로 없는 도구 앱): h1·훅 → 옵션 → 테이블 위 병 → 돌리기 → (돌린 뒤) 결과 + 최근 기록 + 공통 끝 화면 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-bottle" class="bt-screen">
    <h1 class="bt-h1"><span class="bt-kicker">ボトル回し</span><span class="bt-h1-main">スマホを真ん中に、<br><em>ボトルが決める</em></span></h1>
    <p class="bt-hook">誰から始める？次の曲は誰が選ぶ？片付けは誰？とりあえず回してみよう。</p>

    <form id="bt-form" class="bt-card bt-opts" novalidate autocomplete="off">
      <p class="bt-label" id="mode-label">遊び方を選ぶ</p>
      <div class="bt-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="bt-seg-btn" id="mode-free" role="radio" aria-checked="true">そのまま回す</button>
        <button type="button" class="bt-seg-btn" id="mode-names" role="radio" aria-checked="false">名前を入れる</button>
      </div>
      <div id="names-box" class="bt-names" hidden>
        <label class="bt-label" for="names">テーブルを囲むのは？</label>
        <textarea id="names" class="bt-textarea" rows="4" spellcheck="false" placeholder="1行に1人、座っている順に
はると
ゆい
そうた
めい" aria-describedby="names-hint"></textarea>
        <p class="bt-hint" id="names-hint">2〜12人。座っている順に時計回りで入力してください。 <span id="names-count" class="bt-count"></span></p>
        <label class="bt-switch"><input type="checkbox" id="skip" role="switch" checked><span class="bt-switch-ui" aria-hidden="true"></span><span class="bt-switch-text">かぶりなし<small>全員が1回ずつ選ばれるまで同じ人は出ません。</small></span></label>
      </div>
      <label class="bt-switch bt-switch-prompts"><input type="checkbox" id="prompts" role="switch"><span class="bt-switch-ui" aria-hidden="true"></span><span class="bt-switch-text">回すたびにミッションカード<small>選ばれた人にちょっとした楽しいお題をひとつ。</small></span></label>
      <div id="prompts-box" class="bt-prompts" hidden>
        <div class="bt-seg bt-seg-sm" role="radiogroup" aria-label="回すたびにミッションカード">
          <button type="button" class="bt-seg-btn" id="src-builtin" role="radio" aria-checked="true">おまかせ</button>
          <button type="button" class="bt-seg-btn" id="src-custom" role="radio" aria-checked="false">自分で書く</button>
        </div>
        <div id="custom-box" class="bt-custom" hidden>
          <label class="bt-label" for="custom">みんなのミッション</label>
          <textarea id="custom" class="bt-textarea" rows="4" spellcheck="false" placeholder="1行にひとつ
ロボットダンスをする
好きなお菓子を発表" aria-describedby="custom-hint"></textarea>
          <p class="bt-hint" id="custom-hint">30行まで。カードは1枚ずつ出ます。</p>
        </div>
      </div>
    </form>

    <p id="error" class="bt-error" role="alert" hidden></p>
    <p id="shared-note" class="bt-note" hidden>共有リンクから名前を読み込みました。さっそく回そう！</p>

    <div class="bt-stage-wrap">
      <div id="stage" class="bt-stage">
        <div class="bt-table" aria-hidden="true"></div>
        <ol id="seats" class="bt-seats" aria-label="テーブルを囲むのは？"></ol>
        <div id="bottle" class="bt-bottle" role="button" tabindex="0" aria-label="テーブルの上のボトル。タップかはじくと回ります。">
          <svg class="bt-bottle-svg" viewBox="0 0 100 260" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="bt-glass" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#1d6b3c"/><stop offset=".35" stop-color="#3fbf73"/><stop offset=".6" stop-color="#2a9256"/><stop offset="1" stop-color="#16502d"/>
              </linearGradient>
            </defs>
            <ellipse cx="54" cy="252" rx="34" ry="6" fill="rgba(0,0,0,.28)"/>
            <path d="M40 8h20v18c0 16 26 34 26 64v148a14 14 0 0 1-14 14H28a14 14 0 0 1-14-14V90c0-30 26-48 26-64z" fill="url(#bt-glass)" stroke="#0f3a21" stroke-width="4" stroke-linejoin="round"/>
            <rect x="37" y="2" width="26" height="16" rx="4" fill="#f2a33a" stroke="#0f3a21" stroke-width="4"/>
            <rect x="22" y="132" width="56" height="62" rx="8" fill="#fff3d6" stroke="#0f3a21" stroke-width="3"/>
            <circle cx="50" cy="163" r="14" fill="#f26b1d"/>
            <path d="M44 158l6-8 6 8-6 14z" fill="#fff3d6"/>
            <path d="M28 96c-4 14-5 30-5 48" stroke="#c8f5d8" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
          </svg>
        </div>
      </div>
      <p class="bt-tap-hint">ボトルをタップ、または指ではじいてもOK</p>
    </div>

    <button type="button" id="spin-btn" class="bt-btn bt-btn-primary">ボトルを回す 🍾</button>
    <p class="bt-fair">回る前に crypto 乱数で公平に決定 · 名前はこの端末だけ</p>
    <p id="live" class="visually-hidden" aria-live="polite"></p>

    <!-- 돌린 뒤: 결과 카드 → 최근 기록 → 공통 끝 화면 -->
    <div id="result" class="bt-result" hidden>
      <article class="bt-card bt-res-card" id="result-card" aria-labelledby="res-title">
        <p class="bt-res-kicker" id="res-kicker">ボトルが指したのは</p>
        <h2 class="bt-h2 bt-res-title" id="res-title"></h2>
        <p id="res-sub" class="bt-res-sub"></p>
        <p id="res-round" class="bt-res-round" hidden></p>
        <div id="prompt-card" class="bt-prompt" hidden>
          <p class="bt-prompt-title">ミッションカード</p>
          <p id="prompt-text" class="bt-prompt-text"></p>
        </div>
        <div class="bt-actions">
          <button type="button" id="reset-btn" class="bt-btn bt-btn-ghost" hidden>新しい周を始める</button>
          <button type="button" id="link-btn" class="bt-btn bt-btn-ghost" hidden>この名前でリンクをコピー</button>
        </div>
      </article>
      <div id="history-card" class="bt-card bt-history" hidden>
        <h3 class="bt-h3" id="history-title">最近の結果</h3>
        <ol id="history" class="bt-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="bottle"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> ボトル回し · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>
