  <section id="screen-bottle" class="bt-screen">
    <h1 class="bt-h1"><span class="bt-kicker">转瓶子</span><span class="bt-h1-main">手机放中间，<br><em>让瓶子来决定</em></span></h1>
    <p class="bt-hook">谁先来？下一首歌谁来点？谁收拾桌子？转一下就知道。</p>

    <form id="bt-form" class="bt-card bt-opts" novalidate autocomplete="off">
      <p class="bt-label" id="mode-label">怎么玩？</p>
      <div class="bt-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="bt-seg-btn" id="mode-free" role="radio" aria-checked="true">直接转</button>
        <button type="button" class="bt-seg-btn" id="mode-names" role="radio" aria-checked="false">填名字转</button>
      </div>
      <div id="names-box" class="bt-names" hidden>
        <label class="bt-label" for="names">桌边坐着谁？</label>
        <textarea id="names" class="bt-textarea" rows="4" spellcheck="false" placeholder="每行一个名字，按座位顺序
小明
小红
阿杰
朵朵" aria-describedby="names-hint"></textarea>
        <p class="bt-hint" id="names-hint">2～12人。按座位顺时针依次填写。 <span id="names-count" class="bt-count"></span></p>
        <label class="bt-switch"><input type="checkbox" id="skip" role="switch" checked><span class="bt-switch-ui" aria-hidden="true"></span><span class="bt-switch-text">不重复<small>每个人都被选中一次之前，不会再选到同一个人。</small></span></label>
      </div>
      <label class="bt-switch bt-switch-prompts"><input type="checkbox" id="prompts" role="switch"><span class="bt-switch-ui" aria-hidden="true"></span><span class="bt-switch-text">每次转完抽任务卡<small>给被选中的人一个轻松有趣的小任务。</small></span></label>
      <div id="prompts-box" class="bt-prompts" hidden>
        <div class="bt-seg bt-seg-sm" role="radiogroup" aria-label="每次转完抽任务卡">
          <button type="button" class="bt-seg-btn" id="src-builtin" role="radio" aria-checked="true">随机任务</button>
          <button type="button" class="bt-seg-btn" id="src-custom" role="radio" aria-checked="false">自己写</button>
        </div>
        <div id="custom-box" class="bt-custom" hidden>
          <label class="bt-label" for="custom">我们的任务</label>
          <textarea id="custom" class="bt-textarea" rows="4" spellcheck="false" placeholder="每行一个
跳一段机器人舞
说出最爱的零食" aria-describedby="custom-hint"></textarea>
          <p class="bt-hint" id="custom-hint">最多30行，每次只出一张。</p>
        </div>
      </div>
    </form>

    <p id="error" class="bt-error" role="alert" hidden></p>
    <p id="shared-note" class="bt-note" hidden>已从分享链接读取名字，马上转吧！</p>

    <div class="bt-stage-wrap">
      <div id="stage" class="bt-stage">
        <div class="bt-table" aria-hidden="true"></div>
        <ol id="seats" class="bt-seats" aria-label="桌边坐着谁？"></ol>
        <div id="bottle" class="bt-bottle" role="button" tabindex="0" aria-label="桌上的瓶子。点一下或用手指拨动就会转。">
          <svg class="bt-bottle-svg" viewBox="0 0 100 260" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="bt-glass" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#1d6b3c"/><stop offset=".35" stop-color="#3fbf73"/><stop offset=".6" stop-color="#2a9256"/><stop offset="1" stop-color="#16502d"/>
              </linearGradient>
            </defs>
            <ellipse cx="54" cy="252" rx="34" ry="6" fill="rgba(0,0,0,.28)"/>
            <path d="M40 8h20v18c0 16 26 34 26 64v148a14 14 0 0 1-14 14H28a14 14 0 0 1-14-14V90c0-30 26-48 26-64z" fill="url(#bt-glass)" stroke="#0f3a21" stroke-width="4" stroke-linejoin="round"/>
            <rect x="37" y="2" width="26" height="16" rx="4" fill="#f2a33a" stroke="#0f3a21" stroke-width="4"/>
            <rect x="22" y="132" width="56" height="62" rx="8" fill="#fff3d6" stroke="#0f3a21" stroke-width="3"/>
            <circle cx="50" cy="163" r="14" fill="#f26b1d"/>
            <path d="M44 158l6-8 6 8-6 14z" fill="#fff3d6"/>
            <path d="M28 96c-4 14-5 30-5 48" stroke="#c8f5d8" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
          </svg>
        </div>
      </div>
      <p class="bt-tap-hint">点一下瓶子，或用手指拨一下</p>
    </div>

    <button type="button" id="spin-btn" class="bt-btn bt-btn-primary">转瓶子 🍾</button>
    <p class="bt-fair">瓶子转动前已用 crypto 随机数公平选出 · 名字只留在本机</p>
    <p id="live" class="visually-hidden" aria-live="polite"></p>

    <!-- 돌린 뒤: 결과 카드 → 최근 기록 → 공통 끝 화면 -->
    <div id="result" class="bt-result" hidden>
      <article class="bt-card bt-res-card" id="result-card" aria-labelledby="res-title">
        <p class="bt-res-kicker" id="res-kicker">瓶子指向了</p>
        <h2 class="bt-h2 bt-res-title" id="res-title"></h2>
        <p id="res-sub" class="bt-res-sub"></p>
        <p id="res-round" class="bt-res-round" hidden></p>
        <div id="prompt-card" class="bt-prompt" hidden>
          <p class="bt-prompt-title">任务卡</p>
          <p id="prompt-text" class="bt-prompt-text"></p>
        </div>
        <div class="bt-actions">
          <button type="button" id="reset-btn" class="bt-btn bt-btn-ghost" hidden>开始新一轮</button>
          <button type="button" id="link-btn" class="bt-btn bt-btn-ghost" hidden>复制带名字的链接</button>
        </div>
      </article>
      <div id="history-card" class="bt-card bt-history" hidden>
        <h3 class="bt-h3" id="history-title">最近结果</h3>
        <ol id="history" class="bt-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="bottle"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

    © <span id="year"></span> 转瓶子 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
