      <li><span class="tf-how-ico" aria-hidden="true">🔢</span><span class="tf-how-txt">숫자를 눌러 주변 열기</span></li>
    </ul>

      <div id="board" class="tf-board" role="group" aria-label="지뢰찾기 판입니다. 칸을 눌러 열고, 길게 누르거나 깃발 모드로 지뢰를 표시하세요."></div>
      <button id="pause-btn" class="tf-pause" type="button" hidden>일시정지 · 눌러서 계속</button>

        <div class="tf-stat"><dt>연 비율</dt><dd id="res-clear" class="tf-stat-num"></dd></div>

          <p id="res-top" class="tf-top"></p>
          <p id="res-beat" class="tf-beat"></p>
          <p id="res-others" class="tf-others"></p>
        </div>
      </div>
    </article>
