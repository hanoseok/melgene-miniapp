<main class="pw-shell">
  <!-- 첫 화면(시작 화면이 따로 없는 도구 앱): h1·훅 → 종류·옵션 → 만들기 → (만든 뒤) 결과 + 공통 끝 화면 → 맨 아래 mg-ad-start 1개 -->
  <section id="screen-pw" class="pw-screen">
    <h1 class="pw-h1"><span class="pw-kicker">密码生成器</span><span class="pw-h1-main">高强度密码，<br><em>就在这里生成</em></span></h1>
    <p class="pw-hook">选好长度和字符类型，或者切换成由随机单词组成的口令。点一下生成，再点一下复制。</p>

    <form id="pw-form" class="pw-card pw-settings" novalidate autocomplete="off">
      <p class="pw-label" id="mode-label">生成什么</p>
      <div class="pw-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="pw-seg-btn" role="radio" data-mode="password" aria-checked="true">密码</button>
        <button type="button" class="pw-seg-btn" role="radio" data-mode="passphrase" aria-checked="false">单词口令</button>
      </div>

      <div id="opt-password" class="pw-opts">
        <div class="pw-slider-row">
          <label class="pw-label" for="length">长度</label>
          <output id="length-out" class="pw-out" for="length">16</output>
        </div>
        <input id="length" class="pw-range" type="range" min="4" max="64" step="1" value="16">
        <p class="pw-label" id="types-label">包含字符</p>
        <div class="pw-switches" role="group" aria-labelledby="types-label">
          <label class="pw-switch"><input type="checkbox" id="t-upper" role="switch" checked><span class="pw-switch-ui" aria-hidden="true"></span><span class="pw-switch-text">大写字母<span class="pw-sample" aria-hidden="true">ABC</span></span></label>
          <label class="pw-switch"><input type="checkbox" id="t-lower" role="switch" checked><span class="pw-switch-ui" aria-hidden="true"></span><span class="pw-switch-text">小写字母<span class="pw-sample" aria-hidden="true">abc</span></span></label>
          <label class="pw-switch"><input type="checkbox" id="t-digits" role="switch" checked><span class="pw-switch-ui" aria-hidden="true"></span><span class="pw-switch-text">数字<span class="pw-sample" aria-hidden="true">123</span></span></label>
          <label class="pw-switch"><input type="checkbox" id="t-symbols" role="switch" checked><span class="pw-switch-ui" aria-hidden="true"></span><span class="pw-switch-text">符号<span class="pw-sample" aria-hidden="true">#$&amp;</span></span></label>
        </div>
        <label class="pw-switch"><input type="checkbox" id="similar" role="switch"><span class="pw-switch-ui" aria-hidden="true"></span><span class="pw-switch-text">排除易混字符</span></label>
        <p class="pw-hint" id="similar-hint">不使用 0 O 1 l I，看和输入时都不容易出错。</p>
      </div>

      <div id="opt-passphrase" class="pw-opts" hidden>
        <div class="pw-slider-row">
          <label class="pw-label" for="words">单词数</label>
          <output id="words-out" class="pw-out" for="words">5</output>
        </div>
        <input id="words" class="pw-range" type="range" min="3" max="8" step="1" value="5">
        <p class="pw-label" id="sep-label">分隔符</p>
        <div class="pw-chips" role="radiogroup" aria-labelledby="sep-label">
          <button type="button" class="pw-chip" role="radio" data-sep="dash" aria-checked="true" aria-label="短横线"><span class="pw-sep-glyph" aria-hidden="true">-</span><span class="pw-sep-name">短横线</span></button>
          <button type="button" class="pw-chip" role="radio" data-sep="dot" aria-checked="false" aria-label="点"><span class="pw-sep-glyph" aria-hidden="true">.</span><span class="pw-sep-name">点</span></button>
          <button type="button" class="pw-chip" role="radio" data-sep="underscore" aria-checked="false" aria-label="下划线"><span class="pw-sep-glyph" aria-hidden="true">_</span><span class="pw-sep-name">下划线</span></button>
          <button type="button" class="pw-chip" role="radio" data-sep="space" aria-checked="false" aria-label="空格"><span class="pw-sep-glyph" aria-hidden="true">␣</span><span class="pw-sep-name">空格</span></button>
        </div>
        <div class="pw-switches">
          <label class="pw-switch"><input type="checkbox" id="capitalize" role="switch" checked><span class="pw-switch-ui" aria-hidden="true"></span><span class="pw-switch-text">首字母大写</span></label>
          <label class="pw-switch"><input type="checkbox" id="number" role="switch" checked><span class="pw-switch-ui" aria-hidden="true"></span><span class="pw-switch-text">加一个数字</span></label>
        </div>
        <p class="pw-hint">单词来自内置的 2,048 个英文单词列表。</p>
      </div>

      <p class="pw-label" id="count-label">生成数量</p>
      <div class="pw-seg pw-seg-count" role="radiogroup" aria-labelledby="count-label">
        <button type="button" class="pw-seg-btn" role="radio" data-count="1" aria-checked="true">1 个</button>
        <button type="button" class="pw-seg-btn" role="radio" data-count="5" aria-checked="false">一次 5 个</button>
      </div>
    </form>

    <p id="error" class="pw-error" role="alert" hidden></p>
    <button type="button" id="gen-btn" class="pw-btn pw-btn-primary">生成 🔑</button>
    <p class="pw-local">用 crypto.getRandomValues 在本机生成 · 绝不上传</p>

    <div id="result" class="pw-result" hidden>
      <div class="pw-card pw-result-card" id="result-card">
        <h2 class="pw-h2" id="res-title">你的新密码</h2>
        <ol id="pw-list" class="pw-list" aria-labelledby="res-title"></ol>
        <div class="pw-meter" id="meter">
          <div class="pw-meter-head">
            <span class="pw-meter-label">强度</span>
            <strong id="meter-word" class="pw-meter-word"></strong>
          </div>
          <div class="pw-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <p id="meter-bits" class="pw-bits"></p>
          <p id="meter-crack" class="pw-crack"></p>
          <p class="pw-crack-note">按每秒 100 亿次猜测的离线攻击计算的平均时间。</p>
          <p id="meter-tip" class="pw-tip"></p>
        </div>
        <p id="live" class="visually-hidden" aria-live="polite"></p>
      </div>
      <div data-mg-end="password"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 密码生成器 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
