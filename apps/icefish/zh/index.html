<script>window.MG_FAQ = [{"q":"怎么放下鱼线？","a":"按住冰面下方水里的任意位置，鱼钩会移动到你按住的深度，松手就停在那里。电脑上也可以按住 ↓、↑ 键。不同的鱼喜欢不同的深度，多试几层吧。"},{"q":"怎么收线？","a":"鱼咬钩后按住就会收线，右侧的拉力条会上升。拉力条进入红色区域时先松手让线放松，再继续按住。拉力条满了线就会断；放得太松太久，鱼就会脱钩。"},{"q":"为什么不同的鱼分数不一样？","a":"越大、住得越深的鱼力气越大，分数也越高，偶尔出现的黄金鱼分数最高。破靴子之类的垃圾很好拉上来，但是 0 分。个人最佳会保存在这个浏览器里。"},{"q":"切换到别的标签页会怎样？","a":"离开页面或锁屏时游戏会自动暂停，时间也会停止。点“继续钓鱼”（或按 P 键）就能从刚才的地方接着玩。"}];</script>
