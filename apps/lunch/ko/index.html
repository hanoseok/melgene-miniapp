<main class="lc-shell">
  <!-- 시작 화면: 티징만 (배지·슬롯머신 그림·h1·훅·사실 한 줄·시작 버튼) + 맨 아래 광고 1개 — FAQ 없음 -->
  <section id="screen-start" class="lc-screen lc-start">
    <p class="lc-badge">🍽️ “아무거나”는 이제 그만</p>
    <div class="lc-hero" aria-hidden="true"><div class="lc-hero-wins"><span class="lc-hero-win">🍜</span><span class="lc-hero-win">🍣</span><span class="lc-hero-win">🌮</span></div><div class="lc-hero-lights"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="lc-hero-lever"></span></div>
    <h1 class="lc-h1"><span class="lc-kicker">오늘 뭐 먹지?</span><span class="lc-h1-main">메뉴 고민,<br><em>슬롯</em>이 정해 줄게요</span></h1>
    <p class="lc-hook">끼니와 기분을 고르고 레버를 당기면, 슬롯머신이 멈춘 메뉴가 오늘의 밥.</p>
    <button id="start-btn" class="lc-btn lc-btn-primary" type="button">메뉴 뽑으러 가기 →</button>
    <p class="lc-facts">아침부터 야식까지 · 우리가 자주 먹는 메뉴 · 마음에 안 들면 제외</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 고르기 화면 (진행 중 화면의 광고 1자리: 뽑기 버튼 아래) -->
  <section id="screen-pick" class="lc-screen lc-pick" hidden>
    <h2 class="lc-h2">뭐가 땡겨요?</h2>
    <div class="lc-card">
      <p class="lc-label" id="meal-label">어떤 끼니?</p>
      <div class="lc-seg" role="radiogroup" aria-labelledby="meal-label">
        <button type="button" id="meal-b" class="lc-seg-btn" role="radio" data-meal="b">아침</button>
        <button type="button" id="meal-l" class="lc-seg-btn" role="radio" data-meal="l">점심</button>
        <button type="button" id="meal-d" class="lc-seg-btn" role="radio" data-meal="d">저녁</button>
        <button type="button" id="meal-n" class="lc-seg-btn" role="radio" data-meal="n">야식</button>
      </div>
      <p class="lc-label" id="mood-label">기분 (선택)</p>
      <p class="lc-hint">해당하는 걸 마음껏 고르세요. 아무것도 안 고르면 전부 후보예요.</p>
      <div class="lc-chips" role="group" aria-labelledby="mood-label">
        <button type="button" id="tag-h" class="lc-chip" data-tag="h" aria-pressed="false">든든한</button>
        <button type="button" id="tag-l" class="lc-chip" data-tag="l" aria-pressed="false">가벼운</button>
        <button type="button" id="tag-s" class="lc-chip" data-tag="s" aria-pressed="false">매운</button>
        <button type="button" id="tag-o" class="lc-chip" data-tag="o" aria-pressed="false">혼밥 OK</button>
      </div>
      <div class="lc-meta">
        <span id="cand-count" class="lc-count" aria-live="polite"></span>
        <span id="ex-line" class="lc-ex-line" hidden><span id="ex-count"></span><button type="button" id="ex-reset" class="lc-mini">다시 넣기</button></span>
      </div>
      <p id="pick-note" class="lc-note" hidden></p>
    </div>
    <div class="lc-machine">
      <div id="reel" class="lc-reel" aria-hidden="true"><div id="reel-strip" class="lc-strip"></div></div>
    </div>
    <button type="button" id="spin-btn" class="lc-btn lc-btn-primary">슬롯 돌리기 🎰</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 결과: 뽑힌 메뉴 하나 → 공통 끝 화면 -->
  <section id="screen-result" class="lc-screen lc-result" hidden>
    <h2 class="lc-h2">오늘의 메뉴</h2>
    <div class="lc-res" aria-live="polite">
      <span id="res-emoji" class="lc-res-emoji" aria-hidden="true"></span>
      <p id="res-name" class="lc-res-name"></p>
      <span id="res-meal" class="lc-res-meal"></span>
    </div>
    <div class="lc-actions">
      <button type="button" id="again-btn" class="lc-mini lc-mini-accent">🎰 다시 뽑기</button>
      <button type="button" id="exclude-btn" class="lc-mini">🚫 이거 제외</button>
      <button type="button" id="change-btn" class="lc-mini">🎛️ 조건 바꾸기</button>
    </div>
    <div data-mg-end="lunch"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 오늘 뭐 먹지 · <a href="privacy.html">개인정보처리방침</a>
  </footer>
</main>
