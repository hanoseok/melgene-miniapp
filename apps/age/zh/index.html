  <section id="screen-age" class="ag-screen">
    <div class="ag-cake" aria-hidden="true"><span class="ag-cake-flame"></span><span class="ag-cake-top"></span><span class="ag-cake-base"></span></div>
    <h1 class="ag-h1"><span class="ag-kicker">年龄计算器</span><span class="ag-h1-main">我现在<em>到底</em>几岁？</span></h1>
    <p class="ag-hook">选好出生日期，就能知道精确到天的周岁、离下次生日还有几天，以及你已经活了多少天。</p>

    <form id="ag-form" class="ag-card ag-form" novalidate autocomplete="off">
      <div class="ag-field">
        <p class="ag-label" id="birth-label">出生日期</p>
        <div class="ag-sels ag-order-ymd" role="group" aria-labelledby="birth-label"><div class="ag-sel ag-sel-y"><label class="visually-hidden" for="by">年</label><select id="by" class="ag-select" required><option value="">年</option></select></div><div class="ag-sel ag-sel-m"><label class="visually-hidden" for="bm">月</label><select id="bm" class="ag-select" required><option value="">月</option></select></div><div class="ag-sel ag-sel-d"><label class="visually-hidden" for="bd">日</label><select id="bd" class="ag-select" required><option value="">日</option></select></div></div>
      </div>
      <div class="ag-field">
        <label class="ag-label" for="asof">计算到哪天（留空为今天）</label>
        <div class="ag-row">
          <input id="asof" class="ag-input ag-date" type="date" min="1900-01-01" max="2199-12-31">
          <button type="button" id="today-btn" class="ag-mini-btn">今天</button>
        </div>
        <p class="ag-hint">选别的日期，可以算出那一天的周岁，比如入学、报名截止日。</p>
      </div>
    </form>

    <button type="button" id="calc-btn" class="ag-btn ag-btn-primary">计算我的周岁 🎂</button>
    <p class="ag-local">用这台设备的日期计算，出生日期不会上传，也不会保存。</p>
    <p id="error" class="ag-error" role="alert" hidden></p>

    <div id="result" class="ag-result" hidden>
      <article id="result-card" class="ag-hero-card" aria-labelledby="r-label">
        <p class="ag-asof" id="r-asof"></p>
        <p class="ag-r-label" id="r-label">周岁</p>
        <p class="ag-big" id="r-big"></p>
        <p class="ag-ymd" id="r-ymd"></p>
        <p class="ag-born" id="r-born"></p>
        <p class="ag-brand">🎂 年龄计算器</p>
      </article>

      <div class="ag-card ag-next" id="next-card" aria-labelledby="next-title">
        <h2 class="ag-h2" id="next-title">下次生日</h2>
        <p class="ag-next-d" id="n-d"></p>
        <p class="ag-next-sub" id="n-sub"></p>
        <p class="ag-next-date" id="n-date"></p>
        <p class="ag-note" id="n-leap" hidden>2月29日出生：没有2月29日的年份（平年），本工具按2月28日算作生日。</p>
      </div>

      <div class="ag-card" id="totals-card" aria-labelledby="totals-title">
        <h2 class="ag-h2" id="totals-title">你已经活了</h2>
        <dl class="ag-stats">
          <div class="ag-stat"><dt>天</dt><dd id="t-days"></dd></div>
          <div class="ag-stat"><dt>周</dt><dd id="t-weeks"></dd></div>
          <div class="ag-stat"><dt>个月</dt><dd id="t-months"></dd></div>
          <div class="ag-stat"><dt>小时</dt><dd id="t-hours"></dd></div>
        </dl>
        <p class="ag-note">小时数 = 已过天数 × 24，从出生那天零点算起。</p>
      </div>

      <div class="ag-card" id="signs-card" aria-labelledby="signs-title">
        <h2 class="ag-h2" id="signs-title">你的生日小档案</h2>
        <dl class="ag-signs">
          <div class="ag-sign"><dt>星期</dt><dd><span class="ag-sign-ico" aria-hidden="true">📅</span><span id="s-weekday"></span></dd></div>
          <div class="ag-sign"><dt>星座</dt><dd><span class="ag-sign-ico" id="s-zodiac-ico" aria-hidden="true"></span><span id="s-zodiac"></span></dd></div>
          <div class="ag-sign"><dt>生肖</dt><dd><span class="ag-sign-ico" id="s-animal-ico" aria-hidden="true"></span><span id="s-animal"></span></dd></div>
        </dl>
      </div>

      <div class="ag-card" id="ms-card" aria-labelledby="ms-title">
        <h2 class="ag-h2" id="ms-title">纪念日</h2>
        <ol id="ms-list" class="ag-ms-list" aria-labelledby="ms-title"></ol>
      </div>
      <p id="live" class="visually-hidden" aria-live="polite"></p>
      <div data-mg-end="age"></div>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 年龄计算器 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>

<script>window.MG_FAQ = [{"q":"周岁是怎么算的？","a":"出生当天为0岁，每过一次生日加1岁。月和天从最近一次生日起按日历计算；如果你是31日出生而那个月没有31日，就以那个月的最后一天为准。计算用的是设备上的日历日期，不会因为时区或夏令时差一天。"},{"q":"周岁和虚岁有什么不同？","a":"周岁是过一次生日长一岁，身份证、入学、退休等正式场合都用周岁。虚岁是一出生就算1岁，每过一个春节再加1岁，所以通常比周岁大1到2岁。本工具显示的是周岁。"},{"q":"2月29日出生的人，生日怎么算？","a":"闰年按2月29日，平年按2月28日算作生日，当天加一岁。办理证件或法律事务时，规定可能不同，请以相关机构为准。"},{"q":"能算过去或将来某一天的年龄吗？","a":"可以。在“计算到哪天”里填入1900年到2199年之间的任意日期，就会显示那一天的周岁、已活天数和下次生日。留空则按今天计算。"},{"q":"我的出生日期会被保存吗？","a":"不会。计算只在你的浏览器里完成，出生日期不会上传服务器，不会存在设备上，分享时也不会放进链接。"}];</script>
