      <button class="tf-hole" type="button" data-state="" aria-label="5"><span class="tf-dirt"></span><span class="tf-clip"><span class="tf-crit"><i class="tf-eyes"></i><i class="tf-nose"></i><b class="tf-bomb">💣</b></span></span><span class="tf-ham">🔨</span><span class="tf-fx"></span></button>

      <button class="tf-hole" type="button" data-state="" aria-label="7"><span class="tf-dirt"></span><span class="tf-clip"><span class="tf-crit"><i class="tf-eyes"></i><i class="tf-nose"></i><b class="tf-bomb">💣</b></span></span><span class="tf-ham">🔨</span><span class="tf-fx"></span></button>

        <div class="tf-stat"><dt>잡은 두더지</dt><dd id="res-hits" class="tf-stat-num">0</dd></div>
        <div class="tf-stat"><dt>맞은 폭탄</dt><dd id="res-bombs" class="tf-stat-num">0</dd></div>

        <div id="res-rank-body" hidden>
          <p id="res-top" class="tf-top"></p>
          <p id="res-beat" class="tf-beat"></p>
          <p id="res-others" class="tf-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="mole"></div>
  </section>

    © <span id="year"></span> 두더지 잡기 · <a href="privacy.html">개인정보처리방침</a>
  </footer>
