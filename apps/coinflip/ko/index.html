<header class="mg-top"><a class="mg-home" href="https://example.com/ko/" aria-label="멜진 미니앱 홈으로"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">미니앱</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="언어 선택"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko" selected>한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="언어 선택"><a href="../" hreflang="en" lang="en">English</a> <a href="../ja/" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="cf-shell">
  <!-- 시작 화면: 티징만 (배지·동전/주사위 그림·h1·훅·사실 한 줄·시작 버튼) + 맨 아래 광고 1개 — FAQ 없음 -->
  <section id="screen-start" class="cf-screen cf-start">
    <p class="cf-badge">🪙 가장 공평한 결정 방법</p>
    <div class="cf-hero" aria-hidden="true"><span class="cf-hero-coin">🪙</span><span class="cf-hero-die"><span class="cf-die" data-v="5"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span></div>
    <h1 class="cf-h1"><span class="cf-kicker">동전 던지기</span><span class="cf-h1-main">앞면? 뒷면?<br><em>동전</em>이 정해 줄게요</span></h1>
    <p class="cf-hook">두 선택지 이름을 적고 동전을 던져 보세요. 떨어진 쪽으로 가는 거예요. 주사위도 굴릴 수 있어요.</p>
    <button id="start-btn" class="cf-btn cf-btn-primary" type="button">던지러 가기 →</button>
    <p class="cf-facts">동전과 주사위 · 선택지 이름 바꾸기 · 매번 공정하게</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 도구 화면 (진행 중 화면의 광고 1자리: 던지기 버튼 아래) -->
  <section id="screen-tool" class="cf-screen cf-tool" hidden>
    <h2 class="cf-h2">던져 볼까요?</h2>
    <div class="cf-tabs" role="tablist" aria-label="던져 볼까요?">
      <button type="button" id="tab-coin" class="cf-tab" role="tab" aria-selected="true" aria-controls="panel-coin">🪙 동전</button>
      <button type="button" id="tab-dice" class="cf-tab" role="tab" aria-selected="false" aria-controls="panel-dice" tabindex="-1">🎲 주사위</button>
    </div>

    <div id="panel-coin" role="tabpanel" aria-labelledby="tab-coin">
      <div class="cf-card">
        <p class="cf-label" id="names-label">두 선택지 이름</p>
        <p class="cf-hint">기본은 앞면과 뒷면이에요. 짜장면과 짬뽕처럼 원하는 이름으로 바꿔 보세요.</p>
        <div class="cf-names" role="group" aria-labelledby="names-label">
          <input id="name-a" class="cf-input" type="text" maxlength="12" value="앞면" aria-label="첫째 선택지 이름" autocomplete="off" enterkeyhint="done">
          <input id="name-b" class="cf-input" type="text" maxlength="12" value="뒷면" aria-label="둘째 선택지 이름" autocomplete="off" enterkeyhint="done">
        </div>
        <div id="coin-stage" class="cf-stage" aria-hidden="true">
          <div class="cf-toss"><div id="coin" class="cf-coin"><span id="coin-a" class="cf-face cf-face-a"></span><span id="coin-b" class="cf-face cf-face-b"></span></div></div>
          <span class="cf-shadow"></span>
        </div>
      </div>
      <button type="button" id="throw-btn" class="cf-btn cf-btn-primary">동전 던지기 🪙</button>
    </div>

    <div id="panel-dice" role="tabpanel" aria-labelledby="tab-dice" hidden>
      <div class="cf-card">
        <p class="cf-label" id="dice-label">주사위 몇 개?</p>
        <div class="cf-seg" role="radiogroup" aria-labelledby="dice-label">
          <button type="button" class="cf-seg-btn" role="radio" data-dice="1" aria-checked="true">1</button>
          <button type="button" class="cf-seg-btn" role="radio" data-dice="2" aria-checked="false">2</button>
          <button type="button" class="cf-seg-btn" role="radio" data-dice="3" aria-checked="false">3</button>
        </div>
        <div id="dice-stage" class="cf-dice-stage" aria-hidden="true"></div>
      </div>
      <button type="button" id="roll-btn" class="cf-btn cf-btn-primary">주사위 굴리기 🎲</button>
    </div>
    <div class="mg-ad"></div>
  </section>

  <!-- 결과: 하나 + 이번 세션 누적 → 공통 끝 화면 -->
  <section id="screen-result" class="cf-screen cf-result" hidden>
    <h2 class="cf-h2" id="res-title">결과는</h2>
    <div class="cf-res" aria-live="polite">
      <div id="res-coin" class="cf-res-coin"><span class="cf-res-disc" aria-hidden="true">🪙</span><p id="res-name" class="cf-res-name"></p></div>
      <div id="res-dice" class="cf-res-dice" hidden></div>
      <span id="res-sum" class="cf-res-sum" hidden></span>
    </div>
    <div class="cf-tally">
      <p class="cf-tally-title">이번 접속 기록</p>
      <p id="tally-count" class="cf-tally-count"></p>
      <p id="tally-sides" class="cf-tally-sides"></p>
    </div>
    <div class="cf-actions">
      <button type="button" id="again-btn" class="cf-mini cf-mini-accent">다시 던지기</button>
      <button type="button" id="change-btn" class="cf-mini">↩ 설정으로 돌아가기</button>
    </div>
    <div data-mg-end="coinflip"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 동전 던지기 · <a href="privacy.html">개인정보처리방침</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"동전 던지기는 어떻게 하나요?","a":"원하면 두 선택지 이름을 적고 던지기를 누르세요. 결과를 먼저 뽑고 동전은 그 면으로 떨어지는 모습만 보여 주니, 화면에 나온 게 진짜 결과예요. 주사위 탭에서는 6면 주사위를 1~3개 굴려요."},{"q":"정말 공평한가요?","a":"네. 브라우저의 암호학적 난수(crypto.getRandomValues)와 거부 샘플링으로 뽑기 때문에 앞면과 뒷면, 주사위의 각 눈이 모두 같은 확률이에요. 돌아가는 동전과 구르는 주사위는 연출일 뿐이에요."},{"q":"앞면 뒷면 말고 내 선택지로 정할 수 있나요?","a":"네. 동전 위 입력칸에 원하는 이름 두 개를 적으면 돼요. 예를 들어 치킨과 피자로 적으면 결과에 이긴 쪽 이름이 나와요. 칸을 비우면 기본 이름으로 돌아가요."},{"q":"끝 화면의 횟수는 무슨 뜻인가요?","a":"이 페이지를 연 뒤 직접 던진 횟수와 각 면이 나온 횟수예요. 새로고침하면 처음부터 다시 세고, 어디에도 보내지 않아요."}];</script>
