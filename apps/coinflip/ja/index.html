<main class="cf-shell">
  <!-- 시작 화면: 티징만 (배지·동전/주사위 그림·h1·훅·사실 한 줄·시작 버튼) + 맨 아래 광고 1개 — FAQ 없음 -->
  <section id="screen-start" class="cf-screen cf-start">
    <p class="cf-badge">🪙 いちばん公平な決め方</p>
    <div class="cf-hero" aria-hidden="true"><span class="cf-hero-coin">🪙</span><span class="cf-hero-die"><span class="cf-die" data-v="5"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span></div>
    <h1 class="cf-h1"><span class="cf-kicker">コイントス</span><span class="cf-h1-main">表か裏か、<br><em>コイン</em>に決めてもらおう</span></h1>
    <p class="cf-hook">2つの選択肢の名前を決めて、コインを投げるだけ。出たほうに従いましょう。サイコロも振れます。</p>
    <button id="start-btn" class="cf-btn cf-btn-primary" type="button">投げてみる →</button>
    <p class="cf-facts">コインとサイコロ · 名前は自由に変更 · 毎回フェアに</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 도구 화면 (진행 중 화면의 광고 1자리: 던지기 버튼 아래) -->
  <section id="screen-tool" class="cf-screen cf-tool" hidden>
    <h2 class="cf-h2">さあ、投げよう</h2>
    <div class="cf-tabs" role="tablist" aria-label="さあ、投げよう">
      <button type="button" id="tab-coin" class="cf-tab" role="tab" aria-selected="true" aria-controls="panel-coin">🪙 コイン</button>
      <button type="button" id="tab-dice" class="cf-tab" role="tab" aria-selected="false" aria-controls="panel-dice" tabindex="-1">🎲 サイコロ</button>
    </div>

    <div id="panel-coin" role="tabpanel" aria-labelledby="tab-coin">
      <div class="cf-card">
        <p class="cf-label" id="names-label">2つの面の名前</p>
        <p class="cf-hint">最初は「表」と「裏」です。ラーメンとカレーなど、好きな名前に変えられます。</p>
        <div class="cf-names" role="group" aria-labelledby="names-label">
          <input id="name-a" class="cf-input" type="text" maxlength="12" value="表" aria-label="1つ目の名前" autocomplete="off" enterkeyhint="done">
          <input id="name-b" class="cf-input" type="text" maxlength="12" value="裏" aria-label="2つ目の名前" autocomplete="off" enterkeyhint="done">
        </div>
        <div id="coin-stage" class="cf-stage" aria-hidden="true">
          <div class="cf-toss"><div id="coin" class="cf-coin"><span id="coin-a" class="cf-face cf-face-a"></span><span id="coin-b" class="cf-face cf-face-b"></span></div></div>
          <span class="cf-shadow"></span>
        </div>
      </div>
      <button type="button" id="throw-btn" class="cf-btn cf-btn-primary">コインを投げる 🪙</button>
    </div>

    <div id="panel-dice" role="tabpanel" aria-labelledby="tab-dice" hidden>
      <div class="cf-card">
        <p class="cf-label" id="dice-label">サイコロの数は?</p>
        <div class="cf-seg" role="radiogroup" aria-labelledby="dice-label">
          <button type="button" class="cf-seg-btn" role="radio" data-dice="1" aria-checked="true">1</button>
          <button type="button" class="cf-seg-btn" role="radio" data-dice="2" aria-checked="false">2</button>
          <button type="button" class="cf-seg-btn" role="radio" data-dice="3" aria-checked="false">3</button>
        </div>
        <div id="dice-stage" class="cf-dice-stage" aria-hidden="true"></div>
      </div>
      <button type="button" id="roll-btn" class="cf-btn cf-btn-primary">サイコロを振る 🎲</button>
    </div>
    <div class="mg-ad"></div>
  </section>

  <!-- 결과: 하나 + 이번 세션 누적 → 공통 끝 화면 -->
  <section id="screen-result" class="cf-screen cf-result" hidden>
    <h2 class="cf-h2" id="res-title">結果は</h2>
    <div class="cf-res" aria-live="polite">
      <div id="res-coin" class="cf-res-coin"><span class="cf-res-disc" aria-hidden="true">🪙</span><p id="res-name" class="cf-res-name"></p></div>
      <div id="res-dice" class="cf-res-dice" hidden></div>
      <span id="res-sum" class="cf-res-sum" hidden></span>
    </div>
    <div class="cf-tally">
      <p class="cf-tally-title">今回の記録</p>
      <p id="tally-count" class="cf-tally-count"></p>
      <p id="tally-sides" class="cf-tally-sides"></p>
    </div>
    <div class="cf-actions">
      <button type="button" id="again-btn" class="cf-mini cf-mini-accent">もう一度投げる</button>
      <button type="button" id="change-btn" class="cf-mini">↩ 設定に戻る</button>
    </div>
    <div data-mg-end="coinflip"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> コイントス · <a href="privacy.html">プライバシーポリシー</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"コイントスはどうやって使いますか?","a":"必要なら2つの選択肢の名前を入力して、「投げる」を押すだけです。結果は先に決まっていて、コインはその面に落ちる様子を見せているので、表示された結果が本物です。サイコロのタブでは6面サイコロを1〜3個振れます。"},{"q":"本当に公平ですか?","a":"はい。ブラウザの暗号学的乱数(crypto.getRandomValues)と棄却サンプリングで決めているので、表と裏、サイコロの各目はすべて同じ確率です。回るコインや転がるサイコロは演出にすぎません。"},{"q":"表と裏以外の選択肢でも決められますか?","a":"はい。コインの上の入力欄に好きな名前を2つ入力してください。たとえば「ラーメン」と「カレー」にすると、当たった側の名前が結果に出ます。空にすると初期の名前に戻ります。"},{"q":"最後の画面の回数は何ですか?","a":"このページを開いてから自分で投げた回数と、それぞれの面が出た回数です。再読み込みするとゼロから数え直し、どこにも送信されません。"}];</script>
