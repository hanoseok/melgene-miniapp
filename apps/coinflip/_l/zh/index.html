<main class="cf-shell">
  <!-- 시작 화면: 티징만 (배지·동전/주사위 그림·h1·훅·사실 한 줄·시작 버튼) + 맨 아래 광고 1개 — FAQ 없음 -->
  <section id="screen-start" class="cf-screen cf-start">
    <p class="cf-badge">🪙 最公平的决定方式</p>
    <div class="cf-hero" aria-hidden="true"><span class="cf-hero-coin">🪙</span><span class="cf-hero-die"><span class="cf-die" data-v="5"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span></div>
    <h1 class="cf-h1"><span class="cf-kicker">抛硬币</span><span class="cf-h1-main">正面还是反面？<br>让<em>硬币</em>来决定</span></h1>
    <p class="cf-hook">写下两个选项，抛一次硬币，落在哪边就选哪个。也可以改掷骰子。</p>
    <button id="start-btn" class="cf-btn cf-btn-primary" type="button">开始抛 →</button>
    <p class="cf-facts">硬币和骰子 · 两面名字随便改 · 每次都公平</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 도구 화면 (진행 중 화면의 광고 1자리: 던지기 버튼 아래) -->
  <section id="screen-tool" class="cf-screen cf-tool" hidden>
    <h2 class="cf-h2">来抛一下</h2>
    <div class="cf-tabs" role="tablist" aria-label="来抛一下">
      <button type="button" id="tab-coin" class="cf-tab" role="tab" aria-selected="true" aria-controls="panel-coin">🪙 硬币</button>
      <button type="button" id="tab-dice" class="cf-tab" role="tab" aria-selected="false" aria-controls="panel-dice" tabindex="-1">🎲 骰子</button>
    </div>

    <div id="panel-coin" role="tabpanel" aria-labelledby="tab-coin">
      <div class="cf-card">
        <p class="cf-label" id="names-label">给两面起名字</p>
        <p class="cf-hint">默认是“正面”和“反面”。可以改成你的选项，比如火锅和烧烤。</p>
        <div class="cf-names" role="group" aria-labelledby="names-label">
          <input id="name-a" class="cf-input" type="text" maxlength="12" value="正面" aria-label="第一面的名字" autocomplete="off" enterkeyhint="done">
          <input id="name-b" class="cf-input" type="text" maxlength="12" value="反面" aria-label="第二面的名字" autocomplete="off" enterkeyhint="done">
        </div>
        <div id="coin-stage" class="cf-stage" aria-hidden="true">
          <div class="cf-toss"><div id="coin" class="cf-coin"><span id="coin-a" class="cf-face cf-face-a"></span><span id="coin-b" class="cf-face cf-face-b"></span></div></div>
          <span class="cf-shadow"></span>
        </div>
      </div>
      <button type="button" id="throw-btn" class="cf-btn cf-btn-primary">抛硬币 🪙</button>
    </div>

    <div id="panel-dice" role="tabpanel" aria-labelledby="tab-dice" hidden>
      <div class="cf-card">
        <p class="cf-label" id="dice-label">掷几个骰子？</p>
        <div class="cf-seg" role="radiogroup" aria-labelledby="dice-label">
          <button type="button" class="cf-seg-btn" role="radio" data-dice="1" aria-checked="true">1</button>
          <button type="button" class="cf-seg-btn" role="radio" data-dice="2" aria-checked="false">2</button>
          <button type="button" class="cf-seg-btn" role="radio" data-dice="3" aria-checked="false">3</button>
        </div>
        <div id="dice-stage" class="cf-dice-stage" aria-hidden="true"></div>
      </div>
      <button type="button" id="roll-btn" class="cf-btn cf-btn-primary">掷骰子 🎲</button>
    </div>
    <div class="mg-ad"></div>
  </section>

  <!-- 결과: 하나 + 이번 세션 누적 → 공통 끝 화면 -->
  <section id="screen-result" class="cf-screen cf-result" hidden>
    <h2 class="cf-h2" id="res-title">结果是</h2>
    <div class="cf-res" aria-live="polite">
      <div id="res-coin" class="cf-res-coin"><span class="cf-res-disc" aria-hidden="true">🪙</span><p id="res-name" class="cf-res-name"></p></div>
      <div id="res-dice" class="cf-res-dice" hidden></div>
      <span id="res-sum" class="cf-res-sum" hidden></span>
    </div>
    <div class="cf-tally">
      <p class="cf-tally-title">本次记录</p>
      <p id="tally-count" class="cf-tally-count"></p>
      <p id="tally-sides" class="cf-tally-sides"></p>
    </div>
    <div class="cf-actions">
      <button type="button" id="again-btn" class="cf-mini cf-mini-accent">再抛一次</button>
      <button type="button" id="change-btn" class="cf-mini">↩ 返回设置</button>
    </div>
    <div data-mg-end="coinflip"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 抛硬币 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"抛硬币怎么用？","a":"需要的话先给两面起名字，然后点“抛硬币”。结果会先抽出来，硬币只是转到那一面给你看，所以屏幕上显示的就是真实结果。切换到“骰子”标签可以掷1到3个六面骰子。"},{"q":"真的公平吗？","a":"是的。结果由浏览器的加密随机数(crypto.getRandomValues)加拒绝抽样得出，正面和反面、骰子的每一点概率都完全相同。旋转的硬币和滚动的骰子只是动画效果。"},{"q":"可以不用正面反面，换成自己的选项吗？","a":"可以。在硬币上方的输入框里填两个名字就行，比如“火锅”和“烧烤”，结果会显示胜出一方的名字。把输入框清空就会恢复默认名字。"},{"q":"结果页的次数是什么意思？","a":"是你打开这个页面后亲手抛(掷)的次数，以及每一面出现的次数。刷新页面会重新计数，也不会发送到任何地方。"}];</script>
