  <section id="screen-setup" class="rc-screen rc-setup">
    <h1 class="rc-h1"><span class="rc-kicker">动物赛跑抽签</span><span class="rc-h1-main">选不出来？<br><em>让小动物们跑一场</em></span></h1>
    <p class="rc-hook">谁请咖啡？谁先来？把大家放上跑道，看比赛结果吧。</p>

    <form id="rc-form" class="rc-card rc-form" novalidate autocomplete="off">
      <p class="rc-label" id="mode-label">怎么决定？</p>
      <div class="rc-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" class="rc-seg-btn" id="mode-win" role="radio" aria-checked="true">🏆 第一名胜出</button>
        <button type="button" class="rc-seg-btn" id="mode-lose" role="radio" aria-checked="false">☕ 最后一名请客</button>
      </div>
      <div class="rc-count">
        <p class="rc-label" id="count-label">参赛人数</p>
        <div class="rc-stepper" role="group" aria-labelledby="count-label">
          <button type="button" class="rc-step" id="count-less" aria-label="减少人数">−</button>
          <output id="count-out" class="rc-count-out" aria-live="polite">4 人</output>
          <button type="button" class="rc-step" id="count-more" aria-label="增加人数">+</button>
        </div>
      </div>
      <p class="rc-label" id="names-label">谁来参赛？</p>
      <ol id="entries" class="rc-entries" aria-labelledby="names-label"></ol>
      <p class="rc-hint">空着的跑道会用默认名字。小动物只是好玩，不影响任何人的概率。</p>
    </form>

    <p id="error" class="rc-error" role="alert" hidden></p>
    <p id="shared-note" class="rc-note" hidden>已从分享链接读取选手。准备好就开跑！</p>
    <button type="button" id="start-btn" class="rc-btn rc-btn-primary">开跑！🏁</button>
    <p class="rc-fair">开跑前用 crypto 随机数公平决定名次 · 名字只保存在本设备</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 경주 화면: 모드 안내 → 트랙(카운트다운) → (끝나면) 결과 카드 → 최근 기록 → 공통 끝 화면. 광고 자리 없음(끝 화면 공통 컴포넌트만) -->
  <section id="screen-race" class="rc-screen rc-race" hidden>
    <p id="race-banner" class="rc-banner"></p>
    <div class="rc-track-wrap">
      <ol id="track" class="rc-track" aria-label="赛道"></ol>
      <div id="countdown" class="rc-countdown" aria-hidden="true" hidden><span id="countdown-num" class="rc-countdown-num"></span></div>
    </div>
    <p id="live" class="visually-hidden" aria-live="polite"></p>

    <div id="result" class="rc-result" hidden>
      <article class="rc-card rc-res-card" id="result-card" aria-labelledby="res-title">
        <p class="rc-res-kicker" id="res-kicker"></p>
        <h2 class="rc-h2 rc-res-title" id="res-title"></h2>
        <p id="res-sub" class="rc-res-sub"></p>
        <h3 class="rc-h3" id="ranking-title">冲线顺序</h3>
        <ol id="ranking" class="rc-ranking" aria-labelledby="ranking-title"></ol>
        <div class="rc-actions">
          <button type="button" id="edit-btn" class="rc-btn rc-btn-ghost">修改名字</button>
          <button type="button" id="link-btn" class="rc-btn rc-btn-ghost">复制带名字的链接</button>
        </div>
      </article>
      <div id="history-card" class="rc-card rc-history" hidden>
        <div class="rc-history-head">
          <h3 class="rc-h3" id="history-title">最近的比赛</h3>
          <button type="button" id="history-clear" class="rc-mini">清除</button>
        </div>
        <ol id="history" class="rc-history-list" aria-labelledby="history-title"></ol>
      </div>
      <div data-mg-end="race"></div>
    </div>
  </section>

<script>window.MG_FAQ = [{"q":"真的是公平随机吗？","a":"是的。按下开跑的那一刻，会用浏览器的加密随机数（crypto.getRandomValues）、拒绝采样和 Fisher–Yates 洗牌一次性决定全部冲线顺序。每种顺序的概率完全相同，画面里的比赛只是把它演出来。"},{"q":"动物或跑道会影响概率吗？","a":"不会。小动物按跑道顺序分配，只是为了好玩。在这里兔子不比乌龟快，第1跑道和第10跑道的概率也一样。"},{"q":"为什么每次都跑得这么胶着？","a":"为了好看。名次决定后，动画会加入冲刺和踉跄，并根据模式让争夺第一名或最后一名的位置特别接近。动画不会改变名次。"},{"q":"可以把同样的选手发给朋友吗？","a":"可以。点“复制带名字的链接”，链接里只有名字和模式，不含结果。打开的人会重新跑一场。最近的结果只保存在本设备。"}];</script>
