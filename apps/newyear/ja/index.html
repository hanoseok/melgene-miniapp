<script>window.PAGE_I18N = {"questions":[{"q":"大みそか、年明けまであと10分。あなたはどこにいる？","choices":["好きな人たちとこたつでお菓子をつまみながら、予定はまったくなし","何週間も前から自分で準備した、友だちとのカウントダウンパーティー","家でひとり、新しいノートに来年の目標を書いている","思いつきで出かけたひとり旅の先で、知らない人たちのお祝いを眺めている"]},{"q":"新しい一年の手帳が届いた。最初のページに書くのは？","choices":["友だちとやってみたい楽しいことリスト。日付はあとで","まだ何も。書きたくなったときに書く","まずはみんなの誕生日と、家族や親せきの集まりの日","今年の大きな目標をひとつ、月ごとのステップに分けて"]},{"q":"元日の初日の出。どんなふうに迎える？","choices":["目覚ましをセットして、温かい飲み物を片手に窓からそっと","早朝の電車にふと飛び乗って、行ったことのない場所へ","コースもおやつも計画済みの初日の出ハイキングを先頭で","パーティーのあと友だちと話し込んでいたら、たまたま見られた"]},{"q":"今年の抱負は、たぶん…","choices":["新しいスキルを身につける。スケジュールと進み具合の記録つき","大切な人たちに、定期的に連絡したり会いに行ったりする","誘われたら、もっと「いいね！」と乗ってみる","大きな抱負はなし。自分にもう少しやさしくする"]},{"q":"職場や学校で新しいプロジェクトが始まった。あなたは…","choices":["まだ誰もやったことのない部分を引き受けて、やりながら考える","好きなチームに入って、必要なところを手伝う","得意な部分を引き受けて、ひとりでていねいに仕上げる","リーダーを買って出て、みんなで計画を立てる"]},{"q":"思いがけず、ちょっとしたお金が入った。お年玉や小さなボーナスのように。","choices":["予定している集まりや、家族へのプレゼントにあてる","その場で友だちに楽しいことをごちそうする","とりあえずしまっておいて、必要になるまで忘れておく","前から計画していた新しいことの教室や道具に使う"]},{"q":"予定のない、まっさらな週末。どう過ごす？","choices":["誰も行ったことのない場所へ、みんなで日帰り旅行を計画する","部屋を片づけて翌週の準備をし、のんびりした時間を楽しむ","行ったことのない街を、ひとりでぶらぶら歩いてみる","友だちに「うち来る？」と送って、あとはなりゆきで"]},{"q":"新年会で、初めて会う人がとなりに座った。","choices":["にこっとあいさつして、静かに料理を楽しむ","どんな仕事をしているか聞いてみる。自分の目標のヒントがあるかも","みんなに紹介して、ゲームを始める","居心地よく過ごせるよう気を配り、次の集まりにも誘う"]},{"q":"忙しい時期が続いて、ちょっと疲れた。どうやって充電する？","choices":["仲のいい友だちに電話して、何時間でもおしゃべり","思いつきで、まったく新しいことを自分のためにやってみる","友だちと週末旅行を計画する。しおりもつくって","静かな夜を確保する。早寝して、好きな本と温かいお茶"]},{"q":"一年の折り返し地点で、思いがけないチャンスがやってきた。","choices":["じっくり考えてから、しっかり計画を立てて挑戦する","見送る。今のペースが気に入っているから","いちばん身近な人たちと相談してから決める","すぐに飛び込んで、友だちも一緒に巻き込む"]},{"q":"一年後の大みそかを想像してみて。いちばん誇らしいのは？","choices":["小さな習慣を本当に続けられた、記録でいっぱいのノート","チームみんなで一緒に達成した大きな目標","大好きな人たちと過ごした、あたたかい時間の数々","生まれて初めてやってみたことから生まれた、たくさんの思い出話"]}],"qLabel":"質問{n}"};</script>
