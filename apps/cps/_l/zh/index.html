<script>window.MG_FAQ = [{"q":"CPS测试怎么玩？","a":"先选择1秒、5秒或10秒的测试时长，再按开始按钮。你第一次点击或轻触大方框的瞬间开始计时，这一下也算在内。在时间结束前尽可能快地点。CPS就是点击次数除以测试的秒数。"},{"q":"多少CPS算快？","a":"正常点击的话，大多数人每秒在5到8下左右。会抖动点击（jitter click）或蝴蝶点击（butterfly click）等技巧的玩家常常能超过10下。1秒模式来不及累，通常会测出最高的数字。"},{"q":"键盘或多根手指算吗？","a":"只计算方框内的鼠标点击和触屏轻触。键盘按住不放会自动连发，所以故意不计。在触屏上，每根碰到方框的手指都算一下，用两根手指或双手拇指都可以。"},{"q":"为什么这次成绩没算？","a":"计时过程中如果切换标签页、锁屏或离开页面，为了公平这次挑战会被取消。另外，每秒超过25下的成绩是人类手指做不到的，不会保存，也不会和其他玩家比较。"}];</script>
