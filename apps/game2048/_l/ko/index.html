<main class="tf-shell">
  <!-- 시작 화면: 티징 + 아주 짧은 방법 + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="tf-screen tf-start">
    <p class="tf-badge">🎃 할로윈판 · 숫자 퍼즐</p>
    <div class="tf-hero" aria-hidden="true">
      <span class="tf-hero-moon"></span>
      <div class="tf-hero-board">
        <span class="tf-hero-tile tf-v2 tf-hero-a">2</span>
        <span class="tf-hero-tile tf-v2 tf-hero-b">2</span>
        <span class="tf-hero-tile tf-v4 tf-hero-c">4</span>
        <span class="tf-hero-tile tf-v8 tf-hero-d">8</span>
      </div>
    </div>
    <h1 class="tf-h1"><span class="tf-kicker">2048 게임</span><span class="tf-h1-main"><em>2048</em>까지<br>만들 수 있을까?</span></h1>
    <p class="tf-hook">타일을 밀어 보세요. 같은 숫자끼리 만나면 하나로 합쳐져요. 판이 꽉 차기 전에 계속 두 배로!</p>
    <ul class="tf-how">
      <li><span class="tf-how-ico" aria-hidden="true">👆</span><span class="tf-how-txt">밀어서 이동</span></li>
      <li><span class="tf-how-ico" aria-hidden="true">✨</span><span class="tf-how-txt">같은 숫자 합치기</span></li>
      <li><span class="tf-how-ico" aria-hidden="true">🎃</span><span class="tf-how-txt">2048 만들기</span></li>
    </ul>
    <button id="start-btn" class="tf-btn tf-btn-primary" type="button">시작하기 →</button>
    <p class="tf-facts">시간 제한 없음 · 스와이프·방향키</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 4×4 판 (광고 없음) -->
  <section id="screen-play" class="tf-screen tf-play" hidden>
    <div class="tf-hud">
      <div class="tf-hud-box tf-hud-score"><span class="tf-hud-label">점수</span><span id="hud-score" class="tf-hud-val">0</span><span id="hud-gain" class="tf-gain" aria-hidden="true"></span></div>
      <div class="tf-hud-box tf-hud-best"><span class="tf-hud-label">최고</span><span id="hud-best" class="tf-hud-val">0</span></div>
    </div>
    <div id="board" class="tf-board" tabindex="0" role="application" aria-label="게임 판. 스와이프하거나 방향키로 타일을 밀어요.">
      <div class="tf-cells" aria-hidden="true"><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span><span class="tf-cell"></span></div>
      <div id="tiles" class="tf-tiles" aria-live="off"></div>
      <div id="won-overlay" class="tf-overlay tf-won" hidden>
        <p class="tf-overlay-title">2048 달성!</p>
        <button id="keep-btn" class="tf-btn tf-btn-primary tf-btn-sm" type="button">계속하기</button>
        <button id="finish-btn" class="tf-btn tf-btn-ghost tf-btn-sm" type="button">여기서 끝내기</button>
      </div>
      <div id="over-overlay" class="tf-overlay tf-over" hidden><p class="tf-overlay-title">더 이상 움직일 수 없어요!</p></div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="tf-screen tf-end" hidden>
    <article class="tf-result" aria-labelledby="res-score">
      <p id="res-reason" class="tf-eyebrow"></p>
      <p class="tf-score-line"><span id="res-score" class="tf-score-big">0</span> <span class="tf-points">점</span></p>
      <p id="res-newbest" class="tf-newbest" hidden>최고 기록 경신!</p>
      <p id="res-best" class="tf-best"></p>
      <dl class="tf-stats">
        <div class="tf-stat"><dt>가장 큰 타일</dt><dd><span id="res-biggest" class="tf-stat-tile"></span></dd></div>
        <div class="tf-stat"><dt>이동 횟수</dt><dd id="res-moves" class="tf-stat-num">0</dd></div>
      </dl>
      <div id="res-rank" class="tf-rank" hidden>
        <p id="res-comparing" class="tf-comparing">다른 플레이어와 비교하는 중…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="tf-top"></p>
          <p id="res-beat" class="tf-beat"></p>
          <p id="res-others" class="tf-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="game2048"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 2048 게임 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
