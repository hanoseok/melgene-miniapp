    <p class="tf-badge">🎃 ハロウィン版・数字パズル</p>

      <span class="tf-hero-moon"></span>
      <div class="tf-hero-board">
        <span class="tf-hero-tile tf-v2 tf-hero-a">2</span>
        <span class="tf-hero-tile tf-v2 tf-hero-b">2</span>
        <span class="tf-hero-tile tf-v4 tf-hero-c">4</span>
        <span class="tf-hero-tile tf-v8 tf-hero-d">8</span>
      </div>
    </div>
    <h1 class="tf-h1"><span class="tf-kicker">2048 ゲーム</span><span class="tf-h1-main"><em>2048</em>まで<br>たどり着ける？</span></h1>
    <p class="tf-hook">タイルをスライド。同じ数字がぶつかると1つに合体。盤面が埋まる前にどんどん倍にしよう。</p>
    <ul class="tf-how">
      <li><span class="tf-how-ico" aria-hidden="true">👆</span><span class="tf-how-txt">スワイプで移動</span></li>
      <li><span class="tf-how-ico" aria-hidden="true">✨</span><span class="tf-how-txt">同じ数字を合体</span></li>
      <li><span class="tf-how-ico" aria-hidden="true">🎃</span><span class="tf-how-txt">2048を目指す</span></li>

    <button id="start-btn" class="tf-btn tf-btn-primary" type="button">スタート →</button>

    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 4×4 판 (광고 없음) -->
  <section id="screen-play" class="tf-screen tf-play" hidden>
    <div class="tf-hud">
      <div class="tf-hud-box tf-hud-score"><span class="tf-hud-label">スコア</span><span id="hud-score" class="tf-hud-val">0</span><span id="hud-gain" class="tf-gain" aria-hidden="true"></span></div>
      <div class="tf-hud-box tf-hud-best"><span class="tf-hud-label">ベスト</span><span id="hud-best" class="tf-hud-val">0</span></div>
    </div>
    <div id="board" class="tf-board" tabindex="0" role="application" aria-label="ゲーム盤。スワイプか矢印キーでタイルを動かします。">

      <div id="tiles" class="tf-tiles" aria-live="off"></div>
      <div id="won-overlay" class="tf-overlay tf-won" hidden>
        <p class="tf-overlay-title">2048達成！</p>
        <button id="keep-btn" class="tf-btn tf-btn-primary tf-btn-sm" type="button">続ける</button>
        <button id="finish-btn" class="tf-btn tf-btn-ghost tf-btn-sm" type="button">ここで終わる</button>
      </div>
      <div id="over-overlay" class="tf-overlay tf-over" hidden><p class="tf-overlay-title">もう動かせない！</p></div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="tf-screen tf-end" hidden>
    <article class="tf-result" aria-labelledby="res-score">
      <p id="res-reason" class="tf-eyebrow"></p>
      <p class="tf-score-line"><span id="res-score" class="tf-score-big">0</span> <span class="tf-points">点</span></p>
      <p id="res-newbest" class="tf-newbest" hidden>自己ベスト更新！</p>
      <p id="res-best" class="tf-best"></p>
      <dl class="tf-stats">
        <div class="tf-stat"><dt>最大タイル</dt><dd><span id="res-biggest" class="tf-stat-tile"></span></dd></div>
        <div class="tf-stat"><dt>手数</dt><dd id="res-moves" class="tf-stat-num">0</dd></div>
      </dl>
      <div id="res-rank" class="tf-rank" hidden>
        <p id="res-comparing" class="tf-comparing">ほかのプレイヤーと比較中…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="tf-top"></p>
          <p id="res-beat" class="tf-beat"></p>
          <p id="res-others" class="tf-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="game2048"></div>
  </section>

<script>window.MG_FAQ = [{"q":"2048 ゲームの遊び方は？","a":"盤面をスワイプ（または矢印キー）すると、すべてのタイルが一斉にその方向へ動きます。同じ数字のタイルがぶつかると、倍の数字の1枚に合体。動かすたびに新しい2か4が出てきます。"},{"q":"ゲームオーバーになるのは？","a":"時間制限はありません。盤面が埋まり、となり合う同じ数字が1つもなくなったら終了です。2048を作ったらそこで終えても、さらに高得点を狙って続けてもOK。"},{"q":"スコアの計算方法は？","a":"合体するたびに、新しくできたタイルの数字がスコアに加わります。大きな数字ほど高得点。ベストスコアはこのブラウザにだけ保存されます。"},{"q":"上位%は本物？","a":"はい。ゲームが終わるとスコアだけを匿名でサーバーに送り、ほかの人の記録と比べます。比べられる実際の記録があるときだけ上位%を表示し、なければ何も表示しません。"}];</script>
