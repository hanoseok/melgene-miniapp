<main class="aw-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="aw-screen aw-start">
    <p class="aw-badge">🏆 ฤดูมอบรางวัลส่งท้ายปี</p>
    <div class="aw-hero" aria-hidden="true"><span class="aw-hero-paper"><span class="aw-hero-line"></span><span class="aw-hero-line aw-short"></span><span class="aw-hero-line"></span></span><span class="aw-hero-main">🏆</span><span class="aw-hero-star">✨</span><span class="aw-hero-medal">🏅</span><span class="aw-hero-pop">🎉</span><span class="aw-hero-clap">👏</span></div>
    <h1 class="aw-h1"><span class="aw-kicker">ทำเกียรติบัตร</span><span class="aw-h1-main">ต้องมีใครสักคน<br>ที่ควรได้<em>รางวัล</em></span></h1>
    <p class="aw-hook">ตั้งชื่อรางวัล เขียนเหตุผล แล้วส่งลิงก์ที่เปิดออกมาเหมือนพิธีมอบรางวัลจริง</p>
    <button id="start-btn" class="aw-btn aw-btn-primary" type="button">ทำเกียรติบัตร →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="aw-screen aw-edit" hidden>
    <h2 class="aw-edit-title">ออกแบบเกียรติบัตร</h2>
    <div id="themes" class="aw-chips" role="radiogroup" aria-label="แบบเกียรติบัตร">
      <button type="button" class="aw-chip aw-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="aw-chip-emoji" aria-hidden="true">🏆</span><span class="aw-chip-name">กรอบทอง</span></button>
      <button type="button" class="aw-chip aw-theme" role="radio" data-t="1" aria-checked="false"><span class="aw-chip-emoji" aria-hidden="true">🌸</span><span class="aw-chip-name">พาสเทลน่ารัก</span></button>
      <button type="button" class="aw-chip aw-theme" role="radio" data-t="2" aria-checked="false"><span class="aw-chip-emoji" aria-hidden="true">◻️</span><span class="aw-chip-name">มินิมอล</span></button>
      <button type="button" class="aw-chip aw-theme" role="radio" data-t="3" aria-checked="false"><span class="aw-chip-emoji" aria-hidden="true">🎀</span><span class="aw-chip-name">ริบบิ้นเรโทร</span></button>
    </div>
    <div class="aw-preview"><canvas id="preview-canvas" class="aw-canvas" width="1240" height="1754" role="img" aria-label="ตัวอย่างเกียรติบัตร"></canvas></div>
    <div class="aw-field">
      <label class="aw-label" for="f-title">ชื่อรางวัล</label>
      <input id="f-title" class="aw-input" type="text" maxlength="72" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น รางวัลคนขยันแห่งปี">
      <div id="examples" class="aw-exs" role="group" aria-label="ตัวอย่างชื่อรางวัล">
        <button type="button" class="aw-ex">รางวัลคนขยันแห่งปี</button>
        <button type="button" class="aw-ex">ทูตแจกขนม</button>
        <button type="button" class="aw-ex">รางวัลตัวตึงสายฮา</button>
        <button type="button" class="aw-ex">ราชาแห่งรีแอคชัน</button>
      </div>
    </div>
    <label class="aw-field" for="f-to"><span class="aw-label">มอบให้</span>
      <input id="f-to" class="aw-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น น้องมายด์">
    </label>
    <div class="aw-field">
      <div class="aw-msg-head"><label class="aw-label" for="f-msg">เหตุผลที่ได้รางวัล</label><button id="dice-btn" class="aw-dice" type="button">🎲 สุ่ม</button></div>
      <textarea id="f-msg" class="aw-input aw-textarea" rows="3" maxlength="420" autocomplete="off" spellcheck="false" placeholder="เนื่องจาก…"></textarea>
      <p id="msg-count" class="aw-count" aria-live="polite">0/140</p>
    </div>
    <div class="aw-row">
      <label class="aw-field" for="f-date"><span class="aw-label">วันที่</span>
        <input id="f-date" class="aw-input aw-date" type="date" min="2000-01-01" max="2099-12-31">
      </label>
      <label class="aw-field" for="f-issuer"><span class="aw-label">ผู้มอบ</span>
        <input id="f-issuer" class="aw-input" type="text" maxlength="72" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="เช่น แก๊งข้าวเที่ยง">
      </label>
    </div>
    <p class="aw-label" id="seal-label">ตราประทับ</p>
    <div id="seals" class="aw-seals" role="radiogroup" aria-labelledby="seal-label">
      <button type="button" class="aw-seal" role="radio" data-s="0" aria-checked="false"><span aria-hidden="true">🚫</span> ไม่มี</button>
      <button type="button" class="aw-seal is-on" role="radio" data-s="1" aria-checked="true"><span aria-hidden="true">🔴</span> ตราแดง</button>
      <button type="button" class="aw-seal" role="radio" data-s="2" aria-checked="false"><span aria-hidden="true">🏅</span> เหรียญทอง</button>
    </div>
    <button id="done-btn" class="aw-btn aw-btn-primary" type="button">ทำเกียรติบัตรเสร็จแล้ว</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 상장 수여식 (두루마리를 눌러 펼친다, start/done 안 셈) -->
  <section id="screen-open" class="aw-screen aw-open" hidden>
    <p class="aw-open-eyebrow">🏆 พิธีมอบรางวัล</p>
    <p id="open-for" class="aw-open-for"></p>
    <button id="open-btn" class="aw-scroll" type="button" aria-label="คลี่เกียรติบัตร">
      <span class="aw-scroll-rod aw-rod-top" aria-hidden="true"></span>
      <span class="aw-scroll-paper" aria-hidden="true"><span class="aw-scroll-title">🏆</span><span class="aw-scroll-line"></span><span class="aw-scroll-line aw-short"></span><span class="aw-scroll-line"></span></span>
      <span class="aw-scroll-rod aw-rod-bottom" aria-hidden="true"></span>
      <span class="aw-scroll-ribbon" aria-hidden="true"></span>
    </button>
    <p class="aw-open-hint">แตะม้วนกระดาษเพื่อคลี่ออก</p>
    <button id="open-cta" class="aw-btn aw-btn-primary" type="button">คลี่เกียรติบัตร</button>
  </section>

  <!-- 끝 화면: 완성 상장(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="aw-screen aw-end" hidden>
    <article class="aw-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="aw-eyebrow"></p>
      <h2 id="end-title" class="aw-sr"></h2>
      <canvas id="end-canvas" class="aw-canvas aw-end-canvas" width="1240" height="1754" role="img"></canvas>
      <div class="aw-end-actions">
        <button id="save-btn" class="aw-btn aw-btn-primary aw-btn-sm" type="button"><span aria-hidden="true">📥</span> บันทึกรูป</button>
        <button id="edit-btn" class="aw-btn aw-btn-soft aw-btn-sm" type="button"><span aria-hidden="true">✏️</span> แก้ไข</button>
      </div>
      <p id="save-status" class="aw-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="award"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> ทำเกียรติบัตร · <a href="privacy.html">นโยบายความเป็นส่วนตัว</a> · <a href="guide.html">คู่มือ</a>
  </footer>
