<header class="mg-top"><a class="mg-home" href="https://example.com/ko/" aria-label="멜진 미니앱 홈으로"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">미니앱</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="언어 선택"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko" selected>한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="언어 선택"><a href="../" hreflang="en" lang="en">English</a> <a href="../ja/" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="aw-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="aw-screen aw-start">
    <p class="aw-badge">🏆 올해도 수고했어요, 연말 시상식</p>
    <div class="aw-hero" aria-hidden="true"><span class="aw-hero-paper"><span class="aw-hero-line"></span><span class="aw-hero-line aw-short"></span><span class="aw-hero-line"></span></span><span class="aw-hero-main">🏆</span><span class="aw-hero-star">✨</span><span class="aw-hero-medal">🏅</span><span class="aw-hero-pop">🎉</span><span class="aw-hero-clap">👏</span></div>
    <h1 class="aw-h1"><span class="aw-kicker">상장 만들기</span><span class="aw-h1-main">상 받을 사람,<br>분명 <em>있잖아요</em></span></h1>
    <p class="aw-hook">상 이름과 이유를 적어 상장을 만들고, 링크를 보내면 진짜 수여식처럼 열려요.</p>
    <button id="start-btn" class="aw-btn aw-btn-primary" type="button">상장 만들기 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="aw-screen aw-edit" hidden>
    <h2 class="aw-edit-title">상장 꾸미기</h2>
    <div id="themes" class="aw-chips" role="radiogroup" aria-label="상장 디자인">
      <button type="button" class="aw-chip aw-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="aw-chip-emoji" aria-hidden="true">🏆</span><span class="aw-chip-name">클래식 금테</span></button>
      <button type="button" class="aw-chip aw-theme" role="radio" data-t="1" aria-checked="false"><span class="aw-chip-emoji" aria-hidden="true">🌸</span><span class="aw-chip-name">귀여운 파스텔</span></button>
      <button type="button" class="aw-chip aw-theme" role="radio" data-t="2" aria-checked="false"><span class="aw-chip-emoji" aria-hidden="true">◻️</span><span class="aw-chip-name">심플</span></button>
      <button type="button" class="aw-chip aw-theme" role="radio" data-t="3" aria-checked="false"><span class="aw-chip-emoji" aria-hidden="true">🎀</span><span class="aw-chip-name">레트로 리본</span></button>
    </div>
    <div class="aw-preview"><canvas id="preview-canvas" class="aw-canvas" width="1240" height="1754" role="img" aria-label="상장 미리보기"></canvas></div>
    <div class="aw-field">
      <label class="aw-label" for="f-title">상 이름</label>
      <input id="f-title" class="aw-input" type="text" maxlength="72" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 올해의 칭찬상">
      <div id="examples" class="aw-exs" role="group" aria-label="상 이름 예시">
        <button type="button" class="aw-ex">올해의 칭찬상</button>
        <button type="button" class="aw-ex">간식 나눔상</button>
        <button type="button" class="aw-ex">분위기 메이커상</button>
        <button type="button" class="aw-ex">최강 리액션상</button>
      </div>
    </div>
    <label class="aw-field" for="f-to"><span class="aw-label">받는 사람</span>
      <input id="f-to" class="aw-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 김민지">
    </label>
    <div class="aw-field">
      <div class="aw-msg-head"><label class="aw-label" for="f-msg">수상 이유</label><button id="dice-btn" class="aw-dice" type="button">🎲 랜덤 문구</button></div>
      <textarea id="f-msg" class="aw-input aw-textarea" rows="3" maxlength="420" autocomplete="off" spellcheck="false" placeholder="위 사람은…"></textarea>
      <p id="msg-count" class="aw-count" aria-live="polite">0/140</p>
    </div>
    <div class="aw-row">
      <label class="aw-field" for="f-date"><span class="aw-label">날짜</span>
        <input id="f-date" class="aw-input aw-date" type="date" min="2000-01-01" max="2099-12-31">
      </label>
      <label class="aw-field" for="f-issuer"><span class="aw-label">주는 사람·단체</span>
        <input id="f-issuer" class="aw-input" type="text" maxlength="72" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="예: 3팀 일동">
      </label>
    </div>
    <p class="aw-label" id="seal-label">도장</p>
    <div id="seals" class="aw-seals" role="radiogroup" aria-labelledby="seal-label">
      <button type="button" class="aw-seal" role="radio" data-s="0" aria-checked="false"><span aria-hidden="true">🚫</span> 없음</button>
      <button type="button" class="aw-seal is-on" role="radio" data-s="1" aria-checked="true"><span aria-hidden="true">🔴</span> 빨간 도장</button>
      <button type="button" class="aw-seal" role="radio" data-s="2" aria-checked="false"><span aria-hidden="true">🏅</span> 금메달</button>
    </div>
    <button id="done-btn" class="aw-btn aw-btn-primary" type="button">상장 완성</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 상장 수여식 (두루마리를 눌러 펼친다, start/done 안 셈) -->
  <section id="screen-open" class="aw-screen aw-open" hidden>
    <p class="aw-open-eyebrow">🏆 상장 수여식</p>
    <p id="open-for" class="aw-open-for"></p>
    <button id="open-btn" class="aw-scroll" type="button" aria-label="상장 펼치기">
      <span class="aw-scroll-rod aw-rod-top" aria-hidden="true"></span>
      <span class="aw-scroll-paper" aria-hidden="true"><span class="aw-scroll-title">🏆</span><span class="aw-scroll-line"></span><span class="aw-scroll-line aw-short"></span><span class="aw-scroll-line"></span></span>
      <span class="aw-scroll-rod aw-rod-bottom" aria-hidden="true"></span>
      <span class="aw-scroll-ribbon" aria-hidden="true"></span>
    </button>
    <p class="aw-open-hint">두루마리를 눌러 펼쳐 보세요</p>
    <button id="open-cta" class="aw-btn aw-btn-primary" type="button">상장 펼치기</button>
  </section>

  <!-- 끝 화면: 완성 상장(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="aw-screen aw-end" hidden>
    <article class="aw-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="aw-eyebrow"></p>
      <h2 id="end-title" class="aw-sr"></h2>
      <canvas id="end-canvas" class="aw-canvas aw-end-canvas" width="1240" height="1754" role="img"></canvas>
      <div class="aw-end-actions">
        <button id="save-btn" class="aw-btn aw-btn-primary aw-btn-sm" type="button"><span aria-hidden="true">📥</span> 이미지 저장</button>
        <button id="edit-btn" class="aw-btn aw-btn-soft aw-btn-sm" type="button"><span aria-hidden="true">✏️</span> 고치기</button>
      </div>
      <p id="save-status" class="aw-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="award"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 상장 만들기 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
