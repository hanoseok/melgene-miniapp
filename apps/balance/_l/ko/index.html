    <section id="screen-home" class="bal-screen" data-screen="home">
      <div class="bal-hero">
        <h1 class="bal-hero-title"><span class="bal-hero-a">밸런스 게임</span> <span class="bal-hero-b" data-vs="VS">당신의 선택은?</span></h1>
      </div>
      <p class="bal-hook">둘 중 하나만 고르면, 같은 쪽을 고른 사람이 몇 %인지 바로 공개돼요. 12문제를 끝내면 내가 얼마나 대세를 따르는지도 알려 줄게요.</p>

      <h2 class="bal-h2">어떤 팩으로 할까요?</h2>
      <div class="bal-packs" id="packs">
        <button type="button" class="bal-pack bal-pack--random" data-pack="random">
          <span class="bal-pack-emoji" aria-hidden="true">🎲</span>
          <span class="bal-pack-name">랜덤 12</span>
          <span class="bal-pack-blurb">다섯 팩에서 12문제를 섞어서</span>
          <span class="bal-pack-count">12문제</span>
        </button>
        <button type="button" class="bal-pack" data-pack="daily">
          <span class="bal-pack-emoji" aria-hidden="true">☀️</span>
          <span class="bal-pack-name">일상</span>
          <span class="bal-pack-blurb">매일 부딪히는 사소한 고민들</span>
          <span class="bal-pack-count">12문제</span>
        </button>
        <button type="button" class="bal-pack" data-pack="love">
          <span class="bal-pack-emoji" aria-hidden="true">💘</span>
          <span class="bal-pack-name">연애</span>
          <span class="bal-pack-blurb">연애하며 한 번쯤 갈리는 문제, 애인과 함께</span>
          <span class="bal-pack-count">12문제</span>
        </button>
        <button type="button" class="bal-pack" data-pack="work">
          <span class="bal-pack-emoji" aria-hidden="true">💼</span>
          <span class="bal-pack-name">직장·학교</span>
          <span class="bal-pack-blurb">회사와 학교에서 겪는 크고 작은 고민</span>
          <span class="bal-pack-count">12문제</span>
        </button>
        <button type="button" class="bal-pack" data-pack="food">
          <span class="bal-pack-emoji" aria-hidden="true">🍜</span>
          <span class="bal-pack-name">음식</span>
          <span class="bal-pack-blurb">식탁 위에서 우정이 갈리는 논쟁</span>
          <span class="bal-pack-count">12문제</span>
        </button>
        <button type="button" class="bal-pack bal-pack--boss" data-pack="extreme">
          <span class="bal-pack-emoji" aria-hidden="true">🌋</span>
          <span class="bal-pack-name">극한</span>
          <span class="bal-pack-blurb">고르는 것 자체가 벌칙인 선택</span>
          <span class="bal-pack-count">12문제</span>
        </button>
      </div>
      <div class="mg-ad mg-ad-start"></div>
    </section>

    <!-- 질문 -->
    <section id="screen-play" class="bal-screen" data-screen="play" hidden>

        <button type="button" id="back-btn" class="bal-icon-btn" aria-label="팩 고르기로 돌아가기" data-prev="이전 질문으로" data-home="팩 고르기로 돌아가기">

        <span class="bal-stat" aria-hidden="true"><span class="bal-pct"></span><span class="bal-cnt"></span></span>

        <span class="bal-tag bal-tag--friend">친구</span>
      </button>
      <button type="button" class="bal-side bal-side--b" data-opt="1">
        <span class="bal-side-letter" aria-hidden="true">B</span>
        <span class="bal-opt"></span>
        <span class="bal-stat" aria-hidden="true"><span class="bal-pct"></span><span class="bal-cnt"></span></span>
        <span class="bal-meter" aria-hidden="true"><span class="bal-meter-fill"></span></span>
        <span class="bal-tag bal-tag--you">내 선택</span>
        <span class="bal-tag bal-tag--friend">친구</span>
        <span class="bal-vs" aria-hidden="true">VS</span>
      </button>
      </div>

      <div class="bal-after">
        <p id="note" class="bal-note" aria-live="polite"></p>
        <button type="button" id="next-btn" class="bal-next" hidden><span class="bal-next-fill" aria-hidden="true"></span><span class="bal-next-label"></span></button>
      </div>

      <!-- 진행 중 화면의 광고 한 자리: 카드와 "다음" 버튼 아래(겹치지 않음). 보일 때 채우고, 못 채우면 숨는다. localhost 에서는 아무것도 안 함 -->
      <div class="mg-ad"></div>
    </section>

    <!-- 결과: 그 사람의 결과만 (유형·숫자 요약). 푼 질문 목록은 보여 주지 않는다 -->
    <section id="screen-end" class="bal-screen" data-screen="end" hidden>
      <div class="bal-result" id="result-card">
        <p id="r-pack" class="bal-result-pack"></p>
        <h2 id="r-type" class="bal-result-type"></h2>
        <p id="r-desc" class="bal-result-desc"></p>
        <div class="bal-stats">
          <div class="bal-statbox" id="r-rate-box"><span class="bal-statbox-num" id="r-rate"></span><span class="bal-statbox-label">대세 일치율</span></div>
          <div class="bal-statbox" id="r-speed-box"><span class="bal-statbox-num" id="r-speed"></span><span class="bal-statbox-label">평균 고민 시간</span></div>
          <div class="bal-statbox" id="r-friend-box" hidden><span class="bal-statbox-num" id="r-friend"></span><span class="bal-statbox-label">친구와 같은 선택</span></div>
        </div>
        <div class="bal-rate-meter" id="r-meter" aria-hidden="true"><span class="bal-rate-meter-fill"></span></div>
        <p id="r-line" class="bal-result-line"></p>
      </div>

      <div data-mg-end="balance" data-retry-label="다른 팩 하기"></div>
