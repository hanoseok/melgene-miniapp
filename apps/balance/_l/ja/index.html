          <span class="bal-pack-blurb">全パックから12問をシャッフル</span>
          <span class="bal-pack-count">12問</span>
        </button>
        <button type="button" class="bal-pack" data-pack="daily">
          <span class="bal-pack-emoji" aria-hidden="true">☀️</span>
          <span class="bal-pack-name">日常</span>
          <span class="bal-pack-blurb">毎日ぶつかる、ささいな悩み</span>
          <span class="bal-pack-count">12問</span>
        </button>
        <button type="button" class="bal-pack" data-pack="love">
          <span class="bal-pack-emoji" aria-hidden="true">💘</span>
          <span class="bal-pack-name">恋愛</span>
          <span class="bal-pack-blurb">恋人と遊ぶと盛り上がる恋の分かれ道</span>
          <span class="bal-pack-count">12問</span>
        </button>
        <button type="button" class="bal-pack" data-pack="work">
          <span class="bal-pack-emoji" aria-hidden="true">💼</span>
          <span class="bal-pack-name">仕事・学校</span>
          <span class="bal-pack-blurb">職場と教室の、大小さまざまな悩み</span>
          <span class="bal-pack-count">12問</span>
        </button>
        <button type="button" class="bal-pack" data-pack="food">
          <span class="bal-pack-emoji" aria-hidden="true">🍜</span>
          <span class="bal-pack-name">グルメ</span>
          <span class="bal-pack-blurb">食卓で友情が割れる大論争</span>
          <span class="bal-pack-count">12問</span>
        </button>
        <button type="button" class="bal-pack bal-pack--boss" data-pack="extreme">
          <span class="bal-pack-emoji" aria-hidden="true">🌋</span>
          <span class="bal-pack-name">極限</span>
          <span class="bal-pack-blurb">選ぶこと自体が罰ゲーム</span>
          <span class="bal-pack-count">12問</span>
        </button>

      <div class="mg-ad mg-ad-start"></div>
