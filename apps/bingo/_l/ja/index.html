  <section id="screen-start" class="bg-screen">
    <div class="bg-logo" aria-hidden="true"><span>🎯</span></div>

          <button type="button" class="bg-seg-btn" data-size="4" aria-pressed="false">4×4</button>
          <button type="button" class="bg-seg-btn" data-size="5" aria-pressed="true">5×5</button>
        </div>
      <button type="button" id="start-btn" class="bg-btn bg-btn-primary">ビンゴカードを作る</button>
      <button type="button" id="continue-btn" class="bg-btn bg-btn-ghost" hidden>保存したカードを開く</button>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집 화면 -->
  <section id="screen-edit" class="bg-screen" hidden>
    <h2 class="bg-h2">目標を書こう</h2>
    <div class="bg-card bg-settings">
      <div class="bg-field"><label class="bg-label" for="title-input">タイトル</label>
        <input id="title-input" class="bg-input" type="text" maxlength="40" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="bg-row">
        <div class="bg-field"><span class="bg-label" id="lbl-size-edit">マスの数</span>
          <div class="bg-seg" id="size-edit" role="group" aria-labelledby="lbl-size-edit">
          <button type="button" class="bg-seg-btn" data-size="3" aria-pressed="false">3×3</button>
          <button type="button" class="bg-seg-btn" data-size="4" aria-pressed="false">4×4</button>
          <button type="button" class="bg-seg-btn" data-size="5" aria-pressed="true">5×5</button>
        </div>
        </div>
        <label class="bg-switch" id="free-wrap"><input type="checkbox" id="free-toggle" role="switch"><span class="bg-switch-ui" aria-hidden="true"></span><span class="bg-switch-t">真ん中をフリーに</span></label>
      </div>
      <span class="bg-label" id="lbl-theme">カラー</span>
      <div class="bg-themes" id="themes" role="group" aria-labelledby="lbl-theme"></div>
    </div>

    <div class="bg-card bg-editor">
      <div id="grid" class="bg-grid" role="group" aria-label="目標を書こう"></div>
      <div class="bg-cellbox">
        <label class="bg-label" id="cell-label" for="cell-input"></label>
        <div class="bg-cellrow">
          <input id="cell-input" class="bg-input" type="text" maxlength="40" autocomplete="off" placeholder="目標を入力" enterkeyhint="next">
          <button type="button" id="next-btn" class="bg-mini-btn">次へ</button>
        </div>
      </div>
      <p class="bg-filled" id="filled"></p>
      <div class="bg-tools">
        <button type="button" id="ideas-btn" class="bg-tool">✨ アイデアで埋める</button>
        <button type="button" id="shuffle-btn" class="bg-tool">🔀 シャッフル</button>
        <button type="button" id="clear-btn" class="bg-tool">すべて消す</button>
      </div>
    </div>
    <button type="button" id="done-btn" class="bg-btn bg-btn-primary">完成！カードを作る</button>
    <p id="edit-err" class="bg-error" role="alert" hidden></p>
    <p class="bg-local">カードはこの端末にだけ保存されます。サーバーには送りません。</p>
  </section>

    <div class="bg-cardwrap"><canvas id="board-canvas" class="bg-canvas" width="1080" height="1350" role="img" tabindex="0"></canvas></div>
    <p class="bg-tap" id="tap-hint">目標を達成したら、カードのそのマスをタップしてスタンプ。</p>
    <div class="bg-score" id="score"><p class="bg-score-n" id="score-lines"></p><p class="bg-score-g" id="score-goals"></p></div>
    <div class="bg-actions">
      <button type="button" id="download-btn" class="bg-btn bg-btn-primary">画像を保存</button>
      <button type="button" id="link-btn" class="bg-btn bg-btn-ghost">カードのリンクをコピー</button>
      <button type="button" id="edit-btn" class="bg-btn bg-btn-ghost">目標を直す</button>
    </div>
    <p id="live" class="visually-hidden" aria-live="polite"></p>
    <div data-mg-end="bingo"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 目標ビンゴ · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
