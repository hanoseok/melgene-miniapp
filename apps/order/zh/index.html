<main class="or-shell">
  <!-- 입력 화면(첫 화면): h1·훅 → 프리셋 → 이름/번호 → 공개 방향 → 섞기 → 맨 끝 mg-ad-start 1개 -->
  <section id="screen-input" class="or-screen or-input">
    <h1 class="or-h1"><span class="or-kicker">随机排序</span><span class="or-h1-main">谁<em>先来？</em></span></h1>
    <p class="or-hook">写下名字，打乱一次，从第1名到最后一名的顺序就定好了。</p>

    <form id="or-form" class="or-form" novalidate autocomplete="off">
      <div class="or-card">
        <p class="or-label" id="preset-label">这是什么顺序？</p>
        <div class="or-chips" role="group" aria-labelledby="preset-label">
          <button type="button" class="or-chip" data-preset="0" aria-pressed="true">普通排序</button>
          <button type="button" class="or-chip" data-preset="1" aria-pressed="false">汇报顺序</button>
          <button type="button" class="or-chip" data-preset="2" aria-pressed="false">游戏顺序</button>
          <button type="button" class="or-chip" data-preset="3" aria-pressed="false">值日表</button>
        </div>
      </div>

      <div class="or-card">
        <div class="or-seg" role="group" aria-label="名字或数字">
          <button type="button" class="or-seg-btn" id="mode-names" data-mode="names" aria-pressed="true">名字</button>
          <button type="button" class="or-seg-btn" id="mode-numbers" data-mode="numbers" aria-pressed="false">数字 1–N</button>
        </div>
        <div id="names-box" class="or-names">
          <label class="or-label" for="names">名字（每行一个）</label>
          <textarea id="names" class="or-textarea" rows="7" spellcheck="false" placeholder="子轩
欣怡
浩然
雨萱" aria-describedby="names-hint"></textarea>
          <div class="or-foot">
            <p class="or-hint" id="names-hint">可以直接从微信群或表格复制粘贴，逗号、顿号也能分隔。</p>
            <button type="button" id="clear-names" class="or-mini">清空</button>
          </div>
          <p class="or-hint or-count" id="names-count" aria-live="polite"></p>
        </div>
        <div id="numbers-box" class="or-numbers" hidden>
          <div class="or-row">
            <label class="or-label" for="count">到几号？</label>
            <div class="or-stepper">
              <button type="button" id="count-dec" class="or-step" aria-label="减一">−</button>
              <input id="count" class="or-input-num" type="number" step="1" inputmode="numeric" value="8" min="2" max="40" enterkeyhint="done">
              <button type="button" id="count-inc" class="or-step" aria-label="加一">+</button>
            </div>
          </div>
          <p class="or-hint">把1到N的号码打乱，适合按学号或座位号排序。</p>
        </div>
      </div>

      <div class="or-card">
        <p class="or-label" id="from-label">揭晓方式</p>
        <div class="or-seg" role="group" aria-labelledby="from-label">
          <button type="button" class="or-seg-btn" id="from-first" data-from="first" aria-pressed="true">从第1名</button>
          <button type="button" class="or-seg-btn" id="from-last" data-from="last" aria-pressed="false">从最后</button>
        </div>
      </div>
    </form>

    <p id="error" class="or-error" role="alert" hidden></p>
    <button type="button" id="shuffle-btn" class="or-btn or-btn-primary">打乱顺序 🔀</button>
    <p class="or-fair">用加密随机数只打乱一次 · 名字不会离开你的浏览器</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 공개 화면: 번호 카드 한 장씩 (광고 없음) -->
  <section id="screen-reveal" class="or-screen or-reveal" hidden>
    <h2 class="or-h2" id="rv-heading"></h2>
    <div class="or-progress">
      <p id="rv-progress" class="or-progress-text"></p>
      <div class="or-bar" aria-hidden="true"><i id="rv-bar" class="or-bar-fill"></i></div>
    </div>
    <button type="button" id="stage" class="or-stage" aria-describedby="rv-hint">
      <span class="or-stage-card" id="stage-card">
        <span class="or-stage-num" id="stage-num">?</span>
        <span class="or-stage-name" id="stage-name"></span>
      </span>
    </button>
    <p class="or-hint or-center" id="rv-hint">点卡片或“下一个”。顺序在打乱时就已经定好了。</p>
    <p class="visually-hidden" id="rv-live" aria-live="polite"></p>
    <button type="button" id="next-btn" class="or-btn or-btn-primary">开始揭晓 ▶</button>
    <div class="or-actions or-actions-2">
      <button type="button" id="auto-btn" class="or-btn or-btn-ghost" aria-pressed="false">自动揭晓</button>
      <button type="button" id="all-btn" class="or-btn or-btn-ghost">全部显示</button>
    </div>
    <h3 class="or-h3" id="so-far-head" hidden>已揭晓</h3>
    <ol id="so-far" class="or-list or-list-small"></ol>
  </section>

  <!-- 끝 화면: 1번째 → N번째 전체 순서 → 공통 끝 화면 -->
  <section id="screen-end" class="or-screen or-end" hidden>
    <article class="or-card or-result" aria-labelledby="res-title">
      <p id="shared-badge" class="or-badge" hidden>🔢 收到的顺序</p>
      <h2 class="or-h2" id="res-title"></h2>
      <p id="shared-note" class="or-shared-note" hidden>这是保存在链接里的顺序，没有重新打乱。</p>
      <p id="summary" class="or-summary"></p>
      <ol id="list" class="or-list"></ol>
      <div class="or-actions">
        <button type="button" id="copy-btn" class="or-btn or-btn-ghost">复制为文字</button>
        <button type="button" id="link-btn" class="or-btn or-btn-ghost">复制链接</button>
        <button type="button" id="edit-btn" class="or-btn or-btn-ghost">修改名字</button>
      </div>
    </article>
    <div data-mg-end="order"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 随机排序 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
