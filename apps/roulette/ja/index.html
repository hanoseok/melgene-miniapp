<body class="rlt-body">

<header class="mg-top"><a class="mg-home" href="https://example.com/ja/" aria-label="メルジン ミニアプリのホームへ"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">ミニアプリ</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="言語を選択"><option value="../" data-hreflang="en" lang="en">English</option><option value="./" data-hreflang="ja" lang="ja" selected>日本語</option><option value="../zh/" data-hreflang="zh" lang="zh">简体中文</option><option value="../ko/" data-hreflang="ko" lang="ko">한국어</option><option value="../fr/" data-hreflang="fr" lang="fr">Français</option><option value="../de/" data-hreflang="de" lang="de">Deutsch</option><option value="../th/" data-hreflang="th" lang="th">ไทย</option><option value="../vi/" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="../es/" data-hreflang="es" lang="es">Español</option><option value="../it/" data-hreflang="it" lang="it">Italiano</option><option value="../pt/" data-hreflang="pt" lang="pt">Português</option><option value="../ru/" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="言語を選択"><a href="../" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="../ko/" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>
<div class="rlt-shell">
  <main class="rlt-main">
    <section class="rlt-play" aria-labelledby="rlt-title">
      <header class="rlt-head">
        <h1 id="rlt-title" class="rlt-sign" style="--em:5">ルーレット</h1>
        <p class="rlt-tagline">迷ったら、書いて回すだけ。</p>
      </header>

      <div class="rlt-stage" id="stage">
        <canvas id="rim" class="rlt-rim" aria-hidden="true"></canvas>
        <div class="rlt-disc" id="disc">
          <canvas id="wheel" class="rlt-wheel" role="img" aria-label="ルーレット"></canvas>
          <div class="rlt-gloss" aria-hidden="true"></div>
        </div>
        <div class="rlt-pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs><linearGradient id="rpb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6E93"/><stop offset=".5" stop-color="#E8285A"/><stop offset="1" stop-color="#A70E38"/></linearGradient><linearGradient id="rpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEFB8"/><stop offset=".5" stop-color="#F4B63F"/><stop offset="1" stop-color="#A9660F"/></linearGradient><radialGradient id="rpj" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#F6C04F"/><stop offset="1" stop-color="#9A5F12"/></radialGradient></defs><path d="M30 77 C25 64 12 46 12 29 A18 18 0 1 1 48 29 C48 46 35 64 30 77 Z" fill="url(#rpb)" stroke="url(#rpg)" stroke-width="3.2" stroke-linejoin="round"/><path d="M19 22 A13 13 0 0 1 33 13" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3.2" stroke-linecap="round"/><circle cx="30" cy="27" r="7.5" fill="url(#rpj)" stroke="rgba(120,60,8,.55)" stroke-width="1"/></svg></div>
        <button type="button" class="rlt-hub" id="spin-btn" aria-label="ルーレットを回す" style="--em:4"><span>スタート</span></button>
      </div>

      <div class="rlt-tools">
        <button type="button" id="sound-btn" class="rlt-pill" aria-pressed="false"><span class="rlt-pill-icon" aria-hidden="true">🔈</span><span id="sound-label">効果音オフ</span></button>
      </div>
      <p class="rlt-fair">スタートを押した瞬間に結果が先にランダムで決まり、ルーレットはそのマスに止まるように回るだけです。</p>
      <p id="live" class="visually-hidden" aria-live="polite"></p>

      <section id="history" class="rlt-history" aria-labelledby="history-title" hidden>
        <div class="rlt-history-head">
          <h2 id="history-title">回した記録</h2>
          <button type="button" id="history-clear" class="rlt-text-btn">記録を消す</button>
        </div>
        <ol id="history-list" class="rlt-history-list" reversed></ol>
        <div data-mg-end="roulette"></div>
      </section>
    </section>

    <section class="rlt-editor" aria-labelledby="editor-title">
      <fieldset id="editor" class="rlt-card">
        <legend class="visually-hidden">項目</legend>
        <div class="rlt-card-head">
          <h2 id="editor-title">項目</h2>
          <span id="item-count" class="rlt-count"></span>
        </div>
        <div class="rlt-presets" role="group" aria-label="かんたん作成">
          <button type="button" class="rlt-chip" data-preset="lunch"><span class="rlt-chip-icon" aria-hidden="true">🍱</span>ランチ</button>
          <button type="button" class="rlt-chip" data-preset="dare"><span class="rlt-chip-icon" aria-hidden="true">🎤</span>罰ゲーム</button>
          <button type="button" class="rlt-chip" data-preset="duty"><span class="rlt-chip-icon" aria-hidden="true">🙋</span>当番</button>
          <button type="button" class="rlt-chip" data-preset="yesno"><span class="rlt-chip-icon" aria-hidden="true">👍</span>はい/いいえ</button>
          <button type="button" class="rlt-chip" data-preset="numbers"><span class="rlt-chip-icon" aria-hidden="true">🔢</span>数字1〜10</button>
        </div>
        <ol id="item-list" class="rlt-items"></ol>
        <div class="rlt-list-actions">
          <button type="button" id="add-btn" class="rlt-soft-btn"><span aria-hidden="true">＋</span> 項目を追加</button>
          <button type="button" id="shuffle-btn" class="rlt-soft-btn"><span aria-hidden="true">🔀</span> シャッフル</button>
        </div>
        <button type="button" id="restore-btn" class="rlt-text-btn rlt-restore" hidden></button>

        <div class="rlt-option">
          <label class="rlt-switch">
            <input type="checkbox" id="weighted-toggle" aria-describedby="weighted-hint">
            <span class="rlt-switch-track" aria-hidden="true"></span>
            <span class="rlt-switch-text">確率を調整</span>
          </label>
          <p class="rlt-hint" id="weighted-hint">数字が大きいほどマスが広く、当たりやすくなります。</p>
        </div>

        <div class="rlt-option">
          <p class="rlt-option-label" id="theme-label">カラー</p>
          <div class="rlt-themes" role="group" aria-labelledby="theme-label">
          <button type="button" class="rlt-theme" data-theme="candy" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#FF4D7D 0.00% 16.67%, #FF9F43 16.67% 33.33%, #FFD84D 33.33% 50.00%, #3ED6B0 50.00% 66.67%, #4DB8FF 66.67% 83.33%, #9C6BFF 83.33% 100.00%)"></span><span class="rlt-theme-name">キャンディ</span></button>
          <button type="button" class="rlt-theme" data-theme="macaron" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#FFB0C4 0.00% 16.67%, #FFD3A3 16.67% 33.33%, #FBEA9A 33.33% 50.00%, #BDEDB5 50.00% 66.67%, #A6E3EE 66.67% 83.33%, #B3C5FF 83.33% 100.00%)"></span><span class="rlt-theme-name">マカロン</span></button>
          <button type="button" class="rlt-theme" data-theme="circus" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#E2334B 0.00% 16.67%, #FFF4E4 16.67% 33.33%, #24357F 33.33% 50.00%, #F4B63F 50.00% 66.67%, #FFF4E4 66.67% 83.33%, #1F9E8A 83.33% 100.00%)"></span><span class="rlt-theme-name">サーカス</span></button>
          <button type="button" class="rlt-theme" data-theme="jewel" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#C8184A 0.00% 16.67%, #F2A516 16.67% 33.33%, #0F9D74 33.33% 50.00%, #2D5BD8 50.00% 66.67%, #7B3FE4 66.67% 83.33%, #E0457B 83.33% 100.00%)"></span><span class="rlt-theme-name">ジュエル</span></button>
          </div>
        </div>
      </fieldset>
    </section>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> ルーレット · <a href="privacy.html">プライバシーポリシー</a>
  </footer>
</div>

<div id="result" class="rlt-modal" role="dialog" aria-modal="true" aria-labelledby="result-kicker" aria-describedby="result-label" hidden>
  <div class="rlt-modal-backdrop" data-close></div>
  <div class="rlt-modal-card" id="result-card">
    <p class="rlt-modal-kicker" id="result-kicker">ルーレットの結果は</p>
    <p class="rlt-modal-label" id="result-label"></p>
    <div class="rlt-modal-actions">
      <button type="button" id="again-btn" class="rlt-btn">もう一回</button>
      <button type="button" id="remove-btn" class="rlt-soft-btn">当たりを外してもう一回</button>
      <button type="button" id="close-btn" class="rlt-text-btn" data-close>閉じる</button>
    </div>
  </div>
</div>
<canvas id="confetti" class="rlt-confetti" aria-hidden="true"></canvas>

<script>window.MG_FAQ = [{"q":"ルーレットの結果を操作できますか？","a":"できません。結果はスタートを押した瞬間に暗号論的乱数で先に決まり、ルーレットはその結果に合わせて止まるだけです。押すタイミングや回転の見た目で結果は変わりません。"},{"q":"確率の調整（重み）はどう計算されますか？","a":"各項目の重み（1〜5）を全部足した数のうち、その項目が占める割合が当たる確率です。重みが2・1・1なら最初の項目は50%、残りは25%ずつです。"},{"q":"項目はいくつまで入れられますか？","a":"2個から16個までです。項目名は24文字まで入力でき、マスが狭いときは文字を小さくしたり省略記号（…）で表示したりします。"},{"q":"作ったルーレットを友達に送れますか？","a":"はい。「シェア」を押すと、項目・重み・カラーがURLに入ったリンクができます。サーバー保存なしでリンクだけで同じルーレットを回せます。"},{"q":"アプリのインストールや登録は必要ですか？","a":"必要ありません。スマホ・タブレット・パソコンのブラウザでそのまま使える無料のオンラインルーレットです。"}];</script>
