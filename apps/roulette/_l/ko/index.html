<div class="rlt-shell">
  <main class="rlt-main">
    <section class="rlt-play" aria-labelledby="rlt-title">
      <header class="rlt-head">
        <h1 id="rlt-title" class="rlt-sign" style="--em:3">돌림판</h1>
        <p class="rlt-tagline">뭘 고를지 모르겠으면, 적고 돌려요.</p>
      </header>

      <div class="rlt-stage" id="stage">
        <canvas id="rim" class="rlt-rim" aria-hidden="true"></canvas>
        <div class="rlt-disc" id="disc">
          <canvas id="wheel" class="rlt-wheel" role="img" aria-label="돌림판"></canvas>
          <div class="rlt-gloss" aria-hidden="true"></div>
        </div>
        <div class="rlt-pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs><linearGradient id="rpb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6E93"/><stop offset=".5" stop-color="#E8285A"/><stop offset="1" stop-color="#A70E38"/></linearGradient><linearGradient id="rpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEFB8"/><stop offset=".5" stop-color="#F4B63F"/><stop offset="1" stop-color="#A9660F"/></linearGradient><radialGradient id="rpj" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".45" stop-color="#F6C04F"/><stop offset="1" stop-color="#9A5F12"/></radialGradient></defs><path d="M30 77 C25 64 12 46 12 29 A18 18 0 1 1 48 29 C48 46 35 64 30 77 Z" fill="url(#rpb)" stroke="url(#rpg)" stroke-width="3.2" stroke-linejoin="round"/><path d="M19 22 A13 13 0 0 1 33 13" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3.2" stroke-linecap="round"/><circle cx="30" cy="27" r="7.5" fill="url(#rpj)" stroke="rgba(120,60,8,.55)" stroke-width="1"/></svg></div>
        <button type="button" class="rlt-hub" id="spin-btn" aria-label="돌림판 돌리기" style="--em:2.4"><span>돌려!</span></button>
      </div>

      <div class="rlt-tools">
        <button type="button" id="sound-btn" class="rlt-pill" aria-pressed="false"><span class="rlt-pill-icon" aria-hidden="true">🔈</span><span id="sound-label">소리 꺼짐</span></button>
      </div>
      <p class="rlt-fair">돌리기를 누르는 순간 결과가 먼저 무작위로 정해지고, 휠은 그 칸에 멈추도록 돌아갈 뿐이에요.</p>
      <p id="live" class="visually-hidden" aria-live="polite"></p>

      <section id="history" class="rlt-history" aria-labelledby="history-title" hidden>
        <div class="rlt-history-head">
          <h2 id="history-title">돌린 기록</h2>
          <button type="button" id="history-clear" class="rlt-text-btn">기록 지우기</button>
        </div>
        <ol id="history-list" class="rlt-history-list" reversed></ol>
        <div data-mg-end="roulette"></div>
      </section>
    </section>

    <section class="rlt-editor" aria-labelledby="editor-title">
      <fieldset id="editor" class="rlt-card">
        <legend class="visually-hidden">항목</legend>
        <div class="rlt-card-head">
          <h2 id="editor-title">항목</h2>
          <span id="item-count" class="rlt-count"></span>
        </div>
        <div class="rlt-presets" role="group" aria-label="빠른 선택">
          <button type="button" class="rlt-chip" data-preset="lunch"><span class="rlt-chip-icon" aria-hidden="true">🍜</span>점심 메뉴</button>
          <button type="button" class="rlt-chip" data-preset="dare"><span class="rlt-chip-icon" aria-hidden="true">🎤</span>벌칙</button>
          <button type="button" class="rlt-chip" data-preset="duty"><span class="rlt-chip-icon" aria-hidden="true">🙋</span>당번</button>
          <button type="button" class="rlt-chip" data-preset="yesno"><span class="rlt-chip-icon" aria-hidden="true">👍</span>예/아니오</button>
          <button type="button" class="rlt-chip" data-preset="numbers"><span class="rlt-chip-icon" aria-hidden="true">🔢</span>숫자 1~10</button>
        </div>
        <ol id="item-list" class="rlt-items"></ol>
        <div class="rlt-list-actions">
          <button type="button" id="add-btn" class="rlt-soft-btn"><span aria-hidden="true">＋</span> 항목 추가</button>
          <button type="button" id="shuffle-btn" class="rlt-soft-btn"><span aria-hidden="true">🔀</span> 섞기</button>
        </div>
        <button type="button" id="restore-btn" class="rlt-text-btn rlt-restore" hidden></button>

        <div class="rlt-option">
          <label class="rlt-switch">
            <input type="checkbox" id="weighted-toggle" aria-describedby="weighted-hint">
            <span class="rlt-switch-track" aria-hidden="true"></span>
            <span class="rlt-switch-text">확률 조절</span>
          </label>
          <p class="rlt-hint" id="weighted-hint">숫자가 클수록 칸이 넓어지고 더 자주 나와요.</p>
        </div>

        <div class="rlt-option">
          <p class="rlt-option-label" id="theme-label">색 테마</p>
          <div class="rlt-themes" role="group" aria-labelledby="theme-label">
          <button type="button" class="rlt-theme" data-theme="candy" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#FF4D7D 0.00% 16.67%, #FF9F43 16.67% 33.33%, #FFD84D 33.33% 50.00%, #3ED6B0 50.00% 66.67%, #4DB8FF 66.67% 83.33%, #9C6BFF 83.33% 100.00%)"></span><span class="rlt-theme-name">캔디</span></button>
          <button type="button" class="rlt-theme" data-theme="macaron" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#FFB0C4 0.00% 16.67%, #FFD3A3 16.67% 33.33%, #FBEA9A 33.33% 50.00%, #BDEDB5 50.00% 66.67%, #A6E3EE 66.67% 83.33%, #B3C5FF 83.33% 100.00%)"></span><span class="rlt-theme-name">마카롱</span></button>
          <button type="button" class="rlt-theme" data-theme="circus" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#E2334B 0.00% 16.67%, #FFF4E4 16.67% 33.33%, #24357F 33.33% 50.00%, #F4B63F 50.00% 66.67%, #FFF4E4 66.67% 83.33%, #1F9E8A 83.33% 100.00%)"></span><span class="rlt-theme-name">서커스</span></button>
          <button type="button" class="rlt-theme" data-theme="jewel" aria-pressed="false"><span class="rlt-theme-swatch" style="background:conic-gradient(#C8184A 0.00% 16.67%, #F2A516 16.67% 33.33%, #0F9D74 33.33% 50.00%, #2D5BD8 50.00% 66.67%, #7B3FE4 66.67% 83.33%, #E0457B 83.33% 100.00%)"></span><span class="rlt-theme-name">보석</span></button>
          </div>
        </div>
      </fieldset>
    </section>
    <!-- 첫 화면 맨 아래 광고(규칙 2026-10-02). 첫 스핀 뒤 기록(끝 화면, 광고 포함)이 보이면 style.css 가 숨긴다 -->
    <div class="mg-ad mg-ad-start"></div>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> 돌림판 · <a href="privacy.html">개인정보처리방침</a>
  </footer>
</div>

  <div class="rlt-modal-card" id="result-card">
    <p class="rlt-modal-kicker" id="result-kicker">돌림판이 고른 건</p>
    <p class="rlt-modal-label" id="result-label"></p>
    <div class="rlt-modal-actions">
      <button type="button" id="again-btn" class="rlt-btn">다시 돌리기</button>
      <button type="button" id="remove-btn" class="rlt-soft-btn">이 항목 빼고 다시 돌리기</button>
      <button type="button" id="close-btn" class="rlt-text-btn" data-close>닫기</button>
    </div>
  </div>
</div>
