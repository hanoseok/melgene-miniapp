      </div>
    </div>
    <p class="am-how">点中中间的靶子开始 · 点到靶外算失误</p>
    <button id="start-btn" class="am-btn am-btn-primary" type="button">开始瞄准训练 →</button>

  <!-- 게임 화면: HUD(시간·맞힘·정확도) + 플레이 영역 (광고 없음). 가운데 시작 과녁을 맞히면 시작 -->

      <div class="am-hud-box"><span class="am-hud-k">时间</span><span id="hud-time" class="am-hud-v">0.0</span></div>

    </div>
    <p id="play-note" class="am-note" aria-live="polite" hidden></p>
    <button id="change-btn" class="am-link" type="button">← 更换模式</button>

  <!-- 끝 화면: 결과 카드 → 공통 끝 화면 -->

      <p id="res-newbest" class="am-newbest" hidden>刷新个人纪录！</p>
      <p id="res-pb" class="am-pb"></p>

      </div>
    </article>
