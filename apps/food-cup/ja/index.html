<script>window.MG_FAQ = [{"q":"食べ物トーナメントの遊び方は？","a":"16品の料理がランダムなトーナメント表に並びます。1試合に2品が出るので、食べたい方をタップ。1回戦・準々決勝・準決勝・決勝の15回を選ぶと、最後に残った料理があなたの優勝グルメです。"},{"q":"選択率の％は本物ですか？","a":"はい。選択は名前なしの合計だけがサーバーに記録され、同じ対戦はブラウザごとに1回だけ数えます。その対戦を選んだ人が十分に集まったときだけ％を表示し、それまでは作った数字ではなく何も表示しません。"},{"q":"もう一度遊んだり結果をシェアできますか？","a":"何回でも遊べます。毎回トーナメント表が新しく混ざるので対戦も変わります。シェアボタンで優勝グルメを友だちに送って、何を選ぶか比べてみてください。"},{"q":"なぜこの16品なのですか？","a":"屋台の味から家庭の味まで、世界中で愛されている料理を選びました。名前は日本でよく呼ばれる言い方で表示していますが、料理はどの国でも同じなので、選択率は世界中のプレイヤーの合計です。"}];</script>
