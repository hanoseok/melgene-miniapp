  <section id="screen-start" class="fc-screen fc-start">
    <p class="fc-badge">🍽️ 이상형 월드컵 · 음식 편</p>
    <div class="fc-hero" aria-hidden="true">
      <span class="fc-hero-plate is-l">?</span>
      <span class="fc-vs fc-hero-vs">VS</span>
      <span class="fc-hero-plate is-r">?</span>
      <span class="fc-hero-cup">🏆</span>
    </div>
    <h1 class="fc-h1"><span class="fc-kicker">음식 월드컵</span><span class="fc-h1-main">끝까지 남는<br><em>최애 음식</em>은?</span></h1>
    <p class="fc-hook">둘 중 더 먹고 싶은 걸 골라요. 마지막까지 살아남는 게 내 최애 음식!</p>
    <button id="start-btn" class="fc-btn fc-btn-primary" type="button">월드컵 시작 →</button>
    <p class="fc-facts">음식 16개 · 15번 선택 · 1분</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 경기 화면 (진행 중 화면의 광고 1자리: 카드 아래) -->

    <div class="fc-board">
      <p id="round-label" class="fc-round"></p>
      <div id="progress" class="fc-progress" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0"><span id="progress-bar" class="fc-progress-bar"></span></div>
    </div>
    <p class="fc-hint">더 먹고 싶은 쪽을 눌러요</p>
    <div id="arena" class="fc-arena">
      <button type="button" class="fc-card" id="card-a" data-side="0">
        <span class="fc-plate"><span class="fc-emoji" aria-hidden="true"></span></span>
        <span class="fc-name"></span>
      </button>
      <span class="fc-vs fc-arena-vs" aria-hidden="true">VS</span>
      <button type="button" class="fc-card" id="card-b" data-side="1">
        <span class="fc-plate"><span class="fc-emoji" aria-hidden="true"></span></span>
        <span class="fc-name"></span>
      </button>
    </div>
    <p id="pick-stat" class="fc-stat" aria-live="polite"></p>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 우승 음식 + 나의 4강(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="fc-screen fc-end" hidden>
    <article class="fc-champ" aria-labelledby="champ-name">
      <p class="fc-eyebrow"><span aria-hidden="true">🏆</span> 나의 최애 음식</p>
      <div class="fc-champ-plate"><span id="champ-emoji" class="fc-champ-emoji" aria-hidden="true"></span></div>
      <h2 id="champ-name" class="fc-champ-name"></h2>
      <p id="champ-stat" class="fc-champ-stat" hidden></p>
      <h3 class="fc-four-title">나의 4강</h3>
      <ul id="four" class="fc-four"></ul>
    </article>
    <div data-mg-end="food-cup"></div>
  </section>

    © <span id="year"></span> 음식 월드컵 · <a href="privacy.html">개인정보처리방침</a>

<script>window.MG_FAQ = [{"q":"음식 월드컵은 어떻게 하나요?","a":"음식 16개가 무작위 대진표로 섞여요. 한 경기에 두 음식이 나오면 더 먹고 싶은 쪽을 누르세요. 16강·8강·준결승·결승까지 15번 고르면 마지막에 남은 음식이 나의 최애 음식이에요."},{"q":"선택률 %는 진짜인가요?","a":"네. 모든 선택은 이름 없이 서버에 합계로만 쌓이고, 같은 대결은 브라우저마다 한 번만 세요. 그 대결을 한 사람이 충분히 모였을 때만 %가 보이고, 그 전에는 지어낸 숫자 대신 아무것도 보여주지 않아요."},{"q":"다시 하거나 결과를 공유할 수 있나요?","a":"몇 번이든 다시 할 수 있어요. 할 때마다 대진표가 새로 섞여서 대결이 달라져요. 공유 버튼으로 내 최애 음식을 친구에게 보내고 친구는 뭘 고르는지 비교해 보세요."},{"q":"왜 이 16가지 음식인가요?","a":"길거리 음식부터 집밥까지 세계 어디서나 사랑받는 음식들이에요. 이름은 한국에서 부르는 말로 보여주지만 음식은 모든 나라가 같아서, 선택률은 여러 나라 사람들의 선택을 합친 값이에요."}];</script>
