<main class="ny-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="ny-screen ny-start">
    <p class="ny-badge">🎆 안녕, 2027</p>
    <div class="ny-hero" aria-hidden="true"><span class="ny-hero-main">🐐</span><span class="ny-hero-star">🎍</span><span class="ny-hero-gift">🧧</span><span class="ny-hero-snow">🎆</span><span class="ny-hero-card">💌</span><span class="ny-hero-year">2027</span></div>
    <h1 class="ny-h1"><span class="ny-kicker">2027 연하장 만들기</span><span class="ny-h1-main">새해 첫 인사를<br><em>카드 한 장</em>으로</span></h1>
    <p class="ny-hook">디자인을 고르고 덕담 한 줄 적으면, 봉투처럼 열리는 연하장이 완성돼요.</p>
    <button id="start-btn" class="ny-btn ny-btn-primary" type="button">연하장 만들기 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="ny-screen ny-edit" hidden>
    <h2 class="ny-edit-title">연하장 꾸미기</h2>
    <div id="themes" class="ny-chips" role="radiogroup" aria-label="카드 디자인">
      <button type="button" class="ny-chip ny-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="ny-chip-emoji" aria-hidden="true">🧧</span><span class="ny-chip-name">홍색 금박</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="1" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎍</span><span class="ny-chip-name">한지 느낌</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="2" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🐐</span><span class="ny-chip-name">귀여운 양</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="3" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🌅</span><span class="ny-chip-name">미니멀</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="4" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">❄️</span><span class="ny-chip-name">눈 오는 밤</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="5" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎆</span><span class="ny-chip-name">불꽃놀이</span></button>
    </div>
    <div class="ny-preview"><canvas id="preview-canvas" class="ny-canvas" width="1080" height="1350" role="img" aria-label="연하장 미리보기"></canvas></div>
    <p class="ny-label" id="greet-label">인사말</p>
    <div id="greetings" class="ny-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="ny-greet is-on" role="radio" data-g="0" aria-checked="true">새해 복 많이 받으세요</button>
      <button type="button" class="ny-greet" role="radio" data-g="1" aria-checked="false">근하신년</button>
      <button type="button" class="ny-greet" role="radio" data-g="2" aria-checked="false">행복 가득한 새해 되세요</button>
      <button type="button" class="ny-greet" role="radio" data-g="3" aria-checked="false">2027년 새해 인사드립니다</button>
    </div>
    <p class="ny-label" id="deco-label">꾸미기</p>
    <div id="decos" class="ny-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="ny-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">🐐</span> 양띠 배지</button>
      <button type="button" class="ny-deco is-on" data-bit="2" aria-pressed="true"><span aria-hidden="true">🗓️</span> 2027</button>
      <button type="button" class="ny-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> 반짝이</button>
    </div>
    <div class="ny-row">
      <label class="ny-field" for="f-to"><span class="ny-label">받는 사람</span>
        <input id="f-to" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 이모">
      </label>
      <label class="ny-field" for="f-from"><span class="ny-label">보내는 사람</span>
        <input id="f-from" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 지민">
      </label>
    </div>
    <div class="ny-field">
      <div class="ny-msg-head"><label class="ny-label" for="f-msg">덕담 한마디</label><button id="idea-btn" class="ny-idea" type="button">💡 문구 추천</button></div>
      <textarea id="f-msg" class="ny-input ny-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="새해 덕담을 적어 보세요…"></textarea>
      <p id="msg-count" class="ny-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="ny-btn ny-btn-primary" type="button">연하장 완성하기</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="ny-screen ny-open" hidden>
    <p class="ny-open-eyebrow">연하장이 도착했어요</p>
    <p id="open-from" class="ny-open-from"></p>
    <button id="open-btn" class="ny-env" type="button" aria-label="연하장 열어 보기">
      <span class="ny-env-back" aria-hidden="true"></span>
      <span class="ny-env-letter" aria-hidden="true">🐐</span>
      <span class="ny-env-front" aria-hidden="true"></span>
      <span class="ny-env-flap" aria-hidden="true"></span>
      <span class="ny-env-seal" aria-hidden="true">🌸</span>
    </button>
    <button id="open-cta" class="ny-btn ny-btn-primary" type="button">연하장 열어 보기</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="ny-screen ny-end" hidden>
    <article class="ny-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="ny-eyebrow"></p>
      <h2 id="end-title" class="ny-sr"></h2>
      <canvas id="end-canvas" class="ny-canvas ny-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="ny-end-actions">
        <button id="save-btn" class="ny-btn ny-btn-primary ny-btn-sm" type="button"><span aria-hidden="true">📥</span> 이미지 저장</button>
        <button id="copy-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">📋</span> 텍스트 복사</button>
        <button id="edit-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">✏️</span> 고치기</button>
      </div>
      <p id="save-status" class="ny-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="nycard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 2027 연하장 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
