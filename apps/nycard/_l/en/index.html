<body class="ny-body">
<header class="mg-top"><a class="mg-home" href="https://example.com/" aria-label="Melgene Apps home"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">Apps</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="Language"><option value="en" data-hreflang="en" lang="en" selected>English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="Language"><a href="./" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="./" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="./" hreflang="fr" lang="fr">Français</a> <a href="./" hreflang="de" lang="de">Deutsch</a> <a href="./" hreflang="th" lang="th">ไทย</a> <a href="./" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="./" hreflang="es" lang="es">Español</a> <a href="./" hreflang="it" lang="it">Italiano</a> <a href="./" hreflang="pt" lang="pt">Português</a> <a href="./" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="ny-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="ny-screen ny-start">
    <p class="ny-badge">🎆 Hello, 2027</p>
    <div class="ny-hero" aria-hidden="true"><span class="ny-hero-main">🐐</span><span class="ny-hero-star">🎍</span><span class="ny-hero-gift">🧧</span><span class="ny-hero-snow">🎆</span><span class="ny-hero-card">💌</span><span class="ny-hero-year">2027</span></div>
    <h1 class="ny-h1"><span class="ny-kicker">New Year card maker 2027</span><span class="ny-h1-main">Start the year<br>with <em>kind words</em></span></h1>
    <p class="ny-hook">Pick a design, write a short wish and send a card that opens like a real envelope.</p>
    <button id="start-btn" class="ny-btn ny-btn-primary" type="button">Make my card →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="ny-screen ny-edit" hidden>
    <h2 class="ny-edit-title">Design your card</h2>
    <div id="themes" class="ny-chips" role="radiogroup" aria-label="Card designs">
      <button type="button" class="ny-chip ny-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="ny-chip-emoji" aria-hidden="true">🧧</span><span class="ny-chip-name">Red &amp; gold</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="1" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎍</span><span class="ny-chip-name">Washi paper</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="2" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🐐</span><span class="ny-chip-name">Cute goat</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="3" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🌅</span><span class="ny-chip-name">Minimal</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="4" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">❄️</span><span class="ny-chip-name">Snowy night</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="5" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎆</span><span class="ny-chip-name">Fireworks</span></button>
    </div>
    <div class="ny-preview"><canvas id="preview-canvas" class="ny-canvas" width="1080" height="1350" role="img" aria-label="Preview of your card"></canvas></div>
    <p class="ny-label" id="greet-label">Greeting</p>
    <div id="greetings" class="ny-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="ny-greet is-on" role="radio" data-g="0" aria-checked="true">Happy New Year!</button>
      <button type="button" class="ny-greet" role="radio" data-g="1" aria-checked="false">Warmest Wishes for the New Year</button>
      <button type="button" class="ny-greet" role="radio" data-g="2" aria-checked="false">Wishing You Joy &amp; Good Luck</button>
      <button type="button" class="ny-greet" role="radio" data-g="3" aria-checked="false">Cheers to 2027!</button>
    </div>
    <p class="ny-label" id="deco-label">Extras</p>
    <div id="decos" class="ny-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="ny-deco" data-bit="1" aria-pressed="false"><span aria-hidden="true">🐐</span> Goat year</button>
      <button type="button" class="ny-deco is-on" data-bit="2" aria-pressed="true"><span aria-hidden="true">🗓️</span> 2027</button>
      <button type="button" class="ny-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> Sparkle</button>
    </div>
    <div class="ny-row">
      <label class="ny-field" for="f-to"><span class="ny-label">To</span>
        <input id="f-to" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Aunt May">
      </label>
      <label class="ny-field" for="f-from"><span class="ny-label">From</span>
        <input id="f-from" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Sam">
      </label>
    </div>
    <div class="ny-field">
      <div class="ny-msg-head"><label class="ny-label" for="f-msg">Your message</label><button id="idea-btn" class="ny-idea" type="button">💡 Ideas</button></div>
      <textarea id="f-msg" class="ny-input ny-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="Write a short wish for the year…"></textarea>
      <p id="msg-count" class="ny-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="ny-btn ny-btn-primary" type="button">Finish my card</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="ny-screen ny-open" hidden>
    <p class="ny-open-eyebrow">You’ve got a New Year card</p>
    <p id="open-from" class="ny-open-from"></p>
    <button id="open-btn" class="ny-env" type="button" aria-label="Open the card">
      <span class="ny-env-back" aria-hidden="true"></span>
      <span class="ny-env-letter" aria-hidden="true">🐐</span>
      <span class="ny-env-front" aria-hidden="true"></span>
      <span class="ny-env-flap" aria-hidden="true"></span>
      <span class="ny-env-seal" aria-hidden="true">🌸</span>
    </button>
    <button id="open-cta" class="ny-btn ny-btn-primary" type="button">Open the card</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="ny-screen ny-end" hidden>
    <article class="ny-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="ny-eyebrow"></p>
      <h2 id="end-title" class="ny-sr"></h2>
      <canvas id="end-canvas" class="ny-canvas ny-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="ny-end-actions">
        <button id="save-btn" class="ny-btn ny-btn-primary ny-btn-sm" type="button"><span aria-hidden="true">📥</span> Save image</button>
        <button id="copy-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">📋</span> Copy text</button>
        <button id="edit-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">✏️</span> Edit</button>
      </div>
      <p id="save-status" class="ny-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="nycard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> New Year Card Maker · <a href="privacy.html">Privacy Policy</a> · <a href="guide.html">Guide</a>
  </footer>
</main>
