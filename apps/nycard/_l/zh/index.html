<main class="ny-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="ny-screen ny-start">
    <p class="ny-badge">🧧 你好，2027</p>
    <div class="ny-hero" aria-hidden="true"><span class="ny-hero-main">🐐</span><span class="ny-hero-star">🎍</span><span class="ny-hero-gift">🧧</span><span class="ny-hero-snow">🎆</span><span class="ny-hero-card">💌</span><span class="ny-hero-year">2027</span></div>
    <h1 class="ny-h1"><span class="ny-kicker">2027 新年贺卡制作</span><span class="ny-h1-main">新年第一句祝福<br>写进<em>一张贺卡</em></span></h1>
    <p class="ny-hook">选个样式，写一句祝福，就能送出一张像真信封一样打开的贺卡。</p>
    <button id="start-btn" class="ny-btn ny-btn-primary" type="button">开始做贺卡 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="ny-screen ny-edit" hidden>
    <h2 class="ny-edit-title">设计你的贺卡</h2>
    <div id="themes" class="ny-chips" role="radiogroup" aria-label="贺卡样式">
      <button type="button" class="ny-chip ny-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="ny-chip-emoji" aria-hidden="true">🧧</span><span class="ny-chip-name">红金喜庆</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="1" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎍</span><span class="ny-chip-name">和纸风</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="2" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🐐</span><span class="ny-chip-name">萌萌小羊</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="3" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🌅</span><span class="ny-chip-name">简约</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="4" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">❄️</span><span class="ny-chip-name">雪夜</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="5" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎆</span><span class="ny-chip-name">烟花</span></button>
    </div>
    <div class="ny-preview"><canvas id="preview-canvas" class="ny-canvas" width="1080" height="1350" role="img" aria-label="贺卡预览"></canvas></div>
    <p class="ny-label" id="greet-label">祝福语</p>
    <div id="greetings" class="ny-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="ny-greet is-on" role="radio" data-g="0" aria-checked="true">新年快乐</button>
      <button type="button" class="ny-greet" role="radio" data-g="1" aria-checked="false">恭贺新禧</button>
      <button type="button" class="ny-greet" role="radio" data-g="2" aria-checked="false">万事如意</button>
      <button type="button" class="ny-greet" role="radio" data-g="3" aria-checked="false">羊年大吉</button>
    </div>
    <p class="ny-label" id="deco-label">装饰</p>
    <div id="decos" class="ny-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="ny-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">🐐</span> 羊年徽章</button>
      <button type="button" class="ny-deco is-on" data-bit="2" aria-pressed="true"><span aria-hidden="true">🗓️</span> 2027</button>
      <button type="button" class="ny-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> 闪光</button>
    </div>
    <div class="ny-row">
      <label class="ny-field" for="f-to"><span class="ny-label">收件人</span>
        <input id="f-to" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：姥姥">
      </label>
      <label class="ny-field" for="f-from"><span class="ny-label">署名</span>
        <input id="f-from" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：小雨">
      </label>
    </div>
    <div class="ny-field">
      <div class="ny-msg-head"><label class="ny-label" for="f-msg">祝福的话</label><button id="idea-btn" class="ny-idea" type="button">💡 推荐文案</button></div>
      <textarea id="f-msg" class="ny-input ny-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="写一句新年祝福…"></textarea>
      <p id="msg-count" class="ny-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="ny-btn ny-btn-primary" type="button">完成贺卡</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="ny-screen ny-open" hidden>
    <p class="ny-open-eyebrow">你收到了一张新年贺卡</p>
    <p id="open-from" class="ny-open-from"></p>
    <button id="open-btn" class="ny-env" type="button" aria-label="打开贺卡">
      <span class="ny-env-back" aria-hidden="true"></span>
      <span class="ny-env-letter" aria-hidden="true">🐐</span>
      <span class="ny-env-front" aria-hidden="true"></span>
      <span class="ny-env-flap" aria-hidden="true"></span>
      <span class="ny-env-seal" aria-hidden="true">🌸</span>
    </button>
    <button id="open-cta" class="ny-btn ny-btn-primary" type="button">打开贺卡</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="ny-screen ny-end" hidden>
    <article class="ny-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="ny-eyebrow"></p>
      <h2 id="end-title" class="ny-sr"></h2>
      <canvas id="end-canvas" class="ny-canvas ny-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="ny-end-actions">
        <button id="save-btn" class="ny-btn ny-btn-primary ny-btn-sm" type="button"><span aria-hidden="true">📥</span> 保存图片</button>
        <button id="copy-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">📋</span> 复制文字</button>
        <button id="edit-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">✏️</span> 修改</button>
      </div>
      <p id="save-status" class="ny-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="nycard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 2027 新年贺卡 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
