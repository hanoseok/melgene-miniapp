<main class="ny-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="ny-screen ny-start">
    <p class="ny-badge">🎆 สวัสดี 2027</p>
    <div class="ny-hero" aria-hidden="true"><span class="ny-hero-main">🐐</span><span class="ny-hero-star">🎍</span><span class="ny-hero-gift">🧧</span><span class="ny-hero-snow">🎆</span><span class="ny-hero-card">💌</span><span class="ny-hero-year">2027</span></div>
    <h1 class="ny-h1"><span class="ny-kicker">ทำการ์ดปีใหม่ 2027</span><span class="ny-h1-main">เริ่มปีใหม่<br>ด้วย<em>คำอวยพรดี ๆ</em></span></h1>
    <p class="ny-hook">เลือกแบบ เขียนคำอวยพรสั้น ๆ แล้วส่งการ์ดที่เปิดออกมาเหมือนซองจดหมายจริง</p>
    <button id="start-btn" class="ny-btn ny-btn-primary" type="button">ทำการ์ดเลย →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="ny-screen ny-edit" hidden>
    <h2 class="ny-edit-title">ตกแต่งการ์ดของคุณ</h2>
    <div id="themes" class="ny-chips" role="radiogroup" aria-label="แบบการ์ด">
      <button type="button" class="ny-chip ny-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="ny-chip-emoji" aria-hidden="true">🧧</span><span class="ny-chip-name">แดงทอง</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="1" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎍</span><span class="ny-chip-name">กระดาษญี่ปุ่น</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="2" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🐐</span><span class="ny-chip-name">แพะน้อย</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="3" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🌅</span><span class="ny-chip-name">มินิมอล</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="4" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">❄️</span><span class="ny-chip-name">คืนหิมะ</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="5" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎆</span><span class="ny-chip-name">พลุ</span></button>
    </div>
    <div class="ny-preview"><canvas id="preview-canvas" class="ny-canvas" width="1080" height="1350" role="img" aria-label="ตัวอย่างการ์ด"></canvas></div>
    <p class="ny-label" id="greet-label">คำอวยพร</p>
    <div id="greetings" class="ny-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="ny-greet is-on" role="radio" data-g="0" aria-checked="true">สวัสดีปีใหม่</button>
      <button type="button" class="ny-greet" role="radio" data-g="1" aria-checked="false">สุขสันต์วันปีใหม่</button>
      <button type="button" class="ny-greet" role="radio" data-g="2" aria-checked="false">ขอให้มีความสุขตลอดปี</button>
      <button type="button" class="ny-greet" role="radio" data-g="3" aria-checked="false">สวัสดีปีใหม่ 2027</button>
    </div>
    <p class="ny-label" id="deco-label">ตกแต่ง</p>
    <div id="decos" class="ny-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="ny-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">🐐</span> ปีมะแม</button>
      <button type="button" class="ny-deco is-on" data-bit="2" aria-pressed="true"><span aria-hidden="true">🗓️</span> 2027</button>
      <button type="button" class="ny-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> วิบวับ</button>
    </div>
    <div class="ny-row">
      <label class="ny-field" for="f-to"><span class="ny-label">ถึง</span>
        <input id="f-to" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น คุณยาย">
      </label>
      <label class="ny-field" for="f-from"><span class="ny-label">จาก</span>
        <input id="f-from" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น มายด์">
      </label>
    </div>
    <div class="ny-field">
      <div class="ny-msg-head"><label class="ny-label" for="f-msg">ข้อความ</label><button id="idea-btn" class="ny-idea" type="button">💡 ไอเดีย</button></div>
      <textarea id="f-msg" class="ny-input ny-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="เขียนคำอวยพรปีใหม่…"></textarea>
      <p id="msg-count" class="ny-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="ny-btn ny-btn-primary" type="button">ทำการ์ดให้เสร็จ</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="ny-screen ny-open" hidden>
    <p class="ny-open-eyebrow">คุณได้รับการ์ดปีใหม่</p>
    <p id="open-from" class="ny-open-from"></p>
    <button id="open-btn" class="ny-env" type="button" aria-label="เปิดการ์ด">
      <span class="ny-env-back" aria-hidden="true"></span>
      <span class="ny-env-letter" aria-hidden="true">🐐</span>
      <span class="ny-env-front" aria-hidden="true"></span>
      <span class="ny-env-flap" aria-hidden="true"></span>
      <span class="ny-env-seal" aria-hidden="true">🌸</span>
    </button>
    <button id="open-cta" class="ny-btn ny-btn-primary" type="button">เปิดการ์ด</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="ny-screen ny-end" hidden>
    <article class="ny-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="ny-eyebrow"></p>
      <h2 id="end-title" class="ny-sr"></h2>
      <canvas id="end-canvas" class="ny-canvas ny-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="ny-end-actions">
        <button id="save-btn" class="ny-btn ny-btn-primary ny-btn-sm" type="button"><span aria-hidden="true">📥</span> บันทึกรูป</button>
        <button id="copy-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">📋</span> คัดลอกข้อความ</button>
        <button id="edit-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">✏️</span> แก้ไข</button>
      </div>
      <p id="save-status" class="ny-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="nycard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> การ์ดปีใหม่ 2027 · <a href="privacy.html">นโยบายความเป็นส่วนตัว</a> · <a href="guide.html">คู่มือ</a>
  </footer>
</main>
