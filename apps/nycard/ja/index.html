<header class="mg-top"><a class="mg-home" href="https://example.com/ja/" aria-label="メルジン ミニアプリのホームへ"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">ミニアプリ</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="言語を選択"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja" selected>日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="言語を選択"><a href="../" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="../ko/" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="ny-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="ny-screen ny-start">
    <p class="ny-badge">🎍 2027年 ひつじ年</p>
    <div class="ny-hero" aria-hidden="true"><span class="ny-hero-main">🐐</span><span class="ny-hero-star">🎍</span><span class="ny-hero-gift">🧧</span><span class="ny-hero-snow">🎆</span><span class="ny-hero-card">💌</span><span class="ny-hero-year">2027</span></div>
    <h1 class="ny-h1"><span class="ny-kicker">年賀状 作成 2027</span><span class="ny-h1-main">新年のあいさつを<br><em>一枚のカード</em>に</span></h1>
    <p class="ny-hook">デザインを選んでひと言書けば、封筒みたいに開く年賀状のできあがり。</p>
    <button id="start-btn" class="ny-btn ny-btn-primary" type="button">年賀状を作る →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="ny-screen ny-edit" hidden>
    <h2 class="ny-edit-title">年賀状をデザイン</h2>
    <div id="themes" class="ny-chips" role="radiogroup" aria-label="カードのデザイン">
      <button type="button" class="ny-chip ny-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="ny-chip-emoji" aria-hidden="true">🧧</span><span class="ny-chip-name">紅白・金</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="1" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎍</span><span class="ny-chip-name">和紙</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="2" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🐐</span><span class="ny-chip-name">ゆるひつじ</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="3" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🌅</span><span class="ny-chip-name">シンプル</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="4" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">❄️</span><span class="ny-chip-name">雪の夜</span></button>
      <button type="button" class="ny-chip ny-theme" role="radio" data-t="5" aria-checked="false"><span class="ny-chip-emoji" aria-hidden="true">🎆</span><span class="ny-chip-name">花火</span></button>
    </div>
    <div class="ny-preview"><canvas id="preview-canvas" class="ny-canvas" width="1080" height="1350" role="img" aria-label="年賀状のプレビュー"></canvas></div>
    <p class="ny-label" id="greet-label">あいさつ</p>
    <div id="greetings" class="ny-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="ny-greet is-on" role="radio" data-g="0" aria-checked="true">あけましておめでとうございます</button>
      <button type="button" class="ny-greet" role="radio" data-g="1" aria-checked="false">謹賀新年</button>
      <button type="button" class="ny-greet" role="radio" data-g="2" aria-checked="false">賀正</button>
      <button type="button" class="ny-greet" role="radio" data-g="3" aria-checked="false">今年もよろしくお願いします</button>
    </div>
    <p class="ny-label" id="deco-label">かざり</p>
    <div id="decos" class="ny-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="ny-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">🐐</span> 干支</button>
      <button type="button" class="ny-deco is-on" data-bit="2" aria-pressed="true"><span aria-hidden="true">🗓️</span> 2027</button>
      <button type="button" class="ny-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> キラキラ</button>
    </div>
    <div class="ny-row">
      <label class="ny-field" for="f-to"><span class="ny-label">宛名</span>
        <input id="f-to" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：おばあちゃん">
      </label>
      <label class="ny-field" for="f-from"><span class="ny-label">差出人</span>
        <input id="f-from" class="ny-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：ゆい">
      </label>
    </div>
    <div class="ny-field">
      <div class="ny-msg-head"><label class="ny-label" for="f-msg">ひと言</label><button id="idea-btn" class="ny-idea" type="button">💡 文例</button></div>
      <textarea id="f-msg" class="ny-input ny-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="新年のひと言を書こう…"></textarea>
      <p id="msg-count" class="ny-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="ny-btn ny-btn-primary" type="button">年賀状を完成させる</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="ny-screen ny-open" hidden>
    <p class="ny-open-eyebrow">年賀状が届きました</p>
    <p id="open-from" class="ny-open-from"></p>
    <button id="open-btn" class="ny-env" type="button" aria-label="年賀状をひらく">
      <span class="ny-env-back" aria-hidden="true"></span>
      <span class="ny-env-letter" aria-hidden="true">🐐</span>
      <span class="ny-env-front" aria-hidden="true"></span>
      <span class="ny-env-flap" aria-hidden="true"></span>
      <span class="ny-env-seal" aria-hidden="true">🌸</span>
    </button>
    <button id="open-cta" class="ny-btn ny-btn-primary" type="button">年賀状をひらく</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="ny-screen ny-end" hidden>
    <article class="ny-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="ny-eyebrow"></p>
      <h2 id="end-title" class="ny-sr"></h2>
      <canvas id="end-canvas" class="ny-canvas ny-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="ny-end-actions">
        <button id="save-btn" class="ny-btn ny-btn-primary ny-btn-sm" type="button"><span aria-hidden="true">📥</span> 画像を保存</button>
        <button id="copy-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">📋</span> テキストをコピー</button>
        <button id="edit-btn" class="ny-btn ny-btn-soft ny-btn-sm" type="button"><span aria-hidden="true">✏️</span> なおす</button>
      </div>
      <p id="save-status" class="ny-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="nycard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 年賀状メーカー 2027 · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>
