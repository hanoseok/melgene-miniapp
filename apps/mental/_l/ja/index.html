<script>window.PAGE_I18N = {"questions":[{"q":"昨日は本当に最悪な一日でした。次の日の朝、あなたは…","choices":["まだ引きずっている。切り替えるには数日かかる","朝はちょっと憂うつでも、お昼には平気","新しい一日、リセット完了。ほとんど気にしていない","大丈夫だけど、頭の中で何度も再生されちゃう"]},{"q":"目覚ましが鳴らなかった！家を出るまであと20分。あなたは…","choices":["深呼吸して段取りを決め、時間どおりに出る","完全にパニック。バタバタして鍵まで忘れる","心臓バクバクだけど、なんとかバタバタ準備する","ぶつぶつ言いつつ「少し遅れるかも」と連絡して急ぐ"]},{"q":"美容院に行った日、友だちに「ん…個性的だね」と言われた。あなたは…","choices":["笑ってごまかすけど、鏡を何度も見てしまう","気にしない。自分が気に入っていればそれでいい","さっそく「髪 早く伸ばす方法」を検索中","どういう意味か聞くけど、やっぱり気に入っている"]},{"q":"ずっと楽しみにしていた予定が、当日にドタキャンされた。","choices":["1時間くらい残念がって、別のことを見つける","週末の気分がまるごと台なし","その夜はソファでしょんぼり過ごす","まあいっか！別の友だちを誘うか、自由時間を楽しむ"]},{"q":"プレゼン直前、ノートパソコンが突然落ちた。あなたは…","choices":["手が震えるけど、スライドなしで話してみる","落ち着いてパソコンを借り、バックアップを開く","ひと呼吸おいて、覚えている範囲でなんとか発表する","頭が真っ白。準備したことが全部飛んでしまう"]},{"q":"上司や先生から、赤ペンだらけで資料を返された。あなたは…","choices":["役に立つところは取り入れて、自信はそのまま","ちょっと刺さるけど、自分はこれが得意だとわかっている","全部直すけど、少しずつ自分を疑い始める","一晩中コメントを反すう。向いてないのかも…"]},{"q":"がんばったことが派手に失敗。ケーキがしぼんだり、テストがボロボロだったり。あなたは…","choices":["その日は口数が減って、またあとで挑戦する","しばらくはもうやりたくない","笑って写真を撮り、明日また挑戦する","うわーと一言、おやつと散歩で元どおり"]},{"q":"大事な約束に向かう途中、電車が駅と駅の間で止まった。あなたは…","choices":["10秒ごとに時計を見て、胃がキリキリする","少し焦るけど、先に連絡を入れて待つ","ため息をつきながら運行情報アプリを更新し続ける","仕方ない。音楽を聴きつつ遅れると伝える"]},{"q":"グループLINEに意見を送ったら、1時間たっても誰も反応なし。あなたは…","choices":["「ちょっと気まずいけど、みんな忙しいんだろう」","「変なこと言ったかな？」と読み返す","特に気にしない。いい意見だと思っている","「微妙だと思われてる…」と送信取消したくなる"]},{"q":"友だちとのゲーム大会で大負けした。あなたは…","choices":["大笑いして、すぐに「もう一回！」","笑顔だけど、帰り道にちょっとモヤモヤする","1ゲームくらい悔しがって、すぐ忘れる","正直、何日も引きずる"]},{"q":"締め切りが3つ、よりによって同じ日に重なった。あなたは…","choices":["ストレスはあるけど、やることリストを作って取りかかる","優先順位を決めてひとつずつ。なんとかなる","多すぎて固まり、ついスマホを眺めてしまう","あちこち手をつけてバタバタしつつも、最後は終わらせる"]},{"q":"人生の大きな決断を前に、みんながそれぞれ意見をくれる。あなたは…","choices":["全員に聞いて、話すたびに気持ちが変わる","聞くだけ聞いて、最後は自分の直感で。自分の人生だから","アドバイスは参考にして、最終決定は自分でする","多くの人がいいと言うほうに寄っていく"]}],"qLabel":"Q{n}"};</script>
