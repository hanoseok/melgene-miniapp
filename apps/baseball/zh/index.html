  <section id="screen-start" class="bb-screen bb-start">
    <p class="bb-badge">⚾ 数字棒球 · 1A2B</p>
    <div class="bb-hero" aria-hidden="true"><i class="bb-ht">?</i><i class="bb-ht bb-ht-ball"><b>⚾</b></i><i class="bb-ht">?</i></div>
    <h1 class="bb-h1"><span class="bb-kicker">猜数字</span><span class="bb-h1-main">猜出秘密<br><em>数字</em>吧</span></h1>
    <p class="bb-hook">电脑想好了一个各位数字都不重复的秘密数字。输入你的猜测，根据提示一步步推理出答案。</p>
    <div id="levels" class="bb-levels" role="radiogroup" aria-label="选择位数">
      <button type="button" class="bb-level" role="radio" aria-checked="true" data-level="d3"><span class="bb-level-name">3 位数</span><span class="bb-level-sub">经典</span></button>
      <button type="button" class="bb-level" role="radio" aria-checked="false" data-level="d4"><span class="bb-level-name">4 位数</span><span class="bb-level-sub">进阶</span></button>
    </div>
    <label class="bb-timer-opt"><input id="timer-opt" type="checkbox"><span>显示计时</span></label>
    <button id="start-btn" class="bb-btn bb-btn-primary" type="button">开始 →</button>
    <p class="bb-how">位置对＝数字和位置都对 · 数字对＝数字对位置不对 · 全错＝都不对</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 입력칸 + 숫자 패드 + 추리 기록 (광고 없음) -->

    <div class="bb-hud">
      <div class="bb-hud-box"><span class="bb-hud-label">次数</span><span id="hud-tries" class="bb-hud-val" aria-live="off">0</span></div>
      <div id="hud-time-box" class="bb-hud-box bb-hud-time" hidden><span class="bb-hud-label">用时</span><span id="hud-time" class="bb-hud-val" aria-live="off">0.0</span></div>
    </div>
    <div id="slots" class="bb-slots" role="group" aria-label="猜"></div>
    <p id="msg" class="bb-msg" role="status" aria-live="polite"></p>
    <div id="pad" class="bb-pad">
      <button type="button" class="bb-key" data-d="1">1</button>
      <button type="button" class="bb-key" data-d="2">2</button>
      <button type="button" class="bb-key" data-d="3">3</button>
      <button type="button" class="bb-key" data-d="4">4</button>
      <button type="button" class="bb-key" data-d="5">5</button>
      <button type="button" class="bb-key" data-d="6">6</button>
      <button type="button" class="bb-key" data-d="7">7</button>
      <button type="button" class="bb-key" data-d="8">8</button>
      <button type="button" class="bb-key" data-d="9">9</button>
      <button type="button" class="bb-key" data-d="0">0</button>
      <button id="del-btn" type="button" class="bb-key bb-key-del" aria-label="删除">⌫<span class="bb-key-text">删除</span></button>
      <button id="enter-btn" type="button" class="bb-key bb-key-enter">猜</button>
    </div>
    <p class="bb-legend">位置对：数字和位置都对 · 数字对：数字对位置不对</p>
    <div class="bb-history">
      <h2 class="bb-h2">我的猜测</h2>
      <p id="history-empty" class="bb-empty">输入数字，开始第一次猜测。</p>
      <ol id="history" class="bb-list" reversed></ol>
    </div>
    <button id="giveup-btn" class="bb-giveup" type="button">放弃</button>
  </section>

  <!-- 끝 화면: 결과 카드 → 공통 끝 화면 -->
  <section id="screen-end" class="bb-screen bb-end" hidden>
    <article class="bb-result" aria-labelledby="res-head">
      <p id="res-level" class="bb-eyebrow"></p>
      <p class="bb-head-line"><span class="bb-head-emoji" aria-hidden="true">⚾</span><span id="res-head" class="bb-head">猜对了！</span></p>
      <p id="res-secret-label" class="bb-cap">秘密数字</p>
      <div id="res-secret" class="bb-secret" aria-live="off"></div>
      <p class="bb-cap">次数</p>
      <p class="bb-score-line"><span id="res-big" class="bb-score-big">0</span></p>
      <p id="res-newbest" class="bb-newbest" hidden>刷新个人最佳！</p>
      <p id="res-best" class="bb-best"></p>
      <dl class="bb-stats">
        <div id="res-time-box" class="bb-stat" hidden><dt>用时</dt><dd id="res-time" class="bb-stat-num"></dd></div>
      </dl>
      <div id="res-rank" class="bb-rank" hidden>
        <p id="res-comparing" class="bb-comparing">正在与其他玩家比较…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="bb-top"></p>
          <p id="res-beat" class="bb-beat"></p>
          <p id="res-others" class="bb-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="baseball"></div>
  </section>

<script>window.MG_FAQ = [{"q":"猜数字（1A2B）怎么玩？","a":"电脑会想好一个各位数字都不相同的秘密数字。输入位数相同、也不重复的数字，然后点“猜”。数字和位置都对是“位置对”（A），只有数字对是“数字对”（B），都不对就是“全错”。所有位置都对就赢了。"},{"q":"秘密数字能以 0 开头吗？数字会重复吗？","a":"可以以 0 开头，比如 072，但同一个数字不会出现两次。你输入的猜测也不能有重复数字。已经猜过的数字不会再计数，只有新的猜测才会增加次数。"},{"q":"有提示按钮或次数限制吗？","a":"没有提示，也没有次数限制。这是纯推理游戏，用的次数越少越好。卡住了可以点“放弃”查看答案并开始新的一局。计时器默认不显示，打开后才会出现。"},{"q":"3 位数和 4 位数有什么区别？","a":"3 位数共有 720 种可能的秘密数字，4 位数多得多，每一种出现的概率相同。最佳成绩按难度分别保存在这个浏览器里。"},{"q":"“前 %”是怎么算出来的？","a":"猜对后，会把你的次数与同一难度其他玩家的真实成绩比较。如果还没有其他成绩可比，就不会显示。放弃的局不计入。"}];</script>
