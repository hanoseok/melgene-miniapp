        <i class="tf-hbk tf-c4"></i><i class="tf-hbk tf-c4"></i><i class="tf-hbk tf-c4"></i><i class="tf-hbk tf-c4"></i><i class="tf-hbk tf-c4"></i><i class="tf-hbk tf-c4"></i>
      </div>
      <span class="tf-hero-ball"></span>
      <span class="tf-hero-paddle"></span>
    </div>
    <h1 class="tf-h1"><span class="tf-kicker">벽돌깨기</span><span class="tf-h1-main">네온 벽돌을<br>전부 <em>와르르</em></span></h1>
    <p class="tf-hook">패들로 공을 받아 벽돌을 모두 깨세요. 단계가 올라갈수록 공이 조금씩 빨라져요.</p>
    <ul class="tf-how">
      <li><span class="tf-how-ico" aria-hidden="true">👆</span><span class="tf-how-txt">끌어서 이동</span></li>
      <li><span class="tf-how-ico" aria-hidden="true">🧱</span><span class="tf-how-txt">벽돌 깨기</span></li>
      <li><span class="tf-how-ico" aria-hidden="true">🎁</span><span class="tf-how-txt">아이템 받기</span></li>
    </ul>
    <button id="start-btn" class="tf-btn tf-btn-primary" type="button">게임 시작 →</button>
    <p class="tf-facts">터치 · 마우스 · ← → 키</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 캔버스 (광고 없음) -->
  <section id="screen-play" class="tf-screen tf-play" hidden>
    <div class="tf-hud">
      <div class="tf-hud-box tf-hud-score"><span class="tf-hud-label">점수</span><span id="hud-score" class="tf-hud-val">0</span></div>
      <div class="tf-hud-box tf-hud-stage"><span class="tf-hud-label">단계</span><span id="hud-stage" class="tf-hud-val">1</span></div>
      <div class="tf-hud-box tf-hud-lives"><span class="tf-hud-label">목숨</span><span id="hud-lives" class="tf-hud-val" aria-live="polite">3</span></div>
    </div>
    <div id="field" class="tf-field">
      <canvas id="board" class="tf-canvas" role="img" aria-label="벽돌깨기 판입니다. 패들을 움직여 공을 튕기고 벽돌을 깨세요."></canvas>
      <div id="field-msg" class="tf-msg" hidden><p id="field-msg-text" class="tf-msg-text"></p></div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="tf-screen tf-end" hidden>
    <article class="tf-result" aria-labelledby="res-score">
      <p id="res-reason" class="tf-eyebrow"></p>
      <p class="tf-tier-line"><span id="res-tier-emoji" class="tf-tier-emoji" aria-hidden="true"></span><span id="res-tier" class="tf-tier"></span></p>
      <p class="tf-score-line"><span id="res-score" class="tf-score-big">0</span> <span class="tf-points">점</span></p>
      <p id="res-newbest" class="tf-newbest" hidden>최고 기록 경신!</p>
      <p id="res-best" class="tf-best"></p>
      <dl class="tf-stats">
        <div class="tf-stat"><dt>도달한 단계</dt><dd id="res-stage" class="tf-stat-num">1</dd></div>
        <div class="tf-stat"><dt>깬 벽돌</dt><dd id="res-bricks" class="tf-stat-num">0</dd></div>
      </dl>
      <div id="res-rank" class="tf-rank" hidden>
        <p id="res-comparing" class="tf-comparing">다른 플레이어와 비교하는 중…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="tf-top"></p>
          <p id="res-beat" class="tf-beat"></p>
          <p id="res-others" class="tf-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="brick"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 벽돌깨기 · <a href="privacy.html">개인정보처리방침</a>
  </footer>
