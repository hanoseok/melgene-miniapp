      <li><span class="tf-how-ico" aria-hidden="true">🧱</span><span class="tf-how-txt">ブロックを崩す</span></li>

  </section>

      <div class="tf-hud-box tf-hud-lives"><span class="tf-hud-label">ライフ</span><span id="hud-lives" class="tf-hud-val" aria-live="polite">3</span></div>
    </div>
    <div id="field" class="tf-field">
      <canvas id="board" class="tf-canvas" role="img" aria-label="ブロック崩しのフィールド。パドルを動かしてボールを打ち返し、ブロックを崩します。"></canvas>
      <div id="field-msg" class="tf-msg" hidden><p id="field-msg-text" class="tf-msg-text"></p></div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->

    <article class="tf-result" aria-labelledby="res-score">
      <p id="res-reason" class="tf-eyebrow"></p>
      <p class="tf-tier-line"><span id="res-tier-emoji" class="tf-tier-emoji" aria-hidden="true"></span><span id="res-tier" class="tf-tier"></span></p>
      <p class="tf-score-line"><span id="res-score" class="tf-score-big">0</span> <span class="tf-points">点</span></p>
      <p id="res-newbest" class="tf-newbest" hidden>ベスト更新！</p>
      <p id="res-best" class="tf-best"></p>
      <dl class="tf-stats">
        <div class="tf-stat"><dt>到達ステージ</dt><dd id="res-stage" class="tf-stat-num">1</dd></div>
        <div class="tf-stat"><dt>崩したブロック</dt><dd id="res-bricks" class="tf-stat-num">0</dd></div>
      </dl>
      <div id="res-rank" class="tf-rank" hidden>
        <p id="res-comparing" class="tf-comparing">ほかのプレイヤーと比較中…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="tf-top"></p>
          <p id="res-beat" class="tf-beat"></p>
          <p id="res-others" class="tf-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="brick"></div>
  </section>
