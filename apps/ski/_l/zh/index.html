    <h1 class="ski-h1"><span class="ski-kicker">滑雪游戏</span><span class="ski-h1-main">从雪山一冲而下<br><em>看你能滑多远</em></span></h1>
    <p class="ski-hook">雪道永远没有尽头，速度却越来越快。在松树和旗门之间灵活穿梭，看看摔倒之前你能滑出多少米。</p>
    <ul class="ski-how">
      <li><span class="ski-how-ico" aria-hidden="true">👆</span><span class="ski-how-txt">按住左边或右边转向</span></li>
      <li><span class="ski-how-ico" aria-hidden="true">🚩</span><span class="ski-how-txt">穿过旗门拿奖励</span></li>
      <li><span class="ski-how-ico" aria-hidden="true">🌲</span><span class="ski-how-txt">躲开树、石头和雪人</span></li>
    </ul>
    <button id="start-btn" class="ski-btn ski-btn-primary" type="button">出发滑雪 →</button>
    <p class="ski-facts">按住屏幕或 ← → 键 · 手机电脑都能玩 · 刷新纪录</p>
