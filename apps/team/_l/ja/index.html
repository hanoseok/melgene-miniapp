  <section id="screen-start" class="tm-screen tm-start">
    <p class="tm-badge">🎲 もうチーム決めでもめない</p>
    <div class="tm-hero" aria-hidden="true"><span class="tm-hero-box is-0" style="--team:#ff8a1f"><span class="tm-hero-emoji">🐯</span><i></i><i></i><i></i></span><span class="tm-hero-box is-1" style="--team:#2f7fd8"><span class="tm-hero-emoji">🦈</span><i></i><i></i><i></i></span><span class="tm-hero-box is-2" style="--team:#1e9e5a"><span class="tm-hero-emoji">🐉</span><i></i><i></i><i></i></span><span class="tm-hero-dice">🎲</span></div>
    <h1 class="tm-h1"><span class="tm-kicker">チーム分けツール</span><span class="tm-h1-main">あなたのチームに<br><em>誰が</em>来る？</span></h1>
    <p class="tm-hook">名前を貼ってシャッフルを押せば、運がチームを分けてくれる。文句なしの公平さ。</p>
    <button id="start-btn" class="tm-btn tm-btn-primary" type="button">チーム分けする →</button>
    <p class="tm-facts">最大60人・リーダーは別チーム・結果を共有</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 이름 입력 화면 (진행 중 화면의 광고 1자리: 섞기 버튼 아래) -->
  <section id="screen-input" class="tm-screen tm-input" hidden>
    <h2 class="tm-h2">参加するのは誰？</h2>
    <div class="tm-card">
      <label class="tm-label" for="names">名前</label>
      <p class="tm-hint">1行に1人、またはカンマ（、）で区切ります。リーダーは名前の前に * を付けます。</p>
      <textarea id="names" class="tm-names" rows="8" spellcheck="false" autocomplete="off" placeholder="陽翔
結衣
*蓮
葵、湊、陽菜"></textarea>
      <div class="tm-names-bar">
        <span id="people-count" class="tm-count" aria-live="polite"></span>
        <span class="tm-names-tools">
          <button type="button" id="sample-btn" class="tm-mini">サンプル名</button>
          <button type="button" id="clear-btn" class="tm-mini">クリア</button>
        </span>
      </div>
      <p id="names-warn" class="tm-warn" hidden></p>

      <p class="tm-label" id="mode-label">分け方</p>
      <div class="tm-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" id="mode-teams" class="tm-seg-btn" role="radio" data-mode="teams">チーム数で</button>
        <button type="button" id="mode-size" class="tm-seg-btn" role="radio" data-mode="size">1チームの人数で</button>
      </div>
      <div class="tm-stepper">
        <button type="button" id="step-minus" class="tm-step" aria-label="減らす">−</button>
        <output id="step-num" class="tm-step-num">2</output>
        <button type="button" id="step-plus" class="tm-step" aria-label="増やす">+</button>
      </div>
      <p id="preview" class="tm-preview" aria-live="polite"></p>

      <label class="tm-check">
        <input type="checkbox" id="leaders">
        <span class="tm-check-box" aria-hidden="true"></span>
        <span class="tm-check-text">リーダー（*）は別々のチームに</span>
      </label>
      <p id="leaders-note" class="tm-hint tm-leaders-note"></p>
    </div>
    <button type="button" id="shuffle-btn" class="tm-btn tm-btn-primary">チームに分ける 🎲</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 결과: 섞기 애니메이션 → 팀 카드 → 공통 끝 화면 -->
  <section id="screen-result" class="tm-screen tm-result" hidden>
    <p id="shared-note" class="tm-shared-note" hidden>このチーム分けが共有されました。</p>
    <h2 id="result-title" class="tm-h2">チーム分けの結果</h2>
    <div id="deck" class="tm-deck" aria-hidden="true"><span class="tm-deck-dice">🎲</span><span id="deck-label" class="tm-deck-label">シャッフル中…</span></div>
    <div id="teams" class="tm-teams" aria-live="polite"></div>
    <div id="result-actions" class="tm-actions">
      <button type="button" id="rename-btn" class="tm-mini">🔤 チーム名を変える</button>
      <button type="button" id="again-btn" class="tm-mini tm-mini-accent">🎲 もう一度分ける</button>
      <button type="button" id="edit-btn" class="tm-mini">✏️ 名前を直す</button>
    </div>
    <button type="button" id="make-own-btn" class="tm-btn tm-btn-primary" hidden>自分もチーム分けする</button>
    <button type="button" id="copy-btn" class="tm-btn tm-btn-secondary">📋 テキストでコピー</button>
    <div data-mg-end="team"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> チーム分けツール · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
