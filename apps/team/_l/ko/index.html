  <section id="screen-start" class="tm-screen tm-start">
    <p class="tm-badge">🎲 편 가르기 고민 끝</p>
    <div class="tm-hero" aria-hidden="true"><span class="tm-hero-box is-0" style="--team:#ff8a1f"><span class="tm-hero-emoji">🐯</span><i></i><i></i><i></i></span><span class="tm-hero-box is-1" style="--team:#2f7fd8"><span class="tm-hero-emoji">🦈</span><i></i><i></i><i></i></span><span class="tm-hero-box is-2" style="--team:#1e9e5a"><span class="tm-hero-emoji">🐉</span><i></i><i></i><i></i></span><span class="tm-hero-dice">🎲</span></div>
    <h1 class="tm-h1"><span class="tm-kicker">랜덤 팀 나누기 · 조 편성</span><span class="tm-h1-main">우리 팀에는<br><em>누가</em> 올까?</span></h1>
    <p class="tm-hook">이름만 붙여 넣고 섞기를 누르면 운이 알아서 팀을 나눠 줘요. 뒷말 없이 공정하게.</p>
    <button id="start-btn" class="tm-btn tm-btn-primary" type="button">팀 나누기 →</button>
    <p class="tm-facts">최대 60명 · 주장은 다른 팀으로 · 결과 공유</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 이름 입력 화면 (진행 중 화면의 광고 1자리: 섞기 버튼 아래) -->
  <section id="screen-input" class="tm-screen tm-input" hidden>
    <h2 class="tm-h2">누가 참여하나요?</h2>
    <div class="tm-card">
      <label class="tm-label" for="names">이름</label>
      <p class="tm-hint">한 줄에 한 명, 또는 쉼표로 구분해요. 주장은 이름 앞에 *를 붙여요.</p>
      <textarea id="names" class="tm-names" rows="8" spellcheck="false" autocomplete="off" placeholder="김민준
이서연
*박도윤
최지우, 정하준, 강서윤"></textarea>
      <div class="tm-names-bar">
        <span id="people-count" class="tm-count" aria-live="polite"></span>
        <span class="tm-names-tools">
          <button type="button" id="sample-btn" class="tm-mini">예시 이름</button>
          <button type="button" id="clear-btn" class="tm-mini">지우기</button>
        </span>
      </div>
      <p id="names-warn" class="tm-warn" hidden></p>

      <p class="tm-label" id="mode-label">나누는 방법</p>
      <div class="tm-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" id="mode-teams" class="tm-seg-btn" role="radio" data-mode="teams">팀 수로</button>
        <button type="button" id="mode-size" class="tm-seg-btn" role="radio" data-mode="size">팀당 인원으로</button>
      </div>
      <div class="tm-stepper">
        <button type="button" id="step-minus" class="tm-step" aria-label="줄이기">−</button>
        <output id="step-num" class="tm-step-num">2</output>
        <button type="button" id="step-plus" class="tm-step" aria-label="늘리기">+</button>
      </div>
      <p id="preview" class="tm-preview" aria-live="polite"></p>

      <label class="tm-check">
        <input type="checkbox" id="leaders">
        <span class="tm-check-box" aria-hidden="true"></span>
        <span class="tm-check-text">주장(*)은 서로 다른 팀으로</span>
      </label>
      <p id="leaders-note" class="tm-hint tm-leaders-note"></p>
    </div>
    <button type="button" id="shuffle-btn" class="tm-btn tm-btn-primary">팀 섞기 🎲</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 결과: 섞기 애니메이션 → 팀 카드 → 공통 끝 화면 -->
  <section id="screen-result" class="tm-screen tm-result" hidden>
    <p id="shared-note" class="tm-shared-note" hidden>친구가 이 팀 편성을 공유했어요.</p>
    <h2 id="result-title" class="tm-h2">팀 편성 결과</h2>
    <div id="deck" class="tm-deck" aria-hidden="true"><span class="tm-deck-dice">🎲</span><span id="deck-label" class="tm-deck-label">섞는 중…</span></div>
    <div id="teams" class="tm-teams" aria-live="polite"></div>
    <div id="result-actions" class="tm-actions">
      <button type="button" id="rename-btn" class="tm-mini">🔤 팀 이름 바꾸기</button>
      <button type="button" id="again-btn" class="tm-mini tm-mini-accent">🎲 다시 섞기</button>
      <button type="button" id="edit-btn" class="tm-mini">✏️ 이름 고치기</button>
    </div>
    <button type="button" id="make-own-btn" class="tm-btn tm-btn-primary" hidden>나도 팀 나누기</button>
    <button type="button" id="copy-btn" class="tm-btn tm-btn-secondary">📋 텍스트로 복사</button>
    <div data-mg-end="team"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 랜덤 팀 나누기 · <a href="privacy.html">개인정보처리방침</a>
  </footer>
