  <section id="screen-start" class="tm-screen tm-start">
    <p class="tm-badge">🎲 分组不再吵架</p>
    <div class="tm-hero" aria-hidden="true"><span class="tm-hero-box is-0" style="--team:#ff8a1f"><span class="tm-hero-emoji">🐯</span><i></i><i></i><i></i></span><span class="tm-hero-box is-1" style="--team:#2f7fd8"><span class="tm-hero-emoji">🦈</span><i></i><i></i><i></i></span><span class="tm-hero-box is-2" style="--team:#1e9e5a"><span class="tm-hero-emoji">🐉</span><i></i><i></i><i></i></span><span class="tm-hero-dice">🎲</span></div>
    <h1 class="tm-h1"><span class="tm-kicker">随机分组工具</span><span class="tm-h1-main">谁会和你<br><em>分到一组</em>？</span></h1>
    <p class="tm-hook">粘贴名单，点一下打乱，让运气来分组。公平公正，没人有意见。</p>
    <button id="start-btn" class="tm-btn tm-btn-primary" type="button">开始分组 →</button>
    <p class="tm-facts">最多60人 · 组长分开 · 结果可分享</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 이름 입력 화면 (진행 중 화면의 광고 1자리: 섞기 버튼 아래) -->
  <section id="screen-input" class="tm-screen tm-input" hidden>
    <h2 class="tm-h2">谁来参加？</h2>
    <div class="tm-card">
      <label class="tm-label" for="names">名单</label>
      <p class="tm-hint">每行一个名字，或用逗号隔开。组长在名字前加 * 。</p>
      <textarea id="names" class="tm-names" rows="8" spellcheck="false" autocomplete="off" placeholder="王伟
李娜
*张敏
刘洋，陈静，杨磊"></textarea>
      <div class="tm-names-bar">
        <span id="people-count" class="tm-count" aria-live="polite"></span>
        <span class="tm-names-tools">
          <button type="button" id="sample-btn" class="tm-mini">示例名单</button>
          <button type="button" id="clear-btn" class="tm-mini">清空</button>
        </span>
      </div>
      <p id="names-warn" class="tm-warn" hidden></p>

      <p class="tm-label" id="mode-label">分组方式</p>
      <div class="tm-seg" role="radiogroup" aria-labelledby="mode-label">
        <button type="button" id="mode-teams" class="tm-seg-btn" role="radio" data-mode="teams">按组数</button>
        <button type="button" id="mode-size" class="tm-seg-btn" role="radio" data-mode="size">按每组人数</button>
      </div>
      <div class="tm-stepper">
        <button type="button" id="step-minus" class="tm-step" aria-label="减少">−</button>
        <output id="step-num" class="tm-step-num">2</output>
        <button type="button" id="step-plus" class="tm-step" aria-label="增加">+</button>
      </div>
      <p id="preview" class="tm-preview" aria-live="polite"></p>

      <label class="tm-check">
        <input type="checkbox" id="leaders">
        <span class="tm-check-box" aria-hidden="true"></span>
        <span class="tm-check-text">组长（*）分到不同组</span>
      </label>
      <p id="leaders-note" class="tm-hint tm-leaders-note"></p>
    </div>
    <button type="button" id="shuffle-btn" class="tm-btn tm-btn-primary">随机分组 🎲</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 결과: 섞기 애니메이션 → 팀 카드 → 공통 끝 화면 -->
  <section id="screen-result" class="tm-screen tm-result" hidden>
    <p id="shared-note" class="tm-shared-note" hidden>有人把这个分组结果分享给了你。</p>
    <h2 id="result-title" class="tm-h2">分组结果</h2>
    <div id="deck" class="tm-deck" aria-hidden="true"><span class="tm-deck-dice">🎲</span><span id="deck-label" class="tm-deck-label">正在打乱…</span></div>
    <div id="teams" class="tm-teams" aria-live="polite"></div>
    <div id="result-actions" class="tm-actions">
      <button type="button" id="rename-btn" class="tm-mini">🔤 换队名</button>
      <button type="button" id="again-btn" class="tm-mini tm-mini-accent">🎲 重新分组</button>
      <button type="button" id="edit-btn" class="tm-mini">✏️ 修改名单</button>
    </div>
    <button type="button" id="make-own-btn" class="tm-btn tm-btn-primary" hidden>我也来分组</button>
    <button type="button" id="copy-btn" class="tm-btn tm-btn-secondary">📋 复制为文字</button>
    <div data-mg-end="team"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 随机分组工具 · <a href="privacy.html">隐私政策</a>
  </footer>
</main>
