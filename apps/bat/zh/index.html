<script>window.MG_FAQ = [{"q":"怎么玩？","a":"按下开始按钮后，轻点游戏区域、单击鼠标或按空格键，蝙蝠就会扇动翅膀。每扇一下会往上升一点，然后被重力拉下来。让它从柱子之间的空隙穿过去，碰到柱子或地面就结束。"},{"q":"怎么计分？","a":"每完整穿过一道空隙得 1 分。最高分保存在这个浏览器里，下次可以继续挑战。"},{"q":"会越来越难吗？","a":"会，但很平缓。越往后空隙会稍微变窄、速度会稍微变快，到一定程度就不再变化。每道空隙都一定能穿过去。"},{"q":"切换标签页会怎样？","a":"离开当前标签页或应用时游戏会自动暂停。也可以随时用暂停按钮、P 键或 Esc 键暂停，再按“继续”接着玩。"},{"q":"前 % 是真实数据吗？","a":"是的。每次飞行结束时，只会把你的分数匿名发送到服务器，与其他人的分数比较。只有在有真实分数可比时才会显示，否则什么都不显示。"}];</script>
