<script>window.PAGE_I18N = {"questions":[{"q":"友達の集まりで、あなたはたいてい…","choices":["まず何を食べるか決める。メニューが雰囲気を作る。","すみの席で静かに様子を見ている。","自然とムードメーカーになる。","新しい店や新しい人はいないかキョロキョロする。"]},{"q":"予想外のトラブルが起きたら？","choices":["とりあえずあくび。どうせだれかがなんとかする。","ひとりで黙々と原因を突き止める。","話を盛って、おもしろい武勇伝にする。"]},{"q":"旅行の計画を立てるとき、あなたは？","choices":["できるだけ多くの国をスタンプラリーのように回る。","現地の友達を作るのが目標。","食べ物中心にルートを組む。"]},{"q":"友達が理不尽な目にあったと聞いたら？","choices":["「まず証拠を集めよう」と言う。","すぐに動いて確かめに行く。","とりあえず座らせて、お茶を飲みながら話を聞く。","裏でこっそり、さりげなく助ける。"]},{"q":"締め切り直前なのにアイデアが浮かばない。あなたは？","choices":["電気を消してぼーっとする。するとふと思いつく。","とにかく何案も作って、その中からひとつ選ぶ。","材料（資料）を完璧にそろえてから始める。"]},{"q":"買い物のとき、あなたは？","choices":["気に入るひとつが見つかるまで何度でも見直す。","とりあえず買う。後悔はあとで。"]},{"q":"グループ作業でのあなたのポジションは？","choices":["まず方向を決めて、ぐいぐい押し進める。","担当パートを黙々と完璧に仕上げる。","細部と完成度を担当する。"]},{"q":"SNSに何かを投稿するなら？","choices":["よく撮れた自分の写真。","旅先で出会った不思議な人たちの話。","今日読んだ本の一文。","作ったばかりの料理の写真。"]},{"q":"だれかに悩み相談をされたら？","choices":["まずは事実関係を整理する。","一緒になって怒ってあげる。","黙ってじっくり聞いて、なぐさめる。"]},{"q":"新しいことを学ぶときのスタイルは？","choices":["マニュアル通りに一歩ずつ、ミスなく。","まずはひとりで静かに観察して理解する。","とりあえず体当たりしてコツをつかむ。"]},{"q":"待ち合わせに遅れそうなとき、あなたは？","choices":["どうせ遅刻なら、ゆっくり着いてまず席を確保する。","ぴったりのタイミングで着けるよう計算する。","遅れてもインパクトのある登場をする。","いっそ新しいルートを開拓してみる。"]},{"q":"今日一日をひと言でまとめるなら？","choices":["面倒なことは全部かわした。完璧な一日。","ささいなことに、美しさをひとつ見つけた。","今日の出来事、話したらみんな驚くよ。"]}]};</script>
