<script>window.PAGE_I18N = {"questions":[{"q":"Trong buổi tụ tập với bạn bè, bạn thường…","choices":["Chốt món ăn trước tiên. Thực đơn quyết định cả bầu không khí.","Ngồi một góc, lặng lẽ quan sát mọi chuyện.","Thành tâm điểm của cuộc vui lúc nào không hay.","Ngó nghiêng tìm chỗ mới, gương mặt mới."]},{"q":"Khi có sự cố bất ngờ, bạn…","choices":["Ngáp một cái trước đã. Kiểu gì cũng có người lo.","Lặng lẽ tự mình đào sâu cho đến khi tìm ra nguyên nhân.","Biến nó thành một câu chuyện hài để kể lại sau."]},{"q":"Khi lên kế hoạch du lịch, bạn…","choices":["Đi càng nhiều nước càng tốt, “sưu tầm” con dấu hộ chiếu.","Đặt mục tiêu kết bạn với dân địa phương.","Lên cả lộ trình xoay quanh… đồ ăn."]},{"q":"Nghe bạn thân kể vừa bị oan ức, bạn sẽ…","choices":["Nói: “Rồi, trước tiên mình đi thu thập bằng chứng đã.”","Hành động ngay, đi kiểm tra tận nơi luôn.","Kéo bạn ấy ngồi xuống, pha ấm trà rồi lắng nghe.","Âm thầm giúp đỡ từ phía sau."]},{"q":"Deadline dí sát nút mà đầu óc trống trơn. Bạn…","choices":["Tắt đèn ngồi thẫn thờ — rồi ý tưởng bỗng lóe lên.","Phác thật nhanh cả đống bản nháp rồi chọn cái ổn nhất.","Gom đủ mọi tài liệu, tham khảo thật hoàn hảo rồi mới bắt đầu."]},{"q":"Khi mua sắm, bạn…","choices":["Xem đi xem lại cho đến khi tìm được món ưng ý nhất.","Chốt đơn luôn. Hối hận tính sau."]},{"q":"Vai trò của bạn trong bài tập nhóm?","choices":["Định hướng và kéo cả nhóm tiến lên.","Lặng lẽ hoàn thành phần mình thật hoàn hảo.","Lo phần chi tiết và khâu hoàn thiện cuối cùng."]},{"q":"Nếu đăng gì đó lên mạng xã hội, đó sẽ là…","choices":["Một tấm ảnh “sống ảo” thật đẹp của mình.","Chuyện về những người thú vị gặp được khi đi du lịch.","Một câu trích từ cuốn sách vừa đọc hôm nay.","Ảnh món ăn mình vừa nấu xong."]},{"q":"Có người tìm đến bạn xin lời khuyên. Bạn…","choices":["Bắt đầu bằng việc sắp xếp lại các sự thật.","Nổi giận cùng họ luôn.","Lặng lẽ lắng nghe và an ủi."]},{"q":"Khi học một thứ mới, phong cách của bạn là…","choices":["Làm theo hướng dẫn từng bước, không sai sót.","Lặng lẽ quan sát và tự mình hiểu ra trước.","Nhảy vào làm luôn để bắt nhịp."]},{"q":"Bạn sắp trễ hẹn. Bạn…","choices":["Đằng nào cũng trễ rồi, cứ thong thả đến rồi chiếm chỗ ngồi trước.","Tính toán chính xác lộ trình để đến đúng từng phút.","Đến muộn thì cũng phải xuất hiện thật ấn tượng.","Nhân tiện thử luôn một con đường hoàn toàn mới."]},{"q":"Tóm tắt ngày hôm nay của bạn trong một câu:","choices":["Né được hết mọi việc phiền phức. Một ngày hoàn hảo.","Tìm thấy chút vẻ đẹp trong một điều nhỏ bé.","Chuyện hôm nay mà kể ra thì ai cũng phải sốc."]}]};</script>
