<div class="rx-page">
  <!-- 측정 화면: 대기(idle, 티징만) → 빨강(wait) → 초록(go) → 기록(hit) / 부정 출발(foul) / 중단(abort) -->
  <section id="arena" class="rx-arena" data-phase="idle" tabindex="-1" aria-labelledby="arena-title">
    <div class="rx-hud">
      <span id="hud-round" class="rx-hud-round"></span>
      <button type="button" id="quit-btn" class="rx-quit" data-no-tap>やめる</button>
    </div>

    <div class="rx-idle">
      <h1 id="arena-title">反応速度<br>テスト</h1>
      <p class="rx-hook">緑に変わった瞬間にタップ。5回の平均を出して、参加者全体の中で上位何％かがわかります。</p>
      <ul class="rx-rules">
        <li><span class="rx-swatch rx-swatch-stop" aria-hidden="true"></span>赤のあいだは待つ</li>
        <li><span class="rx-swatch rx-swatch-go" aria-hidden="true"></span>緑になったらタップ</li>
      </ul>
      <div class="rx-court">
        <button type="button" id="start-btn" class="rx-pad"><span>タップでスタート</span></button>
      </div>
      <p class="rx-keyhint">PCならスペースキーでもOK</p>
      <div class="mg-ad mg-ad-start" data-no-tap></div>
    </div>

    <div class="rx-signal" aria-live="assertive" aria-atomic="true">
      <p id="sig-title" class="rx-sig-title"></p>
      <p id="sig-num" class="rx-sig-num" hidden><span id="sig-ms" class="rx-num"></span><span class="rx-unit">ms</span><span id="sig-emoji" class="rx-sig-emoji" aria-hidden="true"></span></p>
      <p id="sig-sub" class="rx-sig-sub"></p>
      <p id="sig-act" class="rx-sig-act"></p>
      <p id="sig-key" class="rx-sig-key">スペースキーかEnterでもOK</p>
    </div>

    <ol id="laps" class="rx-laps" aria-label="ラウンドごとの記録">
        <li class="rx-lap" aria-label="1ラウンド目 記録なし"><span class="rx-lap-n">1</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="2ラウンド目 記録なし"><span class="rx-lap-n">2</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="3ラウンド目 記録なし"><span class="rx-lap-n">3</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="4ラウンド目 記録なし"><span class="rx-lap-n">4</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="5ラウンド目 記録なし"><span class="rx-lap-n">5</span><span class="rx-lap-ms">–</span></li>
    </ol>
  </section>

  <!-- 결과 화면: 앱 결과 다음에 공통 끝 화면(별점·하트 → 광고 → 공유 → FAQ → 다시 하기 → 다른 미니앱) -->
  <section id="result" class="rx-result" hidden aria-labelledby="res-label">
    <h2 id="res-label" class="rx-res-label">平均反応速度</h2>
    <p class="rx-res-avg"><span id="res-avg" class="rx-num">0</span><span class="rx-unit">ms</span></p>

    <div class="rx-tier">
      <span id="res-emoji" class="rx-tier-emoji" aria-hidden="true"></span>
      <div class="rx-tier-body">
        <p id="res-tier" class="rx-tier-title"></p>
        <p id="res-tier-desc" class="rx-tier-desc"></p>
      </div>
    </div>

    <div class="rx-block">
      <h3 class="rx-block-title">ラウンドごとの記録</h3>
      <ol id="res-laps" class="rx-lapbars"></ol>
      <p id="res-meta" class="rx-res-meta"></p>
    </div>

    <div id="res-rank" class="rx-block rx-rank" hidden>
      <h3 class="rx-block-title">参加者全体での位置</h3>
      <p id="res-comparing" class="rx-comparing">みんなの記録と比べています…</p>
      <div id="res-rank-body" hidden>
        <p id="res-top" class="rx-rank-top"></p>
        <p id="res-beat" class="rx-rank-beat"></p>
        <div id="res-chart" class="rx-chart"></div>
        <p id="res-readout" class="rx-readout" aria-hidden="true"></p>
      </div>
      <p id="res-note" class="rx-rank-note"></p>
    </div>

    <div data-mg-end="reaction"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 反応速度テスト · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</div>

<script>window.MG_FAQ = [{"q":"スマホとPCで記録が違うのはなぜ？","a":"色の表示やタップの認識には端末ごとに10〜80ミリ秒ほどの差が出ます。比べるなら同じ端末どうしが公平です。"},{"q":"フライングとは？","a":"緑になる前や、緑になってから100ミリ秒未満のタップ（予測タップ）はやり直しになります。平均には入りません。"},{"q":"「上位何％」はどう計算していますか？","a":"平均記録が10ミリ秒単位の匿名の分布に加わります。名前や端末情報は保存せず、自分より遅かった人の割合から順位を出します。"},{"q":"反応速度を上げるには？","a":"しっかり眠り、指を画面の近くに構えましょう。合図を予想せず、色の変化だけに集中するのがコツです。"}];</script>
