    <div class="mg-ad mg-ad-start"></div>
  </section>

    <div class="sk-hud">
      <div class="sk-hud-box sk-hud-score"><span class="sk-hud-label">スコア</span><span id="hud-score" class="sk-hud-val">0</span></div>
      <div class="sk-hud-box sk-hud-best"><span class="sk-hud-label">ベスト</span><span id="hud-best" class="sk-hud-val">0</span></div>
      <div class="sk-hud-box sk-hud-next"><span class="sk-hud-label">ネクスト</span><canvas id="hud-next" class="sk-next" role="img" aria-label=""></canvas></div>
      <button id="pause-btn" class="sk-pause" type="button" aria-label="一時停止" title="一時停止"><span aria-hidden="true"></span></button>
    </div>

      <canvas id="sk-canvas" class="sk-canvas"></canvas>
      <div id="full-overlay" class="sk-overlay sk-full" hidden><p class="sk-full-title">ビンが満杯！</p></div>
      <div id="pause-overlay" class="sk-overlay sk-paused" hidden>
        <p class="sk-paused-title">一時停止中</p>
        <button id="resume-btn" class="sk-btn sk-btn-primary sk-btn-sm" type="button">再開する</button>
      </div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="sk-screen sk-end" hidden>
    <article class="sk-result" aria-labelledby="res-score">
      <p id="res-reason" class="sk-eyebrow"></p>
      <p class="sk-score-line"><span id="res-score" class="sk-score-big">0</span> <span class="sk-points">点</span></p>
      <p id="res-newbest" class="sk-newbest" hidden>自己ベスト更新！</p>
      <p id="res-best" class="sk-best"></p>
      <dl class="sk-stats">
        <div class="sk-stat"><dt>いちばん大きいピース</dt><dd><canvas id="res-biggest-ico" class="sk-stat-ico" aria-hidden="true"></canvas><span id="res-biggest" class="sk-stat-name"></span></dd></div>
        <div class="sk-stat"><dt>合体した回数</dt><dd id="res-merges" class="sk-stat-num">0</dd></div>
      </dl>
      <div id="res-rank" class="sk-rank" hidden>
        <p id="res-comparing" class="sk-comparing">ほかのプレイヤーと比較中…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="sk-top"></p>
          <p id="res-beat" class="sk-beat"></p>
          <p id="res-others" class="sk-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="merge"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> スイカゲーム ハロウィン版 · <a href="privacy.html">プライバシーポリシー</a>

<script>window.MG_FAQ = [{"q":"遊び方は？","a":"ビンの上で指やマウスを動かして位置を決め、指を離すかクリックするとピースが落ちます。矢印キーでねらってスペースで落とすこともできます。同じピースが2つぶつかると、ひとつ上の大きさに合体します。"},{"q":"ゲームオーバーになるのは？","a":"時間制限はありません。積み上がったピースが上の点線より上に2秒ほどとどまるとゲームオーバー。すき間を残して、どこで合体させるか考えながら落としましょう。"},{"q":"スコアはどう決まる？","a":"合体するたびに点数が入り、大きいピースを作るほど高得点。続けて合体する連鎖が起きると一気にスコアが伸びます。"},{"q":"上位％は本当の数字？","a":"はい。ゲームが終わるとスコアだけを匿名でサーバーに送り、ほかの人のスコアと比べます。比べられる実際の記録があるときだけ上位％を表示し、ないときは何も表示しません。別のタブに移るとゲームは自動で止まります。"}];</script>
