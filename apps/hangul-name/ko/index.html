    <p class="hn-hook">영어나 외국 이름을 넣으면 한글로 바꿔 주고, 한 글자씩 읽는 법도 알려 줘요.</p>

      <p id="name-error" class="hn-error" role="alert" hidden></p>
      <button id="start-btn" class="hn-btn hn-btn-primary" type="submit">한글로 써 보기 ✍️</button>
    </form>

    <div class="mg-ad mg-ad-start"></div>
  </section>

      <button type="button" class="hn-chip hn-chip-cute" data-style="cute" role="radio" aria-checked="false"><span class="hn-chip-glyph" aria-hidden="true">한</span><span class="hn-chip-name">귀여운</span></button>
      <button type="button" class="hn-chip hn-chip-bold" data-style="bold" role="radio" aria-checked="false"><span class="hn-chip-glyph" aria-hidden="true">한</span><span class="hn-chip-name">포스터</span></button>

    <h3 class="hn-h3">한 글자씩 읽는 법</h3>
    <div id="breakdown" class="hn-breakdown"></div>
