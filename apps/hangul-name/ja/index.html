    <p class="hn-badge">🇰🇷 10月9日は韓国のハングルの日</p>
    <div class="hn-hero" aria-hidden="true"><span class="hn-tile hn-tile-a">ㅎ</span><span class="hn-op">+</span><span class="hn-tile hn-tile-b">ㅏ</span><span class="hn-op">+</span><span class="hn-tile hn-tile-c">ㄴ</span><span class="hn-op">=</span><span class="hn-tile hn-tile-big">한</span></div>

    <p class="hn-hook">名前を入れると韓国の文字に変身。1文字ずつの読み方もわかります。</p>
    <form id="name-form" class="hn-form" novalidate>
      <label class="hn-label" for="name-input">名前</label>

      <button id="start-btn" class="hn-btn hn-btn-primary" type="submit">ハングルで書く ✍️</button>

    <p class="hn-facts">ローマ字・カナ・キリル文字OK · 名前カード画像 · どこにも送信しません</p>
    <div class="mg-ad mg-ad-start"></div>

  <!-- 결과 화면: 이름 카드 → 카드 스타일 → 저장/복사 → 음절 풀이 → 안내 → 공통 끝 화면 -->
  <section id="screen-result" class="hn-screen hn-result" hidden>
    <p id="result-eyebrow" class="hn-eyebrow">ハングルで書いたあなたの名前</p>
    <div class="hn-card-wrap"><canvas id="card-canvas" class="hn-card" width="1080" height="1080" role="img"></canvas></div>
    <p class="hn-h3" id="style-title">カードのスタイル</p>
    <div id="style-chips" class="hn-chips" role="radiogroup" aria-labelledby="style-title">
      <button type="button" class="hn-chip hn-chip-brush" data-style="brush" role="radio" aria-checked="true"><span class="hn-chip-glyph" aria-hidden="true">한</span><span class="hn-chip-name">筆文字</span></button>
      <button type="button" class="hn-chip hn-chip-cute" data-style="cute" role="radio" aria-checked="false"><span class="hn-chip-glyph" aria-hidden="true">한</span><span class="hn-chip-name">かわいい</span></button>
      <button type="button" class="hn-chip hn-chip-bold" data-style="bold" role="radio" aria-checked="false"><span class="hn-chip-glyph" aria-hidden="true">한</span><span class="hn-chip-name">ポスター</span></button>
      <button type="button" class="hn-chip hn-chip-classic" data-style="classic" role="radio" aria-checked="false"><span class="hn-chip-glyph" aria-hidden="true">한</span><span class="hn-chip-name">クラシック</span></button>
    </div>
    <div class="hn-actions">
      <button id="save-btn" class="hn-btn hn-btn-primary" type="button">画像を保存</button>
      <button id="copy-btn" class="hn-btn hn-btn-ghost" type="button">文字をコピー</button>
    </div>
    <p id="status" class="hn-status" aria-live="polite"></p>
    <h3 class="hn-h3">1文字ずつの読み方</h3>
    <div id="breakdown" class="hn-breakdown"></div>
    <p class="hn-note">読み方はだいたいの目安で、お楽しみ用です。外国の名前はハングルで何通りかに書けます。</p>
