  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->

    <h2 class="pk-edit-title">かぼちゃを彫ってみよう</h2>
    <button id="preview" class="pk-preview" type="button" aria-label="あなたのかぼちゃ。タップで次のパーツに変わります"><span id="preview-art" class="pk-preview-art"></span></button>
    <p class="pk-hint">ヒント：かぼちゃをタップすると次のパーツに</p>
    <div class="pk-toggles">
      <button id="glow-btn" class="pk-toggle" type="button" aria-pressed="true"><span class="pk-toggle-icon" aria-hidden="true">🕯️</span><span class="pk-toggle-label">ろうそく</span><span class="pk-switch" aria-hidden="true"></span></button>
      <button id="night-btn" class="pk-toggle" type="button" aria-pressed="true"><span class="pk-toggle-icon" aria-hidden="true">🌙</span><span class="pk-toggle-label">夜空</span><span class="pk-switch" aria-hidden="true"></span></button>
    </div>
    <div id="tabs" class="pk-tabs" role="tablist" aria-label="かぼちゃのパーツ">
      <button type="button" class="pk-tab is-on" role="tab" id="tab-shape" data-part="shape" aria-selected="true" aria-controls="options">かたち</button>
      <button type="button" class="pk-tab" role="tab" id="tab-color" data-part="color" aria-selected="false" aria-controls="options">色</button>
      <button type="button" class="pk-tab" role="tab" id="tab-eyes" data-part="eyes" aria-selected="false" aria-controls="options">目</button>
      <button type="button" class="pk-tab" role="tab" id="tab-nose" data-part="nose" aria-selected="false" aria-controls="options">鼻</button>
      <button type="button" class="pk-tab" role="tab" id="tab-mouth" data-part="mouth" aria-selected="false" aria-controls="options">口</button>
      <button type="button" class="pk-tab" role="tab" id="tab-stem" data-part="stem" aria-selected="false" aria-controls="options">へた</button>
      <button type="button" class="pk-tab" role="tab" id="tab-extra" data-part="extra" aria-selected="false" aria-controls="options">飾り</button>
    </div>
    <div id="options" class="pk-options" role="tabpanel" aria-labelledby="tab-shape"></div>
    <label class="pk-name" for="name-input"><span class="pk-name-label">かぼちゃの名前（任意）</span>
      <input id="name-input" class="pk-name-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="例：にっこりジャック">
    </label>
    <div class="pk-actions">
      <button id="random-btn" class="pk-btn pk-btn-soft" type="button"><span aria-hidden="true">🎲</span> ランダム</button>
      <button id="done-btn" class="pk-btn pk-btn-primary" type="button">完成！</button>
    </div>
    <div class="mg-ad"></div>
  </section>

      </div>
      <p id="save-status" class="pk-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="pumpkin"></div>
  </section>
