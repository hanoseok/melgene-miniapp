  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="pk-screen pk-edit" hidden>
    <h2 class="pk-edit-title">แกะสลักฟักทองของคุณ</h2>
    <button id="preview" class="pk-preview" type="button" aria-label="ฟักทองของคุณ แตะเพื่อเปลี่ยนเป็นแบบถัดไป"><span id="preview-art" class="pk-preview-art"></span></button>
    <p class="pk-hint">เคล็ดลับ: แตะที่ฟักทองเพื่อเปลี่ยนเป็นแบบถัดไป</p>
    <div class="pk-toggles">
      <button id="glow-btn" class="pk-toggle" type="button" aria-pressed="true"><span class="pk-toggle-icon" aria-hidden="true">🕯️</span><span class="pk-toggle-label">เทียน</span><span class="pk-switch" aria-hidden="true"></span></button>
      <button id="night-btn" class="pk-toggle" type="button" aria-pressed="true"><span class="pk-toggle-icon" aria-hidden="true">🌙</span><span class="pk-toggle-label">กลางคืน</span><span class="pk-switch" aria-hidden="true"></span></button>
    </div>
    <div id="tabs" class="pk-tabs" role="tablist" aria-label="ส่วนต่าง ๆ ของฟักทอง">
      <button type="button" class="pk-tab is-on" role="tab" id="tab-shape" data-part="shape" aria-selected="true" aria-controls="options">ทรง</button>
      <button type="button" class="pk-tab" role="tab" id="tab-color" data-part="color" aria-selected="false" aria-controls="options">สี</button>
      <button type="button" class="pk-tab" role="tab" id="tab-eyes" data-part="eyes" aria-selected="false" aria-controls="options">ตา</button>
      <button type="button" class="pk-tab" role="tab" id="tab-nose" data-part="nose" aria-selected="false" aria-controls="options">จมูก</button>
      <button type="button" class="pk-tab" role="tab" id="tab-mouth" data-part="mouth" aria-selected="false" aria-controls="options">ปาก</button>
      <button type="button" class="pk-tab" role="tab" id="tab-stem" data-part="stem" aria-selected="false" aria-controls="options">ขั้ว</button>
      <button type="button" class="pk-tab" role="tab" id="tab-extra" data-part="extra" aria-selected="false" aria-controls="options">ของตกแต่ง</button>
    </div>
    <div id="options" class="pk-options" role="tabpanel" aria-labelledby="tab-shape"></div>
    <label class="pk-name" for="name-input"><span class="pk-name-label">ตั้งชื่อฟักทอง (ไม่บังคับ)</span>
      <input id="name-input" class="pk-name-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="เช่น เจ้ายิ้มแฉ่ง">
    </label>
    <div class="pk-actions">
      <button id="random-btn" class="pk-btn pk-btn-soft" type="button"><span aria-hidden="true">🎲</span> สุ่ม</button>
      <button id="done-btn" class="pk-btn pk-btn-primary" type="button">เสร็จแล้ว!</button>
    </div>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 호박(결과) → 공통 끝 화면 -->

    <article class="pk-card" aria-labelledby="end-name">
      <p id="end-eyebrow" class="pk-eyebrow"></p>
      <div id="end-art" class="pk-end-art" role="img"></div>
      <h2 id="end-name" class="pk-end-name"></h2>
      <div class="pk-end-actions">
        <button id="save-btn" class="pk-btn pk-btn-primary pk-btn-sm" type="button"><span aria-hidden="true">📥</span> บันทึกรูป</button>
        <button id="edit-btn" class="pk-btn pk-btn-soft pk-btn-sm" type="button"><span aria-hidden="true">✏️</span> แก้ไขต่อ</button>
      </div>
      <p id="save-status" class="pk-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="pumpkin"></div>
  </section>
