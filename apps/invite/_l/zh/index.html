        <input id="f-date" class="iv-input" type="date" min="2000-01-01" max="2100-12-31">
      </label>
      <label class="iv-field" for="f-time"><span class="iv-label">时间</span>
        <input id="f-time" class="iv-input" type="time">
      </label>
    </div>
    <label class="iv-field" for="f-place"><span class="iv-label">地点</span>
      <input id="f-place" class="iv-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：我家三楼">
    </label>
    <label class="iv-field" for="f-note"><span class="iv-label">给客人的话</span>
      <input id="f-note" class="iv-input" type="text" maxlength="240" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="例如：欢迎来变装！">
