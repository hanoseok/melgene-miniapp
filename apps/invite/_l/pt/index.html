<main class="iv-shell">
  <!-- 시작 화면: 티징만 (배지·봉투 그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="iv-screen iv-start">
    <p class="iv-badge">🎃 Especial de Halloween</p>
    <div class="iv-hero" aria-hidden="true"><span class="iv-hero-bat">🦇</span><span class="iv-hero-env">💌</span><span class="iv-hero-pumpkin">🎃</span><span class="iv-hero-ghost">👻</span></div>
    <h1 class="iv-h1"><span class="iv-kicker">Convite de festa de Halloween</span><span class="iv-h1-main">Chame a galera para<br><em>sua festa de terror</em></span></h1>
    <p class="iv-hook">Dê um nome à sua festa, escolha um tema assustador e mande um convite que todo mundo vai querer abrir.</p>
    <button id="start-btn" class="iv-btn iv-btn-primary" type="button">Criar meu convite →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="iv-screen iv-edit" hidden>
    <h2 class="iv-edit-title">Monte seu convite</h2>
    <div id="themes" class="iv-themes" role="radiogroup" aria-label="Temas do convite">
      <button type="button" class="iv-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="iv-theme-emoji" aria-hidden="true">👻</span><span class="iv-theme-name">Fantasma</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="1" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🎃</span><span class="iv-theme-name">Abóbora</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="2" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🦇</span><span class="iv-theme-name">Morcego</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="3" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🧙</span><span class="iv-theme-name">Bruxa</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="4" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🕷️</span><span class="iv-theme-name">Aranha</span></button>
    </div>
    <div class="iv-preview"><canvas id="preview-canvas" class="iv-canvas" width="1080" height="1500" role="img" aria-label="Prévia do seu convite"></canvas></div>
    <label class="iv-field" for="f-title"><span class="iv-label">Nome da festa</span>
      <input id="f-title" class="iv-input" type="text" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex.: Festa na casa assombrada">
    </label>
    <div class="iv-row">
      <label class="iv-field" for="f-date"><span class="iv-label">Data</span>
        <input id="f-date" class="iv-input" type="date" min="2000-01-01" max="2100-12-31">
      </label>
      <label class="iv-field" for="f-time"><span class="iv-label">Hora</span>
        <input id="f-time" class="iv-input" type="time">
      </label>
    </div>
    <label class="iv-field" for="f-place"><span class="iv-label">Local</span>
      <input id="f-place" class="iv-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="ex.: Lá em casa, 3º andar">
    </label>
    <label class="iv-field" for="f-note"><span class="iv-label">Um recado para os convidados</span>
      <input id="f-note" class="iv-input" type="text" maxlength="240" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="ex.: Fantasia obrigatória!">
    </label>
    <button id="done-btn" class="iv-btn iv-btn-primary" type="button">Criar convite</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 초대장(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="iv-screen iv-end" hidden>
    <article class="iv-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="iv-eyebrow"></p>
      <h2 id="end-title" class="iv-sr"></h2>
      <canvas id="end-canvas" class="iv-canvas iv-end-canvas" width="1080" height="1500" role="img"></canvas>
      <div class="iv-end-actions">
        <button id="save-btn" class="iv-btn iv-btn-primary iv-btn-sm" type="button"><span aria-hidden="true">📥</span> Salvar imagem</button>
        <button id="copy-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">📋</span> Copiar texto</button>
        <button id="edit-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">✏️</span> Editar</button>
      </div>
      <p id="save-status" class="iv-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="invite"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Convite de festa de Halloween · <a href="privacy.html">Política de privacidade</a>
  </footer>
</main>
