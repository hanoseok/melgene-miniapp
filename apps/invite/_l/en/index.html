<header class="mg-top"><a class="mg-home" href="https://example.com/" aria-label="Melgene Apps home"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">Apps</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="Language"><option value="en" data-hreflang="en" lang="en" selected>English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="Language"><a href="./" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="./" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="./" hreflang="fr" lang="fr">Français</a> <a href="./" hreflang="de" lang="de">Deutsch</a> <a href="./" hreflang="th" lang="th">ไทย</a> <a href="./" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="./" hreflang="es" lang="es">Español</a> <a href="./" hreflang="it" lang="it">Italiano</a> <a href="./" hreflang="pt" lang="pt">Português</a> <a href="./" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="iv-shell">
  <!-- 시작 화면: 티징만 (배지·봉투 그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="iv-screen iv-start">
    <p class="iv-badge">🎃 Halloween special</p>
    <div class="iv-hero" aria-hidden="true"><span class="iv-hero-bat">🦇</span><span class="iv-hero-env">💌</span><span class="iv-hero-pumpkin">🎃</span><span class="iv-hero-ghost">👻</span></div>
    <h1 class="iv-h1"><span class="iv-kicker">Halloween party invitation maker</span><span class="iv-h1-main">Invite them to<br><em>your spooky party</em></span></h1>
    <p class="iv-hook">Name the party, pick a spooky theme and send guests an invitation they will actually want to open.</p>
    <button id="start-btn" class="iv-btn iv-btn-primary" type="button">Make my invitation →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="iv-screen iv-edit" hidden>
    <h2 class="iv-edit-title">Design your invitation</h2>
    <div id="themes" class="iv-themes" role="radiogroup" aria-label="Invitation themes">
      <button type="button" class="iv-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="iv-theme-emoji" aria-hidden="true">👻</span><span class="iv-theme-name">Ghost</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="1" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🎃</span><span class="iv-theme-name">Pumpkin</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="2" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🦇</span><span class="iv-theme-name">Bat</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="3" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🧙</span><span class="iv-theme-name">Witch</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="4" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🕷️</span><span class="iv-theme-name">Spider</span></button>
    </div>
    <div class="iv-preview"><canvas id="preview-canvas" class="iv-canvas" width="1080" height="1500" role="img" aria-label="Preview of your invitation"></canvas></div>
    <label class="iv-field" for="f-title"><span class="iv-label">Party name</span>
      <input id="f-title" class="iv-input" type="text" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. Haunted House Party">
    </label>
    <div class="iv-row">
      <label class="iv-field" for="f-date"><span class="iv-label">Date</span>
        <input id="f-date" class="iv-input" type="date" min="2000-01-01" max="2100-12-31">
      </label>
      <label class="iv-field" for="f-time"><span class="iv-label">Time</span>
        <input id="f-time" class="iv-input" type="time">
      </label>
    </div>
    <label class="iv-field" for="f-place"><span class="iv-label">Place</span>
      <input id="f-place" class="iv-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="e.g. My place, 3rd floor">
    </label>
    <label class="iv-field" for="f-note"><span class="iv-label">A word for your guests</span>
      <input id="f-note" class="iv-input" type="text" maxlength="240" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="e.g. Costumes encouraged!">
    </label>
    <button id="done-btn" class="iv-btn iv-btn-primary" type="button">Create invitation</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 초대장(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="iv-screen iv-end" hidden>
    <article class="iv-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="iv-eyebrow"></p>
      <h2 id="end-title" class="iv-sr"></h2>
      <canvas id="end-canvas" class="iv-canvas iv-end-canvas" width="1080" height="1500" role="img"></canvas>
      <div class="iv-end-actions">
        <button id="save-btn" class="iv-btn iv-btn-primary iv-btn-sm" type="button"><span aria-hidden="true">📥</span> Save image</button>
        <button id="copy-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">📋</span> Copy text</button>
        <button id="edit-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">✏️</span> Edit</button>
      </div>
      <p id="save-status" class="iv-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="invite"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Halloween Party Invitation Maker · <a href="privacy.html">Privacy Policy</a> · <a href="guide.html">Guide</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"How do I make my invitation?","a":"Pick a theme, type the party name, date, time, place and a word for your guests, and tap “Create invitation”. Every field is optional, and the preview updates as you type."},{"q":"Can I save the invitation as a picture?","a":"Yes. “Save image” makes a PNG you can post or send in any chat. On a phone it opens the share sheet; on a computer it downloads."},{"q":"How does the share link work?","a":"The whole invitation is packed into the link itself, so whoever opens it sees exactly the same card. Nothing is stored on our servers, and opening a link does not change your own invitation."},{"q":"Can I send just the details as text?","a":"Yes. “Copy text” copies the party name, date, time, place, your note and the link, ready to paste into any message."}];</script>
