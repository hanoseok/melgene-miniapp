      </label>
      <label class="iv-field" for="f-time"><span class="iv-label">Время</span>
        <input id="f-time" class="iv-input" type="time">
      </label>
    </div>
    <label class="iv-field" for="f-place"><span class="iv-label">Место</span>
      <input id="f-place" class="iv-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="напр. У меня дома, 3 этаж">

    <label class="iv-field" for="f-note"><span class="iv-label">Пара слов гостям</span>
