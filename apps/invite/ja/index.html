  <section id="screen-start" class="iv-screen iv-start">
    <p class="iv-badge">🎃 ハロウィン特集</p>

    <p class="iv-hook">パーティー名と日時を入れて、テーマを選ぶだけ。もらったらつい開きたくなる招待状ができあがります。</p>
    <button id="start-btn" class="iv-btn iv-btn-primary" type="button">招待状を作る →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="iv-screen iv-edit" hidden>
    <h2 class="iv-edit-title">招待状をつくろう</h2>
    <div id="themes" class="iv-themes" role="radiogroup" aria-label="招待状のテーマ">
      <button type="button" class="iv-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="iv-theme-emoji" aria-hidden="true">👻</span><span class="iv-theme-name">おばけ</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="1" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🎃</span><span class="iv-theme-name">かぼちゃ</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="2" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🦇</span><span class="iv-theme-name">コウモリ</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="3" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🧙</span><span class="iv-theme-name">魔女</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="4" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🕷️</span><span class="iv-theme-name">クモ</span></button>
    </div>
    <div class="iv-preview"><canvas id="preview-canvas" class="iv-canvas" width="1080" height="1500" role="img" aria-label="招待状のプレビュー"></canvas></div>
    <label class="iv-field" for="f-title"><span class="iv-label">パーティー名</span>
      <input id="f-title" class="iv-input" type="text" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：おばけ屋敷パーティー">
    </label>
    <div class="iv-row">
      <label class="iv-field" for="f-date"><span class="iv-label">日付</span>
        <input id="f-date" class="iv-input" type="date" min="2000-01-01" max="2100-12-31">
      </label>
      <label class="iv-field" for="f-time"><span class="iv-label">時間</span>
        <input id="f-time" class="iv-input" type="time">
      </label>
    </div>
    <label class="iv-field" for="f-place"><span class="iv-label">場所</span>
      <input id="f-place" class="iv-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：わが家の3階">
    </label>
    <label class="iv-field" for="f-note"><span class="iv-label">ひとこと</span>
      <input id="f-note" class="iv-input" type="text" maxlength="240" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="例：仮装でお越しください！">
    </label>
    <button id="done-btn" class="iv-btn iv-btn-primary" type="button">招待状を完成</button>
    <div class="mg-ad"></div>
  </section>

      <div class="iv-end-actions">
        <button id="save-btn" class="iv-btn iv-btn-primary iv-btn-sm" type="button"><span aria-hidden="true">📥</span> 画像を保存</button>
        <button id="copy-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">📋</span> テキストをコピー</button>
        <button id="edit-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">✏️</span> 直す</button>
      </div>
      <p id="save-status" class="iv-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="invite"></div>
  </section>
