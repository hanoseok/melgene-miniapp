<main class="iv-shell">
  <!-- 시작 화면: 티징만 (배지·봉투 그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="iv-screen iv-start">
    <p class="iv-badge">🎃 Đặc biệt Halloween</p>
    <div class="iv-hero" aria-hidden="true"><span class="iv-hero-bat">🦇</span><span class="iv-hero-env">💌</span><span class="iv-hero-pumpkin">🎃</span><span class="iv-hero-ghost">👻</span></div>
    <h1 class="iv-h1"><span class="iv-kicker">Thiệp mời tiệc Halloween</span><span class="iv-h1-main">Mời bạn bè đến<br><em>bữa tiệc rùng rợn</em></span></h1>
    <p class="iv-hook">Đặt tên cho bữa tiệc, chọn một chủ đề ma quái và gửi tấm thiệp khiến ai nhận được cũng muốn mở ra xem.</p>
    <button id="start-btn" class="iv-btn iv-btn-primary" type="button">Tạo thiệp mời →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="iv-screen iv-edit" hidden>
    <h2 class="iv-edit-title">Thiết kế thiệp mời</h2>
    <div id="themes" class="iv-themes" role="radiogroup" aria-label="Chủ đề thiệp mời">
      <button type="button" class="iv-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="iv-theme-emoji" aria-hidden="true">👻</span><span class="iv-theme-name">Ma</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="1" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🎃</span><span class="iv-theme-name">Bí ngô</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="2" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🦇</span><span class="iv-theme-name">Dơi</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="3" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🧙</span><span class="iv-theme-name">Phù thủy</span></button>
      <button type="button" class="iv-theme" role="radio" data-t="4" aria-checked="false"><span class="iv-theme-emoji" aria-hidden="true">🕷️</span><span class="iv-theme-name">Nhện</span></button>
    </div>
    <div class="iv-preview"><canvas id="preview-canvas" class="iv-canvas" width="1080" height="1500" role="img" aria-label="Xem trước thiệp mời"></canvas></div>
    <label class="iv-field" for="f-title"><span class="iv-label">Tên bữa tiệc</span>
      <input id="f-title" class="iv-input" type="text" maxlength="90" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="vd: Tiệc nhà ma ám">
    </label>
    <div class="iv-row">
      <label class="iv-field" for="f-date"><span class="iv-label">Ngày</span>
        <input id="f-date" class="iv-input" type="date" min="2000-01-01" max="2100-12-31">
      </label>
      <label class="iv-field" for="f-time"><span class="iv-label">Giờ</span>
        <input id="f-time" class="iv-input" type="time">
      </label>
    </div>
    <label class="iv-field" for="f-place"><span class="iv-label">Địa điểm</span>
      <input id="f-place" class="iv-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="vd: Nhà mình, tầng 3">
    </label>
    <label class="iv-field" for="f-note"><span class="iv-label">Lời nhắn cho khách</span>
      <input id="f-note" class="iv-input" type="text" maxlength="240" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="vd: Nhớ hóa trang nhé!">
    </label>
    <button id="done-btn" class="iv-btn iv-btn-primary" type="button">Hoàn tất thiệp mời</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 완성 초대장(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="iv-screen iv-end" hidden>
    <article class="iv-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="iv-eyebrow"></p>
      <h2 id="end-title" class="iv-sr"></h2>
      <canvas id="end-canvas" class="iv-canvas iv-end-canvas" width="1080" height="1500" role="img"></canvas>
      <div class="iv-end-actions">
        <button id="save-btn" class="iv-btn iv-btn-primary iv-btn-sm" type="button"><span aria-hidden="true">📥</span> Lưu thành ảnh</button>
        <button id="copy-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">📋</span> Sao chép nội dung</button>
        <button id="edit-btn" class="iv-btn iv-btn-soft iv-btn-sm" type="button"><span aria-hidden="true">✏️</span> Chỉnh sửa</button>
      </div>
      <p id="save-status" class="iv-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="invite"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Tạo thiệp mời tiệc Halloween · <a href="privacy.html">Chính sách bảo mật</a>
  </footer>
</main>
