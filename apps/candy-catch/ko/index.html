      <p id="combo" class="cc-combo" aria-live="polite"></p>

        <button id="resume-btn" class="cc-btn cc-btn-primary cc-btn-sm" type="button">계속하기</button>
      </div>
    </div>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="cc-screen cc-end" hidden>
    <article class="cc-result" aria-labelledby="res-score">
      <p id="res-reason" class="cc-eyebrow"></p>
      <p class="cc-score-line"><span id="res-score" class="cc-score-big">0</span> <span class="cc-points">점</span></p>

        <div class="cc-stat"><dt>받은 사탕</dt><dd id="res-caught">0</dd></div>
        <div class="cc-stat"><dt>최대 콤보</dt><dd id="res-streak">0</dd></div>
      </dl>
      <div id="res-rank" class="cc-rank" hidden>
        <p id="res-comparing" class="cc-comparing">다른 사람들과 비교하는 중…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="cc-top"></p>
          <p id="res-beat" class="cc-beat"></p>
          <p id="res-others" class="cc-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="candy-catch"></div>
  </section>
