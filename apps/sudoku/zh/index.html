<main class="sd-shell">
  <!-- 시작 화면: 티징 + 아주 짧은 방법 + 난이도 + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="sd-screen sd-start">
    <p class="sd-badge">🔢 逻辑谜题 · 4种难度</p>
    <div class="sd-hero" aria-hidden="true"><i class="sd-hc">5</i><i class="sd-hc"></i><i class="sd-hc">8</i><i class="sd-hc sd-hc-sel"></i><i class="sd-hc">3</i><i class="sd-hc sd-hc-n"><b>2</b><b>4</b><b>9</b></i><i class="sd-hc">1</i><i class="sd-hc"></i><i class="sd-hc">7</i></div>
    <h1 class="sd-h1"><span class="sd-kicker">数独</span><span class="sd-h1-main">填满九宫格<br>享受<em>纯粹</em>的推理</span></h1>
    <p class="sd-hook">让每一行、每一列、每个3×3宫都恰好包含1到9。不用计算，也不用瞎猜，只要静下心推理，整个盘面就会严丝合缝。</p>
    <ul class="sd-how">
      <li><span class="sd-how-ico" aria-hidden="true">👆</span><span class="sd-how-txt">点选格子</span></li>
      <li><span class="sd-how-ico" aria-hidden="true">🔢</span><span class="sd-how-txt">选择数字</span></li>
      <li><span class="sd-how-ico" aria-hidden="true">✏️</span><span class="sd-how-txt">不确定就记笔记</span></li>
    </ul>
    <div id="diffs" class="sd-diffs" role="radiogroup" aria-label="选择难度">
      <button type="button" class="sd-diff" role="radio" aria-checked="true" tabindex="0" data-diff="easy"><span class="sd-diff-dots" aria-hidden="true">●○○○</span><span class="sd-diff-name">简单</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="medium"><span class="sd-diff-dots" aria-hidden="true">●●○○</span><span class="sd-diff-name">中等</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="hard"><span class="sd-diff-dots" aria-hidden="true">●●●○</span><span class="sd-diff-name">困难</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="expert"><span class="sd-diff-dots" aria-hidden="true">●●●●</span><span class="sd-diff-name">专家</span></button>
    </div>
    <button id="resume-btn" class="sd-btn sd-btn-resume" type="button" hidden><span class="sd-btn-main">继续游戏</span><span id="resume-info" class="sd-btn-sub"></span></button>
    <button id="start-btn" class="sd-btn sd-btn-primary" type="button">开始新题 →</button>
    <button id="daily-btn" class="sd-btn sd-btn-ghost" type="button"><span aria-hidden="true">📅</span> 每日一题</button>
    <p class="sd-facts">唯一解 · 边玩边自动保存</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 판 + 도구 + 숫자 패드 (광고 없음) -->

    <div class="sd-hud">
      <div class="sd-hud-box"><span class="sd-hud-label">难度</span><span id="hud-level" class="sd-hud-val sd-hud-level"></span></div>
      <div class="sd-hud-box"><span class="sd-hud-label">错误</span><span id="hud-mistakes" class="sd-hud-val" aria-live="off">0</span></div>
      <div class="sd-hud-box"><span class="sd-hud-label">用时</span><span id="hud-time" class="sd-hud-val" aria-live="off">0:00</span></div>
    </div>
    <div id="field" class="sd-field">
      <div id="board" class="sd-board" role="group" aria-label="数独盘面。先选一个格子，再点下方数字键盘上的数字。"></div>
      <button id="pause-btn" class="sd-pause" type="button" hidden>已暂停 · 点击继续</button>
    </div>
    <div class="sd-tools">
      <button id="undo-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">↶</span><span class="sd-tool-txt">撤销</span></button>
      <button id="erase-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">⌫</span><span class="sd-tool-txt">擦除</span></button>
      <button id="notes-btn" class="sd-tool" type="button" aria-pressed="false"><span class="sd-tool-ico" aria-hidden="true">✎</span><span class="sd-tool-txt">笔记</span></button>

      <button id="check-btn" class="sd-tool" type="button" aria-pressed="false"><span class="sd-tool-ico" aria-hidden="true">✓</span><span class="sd-tool-txt">查错</span></button>

    <div id="pad" class="sd-pad" role="group" aria-label="数字">
      <button type="button" class="sd-key" data-n="1"><span class="sd-key-n">1</span><span class="sd-key-left">9</span></button>

      <button type="button" class="sd-key" data-n="7"><span class="sd-key-n">7</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="8"><span class="sd-key-n">8</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="9"><span class="sd-key-n">9</span><span class="sd-key-left">9</span></button>

  </section>

  <!-- 끝 화면: 결과 카드 → 공통 끝 화면 -->
  <section id="screen-end" class="sd-screen sd-end" hidden>
    <article class="sd-result" aria-labelledby="res-big">
      <p id="res-reason" class="sd-eyebrow"></p>
      <p class="sd-tier-line"><span class="sd-tier-emoji" aria-hidden="true">🏆</span><span class="sd-tier">解开啦！</span></p>
      <p class="sd-score-line"><span id="res-big" class="sd-score-big">0:00</span></p>
      <p id="res-newbest" class="sd-newbest" hidden>刷新最佳用时！</p>
      <p id="res-best" class="sd-best"></p>
      <dl class="sd-stats">
        <div class="sd-stat"><dt>错误</dt><dd id="res-mistakes" class="sd-stat-num"></dd></div>
        <div class="sd-stat"><dt>提示</dt><dd id="res-hints" class="sd-stat-num"></dd></div>
      </dl>
      <div id="res-rank" class="sd-rank" hidden>
        <p id="res-comparing" class="sd-comparing">正在与其他玩家比较…</p>

          <p id="res-top" class="sd-top"></p>
          <p id="res-beat" class="sd-beat"></p>
          <p id="res-others" class="sd-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="sudoku"></div>
  </section>
