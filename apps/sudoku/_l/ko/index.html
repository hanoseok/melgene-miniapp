<main class="sd-shell">
  <!-- 시작 화면: 티징 + 아주 짧은 방법 + 난이도 + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="sd-screen sd-start">
    <p class="sd-badge">🔢 두뇌 퍼즐 · 4단계</p>
    <div class="sd-hero" aria-hidden="true"><i class="sd-hc">5</i><i class="sd-hc"></i><i class="sd-hc">8</i><i class="sd-hc sd-hc-sel"></i><i class="sd-hc">3</i><i class="sd-hc sd-hc-n"><b>2</b><b>4</b><b>9</b></i><i class="sd-hc">1</i><i class="sd-hc"></i><i class="sd-hc">7</i></div>
    <h1 class="sd-h1"><span class="sd-kicker">스도쿠</span><span class="sd-h1-main">빈칸을 채우는<br>순수한 <em>논리</em>의 시간</span></h1>
    <p class="sd-hook">가로줄, 세로줄, 3×3 칸마다 1부터 9까지 한 번씩. 계산도 찍기도 필요 없어요. 차분하게 추리하다 보면 판이 딱 맞아떨어집니다.</p>
    <ul class="sd-how">
      <li><span class="sd-how-ico" aria-hidden="true">👆</span><span class="sd-how-txt">칸을 누르고</span></li>
      <li><span class="sd-how-ico" aria-hidden="true">🔢</span><span class="sd-how-txt">숫자를 고르고</span></li>
      <li><span class="sd-how-ico" aria-hidden="true">✏️</span><span class="sd-how-txt">헷갈리면 메모</span></li>
    </ul>
    <div id="diffs" class="sd-diffs" role="radiogroup" aria-label="난이도 고르기">
      <button type="button" class="sd-diff" role="radio" aria-checked="true" tabindex="0" data-diff="easy"><span class="sd-diff-dots" aria-hidden="true">●○○○</span><span class="sd-diff-name">쉬움</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="medium"><span class="sd-diff-dots" aria-hidden="true">●●○○</span><span class="sd-diff-name">보통</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="hard"><span class="sd-diff-dots" aria-hidden="true">●●●○</span><span class="sd-diff-name">어려움</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="expert"><span class="sd-diff-dots" aria-hidden="true">●●●●</span><span class="sd-diff-name">전문가</span></button>
    </div>
    <button id="resume-btn" class="sd-btn sd-btn-resume" type="button" hidden><span class="sd-btn-main">이어서 하기</span><span id="resume-info" class="sd-btn-sub"></span></button>
    <button id="start-btn" class="sd-btn sd-btn-primary" type="button">새 퍼즐 시작 →</button>
    <button id="daily-btn" class="sd-btn sd-btn-ghost" type="button"><span aria-hidden="true">📅</span> 오늘의 퍼즐</button>
    <p class="sd-facts">정답은 단 하나 · 하는 동안 자동 저장</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 판 + 도구 + 숫자 패드 (광고 없음) -->
  <section id="screen-play" class="sd-screen sd-play" hidden>
    <div class="sd-hud">
      <div class="sd-hud-box"><span class="sd-hud-label">난이도</span><span id="hud-level" class="sd-hud-val sd-hud-level"></span></div>
      <div class="sd-hud-box"><span class="sd-hud-label">실수</span><span id="hud-mistakes" class="sd-hud-val" aria-live="off">0</span></div>
      <div class="sd-hud-box"><span class="sd-hud-label">시간</span><span id="hud-time" class="sd-hud-val" aria-live="off">0:00</span></div>
    </div>
    <div id="field" class="sd-field">
      <div id="board" class="sd-board" role="group" aria-label="스도쿠 판. 칸을 고른 뒤 아래 숫자판에서 숫자를 누르세요."></div>
      <button id="pause-btn" class="sd-pause" type="button" hidden>일시정지 · 누르면 계속</button>
    </div>
    <div class="sd-tools">
      <button id="undo-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">↶</span><span class="sd-tool-txt">되돌리기</span></button>
      <button id="erase-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">⌫</span><span class="sd-tool-txt">지우기</span></button>
      <button id="notes-btn" class="sd-tool" type="button" aria-pressed="false"><span class="sd-tool-ico" aria-hidden="true">✎</span><span class="sd-tool-txt">메모</span></button>
      <button id="hint-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">✦</span><span class="sd-tool-txt">힌트</span><span id="hint-left" class="sd-tool-badge">3</span></button>
      <button id="check-btn" class="sd-tool" type="button" aria-pressed="false"><span class="sd-tool-ico" aria-hidden="true">✓</span><span class="sd-tool-txt">오답 표시</span></button>
    </div>
    <div id="pad" class="sd-pad" role="group" aria-label="숫자">
      <button type="button" class="sd-key" data-n="1"><span class="sd-key-n">1</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="2"><span class="sd-key-n">2</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="3"><span class="sd-key-n">3</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="4"><span class="sd-key-n">4</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="5"><span class="sd-key-n">5</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="6"><span class="sd-key-n">6</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="7"><span class="sd-key-n">7</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="8"><span class="sd-key-n">8</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="9"><span class="sd-key-n">9</span><span class="sd-key-left">9</span></button>
    </div>
  </section>

  <!-- 끝 화면: 결과 카드 → 공통 끝 화면 -->
  <section id="screen-end" class="sd-screen sd-end" hidden>
    <article class="sd-result" aria-labelledby="res-big">
      <p id="res-reason" class="sd-eyebrow"></p>
      <p class="sd-tier-line"><span class="sd-tier-emoji" aria-hidden="true">🏆</span><span class="sd-tier">퍼즐 완성!</span></p>
      <p class="sd-score-line"><span id="res-big" class="sd-score-big">0:00</span></p>
      <p id="res-newbest" class="sd-newbest" hidden>최고 기록 갱신!</p>
      <p id="res-best" class="sd-best"></p>
      <dl class="sd-stats">
        <div class="sd-stat"><dt>실수</dt><dd id="res-mistakes" class="sd-stat-num"></dd></div>
        <div class="sd-stat"><dt>힌트</dt><dd id="res-hints" class="sd-stat-num"></dd></div>
      </dl>
      <div id="res-rank" class="sd-rank" hidden>
        <p id="res-comparing" class="sd-comparing">다른 플레이어와 비교하는 중…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="sd-top"></p>
          <p id="res-beat" class="sd-beat"></p>
          <p id="res-others" class="sd-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="sudoku"></div>
  </section>
