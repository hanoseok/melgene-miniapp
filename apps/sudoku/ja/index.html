<main class="sd-shell">
  <!-- 시작 화면: 티징 + 아주 짧은 방법 + 난이도 + 맨 아래 광고 1개 — FAQ·SEO 글 없음 -->
  <section id="screen-start" class="sd-screen sd-start">
    <p class="sd-badge">🔢 ロジックパズル · 4段階</p>
    <div class="sd-hero" aria-hidden="true"><i class="sd-hc">5</i><i class="sd-hc"></i><i class="sd-hc">8</i><i class="sd-hc sd-hc-sel"></i><i class="sd-hc">3</i><i class="sd-hc sd-hc-n"><b>2</b><b>4</b><b>9</b></i><i class="sd-hc">1</i><i class="sd-hc"></i><i class="sd-hc">7</i></div>
    <h1 class="sd-h1"><span class="sd-kicker">数独</span><span class="sd-h1-main">マスを埋める<br><em>ひらめき</em>のひととき</span></h1>
    <p class="sd-hook">縦の列、横の行、3×3のブロックに1〜9を1つずつ。計算も当てずっぽうもいりません。じっくり考えれば、盤面がぴたりとそろいます。</p>
    <ul class="sd-how">
      <li><span class="sd-how-ico" aria-hidden="true">👆</span><span class="sd-how-txt">マスを選んで</span></li>
      <li><span class="sd-how-ico" aria-hidden="true">🔢</span><span class="sd-how-txt">数字を入れる</span></li>
      <li><span class="sd-how-ico" aria-hidden="true">✏️</span><span class="sd-how-txt">迷ったらメモ</span></li>
    </ul>
    <div id="diffs" class="sd-diffs" role="radiogroup" aria-label="難易度を選ぶ">
      <button type="button" class="sd-diff" role="radio" aria-checked="true" tabindex="0" data-diff="easy"><span class="sd-diff-dots" aria-hidden="true">●○○○</span><span class="sd-diff-name">初級</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="medium"><span class="sd-diff-dots" aria-hidden="true">●●○○</span><span class="sd-diff-name">中級</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="hard"><span class="sd-diff-dots" aria-hidden="true">●●●○</span><span class="sd-diff-name">上級</span></button>
      <button type="button" class="sd-diff" role="radio" aria-checked="false" tabindex="-1" data-diff="expert"><span class="sd-diff-dots" aria-hidden="true">●●●●</span><span class="sd-diff-name">超上級</span></button>
    </div>
    <button id="resume-btn" class="sd-btn sd-btn-resume" type="button" hidden><span class="sd-btn-main">続きから遊ぶ</span><span id="resume-info" class="sd-btn-sub"></span></button>
    <button id="start-btn" class="sd-btn sd-btn-primary" type="button">新しい問題 →</button>
    <button id="daily-btn" class="sd-btn sd-btn-ghost" type="button"><span aria-hidden="true">📅</span> 今日の問題</button>
    <p class="sd-facts">答えはひとつだけ · プレイ中は自動保存</p>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 게임 화면: HUD + 판 + 도구 + 숫자 패드 (광고 없음) -->
  <section id="screen-play" class="sd-screen sd-play" hidden>
    <div class="sd-hud">
      <div class="sd-hud-box"><span class="sd-hud-label">難易度</span><span id="hud-level" class="sd-hud-val sd-hud-level"></span></div>
      <div class="sd-hud-box"><span class="sd-hud-label">ミス</span><span id="hud-mistakes" class="sd-hud-val" aria-live="off">0</span></div>
      <div class="sd-hud-box"><span class="sd-hud-label">タイム</span><span id="hud-time" class="sd-hud-val" aria-live="off">0:00</span></div>
    </div>
    <div id="field" class="sd-field">
      <div id="board" class="sd-board" role="group" aria-label="数独の盤面。マスを選んでから、下の数字パッドで数字を選んでください。"></div>
      <button id="pause-btn" class="sd-pause" type="button" hidden>一時停止中 · タップで再開</button>
    </div>
    <div class="sd-tools">
      <button id="undo-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">↶</span><span class="sd-tool-txt">戻す</span></button>
      <button id="erase-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">⌫</span><span class="sd-tool-txt">消す</span></button>
      <button id="notes-btn" class="sd-tool" type="button" aria-pressed="false"><span class="sd-tool-ico" aria-hidden="true">✎</span><span class="sd-tool-txt">メモ</span></button>
      <button id="hint-btn" class="sd-tool" type="button"><span class="sd-tool-ico" aria-hidden="true">✦</span><span class="sd-tool-txt">ヒント</span><span id="hint-left" class="sd-tool-badge">3</span></button>
      <button id="check-btn" class="sd-tool" type="button" aria-pressed="false"><span class="sd-tool-ico" aria-hidden="true">✓</span><span class="sd-tool-txt">ミス表示</span></button>
    </div>
    <div id="pad" class="sd-pad" role="group" aria-label="数字">
      <button type="button" class="sd-key" data-n="1"><span class="sd-key-n">1</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="2"><span class="sd-key-n">2</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="3"><span class="sd-key-n">3</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="4"><span class="sd-key-n">4</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="5"><span class="sd-key-n">5</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="6"><span class="sd-key-n">6</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="7"><span class="sd-key-n">7</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="8"><span class="sd-key-n">8</span><span class="sd-key-left">9</span></button>
      <button type="button" class="sd-key" data-n="9"><span class="sd-key-n">9</span><span class="sd-key-left">9</span></button>
    </div>
  </section>

  <!-- 끝 화면: 결과 카드 → 공통 끝 화면 -->
  <section id="screen-end" class="sd-screen sd-end" hidden>
    <article class="sd-result" aria-labelledby="res-big">
      <p id="res-reason" class="sd-eyebrow"></p>
      <p class="sd-tier-line"><span class="sd-tier-emoji" aria-hidden="true">🏆</span><span class="sd-tier">クリア！</span></p>
      <p class="sd-score-line"><span id="res-big" class="sd-score-big">0:00</span></p>
      <p id="res-newbest" class="sd-newbest" hidden>ベストタイム更新！</p>
      <p id="res-best" class="sd-best"></p>
      <dl class="sd-stats">
        <div class="sd-stat"><dt>ミス</dt><dd id="res-mistakes" class="sd-stat-num"></dd></div>
        <div class="sd-stat"><dt>ヒント</dt><dd id="res-hints" class="sd-stat-num"></dd></div>
      </dl>
      <div id="res-rank" class="sd-rank" hidden>
        <p id="res-comparing" class="sd-comparing">ほかのプレイヤーと比べています…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="sd-top"></p>
          <p id="res-beat" class="sd-beat"></p>
          <p id="res-others" class="sd-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="sudoku"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 数独（ナンプレ） · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>

<script>window.MG_FAQ = [{"q":"数独（ナンプレ）の遊び方は？","a":"どの行・列・3×3のブロックにも1〜9の数字が1つずつ入るように、空いているマスを埋めます。マスをタップしてから、下の数字パッドで数字を選んでください。濃い色の数字は最初から入っている数字で、変更できません。"},{"q":"メモ・ヒント・ミス表示とは？","a":"メモは、入りそうな候補の数字をマスに小さく書いておく機能です。ヒントは正しい数字を1マス埋めてくれます（1問につき3回）。ミス表示をオンにすると正解と違う数字が赤くなり、オフのときは同じ行・列・ブロック内の重複だけが表示されます。"},{"q":"答えは本当にひとつだけですか？","a":"はい。問題はブラウザの中で作られ、表示する前に解答プログラムが答えがひとつだけかを確かめています。なので当てずっぽうなしで、理詰めで解けます。初級は基本の考え方だけ、超上級はさらに深い推理が必要です。"},{"q":"ページを閉じたらどうなりますか？","a":"プレイ中の盤面はこのブラウザに自動で保存されます。もう一度開いて「続きから遊ぶ」を押せば、途中から再開できます。ほかのタブに移るとタイマーも止まります。今日の問題は難易度ごとに全員共通で、日本時間の午前9時（UTCの0時）に切り替わります。"}];</script>
