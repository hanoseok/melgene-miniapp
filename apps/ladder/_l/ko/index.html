  <!-- 시작 화면: 티징(훅 한 줄 + 시작에 필요한 입력 + 시작 버튼)만 -->
  <section id="screen-setup" class="ldr-setup">
    <div class="ldr-badge">🪜 무료 온라인</div>
    <h1>결과가 궁금하면<br><em>사다리타기</em></h1>
    <p class="ldr-hook">인원과 결과만 채우면 끝. 점심 메뉴부터 내기, 순서 정하기까지 공정하게 골라드려요.</p>

    <div class="ldr-card">
      <div class="ldr-field-label">인원 수</div>
      <div class="ldr-stepper">
        <button type="button" id="count-minus" class="ldr-step-btn" aria-label="인원 줄이기">−</button>
        <div class="ldr-step-num" id="count-num">4</div>
        <button type="button" id="count-plus" class="ldr-step-btn" aria-label="인원 늘리기">+</button>
      </div>

      <div class="ldr-field-label">빠른 선택</div>
      <div class="ldr-presets" id="preset-row">
        <button type="button" class="ldr-preset-btn" data-preset="lunch">🍜 점심 메뉴</button>
        <button type="button" class="ldr-preset-btn" data-preset="coffee">☕ 커피 내기</button>
        <button type="button" class="ldr-preset-btn" data-preset="clean">🧹 청소 당번</button>
        <button type="button" class="ldr-preset-btn" data-preset="order">🔢 순서 정하기</button>
      </div>

      <div class="ldr-field-label">참가자</div>
      <div id="names-list" class="ldr-edit-list"></div>

      <div class="ldr-field-label-row">
        <div class="ldr-field-label">결과</div>
        <button type="button" id="shuffle-results-btn" class="ldr-mini-btn">🔀 결과 섞기</button>
      </div>
      <div id="results-list" class="ldr-edit-list"></div>

      <button type="button" id="build-btn" class="ldr-btn ldr-btn-primary">사다리 만들기 →</button>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 플레이 화면 -->
  <section id="screen-play" class="ldr-play">
    <div class="ldr-play-toolbar">
      <button type="button" id="edit-btn" class="ldr-mini-btn">← 다시 설정</button>
      <button type="button" id="rebuild-btn" class="ldr-mini-btn ldr-mini-btn-accent">🔁 다시 만들기</button>
    </div>

    <div class="ldr-board" id="ladder-board">
      <div class="ldr-row ldr-players" id="players-row"></div>
      <div class="ldr-canvas-wrap" id="canvas-wrap">
        <canvas id="ladder-canvas"></canvas>
      </div>
      <div class="ldr-row ldr-results" id="results-row"></div>
    </div>
    <p class="ldr-hint">참가자를 탭하면 경로가 그려져요</p>

    <button type="button" id="reveal-all-btn" class="ldr-btn ldr-btn-secondary">전체 결과 보기</button>

    <!-- 결과(앱 결과) 바로 아래에 공통 끝 화면: 별점·하트 → 광고 → 공유 → FAQ → 다시 하기 → 다른 미니앱 -->
    <div id="results-section" class="ldr-results-section">
      <div class="ldr-section-title">최종 결과</div>
      <table class="ldr-results-table" id="results-table"></table>
      <div data-mg-end="ladder"></div>
    </div>

  </section>

  <footer class="site-footer">
    © <span id="year"></span> 사다리타기 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
