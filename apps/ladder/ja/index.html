  <section id="screen-setup" class="ldr-setup">
    <div class="ldr-badge">🪜 無料オンライン</div>
    <h1>迷ったときは<br><em>あみだくじ</em></h1>
    <p class="ldr-hook">名前と結果を入れるだけ。ランチ決めからおごり決め、順番決めまで、公平に決めちゃいます。</p>

    <div class="ldr-card">
      <div class="ldr-field-label">人数</div>
      <div class="ldr-stepper">
        <button type="button" id="count-minus" class="ldr-step-btn" aria-label="人数を減らす">−</button>
        <div class="ldr-step-num" id="count-num">4</div>
        <button type="button" id="count-plus" class="ldr-step-btn" aria-label="人数を増やす">+</button>
      </div>

      <div class="ldr-field-label">かんたん設定</div>
      <div class="ldr-presets" id="preset-row">
        <button type="button" class="ldr-preset-btn" data-preset="lunch">🍱 ランチ決め</button>
        <button type="button" class="ldr-preset-btn" data-preset="coffee">☕ おごり決め</button>
        <button type="button" class="ldr-preset-btn" data-preset="clean">🧹 掃除当番</button>
        <button type="button" class="ldr-preset-btn" data-preset="order">🔢 順番決め</button>
      </div>

      <div class="ldr-field-label">参加者</div>
      <div id="names-list" class="ldr-edit-list"></div>

      <div class="ldr-field-label-row">
        <div class="ldr-field-label">結果</div>
        <button type="button" id="shuffle-results-btn" class="ldr-mini-btn">🔀 シャッフル</button>
      </div>
      <div id="results-list" class="ldr-edit-list"></div>

      <button type="button" id="build-btn" class="ldr-btn ldr-btn-primary">あみだくじを作る →</button>
    </div>
  </section>

  <!-- 플레이 화면 -->

      <button type="button" id="edit-btn" class="ldr-mini-btn">← 設定</button>
      <button type="button" id="rebuild-btn" class="ldr-mini-btn ldr-mini-btn-accent">🔁 作り直す</button>
    </div>

    <div class="ldr-board" id="ladder-board">
      <div class="ldr-row ldr-players" id="players-row"></div>
      <div class="ldr-canvas-wrap" id="canvas-wrap">

      </div>
      <div class="ldr-row ldr-results" id="results-row"></div>

    <p class="ldr-hint">参加者をタップすると線をたどります</p>
