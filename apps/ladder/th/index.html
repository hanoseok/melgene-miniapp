  <section id="screen-setup" class="ldr-setup">
    <div class="ldr-badge">🪜 ฟรีออนไลน์</div>
    <h1>ตัดสินใจไม่ได้เหรอ?<br>ให้<em>บันไดสุ่ม</em>เลือกให้</h1>
    <p class="ldr-hook">ใส่ชื่อกับผลลัพธ์ ที่เหลือปล่อยให้โชคชะตาจัดการ มื้อเที่ยง เลี้ยงกาแฟ เข้าเวร จัดคิว ยุติธรรมทุกเรื่อง</p>

    <div class="ldr-card">
      <div class="ldr-field-label">จำนวนผู้เล่น</div>
      <div class="ldr-stepper">
        <button type="button" id="count-minus" class="ldr-step-btn" aria-label="ลดผู้เล่น">−</button>
        <div class="ldr-step-num" id="count-num">4</div>
        <button type="button" id="count-plus" class="ldr-step-btn" aria-label="เพิ่มผู้เล่น">+</button>
      </div>

      <div class="ldr-field-label">เลือกด่วน</div>
      <div class="ldr-presets" id="preset-row">
        <button type="button" class="ldr-preset-btn" data-preset="lunch">🍜 มื้อเที่ยง</button>
        <button type="button" class="ldr-preset-btn" data-preset="coffee">☕ ใครเลี้ยงกาแฟ</button>
        <button type="button" class="ldr-preset-btn" data-preset="clean">🧹 เข้าเวร</button>
        <button type="button" class="ldr-preset-btn" data-preset="order">🔢 จัดลำดับคิว</button>
      </div>

      <div class="ldr-field-label">ผู้เล่น</div>
      <div id="names-list" class="ldr-edit-list"></div>

      <div class="ldr-field-label-row">
        <div class="ldr-field-label">ผลลัพธ์</div>
        <button type="button" id="shuffle-results-btn" class="ldr-mini-btn">🔀 สลับผลลัพธ์</button>
      </div>
      <div id="results-list" class="ldr-edit-list"></div>

      <button type="button" id="build-btn" class="ldr-btn ldr-btn-primary">สร้างบันได →</button>
    </div>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 플레이 화면 -->
  <section id="screen-play" class="ldr-play">
    <div class="ldr-play-toolbar">
      <button type="button" id="edit-btn" class="ldr-mini-btn">← แก้ไข</button>
      <button type="button" id="rebuild-btn" class="ldr-mini-btn ldr-mini-btn-accent">🔁 สุ่มใหม่</button>
    </div>

    <div class="ldr-board" id="ladder-board">
      <div class="ldr-row ldr-players" id="players-row"></div>
      <div class="ldr-canvas-wrap" id="canvas-wrap">
        <canvas id="ladder-canvas"></canvas>
      </div>
      <div class="ldr-row ldr-results" id="results-row"></div>
    </div>
    <p class="ldr-hint">แตะชื่อผู้เล่นเพื่อดูเส้นทาง</p>
