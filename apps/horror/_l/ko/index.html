<script>window.PAGE_I18N = {"questions":[{"q":"친구들이 동네 끝 폐가에서 하룻밤 자고 오자는 내기를 걸었다. 나는…","choices":["집에 남아서 그 폐가에 얽힌 사연을 인터넷으로 샅샅이 찾아본다","가긴 간다. 대신 손전등, 계획, 2인 1조는 필수","혼자 빠지기 싫어서 따라간다. 밤새 누군가의 옷자락을 꼭 잡고","이미 들어가서 혼자 제일 으스스한 방을 찾고 있다"]},{"q":"자정. 모르는 번호로 전화가 왔는데, 수화기 너머로 느린 숨소리만 들린다.","choices":["끊지 않고 시간을 적어 둔 뒤, 직접 번호를 추적해 본다","바로 끊고 휴대폰을 끈 다음 이불 속으로 숨는다","끊고 나서 단톡방에 \"혹시 이상한 전화 받은 사람?\" 하고 차분히 묻는다","스피커폰으로 돌려 룸메이트들도 듣게 하고 \"누구야?!\" 하고 외친다"]},{"q":"숲길에서 차가 멈췄다. 나무 사이로 불 켜진 오두막이 보인다.","choices":["다들 정하는 대로 따른다. 대신 절대 흩어지지 않기","성큼성큼 가서 문을 두드린다. 별일이야 있겠어?","역할을 나눈다. 둘은 차에 남고 둘은 노크하러, 휴대폰은 충전 완료","문을 잠그고 차 안에서 지도를 보며 다른 길을 찾는다"]},{"q":"위층에서 낡은 오르골이 혼자 울리기 시작했다.","choices":["친구 손을 꼭 잡고 같이 올라간다. 어색하게 웃으면서","모두 아래층에 모으고 침착하게 다 같이 나가자고 한다","혼자 올라가서 작동 원리를 찾아낸다. 다 이유가 있는 법","얼어붙었다가 아무 말 없이 조용히 집을 빠져나간다"]},{"q":"낡은 일기장에 밑줄 친 경고가 있다. \"그 이름을 세 번 부르지 말 것.\"","choices":["세 번 불러 본다. 누군가는 확인해 봐야지","몰래 집에 가져가서 아무에게도 말하기 전에 끝까지 읽어 본다","제자리에 돌려놓고 다들 절대 입 밖에 내지 않기로 약속한다","모두에게 소리 내어 읽어 주고 규칙을 공유한다"]},{"q":"새벽 세 시. 누군가 문을 두드리더니 익숙한 목소리가 내 이름을 부른다.","choices":["같이 사는 사람들을 깨워서 어떻게 할지 함께 정한다","현관 카메라를 확인한 뒤 손전등을 들고 혼자 나가 본다","자는 척하며 숨소리도 내지 않는다","\"그런 수법 안 통해!\" 하고 온 집안이 깰 만큼 크게 외친다"]},{"q":"욕실 거울 속 내가 나보다 한 박자 늦게 눈을 깜빡인다.","choices":["다 불러 모은다. \"한 명씩 제대로 확인해 보자\"","제일 가까운 사람에게 달려가서 오늘 밤은 절대 혼자 안 있는다","눈싸움을 건다. 손도 흔들어 본다. 누가 먼저 깜빡이나 보자","거울을 천으로 덮고 조용히 거울에 얽힌 괴담을 찾아본다"]},{"q":"폭풍우에 정전이 됐다. 집 안이 완전히 깜깜하다.","choices":["그 자리에 웅크리고 불이 다시 들어올 때까지 기다린다","어둠 속에서 괴담 대회를 열어 다 같이 웃게 만든다","혼자 지하실로 내려가 두꺼비집을 확인한다","양초를 나눠 주고 모두 한 방에 모여 있게 한다"]},{"q":"일행 중 누군가 그 유명한 대사를 한다. \"흩어져서 찾아보자.\" 나는…","choices":["사양하고 남아서 자료 조사를 계속한다","\"좋아, 난 저 으스스한 복도 맡을게\" 하고 간다","찬성. 단, 2인 1조로 모일 장소와 신호를 정해 두고","반대. 다 같이 붙어 다닌다. 필요하면 손이라도 잡고"]},{"q":"안개 낀 놀이공원, 점쟁이가 자정 전에 이곳을 떠나라고 경고한다.","choices":["웃어넘기고 친구들을 끌고 마지막으로 놀이기구 하나 더 탄다","당장 떠난다. 필요하면 혼자라도, 뒤도 돌아보지 않고","친구들을 다 불러 모아 가장 안전한 출구를 함께 찾는다","남아서 꼬치꼬치 캐묻는다. 대체 무슨 일인지 알아내야겠다"]},{"q":"매일 아침, 놀이방의 낡은 인형들이 다른 자리로 옮겨져 있다.","choices":["인형을 상자에 넣고 온 가족이 친척 집에 한동안 가 있는다","가족과 함께 카메라를 설치하고 영상을 다 같이 돌려 본다","그 인형들의 예전 주인이 누구였는지 조용히 알아본다","현장을 잡으려고 혼자 놀이방에서 잔다"]}],"qLabel":"장면 {n}"};</script>
