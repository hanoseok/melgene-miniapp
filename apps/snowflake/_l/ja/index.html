  <section id="screen-start" class="sf-screen sf-start">

    <h1 class="sf-h1"><span class="sf-kicker">雪の結晶 作成 · オンラインで</span><span class="sf-h1-main">自分だけの雪の結晶を<br><em>ゆっくり育てよう</em></span></h1>

  <!-- 만들기 (진행 중 화면의 광고 1자리: 맨 아래) -->
  <section id="screen-edit" class="sf-screen sf-edit" hidden>
    <h2 class="sf-edit-title">雪の結晶を作ろう</h2>
    <div class="sf-stage"><canvas id="flake-canvas" class="sf-canvas" width="1080" height="1080" role="img" aria-label="作っている雪の結晶のプレビュー"></canvas></div>
    <div class="sf-sliders">
      <label class="sf-slider" for="in-n">
        <span class="sf-slider-head"><span>片側の枝の数</span><output id="out-n" for="in-n">4</output></span>
        <input id="in-n" type="range" min="2" max="6" step="1" value="4">
      </label>
      <label class="sf-slider" for="in-c">
        <span class="sf-slider-head"><span>細かさ</span><output id="out-c" for="in-c">ふつう</output></span>
        <input id="in-c" type="range" min="1" max="3" step="1" value="2">
      </label>
      <label class="sf-slider" for="in-z">
        <span class="sf-slider-head"><span>枝の長さ</span><output id="out-z" for="in-z">ふつう</output></span>
        <input id="in-z" type="range" min="0" max="2" step="1" value="1">
      </label>
    </div>
    <div class="sf-tools">
      <button id="new-btn" class="sf-tool" type="button">新しい結晶</button>
      <button id="shape-btn" class="sf-tool" type="button"><span class="sf-tool-label">枝の形を変える</span> <span id="shape-name" class="sf-tool-value"></span></button>
      <button id="color-btn" class="sf-tool" type="button"><span class="sf-tool-label">色を変える</span> <span id="color-name" class="sf-tool-value"></span></button>
      <button id="save-btn" class="sf-tool" type="button">PNGで保存</button>
      <button id="share-btn" class="sf-tool" type="button">共有</button>
    </div>
    <p id="edit-status" class="sf-status" aria-live="polite"></p>
    <button id="done-btn" class="sf-btn sf-btn-primary" type="button">できあがり</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 눈꽃(결과) → 공통 끝 화면 -->

      </div>
      <p id="end-status" class="sf-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="snowflake"></div>
