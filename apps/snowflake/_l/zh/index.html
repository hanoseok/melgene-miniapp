<main class="sf-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 도구·FAQ 없음 -->
  <section id="screen-start" class="sf-screen sf-start">
    <p class="sf-badge">❄️ 冬季限定</p>
    <div class="sf-hero" aria-hidden="true"><span class="sf-hero-main">❄️</span><span class="sf-hero-a">✦</span><span class="sf-hero-b">❄</span><span class="sf-hero-c">✧</span></div>
    <h1 class="sf-h1"><span class="sf-kicker">雪花制作 · 在线制作雪花</span><span class="sf-h1-main">长出一朵<br><em>只属于你的雪花</em></span></h1>
    <p class="sf-hook">点几下，一朵完美对称的雪花就慢慢成形了。存成图片，或者把链接发给朋友。</p>
    <button id="start-btn" class="sf-btn sf-btn-primary" type="button">开始制作 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 만들기 (진행 중 화면의 광고 1자리: 맨 아래) -->
  <section id="screen-edit" class="sf-screen sf-edit" hidden>
    <h2 class="sf-edit-title">制作你的雪花</h2>
    <div class="sf-stage"><canvas id="flake-canvas" class="sf-canvas" width="1080" height="1080" role="img" aria-label="正在制作的雪花预览"></canvas></div>
    <div class="sf-sliders">
      <label class="sf-slider" for="in-n">
        <span class="sf-slider-head"><span>单侧分支数</span><output id="out-n" for="in-n">4</output></span>
        <input id="in-n" type="range" min="2" max="6" step="1" value="4">
      </label>
      <label class="sf-slider" for="in-c">
        <span class="sf-slider-head"><span>细致程度</span><output id="out-c" for="in-c">适中</output></span>
        <input id="in-c" type="range" min="1" max="3" step="1" value="2">
      </label>
      <label class="sf-slider" for="in-z">
        <span class="sf-slider-head"><span>分支长度</span><output id="out-z" for="in-z">适中</output></span>
        <input id="in-z" type="range" min="0" max="2" step="1" value="1">
      </label>
    </div>
    <div class="sf-tools">
      <button id="new-btn" class="sf-tool" type="button">新雪花</button>
      <button id="shape-btn" class="sf-tool" type="button"><span class="sf-tool-label">更换分支形状</span> <span id="shape-name" class="sf-tool-value"></span></button>
      <button id="color-btn" class="sf-tool" type="button"><span class="sf-tool-label">更换颜色</span> <span id="color-name" class="sf-tool-value"></span></button>
      <button id="save-btn" class="sf-tool" type="button">保存 PNG</button>
      <button id="share-btn" class="sf-tool" type="button">分享</button>
    </div>
    <p id="edit-status" class="sf-status" aria-live="polite"></p>
    <button id="done-btn" class="sf-btn sf-btn-primary" type="button">做好了</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 눈꽃(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="sf-screen sf-end" hidden>
    <article class="sf-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="sf-eyebrow"></p>
      <h2 id="end-title" class="sf-sr"></h2>
      <div class="sf-end-stage">
        <canvas id="end-canvas" class="sf-canvas sf-end-canvas" width="1080" height="1080" role="img" aria-label="你的雪花完成啦！"></canvas>
      </div>
      <div class="sf-end-actions">
        <button id="end-save" class="sf-btn sf-btn-primary sf-btn-sm" type="button"><span aria-hidden="true">📥</span> 保存 PNG</button>
        <button id="end-edit" class="sf-btn sf-btn-soft sf-btn-sm" type="button"><span aria-hidden="true">✏️</span> 继续制作</button>
      </div>
      <p id="end-status" class="sf-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="snowflake"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 雪花制作器 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>

<script>window.MG_FAQ = [{"q":"雪花要怎么做？","a":"点“新雪花”就会出现一朵新图案。再用下面的三个滑块调整分支数、细致程度和分支长度。雪花由一根分支旋转六次并镜像得到，所以永远是对称的。"},{"q":"形状和颜色按钮有什么用？","a":"“更换分支形状”会在细线、六角片、小刺和羽毛之间切换分支的画法，设计本身不变。“更换颜色”会切换背景和线条的颜色。两者可以在同一个设计上反复试。"},{"q":"怎样保存或分享雪花？","a":"点“保存 PNG”会下载一张 1080×1080 的图片。点“分享”会生成一个包含设置的链接，打开的人会看到同一朵雪花。"},{"q":"我做的雪花会存在服务器上吗？","a":"不会。雪花只保存在图片和链接里。保存或分享时，你做的内容不会上传到我们的服务器。"}];</script>
