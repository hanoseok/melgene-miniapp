<main class="sf-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 도구·FAQ 없음 -->
  <section id="screen-start" class="sf-screen sf-start">
    <p class="sf-badge">❄️ Зимний выпуск</p>
    <div class="sf-hero" aria-hidden="true"><span class="sf-hero-main">❄️</span><span class="sf-hero-a">✦</span><span class="sf-hero-b">❄</span><span class="sf-hero-c">✧</span></div>
    <h1 class="sf-h1"><span class="sf-kicker">Создать снежинку онлайн</span><span class="sf-h1-main">Вырасти снежинку<br><em>только для себя</em></span></h1>
    <p class="sf-hook">Нажми несколько раз и смотри, как появляется идеально симметричная снежинка. Сохрани её картинкой или отправь ссылку другу.</p>
    <button id="start-btn" class="sf-btn sf-btn-primary" type="button">Начать →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 만들기 (진행 중 화면의 광고 1자리: 맨 아래) -->
  <section id="screen-edit" class="sf-screen sf-edit" hidden>
    <h2 class="sf-edit-title">Создай свою снежинку</h2>
    <div class="sf-stage"><canvas id="flake-canvas" class="sf-canvas" width="1080" height="1080" role="img" aria-label="Предпросмотр твоей снежинки"></canvas></div>
    <div class="sf-sliders">
      <label class="sf-slider" for="in-n">
        <span class="sf-slider-head"><span>Лучей с каждой стороны</span><output id="out-n" for="in-n">4</output></span>
        <input id="in-n" type="range" min="2" max="6" step="1" value="4">
      </label>
      <label class="sf-slider" for="in-c">
        <span class="sf-slider-head"><span>Детализация</span><output id="out-c" for="in-c">Средняя</output></span>
        <input id="in-c" type="range" min="1" max="3" step="1" value="2">
      </label>
      <label class="sf-slider" for="in-z">
        <span class="sf-slider-head"><span>Длина лучей</span><output id="out-z" for="in-z">Средние</output></span>
        <input id="in-z" type="range" min="0" max="2" step="1" value="1">
      </label>
    </div>
    <div class="sf-tools">
      <button id="new-btn" class="sf-tool" type="button">Новая снежинка</button>
      <button id="shape-btn" class="sf-tool" type="button"><span class="sf-tool-label">Сменить форму</span> <span id="shape-name" class="sf-tool-value"></span></button>
      <button id="color-btn" class="sf-tool" type="button"><span class="sf-tool-label">Сменить цвет</span> <span id="color-name" class="sf-tool-value"></span></button>
      <button id="save-btn" class="sf-tool" type="button">Сохранить PNG</button>
      <button id="share-btn" class="sf-tool" type="button">Поделиться</button>
    </div>
    <p id="edit-status" class="sf-status" aria-live="polite"></p>
    <button id="done-btn" class="sf-btn sf-btn-primary" type="button">Готово, покажи</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 눈꽃(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="sf-screen sf-end" hidden>
    <article class="sf-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="sf-eyebrow"></p>
      <h2 id="end-title" class="sf-sr"></h2>
      <div class="sf-end-stage">
        <canvas id="end-canvas" class="sf-canvas sf-end-canvas" width="1080" height="1080" role="img" aria-label="Твоя снежинка готова!"></canvas>
      </div>
      <div class="sf-end-actions">
        <button id="end-save" class="sf-btn sf-btn-primary sf-btn-sm" type="button"><span aria-hidden="true">📥</span> Сохранить PNG</button>
        <button id="end-edit" class="sf-btn sf-btn-soft sf-btn-sm" type="button"><span aria-hidden="true">✏️</span> Продолжить</button>
      </div>
      <p id="end-status" class="sf-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="snowflake"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> Snowflake Maker · <a href="privacy.html">Политика конфиденциальности</a> · <a href="guide.html">Гайд</a>
  </footer>
