  <section id="screen-start" class="sf-screen sf-start">
    <p class="sf-badge">❄️ ฤดูหนาวพิเศษ</p>
    <div class="sf-hero" aria-hidden="true"><span class="sf-hero-main">❄️</span><span class="sf-hero-a">✦</span><span class="sf-hero-b">❄</span><span class="sf-hero-c">✧</span></div>
    <h1 class="sf-h1"><span class="sf-kicker">สร้างเกล็ดหิมะออนไลน์</span><span class="sf-h1-main">ค่อยๆ ปลูกเกล็ดหิมะ<br><em>ที่เป็นของคุณคนเดียว</em></span></h1>
    <p class="sf-hook">แตะไม่กี่ครั้ง แล้วดูเกล็ดหิมะที่สมมาตรสมบูรณ์ค่อยๆ ก่อตัวขึ้นตรงหน้า บันทึกเป็นรูปหรือส่งลิงก์ให้เพื่อนก็ได้</p>
    <button id="start-btn" class="sf-btn sf-btn-primary" type="button">เริ่มสร้างเลย →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 만들기 (진행 중 화면의 광고 1자리: 맨 아래) -->
  <section id="screen-edit" class="sf-screen sf-edit" hidden>
    <h2 class="sf-edit-title">สร้างเกล็ดหิมะของคุณ</h2>
    <div class="sf-stage"><canvas id="flake-canvas" class="sf-canvas" width="1080" height="1080" role="img" aria-label="ตัวอย่างเกล็ดหิมะที่กำลังสร้าง"></canvas></div>
    <div class="sf-sliders">
      <label class="sf-slider" for="in-n">
        <span class="sf-slider-head"><span>จำนวนแขนต่อด้าน</span><output id="out-n" for="in-n">4</output></span>
        <input id="in-n" type="range" min="2" max="6" step="1" value="4">
      </label>
      <label class="sf-slider" for="in-c">
        <span class="sf-slider-head"><span>ความละเอียด</span><output id="out-c" for="in-c">ปานกลาง</output></span>
        <input id="in-c" type="range" min="1" max="3" step="1" value="2">
      </label>
      <label class="sf-slider" for="in-z">
        <span class="sf-slider-head"><span>ความยาวของแขน</span><output id="out-z" for="in-z">ปานกลาง</output></span>
        <input id="in-z" type="range" min="0" max="2" step="1" value="1">
      </label>
    </div>
    <div class="sf-tools">
      <button id="new-btn" class="sf-tool" type="button">เกล็ดใหม่</button>
      <button id="shape-btn" class="sf-tool" type="button"><span class="sf-tool-label">เปลี่ยนรูปทรงแขน</span> <span id="shape-name" class="sf-tool-value"></span></button>
      <button id="color-btn" class="sf-tool" type="button"><span class="sf-tool-label">เปลี่ยนสี</span> <span id="color-name" class="sf-tool-value"></span></button>
      <button id="save-btn" class="sf-tool" type="button">บันทึก PNG</button>
      <button id="share-btn" class="sf-tool" type="button">แชร์</button>
    </div>
    <p id="edit-status" class="sf-status" aria-live="polite"></p>
    <button id="done-btn" class="sf-btn sf-btn-primary" type="button">เสร็จแล้ว ดูผลลัพธ์</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 눈꽃(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="sf-screen sf-end" hidden>
    <article class="sf-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="sf-eyebrow"></p>
      <h2 id="end-title" class="sf-sr"></h2>
      <div class="sf-end-stage">
        <canvas id="end-canvas" class="sf-canvas sf-end-canvas" width="1080" height="1080" role="img" aria-label="เกล็ดหิมะของคุณพร้อมแล้ว!"></canvas>
      </div>
      <div class="sf-end-actions">
        <button id="end-save" class="sf-btn sf-btn-primary sf-btn-sm" type="button"><span aria-hidden="true">📥</span> บันทึก PNG</button>
        <button id="end-edit" class="sf-btn sf-btn-soft sf-btn-sm" type="button"><span aria-hidden="true">✏️</span> สร้างต่อ</button>
      </div>
      <p id="end-status" class="sf-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="snowflake"></div>
  </section>

  </footer>
