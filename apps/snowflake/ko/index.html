<header class="mg-top"><a class="mg-home" href="https://example.com/ko/" aria-label="멜진 미니앱 홈으로"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">미니앱</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="언어 선택"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja">日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko" selected>한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="언어 선택"><a href="../" hreflang="en" lang="en">English</a> <a href="../ja/" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="./" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="sf-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 도구·FAQ 없음 -->
  <section id="screen-start" class="sf-screen sf-start">
    <p class="sf-badge">❄️ 겨울 한정</p>
    <div class="sf-hero" aria-hidden="true"><span class="sf-hero-main">❄️</span><span class="sf-hero-a">✦</span><span class="sf-hero-b">❄</span><span class="sf-hero-c">✧</span></div>
    <h1 class="sf-h1"><span class="sf-kicker">눈꽃 만들기 · 눈 결정 만들기</span><span class="sf-h1-main">나만의 눈꽃을<br><em>천천히 피워 보세요</em></span></h1>
    <p class="sf-hook">몇 번 누르면 완벽하게 대칭인 눈 결정이 피어나요. 그림으로 저장하거나 링크를 친구에게 보내 보세요.</p>
    <button id="start-btn" class="sf-btn sf-btn-primary" type="button">눈꽃 만들기 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 만들기 (진행 중 화면의 광고 1자리: 맨 아래) -->
  <section id="screen-edit" class="sf-screen sf-edit" hidden>
    <h2 class="sf-edit-title">눈꽃을 만들어요</h2>
    <div class="sf-stage"><canvas id="flake-canvas" class="sf-canvas" width="1080" height="1080" role="img" aria-label="만들고 있는 눈꽃 미리보기"></canvas></div>
    <div class="sf-sliders">
      <label class="sf-slider" for="in-n">
        <span class="sf-slider-head"><span>한쪽 가지 수</span><output id="out-n" for="in-n">4</output></span>
        <input id="in-n" type="range" min="2" max="6" step="1" value="4">
      </label>
      <label class="sf-slider" for="in-c">
        <span class="sf-slider-head"><span>복잡도</span><output id="out-c" for="in-c">보통</output></span>
        <input id="in-c" type="range" min="1" max="3" step="1" value="2">
      </label>
      <label class="sf-slider" for="in-z">
        <span class="sf-slider-head"><span>가지 길이</span><output id="out-z" for="in-z">보통</output></span>
        <input id="in-z" type="range" min="0" max="2" step="1" value="1">
      </label>
    </div>
    <div class="sf-tools">
      <button id="new-btn" class="sf-tool" type="button">새 눈꽃 만들기</button>
      <button id="shape-btn" class="sf-tool" type="button"><span class="sf-tool-label">가지 모양 바꾸기</span> <span id="shape-name" class="sf-tool-value"></span></button>
      <button id="color-btn" class="sf-tool" type="button"><span class="sf-tool-label">색 바꾸기</span> <span id="color-name" class="sf-tool-value"></span></button>
      <button id="save-btn" class="sf-tool" type="button">PNG로 저장</button>
      <button id="share-btn" class="sf-tool" type="button">공유</button>
    </div>
    <p id="edit-status" class="sf-status" aria-live="polite"></p>
    <button id="done-btn" class="sf-btn sf-btn-primary" type="button">다 만들었어요</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 끝 화면: 눈꽃(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="sf-screen sf-end" hidden>
    <article class="sf-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="sf-eyebrow"></p>
      <h2 id="end-title" class="sf-sr"></h2>
      <div class="sf-end-stage">
        <canvas id="end-canvas" class="sf-canvas sf-end-canvas" width="1080" height="1080" role="img" aria-label="눈꽃이 완성됐어요!"></canvas>
      </div>
      <div class="sf-end-actions">
        <button id="end-save" class="sf-btn sf-btn-primary sf-btn-sm" type="button"><span aria-hidden="true">📥</span> PNG로 저장</button>
        <button id="end-edit" class="sf-btn sf-btn-soft sf-btn-sm" type="button"><span aria-hidden="true">✏️</span> 계속 만들기</button>
      </div>
      <p id="end-status" class="sf-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="snowflake"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 눈꽃 만들기 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
