        <button type="button" id="mood-cool" class="nk-seg-btn" role="radio" data-mood="cool">멋진</button>
        <button type="button" id="mood-funny" class="nk-seg-btn" role="radio" data-mood="funny">웃긴</button>
        <button type="button" id="mood-dreamy" class="nk-seg-btn" role="radio" data-mood="dreamy">몽환적인</button>
        <button type="button" id="mood-mystic" class="nk-seg-btn" role="radio" data-mood="mystic">미스터리</button>
      </div>
      <label class="nk-label" for="name-input">이름이나 글자 (선택)</label>
      <p class="nk-hint">닉네임에 섞어 드려요. 12글자까지, 이 브라우저 안에서만 써요.</p>

    <button type="button" id="make-btn" class="nk-btn nk-btn-primary">닉네임 만들기 🎲</button>
    <div class="mg-ad"></div>
  </section>

    <h2 class="nk-h2">나의 닉네임</h2>

      <span id="nick-mood" class="nk-nick-mood"></span>
      <p id="nick-text" class="nk-nick"></p>
