        <button type="button" id="mood-cool" class="nk-seg-btn" role="radio" data-mood="cool">かっこいい</button>

        <button type="button" id="mood-dreamy" class="nk-seg-btn" role="radio" data-mood="dreamy">ゆめかわ</button>
