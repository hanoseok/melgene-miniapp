    <div class="hue-hud">
      <div class="hue-hud-box hue-hud-level"><span class="hue-hud-label">レベル</span><span id="hud-level" class="hue-hud-val">0</span></div>
      <div class="hue-hud-box hue-hud-time"><span class="hue-hud-label">残り</span><span id="hud-time" class="hue-hud-val">60</span></div>
      <div class="hue-hud-box hue-hud-best"><span class="hue-hud-label">ベスト</span><span id="hud-best" class="hue-hud-val">0</span></div>

      <div id="over-overlay" class="hue-overlay" hidden><p class="hue-over-title">タイムアップ！</p></div>
    </div>
    <p id="play-hint" class="hue-hint" aria-live="polite">色が違うタイルをタップ</p>
  </section>

  <!-- 끝 화면: 점수 카드(결과) → 공통 끝 화면 -->

      <p class="hue-tier"><span class="hue-tier-label">あなたの色彩感覚</span><span id="res-tier" class="hue-tier-name"></span></p>
      <p id="res-newbest" class="hue-newbest" hidden>自己ベスト更新！</p>
      <p id="res-best" class="hue-best"></p>
      <dl class="hue-stats">
        <div class="hue-stat"><dt>ミスした回数</dt><dd id="res-misses">0</dd></div>
        <div class="hue-stat"><dt>最大のマス</dt><dd id="res-grid">2×2</dd></div>
      </dl>
      <div id="res-rank" class="hue-rank" hidden>
        <p id="res-comparing" class="hue-comparing">ほかのプレイヤーと比べています…</p>
        <div id="res-rank-body" hidden>
          <p id="res-top" class="hue-top"></p>
          <p id="res-beat" class="hue-beat"></p>
          <p id="res-others" class="hue-others"></p>
        </div>
      </div>
    </article>
    <div data-mg-end="hue"></div>
  </section>

<script>window.MG_FAQ = [{"q":"遊び方は？","a":"スタートを押すと色のタイルが並びます。どれも同じ色ですが、1枚だけほんの少し明るいか暗くなっています。そのタイルをタップすると次のレベルへ。進むほどマスは増え、色の差は小さくなります。持ち時間は全部で60秒です。"},{"q":"違うタイルを押したらどうなる？","a":"ゲームは終わりませんが、残り時間から3秒引かれ、盤面が揺れます。あてずっぽうで連打するより、1秒よく見てから押すほうがたいてい有利です。"},{"q":"色によって難しさが違うのはなぜ？","a":"人の目は色によって明るさの違いの感じ方が変わります。画面ごとの発色の差や、明るさ・ダークモード・ブルーライトカット・見る角度も影響します。画面を明るくして正面から見てください。"},{"q":"色覚検査ですか？","a":"いいえ。楽しむためのゲームで、医学的な検査ではありません。スコアが低くても目に問題があるという意味ではありません。色の見え方が気になる場合は眼科で相談してください。"}];</script>
