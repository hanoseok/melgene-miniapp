<header class="mg-top"><a class="mg-home" href="https://example.com/ja/" aria-label="メルジン ミニアプリのホームへ"><span class="mg-home-mark" aria-hidden="true"></span><span class="mg-home-word">Melgene</span><span class="mg-home-badge">ミニアプリ</span></a><div class="lang-switch"><label class="lang-select"><span class="lang-globe" aria-hidden="true">🌐</span><select aria-label="言語を選択"><option value="en" data-hreflang="en" lang="en">English</option><option value="ja" data-hreflang="ja" lang="ja" selected>日本語</option><option value="zh" data-hreflang="zh" lang="zh">简体中文</option><option value="ko" data-hreflang="ko" lang="ko">한국어</option><option value="fr" data-hreflang="fr" lang="fr">Français</option><option value="de" data-hreflang="de" lang="de">Deutsch</option><option value="th" data-hreflang="th" lang="th">ไทย</option><option value="vi" data-hreflang="vi" lang="vi">Tiếng Việt</option><option value="es" data-hreflang="es" lang="es">Español</option><option value="it" data-hreflang="it" lang="it">Italiano</option><option value="pt" data-hreflang="pt" lang="pt">Português</option><option value="ru" data-hreflang="ru" lang="ru">Русский</option></select></label><noscript><nav class="lang-links" aria-label="言語を選択"><a href="../" hreflang="en" lang="en">English</a> <a href="./" hreflang="ja" lang="ja">日本語</a> <a href="../zh/" hreflang="zh" lang="zh">简体中文</a> <a href="../ko/" hreflang="ko" lang="ko">한국어</a> <a href="../fr/" hreflang="fr" lang="fr">Français</a> <a href="../de/" hreflang="de" lang="de">Deutsch</a> <a href="../th/" hreflang="th" lang="th">ไทย</a> <a href="../vi/" hreflang="vi" lang="vi">Tiếng Việt</a> <a href="../es/" hreflang="es" lang="es">Español</a> <a href="../it/" hreflang="it" lang="it">Italiano</a> <a href="../pt/" hreflang="pt" lang="pt">Português</a> <a href="../ru/" hreflang="ru" lang="ru">Русский</a></nav></noscript></div></header>

<main class="xc-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="xc-screen xc-start">
    <p class="xc-badge">🎄 年末スペシャル</p>
    <div class="xc-hero" aria-hidden="true"><span class="xc-hero-tree">🎄</span><span class="xc-hero-star">⭐</span><span class="xc-hero-gift">🎁</span><span class="xc-hero-snow">❄️</span><span class="xc-hero-card">💌</span></div>
    <h1 class="xc-h1"><span class="xc-kicker">クリスマスカード作成</span><span class="xc-h1-main">大切な人へ<br><em>あったかい気持ち</em></span></h1>
    <p class="xc-hook">かわいいデザインを選んでひとこと書けば、本物の封筒みたいに開くカードのできあがり。</p>
    <button id="start-btn" class="xc-btn xc-btn-primary" type="button">カードを作る →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="xc-screen xc-edit" hidden>
    <h2 class="xc-edit-title">カードをデザイン</h2>
    <div id="themes" class="xc-chips" role="radiogroup" aria-label="カードのデザイン">
      <button type="button" class="xc-chip xc-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="xc-chip-emoji" aria-hidden="true">🎄</span><span class="xc-chip-name">クラシック</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="1" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">⛄</span><span class="xc-chip-name">雪の夜</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="2" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🔔</span><span class="xc-chip-name">ゴールド</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="3" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🧸</span><span class="xc-chip-name">かわいい</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="4" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🌟</span><span class="xc-chip-name">シンプル</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="5" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🦌</span><span class="xc-chip-name">冬の森</span></button>
    </div>
    <div class="xc-preview"><canvas id="preview-canvas" class="xc-canvas" width="1080" height="1350" role="img" aria-label="カードのプレビュー"></canvas></div>
    <p class="xc-label" id="greet-label">あいさつ</p>
    <div id="greetings" class="xc-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="xc-greet is-on" role="radio" data-g="0" aria-checked="true">メリークリスマス！</button>
      <button type="button" class="xc-greet" role="radio" data-g="1" aria-checked="false">楽しいホリデーを！</button>
      <button type="button" class="xc-greet" role="radio" data-g="2" aria-checked="false">あけましておめでとう！</button>
      <button type="button" class="xc-greet" role="radio" data-g="3" aria-checked="false">よいお年をお迎えください</button>
    </div>
    <p class="xc-label" id="deco-label">かざり</p>
    <div id="decos" class="xc-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="xc-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">❄️</span> 雪</button>
      <button type="button" class="xc-deco" data-bit="2" aria-pressed="false"><span aria-hidden="true">💡</span> ライト</button>
      <button type="button" class="xc-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> キラキラ</button>
    </div>
    <div class="xc-row">
      <label class="xc-field" for="f-to"><span class="xc-label">宛名</span>
        <input id="f-to" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：おばあちゃん">
      </label>
      <label class="xc-field" for="f-from"><span class="xc-label">差出人</span>
        <input id="f-from" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例：ゆい">
      </label>
    </div>
    <div class="xc-field">
      <div class="xc-msg-head"><label class="xc-label" for="f-msg">メッセージ</label><button id="idea-btn" class="xc-idea" type="button">💡 文例</button></div>
      <textarea id="f-msg" class="xc-input xc-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="あったかいひとことを…"></textarea>
      <p id="msg-count" class="xc-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="xc-btn xc-btn-primary" type="button">カードを完成させる</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="xc-screen xc-open" hidden>
    <p class="xc-open-eyebrow">クリスマスカードが届きました</p>
    <p id="open-from" class="xc-open-from"></p>
    <button id="open-btn" class="xc-env" type="button" aria-label="カードを開く">
      <span class="xc-env-back" aria-hidden="true"></span>
      <span class="xc-env-letter" aria-hidden="true">🎄</span>
      <span class="xc-env-front" aria-hidden="true"></span>
      <span class="xc-env-flap" aria-hidden="true"></span>
      <span class="xc-env-seal" aria-hidden="true">❤️</span>
    </button>
    <button id="open-cta" class="xc-btn xc-btn-primary" type="button">カードを開く</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="xc-screen xc-end" hidden>
    <article class="xc-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="xc-eyebrow"></p>
      <h2 id="end-title" class="xc-sr"></h2>
      <canvas id="end-canvas" class="xc-canvas xc-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="xc-end-actions">
        <button id="save-btn" class="xc-btn xc-btn-primary xc-btn-sm" type="button"><span aria-hidden="true">📥</span> 画像を保存</button>
        <button id="copy-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">📋</span> テキストをコピー</button>
        <button id="edit-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">✏️</span> 修正する</button>
      </div>
      <p id="save-status" class="xc-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="xmascard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> クリスマスカード作成 · <a href="privacy.html">プライバシーポリシー</a> · <a href="guide.html">ガイド</a>
  </footer>
</main>
