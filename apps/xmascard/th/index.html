  <section id="screen-start" class="xc-screen xc-start">
    <p class="xc-badge">🎄 พิเศษช่วงปลายปี</p>
    <div class="xc-hero" aria-hidden="true"><span class="xc-hero-tree">🎄</span><span class="xc-hero-star">⭐</span><span class="xc-hero-gift">🎁</span><span class="xc-hero-snow">❄️</span><span class="xc-hero-card">💌</span></div>
    <h1 class="xc-h1"><span class="xc-kicker">ทำการ์ดคริสต์มาส</span><span class="xc-h1-main">ส่งความอบอุ่น<br><em>ให้คนสำคัญ</em></span></h1>
    <p class="xc-hook">เลือกดีไซน์น่ารัก ๆ เขียนข้อความจากใจ แล้วส่งการ์ดที่เปิดออกมาเหมือนซองจดหมายจริง</p>
    <button id="start-btn" class="xc-btn xc-btn-primary" type="button">ทำการ์ดเลย →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="xc-screen xc-edit" hidden>
    <h2 class="xc-edit-title">ตกแต่งการ์ด</h2>
    <div id="themes" class="xc-chips" role="radiogroup" aria-label="ดีไซน์การ์ด">
      <button type="button" class="xc-chip xc-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="xc-chip-emoji" aria-hidden="true">🎄</span><span class="xc-chip-name">คลาสสิก</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="1" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">⛄</span><span class="xc-chip-name">คืนหิมะ</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="2" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🔔</span><span class="xc-chip-name">สีทอง</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="3" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🧸</span><span class="xc-chip-name">น่ารัก</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="4" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🌟</span><span class="xc-chip-name">มินิมอล</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="5" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🦌</span><span class="xc-chip-name">ป่าฤดูหนาว</span></button>
    </div>
    <div class="xc-preview"><canvas id="preview-canvas" class="xc-canvas" width="1080" height="1350" role="img" aria-label="ตัวอย่างการ์ด"></canvas></div>
    <p class="xc-label" id="greet-label">คำอวยพร</p>
    <div id="greetings" class="xc-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="xc-greet is-on" role="radio" data-g="0" aria-checked="true">สุขสันต์วันคริสต์มาส!</button>
      <button type="button" class="xc-greet" role="radio" data-g="1" aria-checked="false">สุขสันต์วันหยุด!</button>
      <button type="button" class="xc-greet" role="radio" data-g="2" aria-checked="false">สวัสดีปีใหม่!</button>
      <button type="button" class="xc-greet" role="radio" data-g="3" aria-checked="false">ขอให้มีความสุขส่งท้ายปี</button>
    </div>
    <p class="xc-label" id="deco-label">ของตกแต่ง</p>
    <div id="decos" class="xc-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="xc-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">❄️</span> หิมะ</button>
      <button type="button" class="xc-deco" data-bit="2" aria-pressed="false"><span aria-hidden="true">💡</span> ไฟประดับ</button>
      <button type="button" class="xc-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> ประกาย</button>
    </div>
    <div class="xc-row">
      <label class="xc-field" for="f-to"><span class="xc-label">ถึง</span>
        <input id="f-to" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น คุณแม่">
      </label>
      <label class="xc-field" for="f-from"><span class="xc-label">จาก</span>
        <input id="f-from" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="เช่น มายด์">
      </label>
    </div>
    <div class="xc-field">
      <div class="xc-msg-head"><label class="xc-label" for="f-msg">ข้อความ</label><button id="idea-btn" class="xc-idea" type="button">💡 ไอเดีย</button></div>
      <textarea id="f-msg" class="xc-input xc-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="เขียนข้อความอบอุ่นสักหน่อย…"></textarea>
      <p id="msg-count" class="xc-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="xc-btn xc-btn-primary" type="button">ทำการ์ดให้เสร็จ</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="xc-screen xc-open" hidden>
    <p class="xc-open-eyebrow">คุณได้รับการ์ดคริสต์มาส</p>
    <p id="open-from" class="xc-open-from"></p>
    <button id="open-btn" class="xc-env" type="button" aria-label="เปิดการ์ด">
      <span class="xc-env-back" aria-hidden="true"></span>
      <span class="xc-env-letter" aria-hidden="true">🎄</span>
      <span class="xc-env-front" aria-hidden="true"></span>
      <span class="xc-env-flap" aria-hidden="true"></span>
      <span class="xc-env-seal" aria-hidden="true">❤️</span>
    </button>
    <button id="open-cta" class="xc-btn xc-btn-primary" type="button">เปิดการ์ด</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="xc-screen xc-end" hidden>
    <article class="xc-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="xc-eyebrow"></p>
      <h2 id="end-title" class="xc-sr"></h2>
      <canvas id="end-canvas" class="xc-canvas xc-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="xc-end-actions">
        <button id="save-btn" class="xc-btn xc-btn-primary xc-btn-sm" type="button"><span aria-hidden="true">📥</span> บันทึกรูป</button>
        <button id="copy-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">📋</span> คัดลอกข้อความ</button>
        <button id="edit-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">✏️</span> แก้ไข</button>
      </div>
      <p id="save-status" class="xc-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="xmascard"></div>
  </section>
