<main class="xc-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="xc-screen xc-start">
    <p class="xc-badge">🎄 年末特辑</p>
    <div class="xc-hero" aria-hidden="true"><span class="xc-hero-tree">🎄</span><span class="xc-hero-star">⭐</span><span class="xc-hero-gift">🎁</span><span class="xc-hero-snow">❄️</span><span class="xc-hero-card">💌</span></div>
    <h1 class="xc-h1"><span class="xc-kicker">圣诞贺卡制作</span><span class="xc-h1-main">给重要的人<br><em>送上一份温暖</em></span></h1>
    <p class="xc-hook">挑一个喜欢的设计，写几句心里话，做一张像真信封一样拆开的贺卡。</p>
    <button id="start-btn" class="xc-btn xc-btn-primary" type="button">开始做贺卡 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="xc-screen xc-edit" hidden>
    <h2 class="xc-edit-title">设计你的贺卡</h2>
    <div id="themes" class="xc-chips" role="radiogroup" aria-label="贺卡设计">
      <button type="button" class="xc-chip xc-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="xc-chip-emoji" aria-hidden="true">🎄</span><span class="xc-chip-name">经典</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="1" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">⛄</span><span class="xc-chip-name">雪夜</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="2" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🔔</span><span class="xc-chip-name">金色</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="3" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🧸</span><span class="xc-chip-name">可爱</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="4" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🌟</span><span class="xc-chip-name">简约</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="5" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🦌</span><span class="xc-chip-name">冬日森林</span></button>
    </div>
    <div class="xc-preview"><canvas id="preview-canvas" class="xc-canvas" width="1080" height="1350" role="img" aria-label="贺卡预览"></canvas></div>
    <p class="xc-label" id="greet-label">祝福语</p>
    <div id="greetings" class="xc-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="xc-greet is-on" role="radio" data-g="0" aria-checked="true">圣诞快乐！</button>
      <button type="button" class="xc-greet" role="radio" data-g="1" aria-checked="false">节日快乐！</button>
      <button type="button" class="xc-greet" role="radio" data-g="2" aria-checked="false">新年快乐！</button>
      <button type="button" class="xc-greet" role="radio" data-g="3" aria-checked="false">岁末安康，万事顺意</button>
    </div>
    <p class="xc-label" id="deco-label">装饰</p>
    <div id="decos" class="xc-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="xc-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">❄️</span> 雪花</button>
      <button type="button" class="xc-deco" data-bit="2" aria-pressed="false"><span aria-hidden="true">💡</span> 彩灯</button>
      <button type="button" class="xc-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> 闪光</button>
    </div>
    <div class="xc-row">
      <label class="xc-field" for="f-to"><span class="xc-label">收件人</span>
        <input id="f-to" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：妈妈">
      </label>
      <label class="xc-field" for="f-from"><span class="xc-label">署名</span>
        <input id="f-from" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="例如：小雨">
      </label>
    </div>
    <div class="xc-field">
      <div class="xc-msg-head"><label class="xc-label" for="f-msg">想说的话</label><button id="idea-btn" class="xc-idea" type="button">💡 文案灵感</button></div>
      <textarea id="f-msg" class="xc-input xc-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="写几句暖心的话…"></textarea>
      <p id="msg-count" class="xc-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="xc-btn xc-btn-primary" type="button">完成贺卡</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="xc-screen xc-open" hidden>
    <p class="xc-open-eyebrow">你收到了一张圣诞贺卡</p>
    <p id="open-from" class="xc-open-from"></p>
    <button id="open-btn" class="xc-env" type="button" aria-label="拆开贺卡">
      <span class="xc-env-back" aria-hidden="true"></span>
      <span class="xc-env-letter" aria-hidden="true">🎄</span>
      <span class="xc-env-front" aria-hidden="true"></span>
      <span class="xc-env-flap" aria-hidden="true"></span>
      <span class="xc-env-seal" aria-hidden="true">❤️</span>
    </button>
    <button id="open-cta" class="xc-btn xc-btn-primary" type="button">拆开贺卡</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="xc-screen xc-end" hidden>
    <article class="xc-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="xc-eyebrow"></p>
      <h2 id="end-title" class="xc-sr"></h2>
      <canvas id="end-canvas" class="xc-canvas xc-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="xc-end-actions">
        <button id="save-btn" class="xc-btn xc-btn-primary xc-btn-sm" type="button"><span aria-hidden="true">📥</span> 保存图片</button>
        <button id="copy-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">📋</span> 复制文字</button>
        <button id="edit-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">✏️</span> 修改</button>
      </div>
      <p id="save-status" class="xc-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="xmascard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 圣诞贺卡制作 · <a href="privacy.html">隐私政策</a> · <a href="guide.html">攻略</a>
  </footer>
</main>
