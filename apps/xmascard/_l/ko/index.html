<main class="xc-shell">
  <!-- 시작 화면: 티징만 (배지·그림·h1·훅·시작 버튼·맨 아래 광고 1개) — 입력 칸·FAQ 없음 -->
  <section id="screen-start" class="xc-screen xc-start">
    <p class="xc-badge">🎄 연말 스페셜</p>
    <div class="xc-hero" aria-hidden="true"><span class="xc-hero-tree">🎄</span><span class="xc-hero-star">⭐</span><span class="xc-hero-gift">🎁</span><span class="xc-hero-snow">❄️</span><span class="xc-hero-card">💌</span></div>
    <h1 class="xc-h1"><span class="xc-kicker">크리스마스 카드 만들기</span><span class="xc-h1-main">고마운 사람에게<br><em>따뜻한 한마디</em></span></h1>
    <p class="xc-hook">예쁜 디자인을 고르고 마음을 담아 적으면, 진짜 봉투처럼 열리는 카드가 완성돼요.</p>
    <button id="start-btn" class="xc-btn xc-btn-primary" type="button">카드 만들기 →</button>
    <div class="mg-ad mg-ad-start"></div>
  </section>

  <!-- 편집기 (진행 중 화면의 광고 1자리: 편집기 아래) -->
  <section id="screen-edit" class="xc-screen xc-edit" hidden>
    <h2 class="xc-edit-title">카드 꾸미기</h2>
    <div id="themes" class="xc-chips" role="radiogroup" aria-label="카드 디자인">
      <button type="button" class="xc-chip xc-theme is-on" role="radio" data-t="0" aria-checked="true"><span class="xc-chip-emoji" aria-hidden="true">🎄</span><span class="xc-chip-name">클래식</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="1" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">⛄</span><span class="xc-chip-name">눈 오는 밤</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="2" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🔔</span><span class="xc-chip-name">골드</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="3" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🧸</span><span class="xc-chip-name">귀여움</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="4" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🌟</span><span class="xc-chip-name">미니멀</span></button>
      <button type="button" class="xc-chip xc-theme" role="radio" data-t="5" aria-checked="false"><span class="xc-chip-emoji" aria-hidden="true">🦌</span><span class="xc-chip-name">겨울 숲</span></button>
    </div>
    <div class="xc-preview"><canvas id="preview-canvas" class="xc-canvas" width="1080" height="1350" role="img" aria-label="카드 미리보기"></canvas></div>
    <p class="xc-label" id="greet-label">인사말</p>
    <div id="greetings" class="xc-greets" role="radiogroup" aria-labelledby="greet-label">
      <button type="button" class="xc-greet is-on" role="radio" data-g="0" aria-checked="true">메리 크리스마스!</button>
      <button type="button" class="xc-greet" role="radio" data-g="1" aria-checked="false">즐거운 성탄 보내세요!</button>
      <button type="button" class="xc-greet" role="radio" data-g="2" aria-checked="false">새해 복 많이 받으세요!</button>
      <button type="button" class="xc-greet" role="radio" data-g="3" aria-checked="false">따뜻한 연말 보내세요</button>
    </div>
    <p class="xc-label" id="deco-label">장식</p>
    <div id="decos" class="xc-decos" role="group" aria-labelledby="deco-label">
      <button type="button" class="xc-deco is-on" data-bit="1" aria-pressed="true"><span aria-hidden="true">❄️</span> 눈</button>
      <button type="button" class="xc-deco" data-bit="2" aria-pressed="false"><span aria-hidden="true">💡</span> 전구</button>
      <button type="button" class="xc-deco is-on" data-bit="4" aria-pressed="true"><span aria-hidden="true">✨</span> 반짝이</button>
    </div>
    <div class="xc-row">
      <label class="xc-field" for="f-to"><span class="xc-label">받는 사람</span>
        <input id="f-to" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 엄마">
      </label>
      <label class="xc-field" for="f-from"><span class="xc-label">보내는 사람</span>
        <input id="f-from" class="xc-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" spellcheck="false" placeholder="예: 지민">
      </label>
    </div>
    <div class="xc-field">
      <div class="xc-msg-head"><label class="xc-label" for="f-msg">메시지</label><button id="idea-btn" class="xc-idea" type="button">💡 문구 추천</button></div>
      <textarea id="f-msg" class="xc-input xc-textarea" rows="3" maxlength="360" autocomplete="off" spellcheck="false" placeholder="따뜻한 한마디를 적어 보세요…"></textarea>
      <p id="msg-count" class="xc-count" aria-live="polite">0/120</p>
    </div>
    <button id="done-btn" class="xc-btn xc-btn-primary" type="button">카드 완성하기</button>
    <div class="mg-ad"></div>
  </section>

  <!-- 받은 링크: 봉투 열기 (start/done 안 셈) -->
  <section id="screen-open" class="xc-screen xc-open" hidden>
    <p class="xc-open-eyebrow">크리스마스 카드가 도착했어요</p>
    <p id="open-from" class="xc-open-from"></p>
    <button id="open-btn" class="xc-env" type="button" aria-label="카드 열어 보기">
      <span class="xc-env-back" aria-hidden="true"></span>
      <span class="xc-env-letter" aria-hidden="true">🎄</span>
      <span class="xc-env-front" aria-hidden="true"></span>
      <span class="xc-env-flap" aria-hidden="true"></span>
      <span class="xc-env-seal" aria-hidden="true">❤️</span>
    </button>
    <button id="open-cta" class="xc-btn xc-btn-primary" type="button">카드 열어 보기</button>
  </section>

  <!-- 끝 화면: 완성 카드(결과) → 공통 끝 화면 -->
  <section id="screen-end" class="xc-screen xc-end" hidden>
    <article class="xc-card" aria-labelledby="end-title">
      <p id="end-eyebrow" class="xc-eyebrow"></p>
      <h2 id="end-title" class="xc-sr"></h2>
      <canvas id="end-canvas" class="xc-canvas xc-end-canvas" width="1080" height="1350" role="img"></canvas>
      <div class="xc-end-actions">
        <button id="save-btn" class="xc-btn xc-btn-primary xc-btn-sm" type="button"><span aria-hidden="true">📥</span> 이미지 저장</button>
        <button id="copy-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">📋</span> 텍스트 복사</button>
        <button id="edit-btn" class="xc-btn xc-btn-soft xc-btn-sm" type="button"><span aria-hidden="true">✏️</span> 고치기</button>
      </div>
      <p id="save-status" class="xc-save-status" aria-live="polite"></p>
    </article>
    <div data-mg-end="xmascard"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 크리스마스 카드 · <a href="privacy.html">개인정보처리방침</a> · <a href="guide.html">가이드</a>
  </footer>
</main>
