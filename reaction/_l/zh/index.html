<div class="rx-page">
  <!-- 측정 화면: 대기(idle, 티징만) → 빨강(wait) → 초록(go) → 기록(hit) / 부정 출발(foul) / 중단(abort) -->
  <section id="arena" class="rx-arena" data-phase="idle" tabindex="-1" aria-labelledby="arena-title">
    <div class="rx-hud">
      <span id="hud-round" class="rx-hud-round"></span>
      <button type="button" id="quit-btn" class="rx-quit" data-no-tap>退出</button>
    </div>

    <div class="rx-idle">
      <h1 id="arena-title">反应速度<br>测试</h1>
      <p class="rx-hook">屏幕一变绿就点。测5轮算出平均值，看看你比多少人反应更快。</p>
      <ul class="rx-rules">
        <li><span class="rx-swatch rx-swatch-stop" aria-hidden="true"></span>红色时等待</li>
        <li><span class="rx-swatch rx-swatch-go" aria-hidden="true"></span>绿色时点击</li>
      </ul>
      <div class="rx-court">
        <button type="button" id="start-btn" class="rx-pad"><span>点击开始</span></button>
      </div>
      <p class="rx-keyhint">电脑上按空格键也可以</p>
      <div class="mg-ad mg-ad-start" data-no-tap></div>
    </div>

    <div class="rx-signal" aria-live="assertive" aria-atomic="true">
      <p id="sig-title" class="rx-sig-title"></p>
      <p id="sig-num" class="rx-sig-num" hidden><span id="sig-ms" class="rx-num"></span><span class="rx-unit">ms</span><span id="sig-emoji" class="rx-sig-emoji" aria-hidden="true"></span></p>
      <p id="sig-sub" class="rx-sig-sub"></p>
      <p id="sig-act" class="rx-sig-act"></p>
      <p id="sig-key" class="rx-sig-key">空格键或回车键也可以</p>
    </div>

    <ol id="laps" class="rx-laps" aria-label="每轮成绩">
        <li class="rx-lap" aria-label="第1轮 暂无成绩"><span class="rx-lap-n">1</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="第2轮 暂无成绩"><span class="rx-lap-n">2</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="第3轮 暂无成绩"><span class="rx-lap-n">3</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="第4轮 暂无成绩"><span class="rx-lap-n">4</span><span class="rx-lap-ms">–</span></li>
        <li class="rx-lap" aria-label="第5轮 暂无成绩"><span class="rx-lap-n">5</span><span class="rx-lap-ms">–</span></li>
    </ol>
  </section>

  <!-- 결과 화면: 앱 결과 다음에 공통 끝 화면(별점·하트 → 광고 → 공유 → FAQ → 다시 하기 → 다른 미니앱) -->
  <section id="result" class="rx-result" hidden aria-labelledby="res-label">
    <h2 id="res-label" class="rx-res-label">你的平均反应速度</h2>
    <p class="rx-res-avg"><span id="res-avg" class="rx-num">0</span><span class="rx-unit">ms</span></p>

    <div class="rx-tier">
      <span id="res-emoji" class="rx-tier-emoji" aria-hidden="true"></span>
      <div class="rx-tier-body">
        <p id="res-tier" class="rx-tier-title"></p>
        <p id="res-tier-desc" class="rx-tier-desc"></p>
      </div>
    </div>

    <div class="rx-block">
      <h3 class="rx-block-title">每轮成绩</h3>
      <ol id="res-laps" class="rx-lapbars"></ol>
      <p id="res-meta" class="rx-res-meta"></p>
    </div>

    <div id="res-rank" class="rx-block rx-rank" hidden>
      <h3 class="rx-block-title">你的排名</h3>
      <p id="res-comparing" class="rx-comparing">正在和大家比较…</p>
      <div id="res-rank-body" hidden>
        <p id="res-top" class="rx-rank-top"></p>
        <p id="res-beat" class="rx-rank-beat"></p>
        <div id="res-chart" class="rx-chart"></div>
        <p id="res-readout" class="rx-readout" aria-hidden="true"></p>
      </div>
      <p id="res-note" class="rx-rank-note"></p>
    </div>

    <div data-mg-end="reaction"></div>
  </section>

  <footer class="site-footer">
    © <span id="year"></span> 反应速度测试 · <a href="privacy.html">隐私政策</a>
  </footer>
</div>
